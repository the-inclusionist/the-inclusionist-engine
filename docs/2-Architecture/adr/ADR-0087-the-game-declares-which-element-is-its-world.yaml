title: The game DECLARES which element is its world, and `none` is a written choice rather than what happens when somebody forgets

context-and-problem-statement: |
  `render/viz-setters.alcanceDoModo` gives the nine empathy simulations the scope `mundo`, and `main.ts`
  implements `mundo` as the PixiJS canvas, clearing the filter on `#dom-layer`.

  THE REASONING IS CORRECT AND IS WRITTEN DOWN: the menu is the instrument for LEAVING the simulation, and a
  blindness that blanked the pause menu would lock a child inside it (issue #82).

  ⚠️ IN A GAME WHOSE VISIBLE CONTENT IS DOM, IT INVERTS. `blind` (`brightness(0)`) blacks out a canvas nobody
  is looking at and leaves the numbers perfectly legible: the simulation comes out backwards, and an adult is
  told they felt something they did not. In a product whose reason to exist is not making false claims about
  accessibility, that is the worst class of defect available.

  `game-15puzzle` found it and worked around it by filtering `#game-region` itself, with the reasoning written
  beside the workaround.

  ⚠️ AND THE OBVIOUS FIX IS WRONG, WHICH WAS MEASURED BEFORE CHOOSING. "The engine filters `#game-region`"
  repairs the 15-puzzle and BREAKS the engine's own game: in `app/index.html` the `#dom-layer` sits INSIDE
  `#game-region` (lines 58 and 71) and a CSS filter inherits, so the pause menu would go dark with it. The
  same line, opposite results, because the shape of the DOM is not guaranteed by the contract. That is why
  this is a DECLARATION and not a better default.

decision-drivers:
- "⚠️ Measured: `#dom-layer` is inside `#game-region` in the engine's markup and is absent from the
   15-puzzle's. No single default is right for both."
- "A simulation that lies is worse than a simulation that is unavailable."
- "⚠️ BLINDFOLD CHESS EXISTS. A DOM-only game is not a game where empathy makes no sense; it is a game where
   it demands more of whoever writes it. The Dev said so, and it is what rules out an escape hatch."
- "But an activity with no space is real: free painting, authoring, a form. The Dev named it: `atividades como
   paint não são exatamente jogos, mas podem ser feitas com a engine e sonar não vai funcionar muito bem`."

considered-options:
- "W1 - the game declares the element, mandatorily, with `none` as an explicit written choice"
- "W2 - the engine changes its default to `#game-region`"
- "W3 - a third scope, `nada`, that a DOM game uses to declare empathy unavailable"
- "W4 - leave it and document"

pros-and-cons-of-the-options:
  W1:
    good:
    - "The only option that survives both DOM shapes, because what varies between games becomes declared -
       literally ADR-0080's rule."
    - "⚠️ `none` stops being an escape hatch and becomes a statement: silence is REJECTED, so forgetting and
       choosing are no longer the same act. Today they produce the same result."
    bad:
    - "One more field, and a THIRD breaking contract change before the first npm publish."
  W2:
    good:
    - "No new field; the fix would be internal."
    bad:
    - "⚠️ REFUTED BY MEASUREMENT, and recorded because it is what anyone would try first: it blanks the pause
       menu in the engine's own game, which is exactly the trap issue #82 exists to prevent."
  W3:
    good:
    - "Honest in one respect: it names the case where simulating would lie."
    bad:
    - "Removes the feature from a whole class of games instead of fixing it, and the 15-puzzle proves it CAN
       be fixed. Blindfold chess is the counter-example."
  W4:
    bad:
    - "Keeps a false claim inside an accessibility product."

decision-outcome:
  chosen-option:
    link: "W1 - declared, mandatory, with `none` as a written choice"
    justification: |
      ===== 1. THE FIELD =====
      `GameDeclaration.world(): WorldScope`, a FUNCTION for the same reason `topology` became one (ADR-0084):
      an activity can change surface while it runs - an editor that opens a painting canvas over the board -
      and reading once would freeze the simulation's reach on what used to be there.

        { kind: 'element', selector }   the element that IS the game
        { kind: 'none' }                no space: empathy and sonar are not offered

      A SELECTOR and not an element, because `core/contract` is a pure leaf module with no DOM: the
      composition root resolves it, as it already does for every other DOM access.

      ===== 2. MANDATORY, AND THAT IS THE DECISION =====
      ⚠️ The first proposal was an OPTIONAL field with a default, plus `none` as a guard for the missing case.
      The Dev refused both halves, and the argument is blindfold chess: it exists, so a DOM-only game is not a
      game where empathy makes no sense - it is one where it costs the programmer more. A default would let
      FORGETTING pass as if it were CHOOSING.

      So `conformanceProblems` reports three distinct failures where the shape has three ways to be wrong -
      missing, not a function, or a malformed scope - and the missing message names both exits so the author
      is not sent hunting: `declare the element that IS the game, or {kind:"none"} if it has no space`.

      ===== 3. AND `none` IS A STATEMENT, NOT A FALLBACK =====
      The Dev corrected this mid-decision and the correction is what makes the design honest: W3 as a GUARD is
      wrong, W3 as a DECLARED CHOICE is right. An activity with no space says so; a game that forgot is
      rejected. Before this field the two produced the same silence, and the silence was resolved by the
      engine guessing that the world is the canvas.

  consequences:
    positive:
    - "A DOM game can offer empathy simulations that mean what they say - the 15-puzzle's workaround becomes
       the contract."
    - "issue #82's rule is preserved intact: a simulation still reaches the world and not the menus. What
       changes is one layer below - WHO says which element is the world."
    - "An activity with no space is expressible without pretending to have one."
    negative:
    - "⚠️ BREAKING, and the third contract change in one day: `game-chess` and `game-15puzzle` both need the
       new field. Neither is in this repository."
    - "The eight-field count in ADR-0030 is now seven-plus-one, and every fixture that builds a declaration
       grew a line."
    neutral:
    - "Nothing in the running game changes yet: the field is declared and validated, and `main.ts` still
       applies the filter the way it did. Wiring the root to the declared element is the next step and is
       deliberately not in this record - it is the part that can be seen on screen, and it wants its own
       verification."
  confirmation: |
    `tests/contract-topologia-e-funcao.node.test.js`, born failing under a confirmed mutation - letting a
    missing `world` pass turns two tests red, one of them the eight-field count.

    · A declared element passes; `{kind:'none'}` passes.
    · ABSENT is rejected, and the message names both exits.
    · An empty selector is rejected - declaring nothing is not declaring.
    · An unknown kind, a value instead of a function, and a function returning nothing are each rejected with
      their own message.
    · The scope is RE-EVALUATED: a declaration whose selector changes between two calls reports the new one.

    ⚠️ WHAT NO GATE CONFIRMS: that a blindness simulation actually blacks out what the child is looking at.
    That is a screen measurement and it needs the root wired first - see the neutral consequence above.

more-information: |
  This is the third of the three contract decisions the 15-puzzle's debt report forced. ADR-0084 answered the
  first (`topology` is a function). The second - the grid metric, and space beyond two dimensions - is still
  open and is the Dev's to close: he rejected the options offered and asked for a measure the ENGINE chooses
  and performs, working at any orientation in the plane and in three dimensions, with the narration in
  geographic terms. A proposal (O4) is written and with him.

  ⚠️ AND ONE THING IS DELIBERATELY LEFT UNDECIDED HERE: what the engine does with `{kind:'none'}` beyond not
  offering empathy and sonar. Whether the selection screen must SAY so before the child starts - the way
  ADR-0079 requires of a transport that cannot reach an action - is the same family of question and is not
  answered by this record.
