title: The no-littering sign bars the CHILD, not the litter — and where it stands is level DATA, never a derivation

context-and-problem-statement: |
  The recycling activity put a PROIBIDO JOGAR LIXO sign in the platformer level, and the first implementation
  read it as a rule about the OBJECT: crossing its line made the child DROP the litter, and anything thrown past
  it bounced.

  The Dev reversed it: "Se estiver segurando lixo o jogador não pode seguir adiante após a placa. Se deixar cair
  o lixo, ele está desobedecendo a placa, se lançar o lixo, também. Uma vez que segura o lixo ele só poderá
  soltar na lixeira e não poderá seguir após a placa."

  ⚠️ AND THIS RECORD EXISTS BECAUSE THE DECISION WAS FILED IN THE WRONG PLACE. It was written on 2026-08-28 as
  §6b of ADR-0049, "every reward is deterministic and the only celebration is growth" — a record about REWARDS.
  A sign that stops a child from walking forward is not a reward, and ADR-0057 §1b decides that an accepted
  record does not grow: a clause about something the host never decided is MISFILED, and extracting it is an
  erratum on the host rather than a change to it. The text below is that clause, moved.

decision-drivers:
  - "The child has to be able to read the rule off the screen without anyone explaining it. Whatever she cannot
     see, she will read as the game being broken."
  - "A wrong POSITION for this sign is invisible to every test and obvious to anyone looking at the screen — it
     was got wrong twice in one day, both times by a rule that computed the place instead of reading it."
  - "The design refuses to punish, so every mechanism here has to work by PREVENTION, which is a harder shape."

considered-options:
  - "P1 — bar the OBJECT: crossing the line drops the litter, and a thrown piece bounces back"
  - "P2 — bar the CHILD: holding litter, she does not pass the sign at all"
  - "P3 — let her pass and take points away for it"

pros-and-cons-of-the-options:
  P1:
    good: ["It is what was built first, and it enforces the rule without stopping anyone."]
    bad: ["It lets the disobedience HAPPEN and then repairs the consequence, so the child experiences a rule she
           already broke.",
          "The link between the sign and the effect is indirect: something is taken from her hand, somewhere
           past a sign she may not have connected it to."]
  P2:
    good: ["It leaves the disobedience nowhere to start.",
           "It reads better: she sees the sign, feels that she does not pass, and the two are simultaneous."]
    bad: ["A barrier that is wrong or invisible is indistinguishable from a bug, which raises the cost of getting
           its extent and position right."]
  P3:
    good: ["Simplest to implement; needs no barrier at all."]
    bad: ["⚠️ Refused on the design's finest point, and it is the Dev's: `a criança não pode escolher ter um
           comportamento ruim, visto que a perda de pontos ainda é vista como recompensa para crianças que estão
           procurando fazer uma má ação`. A number that goes DOWN is as good a reaction as one that goes up, when
           reaction is what is being sought."]

decision-outcome:
  chosen-option:
    link: "P2 — the sign bars the CHILD, and it never punishes"
    justification: |
      ===== 1. THE RULE =====
      Holding litter, the child does not pass the sign. Dropping it there is disobedience and so is throwing it:
      once she picks litter up, the only place it goes is the right bin.

      ⚠️ AND THE MISTAKE IS WORTH RECORDING BECAUSE IT IS SEDUCTIVE. Barring the OBJECT lets the disobedience
      happen and then repairs the consequence; barring the CHILD leaves it nowhere to start.

      ===== 2. THE BARRIER IS A SEGMENT, NOT A LINE =====
      From the floor the sign stands on, up to the first solid tile above it. The Dev, after the first version
      barred the whole column: "a barreira deve valer só do piso da placa até o próximo tile sólido acima da
      placa."

      ⚠️ A LINE RUNNING THE HEIGHT OF THE MAP STOPS THE CHILD ON FLOORS WHERE THE SIGN IS NOT EVEN VISIBLE. She
      meets an invisible wall and can only read it as a broken game. Confined to the sign's own gap, barrier and
      warning occupy the same place: where she does not pass, she sees why.

      ===== 3. PICKING LITTER UP LOCKS THE HAND =====
      No dropping and no throwing — only the right bin (`game/carry.PODE`, and the four carry classes are
      ADR-0060's routing). It is the same decision as §1 seen from the object's side: if the litter cannot leave
      her hand anywhere else, there is no disobedience to prevent at the sign; the sign only has to stop her
      walking.

      ===== 4. THE ART HAS TO BE READ AS A PROHIBITION =====
      The pictogram of a person dropping litter inside a cut circle, drawn large enough to be legible at the
      game's resolution. At 11×16 it was a small red square with a slash, which a child reads as "some object".

      ===== 5. WHERE IT STANDS IS LEVEL DATA, NEVER A DERIVATION =====
      Settled after getting it wrong TWICE, in the same day, in the same way. The first rule put it "just after
      the trampoline" and landed in the basement; the second put it at `agua - 1` and landed on the top platform,
      decided by water rows twenty rows below it. Both were right by coincidence of map, and both were caught by
      the Dev looking at the screen — never by a test.

      The position he gave is a reading of the level's SHAPE: "eu posicionei duas plataformas abaixo da lava.
      Pedi pra colocar a 15 blocos de altura do chão, 27ª coluna contando da esquerda para a direita." Where the
      path narrows and the drop begins is a design judgement, and no formula over tiles reaches it.

      ⚠️ SO A LEVEL WITH NO DECLARED SIGN HAS NO SIGN. Inventing a position is precisely what produced two wrong
      signs in silence — nothing broke, nothing went red, and the thing appeared in the wrong place on someone's
      screen. Degrading to "no sign, and therefore no barrier" is LOUD and visible; degrading to "a sign
      somewhere" is the failure mode ADR-0047 already refused elsewhere.

  consequences:
    positive:
      - "The child never experiences a rule she has already broken, which is what P1 could not avoid."
      - "The barrier and the reason for it occupy the same square of screen, so the rule is readable without
         words — which is what an activity for a pre-literate or non-reading child needs."
      - "A missing sign is now a visible absence rather than a sign in the wrong place, and the wrong place was
         the failure that actually happened, twice."
    negative:
      - "The barrier is invisible geometry. A child who does not connect it to the sign reads it as a bug, and
         nothing on screen can prove she made the connection."
      - "Level data grows a field that a level author must fill and can forget — and forgetting it silently
         removes the whole activity's rule from that level."
      - "Locking the hand means a child who picks up litter far from a bin must carry it back, and the walk is
         not fun. It is accepted because the alternative is a droppable object the sign then has to police."
    neutral:
      - "Nothing here changes the point count: the sign neither gives nor takes, by ADR-0049 §1."

  confirmation: |
    · `podePassarDaPlaca(x, y, barreira, carregandoLixo)` is a pure function and takes the position — a test can
      assert that the SAME x passes at a y outside the segment and fails inside it. That is the clause that was
      wrong first and is cheapest to hold down.
    · `posicaoDaPlaca(mapa, declarada)` returns the DECLARED position or nothing. A test with no declaration must
      get no sign, not a computed one.
    · `PODE.lixo` is `{soltar: false, arremessar: false}` — checkable by reading the table.

    ⚠️ WHAT NO TEST CONFIRMS: whether a child connects the barrier to the sign. Both wrong positions were caught
    by a person looking at the screen, and that is still the only instrument for this clause. Issue #7.

more-information: |
  EXTRACTED FROM ADR-0049 §6b ON 2026-09-04, under ADR-0057 §1b. The clause was written into a record about
  rewards on the day it was decided, because that record was open; a sign that stops a child walking is not a
  reward. Its removal from ADR-0049 is an ERRATUM on that record — the host never decided this, so taking it out
  restores what the host did decide rather than overwriting anything.

  THE DATE ABOVE IS 2026-08-28, when the decision was taken, and not the day of the extraction. A record dated
  by its rescue sits in the wrong place in the history it exists to keep.
