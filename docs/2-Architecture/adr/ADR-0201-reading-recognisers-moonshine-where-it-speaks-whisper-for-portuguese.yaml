title: Reading recognisers — Moonshine where it speaks the language, Whisper for Portuguese

context-and-problem-statement: |
  ADR-0190's erratum gave reading in Portuguese and Spanish to Whisper base. The Dev, 2026-09-14: «Moonshine é melhor para
  dispositivos econômicos, prefira moonshine para ES também, deixe whisper somente onde moonshine não contempla, isto é, PT. Se
  realmente não houver moonshine para ES, usaremos Whisper, sem problemas, mas eu acredito que exista. Vamos tentar, além de
  whisper tiny e base, whisper small, moonshine base e moonshine small em inglês.» And on the roles: «os whisper e moonshine serão
  usados para atividades onde o jogador precisa ler textos como avaliadores de leitura, é outro uso.»

decision-drivers:
  - "D1 — A CHEAP DEVICE: Moonshine is smaller and faster than Whisper at the same task"
  - "D2 — READING IS ASSESSED, COMMANDS ARE CONTROL: two uses, two kinds of recogniser"

considered-options:
  - "A — Whisper for Portuguese and Spanish, Moonshine for English (ADR-0190 erratum)"
  - "B — Moonshine wherever it covers the language; Whisper only where it does not"

pros-and-cons-of-the-options: |
  **A.** ✅ One model for two languages. ❌ The larger model on the devices that can least carry it, where a smaller one exists.
  **B.** ✅ The smaller model wherever there is one. ❌ Spanish Moonshine is either under a community license, or MIT without an ONNX
  export the browser can run.

decision-outcome:
  chosen-option:
    link: "B — Moonshine where it speaks the language"
    justification: |
      1. **Reading in English and Spanish is recognised by Moonshine; reading in Portuguese by Whisper**, the only one of the two that
         covers it. If no usable Spanish Moonshine is found, Spanish takes Whisper.
      2. **Tried, before one is kept**: Whisper tiny, base and small; Moonshine base and small in English.
      3. **These recognise reading** — an activity assessing a child's reading aloud. Commands and menu names are Vosk's (ADR-0193).
      4. ⚠️ OPEN, for the Dev: which Spanish Moonshine — the base model under the Moonshine AI Community License, or the MIT streaming
         models exported to ONNX here. → Answered in the erratum: the MIT streaming models.

  consequences:
    positive:
      - "The smallest recogniser that covers a language is the one a child's device runs"
    negative:
      - "Three model families to fetch, check and try"

  confirmation: |
    ✅ The WER of each candidate was measured per language on the Dev's recordings (errata of 2026-09-14). The gates in
    confirmed-by: the kept models — Whisper small for pt, Moonshine streaming small for en and es — are in the
    heavy-file catalogue with their sha256, every file a model needs named by id; and a read sentence is transcribed on
    the device, with the same words the model itself answered.

more-information: |
  The Dev's recordings for this (2026-09-14): commands and a read text in Portuguese, Spanish and English, in the engine's
  `research/` folder — personal data, never committed.
