title: Hosting moves to a GitHub ORGANISATION that claims nothing — private until the Município authorises publication

context-and-problem-statement: |
  ADR-0026 moved code, backlog, CI and the npm registry to a private GitLab. Two things happened on
  2026-09-04 that reopen it.

  ⚠️ FIRST, THE REWRITE COULD NOT LAND. The requerimento — a private internal document that should never have
  been versioned here — was purged from the local history, and the force-push was REFUSED: `main` is a
  protected branch and GitLab's `pre-receive` declines it. The clean history exists locally and cannot reach
  the remote without unprotecting the branch.

  SECOND, THE PROJECT OUTGREW ONE REPOSITORY. ADR-0058 names nine, and the Dev has since decided one
  repository per game — three hundred and more. A container with shared members, teams and permissions stops
  being convenience and becomes the only way to administer it.

  ⚠️ AND THE THING THAT DECIDES THE NAME IS NOT TASTE. The patrimonial owner of this software is the
  MUNICÍPIO (Lei nº 9.609/1998 art. 4º), which is why the package scope is `@pm-monte` (ADR-0036) and why
  publication is a PEDIDO in the requerimento rather than a decision of whoever wrote the code. An
  organisation named after the Prefeitura, created privately by a municipal employee before any authorising
  act, would put an account that READS AS OFFICIAL on a public platform under one person's control. That is a
  different and worse problem than the one it would solve.

decision-drivers:
  - "The container must not claim an identity that has not been granted. Everything else is reversible; that
     is not."
  - "The clean history has to become the only history, and it cannot while a protected branch refuses it."
  - "Three hundred repositories need shared permissions, and per-repository administration does not scale to
     one person."
  - "Publication is the Município's act. Nothing here may make it look already taken."

considered-options:
  - "H1 — stay on GitLab: unprotect `main`, force-push, keep the topology there"
  - "H2 — a GitHub ORGANISATION with a neutral name, repositories PRIVATE, publication deferred"
  - "H3 — a GitHub organisation named for the Município (`pm-monte` or similar)"
  - "H4 — a GitHub organisation, repositories PUBLIC from the start under AGPL"

pros-and-cons-of-the-options:
  H1:
    good: ["No move, no CI port, no registry question. ADR-0026 stands.",
           "GitLab groups would have given the same container."]
    bad: ["The protected branch has already refused the push once, and the old history stays until someone
           changes a setting.",
          "It answers the container question and not the reason the Dev raised it."]
  H2:
    good: ["Names the PRODUCT, not the institution, so no account reads as the Prefeitura's.",
           "Private repositories mean nothing is published before the act that authorises publishing.",
           "GitHub transfers repositories between organisations, so if the Município creates its own account
            after the ato, all of them move without rewriting a byte of history."]
    bad: ["ADR-0026 moved FOUR things and all four move again — the npm registry currently resolves `@pm-monte`
           against GitLab's, and the `.gitlab-ci.yml` is a real port to Actions, not a copy.",
          "A neutral name is a name that will have to change, and renaming an organisation breaks every URL
           anyone wrote down."]
  H3:
    good: ["Aligns the container with the true owner, and with the `@pm-monte` scope already in `package.json`."]
    bad: ["⚠️ It creates an account that reads as official for a real institution, under personal control,
           before the act that would authorise it. Impersonation risk is not undone by good intentions, and
           the requerimento exists precisely to ask for that authority.",
          "If the Município later declines, the account has to be dismantled rather than transferred."]
  H4:
    good: ["The requerimento argues publication is a legal DUTY under art. 16 of Lei nº 14.063/2020, so the
            direction is not in doubt."]
    bad: ["⚠️ The duty is the MUNICÍPIO'S. Publishing first makes pedido `e` moot and presents the
           Administração with a fait accompli inside the very process where it is being asked to decide.",
          "The repository has never been audited for publication, and the art licensing (ADR-0064 §3,
           `docs/LICENSES.md`) was only written today."]

decision-outcome:
  chosen-option:
    link: "H2 — a GitHub organisation named `the-inclusionist`, repositories PRIVATE"
    justification: |
      ===== 1. THE ORGANISATION IS THE CONTAINER; THE BOARD IS NOT =====
      On GitHub a **Project** is a planning board that spans repositories — it does not hold them. What groups
      repositories, and carries members, teams and permissions, is an **Organisation**. The board is optional
      and may come later; the organisation is the decision.

      ===== 2. THE NAME CLAIMS NOTHING =====
      `the-inclusionist`. It names the product, not the institution.

      ⚠️ AND THE OWNERSHIP IS STATED INSIDE RATHER THAN IN THE NAME — in `docs/LICENSES.md`, in ADR-0064, and
      in the `@pm-monte` package scope. A name is read by strangers who will not open the repository; a
      LICENSE is read by anyone who intends to use it. Putting the claim where it is read, and keeping it out
      of where it would merely be assumed, is the whole of this clause.

      ⚠️ AND THE EXIT IS PART OF THE DECISION: GitHub transfers repositories between organisations. If the
      ato comes and the Município creates its own account, everything moves under it without rewriting
      history, without changing a commit, and without this record being wrong in retrospect.

      ===== 3. PRIVATE UNTIL THE ATO =====
      Every repository is created PRIVATE and stays private until the Poder Executivo authorises publication
      (requerimento, pedido `e`). This record does not weaken that request; it prepares for it.

      ⚠️ WHAT MUST HAPPEN BEFORE ANY OF THEM GOES PUBLIC, and it is written here because the day it happens
      nobody will want to stop:
        · a content audit of all 995 commits for secrets and personal data — filenames and absolute paths were
          checked on 2026-09-04 and were clean; CONTENT was not;
        · `docs/LICENSES.md` complete, including the art inventory it deliberately does not yet carry;
        · the ato itself, in the process.

      ===== 4. WHAT MOVES, AND THE TWO THAT ARE WORK RATHER THAN SETTINGS =====
      ADR-0026 moved four things and all four move again:
        · **Code** — a push. The rewritten history goes up first, so the remote never holds the old one.
        · **Backlog** — the 44 issues migrate; GitHub's importer carries titles and bodies, and the numbers
          will NOT survive. Every `#N` written in a record or a commit message becomes wrong.
        · **CI** — ⚠️ a PORT, not a copy. `.gitlab-ci.yml` runs the ADR validator, typecheck, build, the
          precache gate and the axe job; each becomes a GitHub Actions workflow, and a gate that silently
          stops running is worse than one that never existed.
        · **Registry** — `@pm-monte` currently resolves against GitLab's package registry. GitHub Packages
          scopes to the ORGANISATION, and this organisation is not `pm-monte`. **Unresolved here on purpose**:
          it is a decision of its own and is not made by moving the host.

      ===== 5. THE GITLAB PROJECT STAYS, ARCHIVED =====
      The Dev's decision, taken with the consequence in front of him: the old history — including the
      requerimento — remains on GitLab's servers. Archiving makes a project read-only; it does not remove
      history. Deleting the project is the only thing that would, and it stays available as a later choice.

  consequences:
    positive:
      - "One container for eleven repositories now and three hundred later, with permissions set once."
      - "The clean history reaches a remote for the first time, which the protected branch on GitLab refused."
      - "No account claims to be the Município, and no source is published before the act that authorises it."
      - "The transfer path means this choice does not have to be right forever."
    negative:
      - "⚠️ THE ISSUE NUMBERS DIE. Every `#N` in an ADR, a commit message or an issue body points at a GitLab
         number that GitHub will not reproduce. This is the `citation must pin what does not move` problem
         (ADR-0057 §1c) arriving in the backlog, and it needs its own pass."
      - "The CI port is real work and the gates are not optional: eight ADR checks, the precache budget and the
         axe job all run there."
      - "`@pm-monte` no longer matches the host that serves it, and the registry question is left open."
      - "A neutral name is a name that will have to change if the Município takes ownership, and organisation
         renames break every URL already written down."
    neutral:
      - "The five experiment worktrees (`exp1`…`exp4`) are unaffected; they were confirmed clean of the purge
         and are not part of this move."

  confirmation: |
    · The organisation exists and its repositories are PRIVATE — checkable with `gh repo list the-inclusionist`.
    · `git log --all -- <the four requerimento paths>` is empty on the new remote, which is the whole reason
      the remote is new.
    · The CI gates run on GitHub and FAIL when they should: the ADR validator on a bad `status`, the precache
      gate over budget, axe on a violation. A ported gate that never goes red has not been ported.

    ⚠️ WHAT NO CHECK CONFIRMS: whether a stranger reads `the-inclusionist` as unaffiliated with the Município.
    That is the reason for the name and the one thing about it that cannot be measured.

more-information: |
  SUPERSEDES ADR-0026 whole. Its title asserts what changed — "All project hosting moves to GitLab" — and
  ADR-0057's second erratum decides that a record whose title asserts the replaced thing is superseded whole,
  however much survives. What survives and is carried forward unamended: its argument that code, backlog, CI
  and registry belong on ONE host rather than split across two.

  ⚠️ AND THIS RECORD DECIDES ONLY WHERE THINGS LIVE. Two other decisions were taken in the same conversation
  and get their own records, because a title that needs an "and" is two records: **when a repository is
  created** (which revokes ADR-0058 §10), and **one repository per game with delivery still through a single
  catalogue** (which replaces the `demos` role in ADR-0058 §1).
