metadata:
  status: "accepted"
  date: 2026-09-05
  supersedes-in-part: [ADR-0068]
  errata:
    - date: 2026-09-05
      what: "THE RECORD CALLED THE 2048 `the first game repository` AND SAID ITS ADDRESS WAS `one instance`,
             AND BOTH WERE FALSE WHEN WRITTEN. `the-inclusionist/hartwig-zdog-chess` already existed in the
             organisation, holding `@the-inclusionist/game-chess`, AGPL-3.0-or-later, consuming this engine.
             The facts were available and were not gathered — so this is an ERRATUM under ADR-0057 §1 and not
             a supersession: the DECISION (the declared address governs; §1's pattern is suspended) is
             unchanged, and it is the REASONING that was defective. Three sentences were corrected in place:
             §2's repo/package divergence is PRECEDENT and not a new choice; §3's `one instance is not a
             rule` becomes TWO instances of one shape; and §4's objection shrinks, because this project has
             two renderers ON PURPOSE and naming one distinguishes them. What did NOT change: nothing
             declares a general rule, so the suspension and its trigger stand."
  decision-makers: [Dev]
  consulted:
    - "`the-inclusionist/hartwig-zdog-chess` — THE EVIDENCE THIS RECORD WAS MISSING. A second game repository
       that already exists, is named in the same shape, and already consumes the engine (by `file:`, not by
       registry). Read on 2026-09-05, after the record was first written"
    - "ADR-0068 §1 — SUPERSEDED IN PART: it prescribed `the-inclusionist-game-<slug>` for every game
       repository, and the first game does not carry that name. Every other clause of §1 stands"
    - "ADR-0067 §5 — the rule this record obeys: creation follows a DECLARATION IN A RECORD, not a name in a
       backlog item or a folder somebody made. This IS that declaration"
    - "ADR-0071 §1 — the argument that makes the shorter name defensible: `@the-inclusionist/engine` and not
       `@the-inclusionist/inclusionist-engine`, because the word would appear twice"
    - "ADR-0066 §2 — a container name claims nothing, so a repository name is free to be short"
    - "ADR-0035 — the renderer choice was made REVERSIBLE on purpose (`render/port`), and it is the record this
       name argues against; the cost is written into the consequences rather than argued away"
    - "ADR-0068 §6 — the template that would otherwise reproduce a superseded pattern 299 times"
  informed: []

title: The 2048's repository is named by declaration — `the-inclusionist/pixi-2048` — and ADR-0068's naming pattern is SUSPENDED, not replaced
# ⚠️ O TÍTULO DIZIA `The FIRST game repository`, e era falso: o `hartwig-zdog-chess` já existia. Corrigido na
# errata de 05/09. O NOME DO FICHEIRO fica como está, de propósito — renomear ficheiro não é errata (regra do
# índice em `README.md`), e o link da tabela é o que não pode quebrar. Quem chegar pelo nome do ficheiro lê a
# correção na primeira dúzia de linhas, que é o que a regra do ADR-0057 pede.

context-and-problem-statement: |
  ADR-0068 §1 gave every game repository a shape: `the-inclusionist-game-<slug>`. It was written before any
  game existed and before ADR-0066 put the repositories inside an organisation, and it has never been executed.

  The Dev has now declared the address of the first one, and it is not that shape:
  **`https://github.com/the-inclusionist/pixi-2048`**.

  Under ADR-0067 §5 the declaration is the moment of creation, so this is not a preference to be reconciled
  later — it is the address, and the repository comes into existence at it. What has to be decided is what
  happens to the SENTENCE in §1 that it contradicts, because an accepted record that keeps prescribing a
  pattern the first instance already broke does not sit quietly: ADR-0057 measured the failure mode, which is
  that the stale record argues against its own author in every later conversation.

  ⚠️ AND THERE IS A MECHANISM ATTACHED, WHICH IS WHY THIS CANNOT WAIT FOR THE SECOND GAME. ADR-0068 §6 says the
  three-hundred-repository script runs once ONE game has gone end to end, and that script reads the pattern.
  Left alone, §1 does not merely look wrong — it produces 299 addresses in a shape the project has already
  stopped using, in one run, from a template whose whole justification was that a human reviews it instead of
  the outputs.

  ⚠️ AND THE SHORTER NAME HAS AN ARGUMENT, WHICH IS NOT THE DEV'S TASTE AND IS WORTH STATING. ADR-0071 §1 chose
  `@the-inclusionist/engine` over `@the-inclusionist/inclusionist-engine` for one reason: *"the word would
  appear twice, and this is the one moment it costs nothing to fix"*. `the-inclusionist/the-inclusionist-game-2048`
  is that same repetition, one layer up. The organisation already names the container (ADR-0066 §2), and a
  repository inside it does not have to say the container's name again.

  ⚠️ AND THE PROJECT IS ALREADY INCONSISTENT ABOUT THIS, WHICH IS THE PART A RULE WOULD HAVE TO SETTLE. The
  first repository in the organisation is `the-inclusionist-engine`, and it DOES repeat the container.

  ⚠️ CORRIGIDO NA ERRATA DE 05/09 — E A CORREÇÃO MUDA O QUE ESTE REGISTRO PODE AFIRMAR. A frase original
  seguia "há duas formas e uma instância de cada". Havia outra, e ela não foi procurada:
  **`the-inclusionist/hartwig-zdog-chess`** — um xadrez que já existe, já é AGPL-3.0-or-later, já publica
  `@the-inclusionist/game-chess` e já consome esta engine. O `pixi-2048` não inaugura forma nenhuma: ele é a
  SEGUNDA instância de `<renderizador>-<jogo>`, e a primeira foi criada sem que ninguém precisasse de um
  registro para saber como chamá-la.

decision-drivers:
- "ADR-0067 §5 makes a declared address the moment of creation; this address is declared."
- "A superseded pattern that stays accepted gets executed by a script, not merely read wrong (ADR-0068 §6)."
- "ADR-0071 §1's reasoning applies unchanged one layer up: the container should not be named twice."
- "Two shapes exist in the organisation today, and nothing decides which is the rule."
- "A record must not invent a rule that was not decided - one game is one instance, not a pattern."

considered-options:
- "N1 - record the declared address, and SUSPEND §1's pattern until the template forces the general rule"
- "N2 - record the declared address AND replace §1 with a new general pattern derived from it"
- "N3 - treat `pixi-2048` as an exception and keep §1 governing the other 299"

pros-and-cons-of-the-options:
  N1:
    pros:
    - "Records exactly what was decided and nothing more, which is what an accepted record is supposed to mean."
    - "Puts a GATE where the damage would be - the template - instead of a preference where it would be prose."
    - "Names the two-shapes inconsistency instead of resolving it by guessing, in the same posture ADR-0066 §4
       used for the registry: open, with a trigger."
    cons:
    - "Leaves the project with no naming rule for a stretch, and somebody could create a repository in the gap."
  N2:
    pros:
    - "One rule, written once, and the template can be written immediately after."
    cons:
    - "⚠️ There is no evidence for a general rule. `pixi-2048` is one name; deriving `<engine>-<slug>` or
       `<slug>` from it is inventing the shape of the question, which is the exact error the engine's own
       `menu-nav` taught this project not to repeat (`getPhase()` against `isNavigable()`)."
    - "`the-inclusionist-engine` would immediately violate whichever rule is written, so the rule is born with
       an exception."
  N3:
    pros:
    - "Smallest possible change; §1 keeps governing."
    cons:
    - "An exception with no reason written down is how a pattern rots: the second game asks which of the two
       shapes it is, and there is no answer."
    - "It would leave the FIRST instance of a three-hundred-item pattern outside the pattern, which reverses
       what §6's `exercised once` clause exists to buy."

decision-outcome:
  chosen-option:
    link: "N1 - the declared address governs, and §1's pattern is suspended with a trigger"
    justification: |
      ===== 1. THE ADDRESS =====
      **`https://github.com/the-inclusionist/pixi-2048`**, declared by the Dev on 2026-09-05. Under ADR-0067 §5
      the repository is created at it, born with the four files of ADR-0067 §2 and a README that says in those
      words that it holds no product yet.

      ⚠️ ERRATA DE 05/09: o título e o corpo diziam "o PRIMEIRO repositório de jogo", e não é. O
      `hartwig-zdog-chess` já existe e já tem produto dentro. Este é o primeiro criado SOB UM REGISTRO —
      distinção que continua valendo alguma coisa (é o ADR-0067 §5 funcionando pela primeira vez), e que é
      bem menor do que a frase original prometia.

      The internal name of the game is **"2048 · Potência de 2"**, and it is a different thing from the address:
      one is what a machine resolves, the other is what a child and a teacher read. ⚠️ And the internal name is
      a STRING IN THE DICTIONARY, not a constant — pillar 3 has no exception for titles.

      ===== 2. THE PACKAGE NAME DOES NOT FOLLOW THE REPOSITORY, AND THAT IS DELIBERATE =====
      The package stays `@the-inclusionist/game-2048`, the shape ADR-0068 §3 prescribed with ADR-0071's scope
      substituted. §3 was not revoked and is not revoked here.

      The divergence is worth one sentence of reason, because divergence normally is a defect: a package name is
      read by strangers in a dependency line, and that is the one place ADR-0071 spent a whole record thinking
      about. `game-2048` tells such a reader what the thing is; `pixi-2048` tells him which renderer it used,
      which is not what he was asking.

      ⚠️ ERRATA DE 05/09: isto foi escrito como se fosse uma escolha a justificar, e **já era o padrão em
      exercício**. `hartwig-zdog-chess` publica `@the-inclusionist/game-chess` — mesma divergência, mesma
      direção, sem registro nenhum. O que este parágrafo faz, então, não é decidir: é dizer em voz alta a
      razão de uma prática que já existia calada.

      ===== 3. §1's PATTERN IS SUSPENDED, NOT REPLACED — AND THE DIFFERENCE IS THE POINT =====
      `the-inclusionist-game-<slug>` no longer governs. NOTHING replaces it, because nothing was DECLARED —
      and that is a different reason from the one this section originally gave.

      ⚠️ ERRATA DE 05/09. A frase era: *"one declared address is one instance, and a general rule derived from
      a single instance is a guess wearing a record's clothes"*. **Não é uma instância; são duas** —
      `hartwig-zdog-chess` e `pixi-2048`, e as duas nomeiam o renderizador. Isso é PADRÃO OBSERVADO, não
      coincidência, e derrubar o argumento que eu tinha usado é o motivo de a errata existir.

      A suspensão fica de pé, por um motivo mais estreito e mais honesto: **duas instâncias mostram uma
      prática; elas não decidem uma regra.** Ninguém escreveu que jogo se chama `<renderizador>-<jogo>`, e o
      que o template do §6 vai executar trezentas vezes é uma regra escrita, não uma prática deduzida por
      quem escrever o script. A diferença entre as duas é exatamente o que o ADR-0057 existe para proteger.

      ⚠️ SO THE OPEN QUESTION GETS A TRIGGER, in the shape ADR-0066 §4 used for the registry: **the naming rule
      for game repositories is decided when the template of ADR-0068 §6 is written, and the template is not
      written before it.** That is not a deferral into the fog — the template is a named artifact with a named
      precondition, and it is the only thing that can turn a naming preference into 299 facts.

      The evidence the future record will weigh, gathered here so it is not re-derived: the organisation holds
      the namespace (ADR-0066 §2, ADR-0067 §1), the container should not be named twice (ADR-0071 §1), and the
      organisation currently contains BOTH shapes — `the-inclusionist-engine`, which repeats it, and
      `hartwig-zdog-chess` + `pixi-2048`, which do not and which both name the renderer instead
      (⚠️ o segundo par entrou pela errata de 05/09; a versão original listava só o 2048).

      ===== 4. THE COST OF THIS PARTICULAR NAME, WRITTEN DOWN RATHER THAN ARGUED AWAY =====
      ⚠️ `pixi-` NAMES THE RENDERER, AND THE RENDERER IS THE ONE THING THIS ARCHITECTURE SPENT A RECORD MAKING
      REPLACEABLE. ADR-0035 bet the reversibility of the renderer choice on an adapter, and `render/port` exists
      so that no module outside it imports PixiJS by name. An address that carries `pixi` takes the opposite
      bet, in the one place the project cannot refactor: if the renderer is ever swapped, the code changes and
      the address does not, and from that day the address says something false to everybody who reads it.

      ⚠️ ERRATA DE 05/09 — A OBJEÇÃO ENCOLHE, E ENCOLHE POR UM FATO. Ela foi escrita como se `pixi-` nomeasse
      um detalhe de implementação intercambiável. Não nomeia: **este projeto tem DOIS renderizadores de
      propósito** — o pilar 2 do ADR-0010 manda Libras num motor à parte, e o `hartwig-zdog-chess` compõe
      Zdog com PixiJS a 640×360, o dobro da base da engine, por um argumento medido sobre diagonais em baixa
      resolução. Num projeto assim, dizer `pixi-` ou `zdog-` no endereço RESPONDE uma pergunta real: em qual
      dos motores este jogo foi construído.

      O que sobra da objeção é menor e continua verdadeiro: o dia em que um jogo MIGRAR de um motor para o
      outro, o endereço fica dizendo o motor antigo. É um risco real e é bem menos provável do que "o Pixi
      será substituído", que era o risco que a frase original imaginava.

      Isto é registrado, não resistido. O Dev declarou o endereço, o ADR-0067 §5 faz da declaração a decisão,
      e nome que envelhece mal é falha menor que repositório que não existe. ⚠️ E segue sendo mais barato
      mudar HOJE, antes de o repositório existir — o mesmo relógio que o ADR-0071 leu ao renomear o escopo
      enquanto o único consumidor era um repositório que não tinha começado.

  consequences:
    positive:
    - "The first game has an address, so ADR-0067 §5 has fired and the repository can be created."
    - "ADR-0068 §1 stops prescribing a shape that the first instance already contradicts."
    - "The template of §6 gains a written precondition, so the naming question cannot be answered by whoever
       happens to write the script."
    - "The organisation's two naming shapes are named as an open inconsistency instead of being averaged into a
       rule nobody decided."
    negative:
    - "⚠️ The address carries a renderer's name, so a game that ever MIGRATES between this project's two
       renderers keeps an address naming the old one. (Errata 05/09: this line first said the risk was
       ADR-0035's renderer swap; the narrower migration risk is the one that survives, because the project
       runs two renderers on purpose.)"
    - "Repository name and package name diverge, so `pixi-2048` and `@the-inclusionist/game-2048` have to be
       held in the head as the same thing - as `hartwig-zdog-chess` and `@the-inclusionist/game-chess` already are."
    - "There is no WRITTEN naming rule until the template record; a repository created in that window is created
       from a practice somebody has to notice rather than from a sentence somebody can read."
    neutral:
    - "The internal title `2048 · Potencia de 2` binds nothing technical - it is a dictionary key like any
       other string, and pillar 3 governs it."
  confirmation: |
    · The repository exists at `https://github.com/the-inclusionist/pixi-2048`, holding exactly the four files
      of ADR-0067 §2, with `main` protected.
    · `grep -rn "the-inclusionist-game-2048"` finds nothing outside this record's own quotation of the
      superseded pattern.
    · The game's `package.json` reads `@the-inclusionist/game-2048`.
    · ⚠️ The gate this record installs: **no template script exists** until a record decides the naming rule.
      If a `create-game-repo` script appears before that record, this decision was not kept.

more-information: |
  ADR-0068 §5 stays whole and is worth repeating here because this record could be misread as an exception to
  it: a game repository has NO `adr/` folder. This record lives in the engine, like every other, and the game
  states only what is its own — its art, its credits, its third-party terms.

  What this record does NOT decide, listed so none of it is read as settled: the naming rule for the remaining
  games (trigger above), whether `the-inclusionist-engine` is eventually renamed, and anything at all about the
  game's content. The last one is deliberate — the 2048's product choices obey pillars that are already
  accepted (ADR-0006, ADR-0037, ADR-0049 and pillar 2 of ADR-0010), and obeying an accepted pillar is not a new
  decision. The first of those choices that DEPARTS from a pillar will need its own record, and none does yet.
