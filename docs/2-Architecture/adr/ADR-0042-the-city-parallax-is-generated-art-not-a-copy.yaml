metadata:
  status: "accepted"
  date: 2026-08-25
  decision-makers: [Dev]
  consulted: [ADR-0010 (the pillars — pillar 1, art is data), "issue #74 (the City parallax does not decompose)",
              "issue #71 (dead _hc PNGs)", "pipeline item 16, second half", "pipeline item 18 (the no-PNG gate)"]
  informed: []

title: The City parallax is REDRAWN as generated art, not reproduced — the measurement killed the premise that it was geometry

context-and-problem-statement: |
  The first half of pipeline item 16 is delivered: both City tiles are data in `render/city-tiles.ts`, 51 and
  62 rectangles, faithful to the pixel. What remains are the three parallax backdrops —
  cenarios/cidade/c2.png, c3.png and c4.png — the LAST PNGs outside sprites/, and therefore what blocks item 18.

  THE PREMISE DID NOT SURVIVE MEASUREMENT. The pipeline says "44 and 62 rectangles for the backdrops". All
  three were decoded and covered with maximal uniform-colour rectangles by a 2D greedy pass — the most
  favourable method, not column strips:

      c4   400x180    65 colours    2065 rectangles
      c3   400x180    22 colours    2899 rectangles
      c2   400x180   171 colours    6418 rectangles
                                   11382 total

  Two to three orders of magnitude above the estimate. The 62 came from the TILE, not the backdrop —
  city-tiles.ts:69 says "62 rectangles, 23 colours" for the top tile and :19 says 51 for the middle one. The
  item-16 numbers appear to be the tile numbers, attributed to the backdrop.

  This is not a bookkeeping detail: 400x180 is 72000 pixels with 171 colours. That is hand-drawn art, not
  geometry. EXACT REPRODUCTION AS DATA IS NOT AVAILABLE AT A REASONABLE COST, and no amount of cleverness in
  the packer changes the order of magnitude.

decision-drivers:
  - "⚠️ THE FIRST DRIVER LISTED HERE WAS FALSE — see the correction in decision-outcome. It read: pillar 1
     exists to buy recolourability, high contrast repaints data and cannot repaint a PNG. `directBgTexture`
     dims and desaturates any texture, PNG included. Kept visible rather than deleted, because it is the
     sentence the choice was made on."
  - "Pillar 1 buys PARAMETERIZABILITY: a generated backdrop can be recoloured BY ROLE, which a raster cannot
     — a capability, not something exercised today."
  - "A pillar with a permanent exception is a sentence, not a rule, and the item-18 gate cannot be written
     while three files need an allowlist."
  - "Redrawing art is a product decision and belongs to the Dev; measuring its cost is not."

considered-options:
  - "P1 — a GENERATED skyline: buildings as rectangles, windows by rule, a few dozen lines"
  - "P2 — keep the three PNGs and narrow the item-18 gate to allow cenarios/ alongside sprites/"
  - "P3 — ship the 11382 measured rectangles as data"

pros-and-cons-of-the-options:
  P1:
    good: ["Parameterizable, which is what pillar 1 buys — the colours become arguments instead of pixels.",
           "Cheap in the bundle — a few dozen lines against roughly 29 KB of PNG.",
           "⚠️ A third entry here read 'the largest surface finally participates in high contrast'. It was
            FALSE and is withdrawn: `directBgTexture` already dimmed the PNG. See decision-outcome."]
    bad: ["It is NEW ART THAT RESEMBLES THE OLD, not the old art. This is not a refactor; nothing verifies it
           except somebody looking at it."]
  P2:
    good: ["Costs nothing today and the backdrops keep their exact appearance."]
    bad: ["The pillar keeps a PERMANENT exception, and item 18 cannot be written without an allowlist.",
          "⚠️ The rest of this entry read that high contrast never reaches the City backdrop. It was FALSE
           and is withdrawn — the mode dims a PNG like anything else. What P2 really costs is the exception,
           and the parameterizability the backdrop would never gain."]
  P3:
    good: ["Reproduces exactly and satisfies the letter of the pillar."]
    bad: ["Trades roughly 30 KB of PNG for hundreds of KB of JS array. It is worse on everything pillar 1
           measures, and is listed for honesty rather than as a serious alternative."]

decision-outcome:
  chosen-option:
    link: "P1 — the three backdrops are redrawn as a generated skyline"
    justification: |
      ⚠️ THE DECIDING ARGUMENT AS FIRST WRITTEN IS FALSE, AND IT WAS MINE. This record — and issue #74 before
      it, and the option text the Dev chose from — said that high contrast "repaints a datum and does not
      repaint a PNG", so the City backdrop was the one surface the mode could never reach. That is not how the
      code works. `render/high-contrast.directBgTexture` draws ANY source texture into a canvas and applies
      `dimDesat`; it reached the PNG exactly as it reaches a generated texture. Verified in the built game:
      switching to `hc-direto` swapped all three City layer textures before this change and after it.

      WHAT IS ACTUALLY TRUE, measured rather than asserted:

        1. ITEM 18 becomes reachable, and it did: the PNG gate's debt list is EMPTY, so pillar 1 stops
           carrying a permanent exception. This is the real, delivered gain.
        2. ~29 KB of PNG leave (18.1 + 6.1 + 5.8), `dist` shrinks 40 KB, precache goes 141 → 138 entries.
        3. THE ASYNC LOAD AND ITS RACE ARE DELETED. Three `Image` downloads, each `onload` having to re-check
           `getCenario() !== theme` because the child may have switched scenery mid-download. There is nothing
           left to download, so there is no race left to lose. Six tests of that race went with it.
        4. The backdrop becomes PARAMETERIZABLE: high contrast COULD one day recolour it by role instead of
           only dimming it, because the colours are arguments and not pixels. That is a CAPABILITY, not a
           fact — today both paths still go through the same `dimDesat` filter, and nothing recolours by role.

      So the accessibility argument survives only as (4), and only as potential. The decision still stands on
      (1)–(3), which are real and verified — but it stands on different ground than the ground it was chosen
      on, and whoever chose it is entitled to know that.

      Buildings become rectangles and windows become a rule, with every parameter MEASURED in the files they
      replace — the base line, the range of tops, the two body tones and the two window tones of each band.
      The result is art of the same family, not a photograph of the old one, and that difference is accepted
      deliberately: it is what makes the surface parameterizable.

      P3 is rejected on its own numbers. It satisfies the letter of pillar 1 and violates everything the pillar
      is for.

      ⚠️ A PRIMEIRA ARTE GERADA FOI REPROVADA NA TELA, e as três causas eram erros de MEDIÇÃO meus. O Dev
      olhou e disse o que faltava: "perdeu variedade… não há mais prédios com topo piramidal, caixas d'água
      ou antenas… as janelas são iguais em todos os prédios e não dá para dizer se está acesa ou apagada…
      de cidade ativa com luzes virou uma cidade cinza". Os três erros, e cada um é uma lição sobre o que
      "medir" quer dizer:

        1. CONTEI FREQUÊNCIA E NÃO PERGUNTEI O QUE A COR ERA. As duas cores que registrei como "janela
           acesa/apagada" (`#6b7e98` e `#6e809b`) são o SEGUNDO TOM DE MASSA — os prédios de trás. As luzes
           de verdade se separam por TEMPERATURA (R > B) e são raras: 5,41% da área na camada próxima,
           0,28% na média, 0,04% na bruma.
        2. DESENHEI TODA CÉLULA. No original não existe janela apagada: a apagada é a parede. Pintar todas
           em dois tons quase iguais é exatamente como se fabrica um dither cinza.
        3. ASSUMI QUE OS PRÉDIOS ENCOSTAM. Minha primeira medição perguntou "em que linha a cobertura é
           100%" somando os dois tons, e li a resposta como "não há vãos". Medindo por tom: em `c2.png`,
           y=148, a fileira da frente ocupa 279 das 400 colunas, a de trás aparece em 76, e 45 ficam
           vazias. A linha realmente sólida é y=158, não 112 — eu a tinha 46 px alta demais, e por isso a
           metade de baixo virou parede com janelas boiando nela.

      A segunda versão mede as três coisas e CALIBRA contra elas: a fração de pixel quente da textura
      gerada é conferida contra a do original (0,02% / 0,22% / 6,43% contra 0,04% / 0,28% / 5,41%). Ganhou
      também um vocabulário de topos — laje, recuo, escada, caixa de água, antenas, mastro, cúpula — e uma
      torre marcante a cada onze prédios, porque sem eventos altos a linha do horizonte fica plana mesmo
      com os topos variando.

  consequences:
    good:
      - "Item 18 becomes reachable, and it was reached: the PNG gate's debt list is empty and pillar 1 carries
         no exception."
      - "The async load of three files disappears, and the race guard that every `onload` had to run
         disappears with it — theme switching became synchronous."
      - "The bundle shrinks: ~29 KB of PNG, 40 KB of `dist`, 141 → 138 precache entries."
    bad:
      - "The City stops looking exactly as it looked. There is no automated check for that, and there cannot be."
      - "Art work is not reversible cheaply — redoing it twice is the expensive mistake, which is why nothing
         was touched before this decision."
    neutral:
      - "The item-16 numbers in the pipeline are wrong and stay recorded as wrong here: they are the tile
         numbers attributed to the backdrop. The 79% figure has the same origin — the register says 66% for
         the masonry RULE and 100% for the rectangle list."

  confirmation: |
    The item-18 gate, which is the real confirmation: no PNG outside sprites/, with no exception clause for
    cenarios/. It can only be written once these three files are gone.

    Plus the browser protocol under the house rules — dist server, service worker unregistered, caches cleared,
    ?x=N, the loaded script src compared against the hash in dist/index.html — checking that the three parallax
    layers still scroll at their own factors, and, the part P2 could never pass, that switching to high
    contrast repaints the backdrop along with the rest of the frame.

more-information: |
  Issue #74 holds the measurement, the method (2D greedy, not column strips) and the trace of where the wrong
  numbers came from. Item 17 is already verified in the browser: 42 PNG requests, zero 404s, on build
  main-DNlMM17x.

  Related: ADR-0010 pillar 1 (art is data), issue #71 (the 38 dead _hc PNGs, a separate cleanup on the same
  surface).
