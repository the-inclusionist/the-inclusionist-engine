metadata:
  status: "accepted"
  date: 2026-08-26
  decision-makers: [Dev]
  consulted: ["ADR-0035 (the engine is ours)", "ADR-0039 (a minimal description must be a true supertype)",
              "commit 1aedb64 (main.js becomes main.ts)", "scripts/check-precache.mjs (the same shape, applied to the service worker)"]
  informed: []

title: A KNOWN debt gets a budget that only goes down — never a disabled gate, never a red pipeline

context-and-problem-statement: |
  This record is written the day the debt reached zero, and it is written because the reasoning was living
  inside the script that just got deleted. The decision outlived the artifact; it needs a home that does not.

  WHAT HAPPENED. While `main.js` was JavaScript, `tsc` did not read it (`checkJs: false`) and `npm run
  typecheck` passed. On the day it became `main.ts` (1aedb64), 273 errors became visible at once — which was
  the POINT of the conversion. The side effect was not the point: `typecheck` is the second step of the CI
  `test` job, and a failing step aborts the job. From that commit on, CI stopped running the tests, the build
  AND the precache gate, and the accessibility job in the next stage never started either. The pipeline went
  red over a debt that was already known, and in doing so stopped protecting against the unknown ones.

  This is the general shape, not a TypeScript accident: a deliberate migration makes an existing gate red,
  and the gate's redness costs more than the debt it is reporting.

decision-drivers:
  - "A gate that is always red is a gate nobody reads — and the four gates behind it die with it."
  - "Loosening a gate to fit the debt is the move this repository already refused for the precache manifest
     and for the exception list of item 14."
  - "The debt is KNOWN and BOUNDED. What must be prevented is its growth, not its existence."
  - "Whatever is chosen has to state its own end — a scaffold with no demolition date is a permanent building."

considered-options:
  - "B1 — leave the pipeline red until the conversion finishes"
  - "B2 — make typecheck non-blocking (continue-on-error)"
  - "B3 — a named budget that only goes down, with a written expiry condition"

pros-and-cons-of-the-options:
  B1:
    good: ["Honest: the debt is real and the pipeline says so."]
    bad: ["Turns the pipeline into noise, and takes the tests, the build, the precache gate and the
           accessibility job down with it — the gates that catch what nobody knows about."]
  B2:
    good: ["One line; everything downstream runs again."]
    bad: ["The gate stops asserting anything. A new error in an untouched file becomes invisible, which is
           exactly the failure the gate exists to prevent.",
          "Nothing in it ever ends: a non-blocking gate has no pressure to become blocking again."]
  B3:
    good: ["Splits the assertion in two, and the FIRST half is the one that matters: ZERO errors outside the
            converting file, with no tolerance at all. That is what proves the conversion is not pushing
            errors onto the neighbours.",
           "The ceiling only descends, and lowering it is MANDATORY whenever the real count drops — a slack
            budget measures nothing.",
           "It names its own end: at zero the script is deleted and `tsc` becomes the direct gate again."]
    bad: ["A second artifact to maintain while it lives, and one more name (`check:types`) beside
           `typecheck`.",
          "It requires discipline at exactly one point — remembering to lower the number — and that point is
           the only place where the mechanism can rot."]

decision-outcome:
  chosen-option:
    link: "B3 — the budget, split into an absolute clause and a descending one"
    justification: |
      The gate asserted two different things, and the split is the whole idea:

        1. OUTSIDE the converting file: zero errors, no budget, no tolerance. This is the real gate.
        2. INSIDE it: at most ORCAMENTO, a number that only descends, and that MUST be lowered in the same
           commit that lowers the real count.

      Clause 2 buys the time; clause 1 is what keeps the purchase honest. Without clause 1 this would be B2
      wearing a number.

      The failure message carries the instruction, not just the count — when the real count drops below the
      budget the script FAILS and tells the reader to lower it. That is what makes clause 2 self-enforcing
      instead of aspirational: the only way to keep the gate green is to keep the number true.

  consequences:
    good:
      - "CI ran the tests, the build, the precache gate and the accessibility job throughout the conversion."
      - "The debt went 273 → 0 over about fifty commits, and clause 1 held at every one of them."
      - "The four accessibility defects found along the way were errors the compiler had been seeing all
         along — two of them shipping (issue: the blind-mode button lied; the TTS mixer guard)."
    bad:
      - "For the life of the budget, `npm run typecheck` was NOT the thing to run, and a contributor who ran
         it saw a wall of known errors. It took a warning in CLAUDE.md to keep that from wasting anyone's day."
    neutral:
      - "TS2552/TS2304 (undeclared name) were taken OUT of the budget entirely on 2026-08-25 — those are never
         debt, they are a call site that no longer exists, and the queue was hiding four of them."

  confirmation: |
    The end condition is the confirmation, and it has now happened: `scripts/check-types.mjs` is deleted,
    `npm run check:types` is gone from package.json, and `.gitlab-ci.yml` runs `npm run typecheck` with no
    tolerance of any kind. `tsc --noEmit` exits clean on the whole tree.

    For the NEXT time this shape is needed, the confirmation is the same three parts: the absolute clause is
    green from the first commit; the descending clause fails when it goes slack; and the script says, in its
    own header, the condition under which it deletes itself.

more-information: |
  The same shape is already in `scripts/check-precache.mjs` (no manifest entry may FREEZE a file), in the
  engine-boundary gate (no engine module may import from `game/`, a list that emptied on 2026-08-25) and in
  the i18n gate. This record generalizes what those three had in common and what the type budget added: the
  split between an absolute clause and a descending one, and a written demolition date.
