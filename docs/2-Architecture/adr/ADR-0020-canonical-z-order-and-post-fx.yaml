---
metadata:
  status: "accepted"
  superseded-in-part:
    - by: ADR-0046
      what: "§1's FILTER TARGET. This record decided the CSS filter goes on `#game-region`, `o elemento que
              contém a canvas E os menus`, and it was right for the case it examined — a COLOUR-BLIND child was
              getting the game corrected and the menus raw, and the menus are where the words are, including the
              words of the accessibility settings themselves. ⚠️ But it states the target flatly, with no
              distinction by MODE, and ADR-0046 supplies the one that was missing: the reach depends on what the
              mode IS. `alcanceDoModo(m) = simulatesDisability(m) ? mundo : mundo-e-menus`. A SIMULATION must
              degrade the experience and never the control, so `.screen-a11y` is a SIBLING of `.screen-exp` and
              not a descendant — CSS `filter` descends to every descendant and a child cannot cancel it.
              ⚠️ THE HARM IS CONCRETE: implementing this record literally puts blind-mode `brightness(0)` on the
              element that contains the accessibility bar, and the child is locked inside the simulation with no
              way to switch it off. The CORRECTION half of §1 stands unchanged and is why ADR-0046 kept
              `mundo-e-menus` as the default."
  errata:
    - date: 2026-08-24
      what: "the record said A11Y_CORRECTION is ALWAYS last, full stop, and it is not — FLASH_LIMIT runs after
             it. The record held a contradiction rather than a wrong decision, and resolving it needed a
             distinction it never made: CORRECTION versus SAFETY. A11Y_CORRECTION decides how the image LOOKS,
             so it must see the final composite, menus included — that is why it outranks the CRT. FLASH_LIMIT
             decides whether the image can HARM, and WCAG 2.3.1 bounds luminance change over time, so the only
             frame whose luminance matters is the one the eye actually receives. A limiter placed before the
             correction clamps an image that no longer exists. ERRATUM under ADR-0057 §1: the safety ordering
             was always required by the standard the record cites; the sentence just did not carry it."
  date: 2026-07-06
  decision-makers: [Dev, AI]
  consulted: []
  informed: []

title: Canonical Z-order registry (two scopes, PIXI + DOM) + post-process is a filter chain

context-and-problem-statement: |
  Render layers were created ad-hoc with `addChildAt(camera.getChildIndex(neighbour))`, welding each layer's z to the
  ASSEMBLY ORDER of the render-graph. That coupled every layer to its neighbours (moving/extracting one risked a silent
  visual regression — it blocked the scene-sky extraction, #43) and there was no single definition of "what each z means".
  The Dev asked to define the layer stack once so the coupling ends. Two extra questions surfaced: where do CRT/vignette
  and the a11y filters (high-contrast, colour-blind correction, disability simulation) sit, and do they cover the menus?

decision-drivers:
- "Decouple: a layer must place itself by a NAMED z, never by referencing its neighbours."
- "a11y-first (ADR-0010/0011): the accessibility filters must cover EVERYTHING (game + HUD + menus), and must not be
  degraded by decorative effects."
- Multiplayer runs on separate viewports via per-screen render-textures — the world stack is per-viewport, the UI is global.
- The frame is half PIXI canvas (world) and half DOM/CSS (menus/HUD/captions) — one registry must span both.
- Inserting a future layer must not force renumbering everything.

considered-options:
- &adhoc "Keep ad-hoc addChildAt(getChildIndex(neighbour))"
- &magic "Scatter raw z-index numbers at each call site"
- &registry "A single named z-order registry (core/layers.ts) in two scopes, spanning PIXI+DOM, with post-FX as a separate filter chain"

pros-and-cons-of-the-options:
  adhoc:
    cons:
    - "Every layer coupled to its neighbours; z welded to creation order; extraction risks silent visual regressions."
  magic:
    cons:
    - "Unnamed numbers drift and collide; no shared meaning; same coupling in disguise."
  registry:
    pros:
    - &decouple "Each layer sets its own named z (PIXI zIndex + sortableChildren for world; CSS z-index for DOM overlay) — zero neighbour coupling."
    - &gaps "Step-100 spacing + a reserved MENU range (2600–2999) → insert a layer without renumbering."
    - &twoscopes "Two scopes make the per-viewport (world) vs global (overlay) split explicit, which is what the multiplayer render-textures need."
    - &a11ycovers "The a11y correction covers the WHOLE composited frame (menus included) — fixing the current gap where it did not."

decision-outcome:
  chosen-option:
    link: *registry
    justification: |
      Adopt `app/js/core/layers.ts` as the single source of truth: a named `Z` map in two scopes — WORLD (per viewport,
      applied as PIXI `zIndex` with `sortableChildren` on the camera) and OVERLAY (global, used as CSS `z-index` on the
      DOM menus/HUD/captions). Layer semantics (bottom→top): sky · sky-anim · parallax 4..1 · bg-decor · tiles ·
      interactive-scenery · vfx-back · fauna-decor · npc · items · PLAYER · vfx-front · foreground/weather · world-a11y ·
      then overlay: hud · touch-controls · captions · dialogue · game-msg · modal-scrim · menu(range) · transition · debug.
      Two confirmed calls: ITEMS render BEHIND the player (DK barrels / Yoshi / SMW keys); the filters cover EVERYTHING.
      Post-process is NOT a z-layer: CRT/vignette and the a11y filters are a CHAIN over the composited frame
      (`POST_FX_ORDER`), applied inner→outer, with **A11Y_CORRECTION last among the CORRECTION passes** (else the CRT
      re-tints and breaks the colour-blind correction), a11y modes **suppress** the decorative CRT/flashes, and the
      overlay is **palette-aware** (swaps to a CB-safe palette — extends the CB-safe UI work, ADR unlocks the "filter
      also covers the menu" fix).
      AMENDED 2026-08-24 (see ADR-0027): this record used to say A11Y_CORRECTION is ALWAYS last, full stop. It is not.
      **FLASH_LIMIT runs after it**, and the distinction that resolves the contradiction is between CORRECTION and
      SAFETY. A11Y_CORRECTION decides how the image LOOKS and must therefore see the final composite, menus included —
      that is why it outranks the CRT. FLASH_LIMIT decides whether the image can HARM: WCAG 2.3.1 bounds luminance
      change over time, and the only frame whose luminance matters is the one the eye actually receives. A limiter
      placed before the correction clamps an image that no longer exists, and the correction is free to re-open the
      swing it just closed — a colour-blindness matrix redistributes luminance by design. Safety is the outermost
      pass because it is the last thing that is true about the frame.
  consequences:
    positive:
    - *decouple
    - *gaps
    - *twoscopes
    - *a11ycovers
    neutral:
    - "World layers switch to PIXI `zIndex` + `sortableChildren` on the camera (fixed layers → negligible sort cost)."
    - "All ~54 addChild/addChildAt sites in game.js get rewired to `Z.*` — a dedicated round; scene-sky's 6 layers move too."
    negative:
    - "One-time large mechanical rewiring with visual-regression risk the sandbox can't verify → Dev eyeballs post-build."

  amendment-2026-08-26: |
    ⚠️ TRÊS AFIRMAÇÕES DESTE REGISTRO NÃO SE SUSTENTAM NA IMPLEMENTAÇÃO. Medidas no navegador em 2026-08-26,
    com o build `main-C-6FZO5r.js`. Ficam aqui com o texto original intacto acima — um registro que se corrige
    escondendo o que dizia antes não ensina nada.

    ===== 1. "OS FILTROS COBREM TUDO (jogo + HUD + menus)" É FALSO, E É UM DEFEITO NO AR =====
    É o driver de a11y deste ADR, e o motivo declarado de A11Y_CORRECTION vir depois do CRT. Medição, com a
    correção de daltonismo `fix-deuter` ativa:

      · a CANVAS carrega `filter: url(#cvd-fix-deuter)`  → cadeia de filtros: [CANVAS]
      · o MENU (`.screen-pause`, DOM irmão dentro de `#game-region`) → cadeia de filtros: []

    A criança daltônica recebe o JOGO corrigido e os MENUS crus. E o menu é onde estão as palavras — inclusive
    as dos próprios ajustes de acessibilidade. Nenhuma classe de `body` compensa isso: `document.body.classList`
    está VAZIA nesse estado, e a única regra de CSS que reage a modo (`body.blind-mode … {visibility:hidden}`)
    esconde HUD, não filtra.

    A CAUSA é de mecanismo, não de esquecimento: metade do quadro é canvas e metade é DOM, e **um filtro do
    PIXI não alcança DOM**. Este registro assumiu "uma CADEIA de passes sobre o frame JÁ COMPOSTO" como se
    existisse um frame composto único. Não existe.

    O MECANISMO QUE FUNCIONA existe e é simples: `filter` de CSS no `#game-region`, que é o elemento que contém
    a canvas E os menus. Hoje o filtro está na canvas. Mover o alvo é uma linha na raiz de composição (o verbo
    `AplicarFiltroCss`, criado em 2026-08-26) — mas muda a aparência de TODO menu em TODOS os 16 modos de
    visão, então é mudança que o Dev confere na tela, não que se empurra.

    Consequência para a ORDEM: com o filtro no `#game-region`, o CRT passa a ser filtrado JUNTO, que é
    exatamente o que `POST_FX_ORDER` manda (CRT_VIGNETTE é o passe mais interno, A11Y_CORRECTION vem depois).
    Hoje a ordem real é a INVERSA — a scanline é um pseudo-elemento em `z-index:500`, pintado POR CIMA da
    canvas já corrigida.

    ✅ RESOLVIDO EM 2026-08-27 PELO ADR-0047, e esta é a metade que faltava desde 2026-07-06: a scanline E a
    vinheta passam a CEDER a qualquer modo de acessibilidade visual, por padrão. A pergunta que esta emenda
    deixou em aberto ("a scanline cede como a vinheta passou a ceder, ou não?") está fechada, e fechada com uma
    resposta melhor que sim ou não — cede, e a criança tem uma chave por efeito no menu Sensibilidade visual para
    dizer o contrário. O `POST_FX_ORDER` deste registro finalmente descreve o que o código faz.

    ===== 2. "MODOS DE A11Y SUPRIMEM O CRT DECORATIVO" NÃO ESTÁ IMPLEMENTADO =====
    Medido com a vinheta ligada (`CRT.vig = 1`): a classe `crt-vig-1` sobrevive em `hc-direto`, `fix-deuter`,
    `lv-blur` e `blind` — nos dezesseis modos, na verdade. A precedência "a11y > estética" que este registro
    decide não existe em código.

    O impacto REAL é condicional e vale dizer com honestidade: a vinheta vem DESLIGADA de fábrica
    (`CRT_DEFAULT.vig = 0`), então só alcança quem a liga no menu Sensibilidade visual. Quem liga e usa alto
    contraste recebe uma vinheta escurecendo as bordas — trabalhando contra o modo que existe para aumentar
    contraste.

    ===== 3. AS ESCALAS SÃO TRÊS, NÃO DUAS =====
    Este registro diz "two scopes": MUNDO (por viewport, dentro da câmera) e OVERLAY (global, DOM). Falta a do
    meio, e é por isso que o `app.stage` é o único lugar que ainda se posiciona por ORDEM DE INSERÇÃO.

    Medido: em solo o `stage` tem 4 filhos (câmera, `weatherLayer`, `fogG`, `titleG`); com 3 telas tem 10 — os
    mesmos quatro mais 3 sprites de 320×180 (as render-textures por jogador), a moldura de 640×360 e as
    bolinhas indicadoras. Todos com `zIndex: 0` e `stage.sortableChildren === false`.

    Os seis últimos são criados por `render/screen-pipeline` e RECRIADOS a cada troca de número de telas. E há
    uma dependência de ordem que sustenta o multi-tela: `screen-pipeline` faz `stage.addChildAt(camera, 0)` —
    a câmera precisa ficar embaixo dos sprites de saída, senão o mundo cru cobre as telas compostas.

    A ESCALA QUE FALTA CHAMA-SE **COMPOSIÇÃO**: o mundo JÁ RENDERIZADO em textura, disposto na tela, uma vez
    por jogador. Não é MUNDO (que é o conteúdo DENTRO de cada viewport) nem OVERLAY (que é DOM). Encaixá-la no
    espaço numérico livre entre `WORLD_A11Y` (23000) e `HUD` (24000) seria erro de categoria: aqueles sprites
    não são "mais uma camada do mundo", são outra escala.

    Enquanto ela não tiver nome próprio no `Z`, o `stage` continua por ordem de inserção — e continuar assim é
    mais honesto do que inventar um número que passaria a mentir com autoridade.

  confirmation: |
    Recorded retroactively on 2026-08-06, and PARTIAL — stated as such rather than ticked. `app/js/core/layers.ts`
    exists and holds the named registry (`Z`, `POST_FX_ORDER`), so the decision is implemented. It is not yet ADOPTED:
    `game.js` is the only importer, meaning the ~54 layer sites still place themselves the old way. Rewiring them is
    issue !52. The decision stands; its rollout is unfinished, and this record should not read as though it were done.

    ATUALIZADO 2026-08-26, com medição (ver a emenda acima). A escala MUNDO ESTÁ adotada: o bloco "R1" do
    `main.ts` liga `camera.sortableChildren` e posiciona ~27 camadas por `Z.*`; sobrou UM
    `addChildAt(getChildIndex(...))` na árvore, o do `titleG`, e ele está no `stage` — a escala que este
    registro não nomeou. A escala OVERLAY NÃO está adotada: são 17 `z-index` literais em `style.css`, de 4 a
    500, sem relação com os slots de `Z`. E `POST_FX_ORDER` está declarado e nunca foi lido por código nenhum:
    a única ocorrência fora do próprio `core/layers.ts` é este parágrafo.

more-information: |
  ===== EMENDA 2026-08-27 — O QUE É POR TELA, E A ÚNICA EXCEÇÃO =====
  Este registro dizia apenas o FATO de implementação: "Multiplayer runs on separate viewports via per-screen
  render-textures". O Dev transformou isso em REGRA, e a regra é mais forte que o fato — ela proíbe uma
  otimização futura que parece óbvia:

    "Nunca unificar multi tela. Correções / melhorias são por tela. Modos multi são por tela. O único ponto que
     exige modo solo é o modo cego: ele limita a quantidade de telas para a quantidade de áudio, e os efeitos
     ligados a áudio (redução de fx etc.) têm prioridade e funcionam para todos ao mesmo tempo."

  Em termos deste registro: **todo ajuste de visão é por VIEWPORT**, nunca um filtro único sobre o `app.stage`.
  Numa mesa de dois jogadores em que só uma criança precisa de alto contraste, um filtro global corrigiria a tela
  da outra também — regressão silenciosa, e do tipo que ninguém reporta porque a tela "melhorou".

  O SOM NÃO É EXCEÇÃO À REGRA — ele é outra realidade, e o Dev fez questão da distinção: "é pra deixar claro a
  exceção do modo cego (acessibilidade), que NÃO É UMA EXCEÇÃO, mas sim uma realidade que não permite trabalhar de
  outro modo."

  A diferença não é retórica. Uma exceção é uma escolha que alguém poderia ter feito de outro jeito e decidiu não
  fazer — e uma exceção convida a ser revisitada ("e se a gente...?"). Aqui não há o outro jeito: **áudio não tem
  viewport.** Não existe recortar o som numa região da tela, como se recorta a imagem. Duas narrações simultâneas
  na mesma mesa não são duas narrações, são ruído.

  Daí decorre, e decorre por FÍSICA e não por política: o modo cego é GLOBAL, vale para a mesa inteira, e por isso
  LIMITA o número de telas — não porque a renderização não escale, mas porque a audição não se divide. Mesma lógica
  para tudo que estiver preso ao áudio (redução de efeitos, sonar, earcons): tem prioridade e vale para todos ao
  mesmo tempo.

  Isto é emenda e não registro novo porque é a mesma decisão de escopo que o parágrafo original tratava pela metade.
  O que a torna necessária: o fato era descritivo e a regra é proibitiva — só a segunda impede alguém de "otimizar"
  mais tarde.

  Registry + filter-chain live in `app/js/core/layers.ts` (`Z`, `POST_FX_ORDER`). Relates to ADR-0011 (visual a11y),
  ADR-0010 (pillars: a11y-first), and the CB-safe UI work. Y-sorting within an actor band is NOT adopted (side-view
  platformer → fixed order is standard); revisit only for a future top-down mode. The rewiring of the 54 sites is
  tracked as its own modularization round (a new issue).
