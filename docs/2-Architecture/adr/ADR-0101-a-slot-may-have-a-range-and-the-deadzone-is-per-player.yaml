title: A slot may have a RANGE, and the deadzone stops being one number for everybody

context-and-problem-statement: |
  The engine reads a gamepad as a set of switches. `PadButtonLike` declares `{ pressed: boolean }` and
  nothing else; `padActions` reads only `pressed`; `held()` returns a boolean. The Gamepad API offers
  `GamepadButton.value` and an axis offers a number, and both are discarded at the door.

  ⚠️ A GAME CANNOT RECOVER A NUMBER THE TRANSPORT THREW AWAY. This is not a gap a consumer can fill: by the
  time the game sees the input, the travel is gone. `input/default-bindings.ts` already says so in its own
  header about the triggers, which means the defect was seen, named, and left.

  ⚠️ AND THE DEADZONE IS ONE NUMBER FOR EVERY CHILD ON EVERY PAD. `PAD_DEAD = 0.5` is a module constant.
  ADR-0013 chose it deliberately, as ergonomics — half the stick's travel, so a hand does not have to hold
  a precise position. That reasoning is right and is not being withdrawn. What is wrong is that it is the
  ONLY value: a child with a tremor needs more, a child with limited range of movement needs much less, and
  in a two-seat game they sit at the same screen.

decision-drivers:
  - "A number discarded at the transport cannot be recovered downstream, so this is the engine's or it is
     nobody's."
  - "⚠️ A DEADZONE IS AN ACCOMMODATION WEARING A TUNING'S CLOTHES. It looks like feel and it decides whether
     a particular hand can steer at all. Pillar 2 makes it the engine's business; pillar 1 makes it urgent,
     because the pads a school has are not the pads a value was chosen on."
  - "ADR-0013's ergonomics argument still holds for the DEFAULT: a child who has not been given a value
     should meet a forgiving one, not a twitchy one."
  - "The four analogue positions exist already (ADR-0086); what is missing is that two of them are triggers
     and are being read as switches."

considered-options:
  - "A1 - a slot may declare a RANGE. The transport reports magnitude where it has one, and the deadzone is
     per player with 0.5 as the default"
  - "A2 - magnitude only, and the deadzone stays global"
  - "A3 - leave both. Games that want a range read `navigator.getGamepads()` themselves"

pros-and-cons-of-the-options:
  A1:
    good:
      - "⚠️ THE TWO ARE ONE DECISION AND SEPARATING THEM WOULD BE ODD: both are the same sentence - the
         transport reads a number and must stop discarding it. A magnitude with a fixed deadzone is a
         magnitude a particular hand still cannot produce."
      - "A digital slot can still carry a ranged action by RAMPING while held, so a keyboard and a touch
         layout are not excluded from a game that uses a trigger."
      - "It makes a stick usable for aiming and steering, which is most of what a sports game is."
    bad:
      - "⚠️ EVERY CONSUMER OF `held()` NOW HAS A SECOND QUESTION TO ASK, and the ones that do not ask it get
         a boolean that is quietly a threshold. The migration is real and it is the same shape as issue
         #103's, which is not yet cold."
      - "Per-player deadzone is one more setting to persist and migrate, next to the keymap that already
         owes a migration and the charge modes that would owe another."
  A2:
    good:
      - "Smaller: one change, no new persisted state."
    bad:
      - "It gives a child a number she cannot reach. A stick with a half-travel deadzone that now reports a
         magnitude reports it only to hands that can push past half, which is the population the deadzone
         was set for in the first place - inverted."
  A3:
    good:
      - "No engine change at all."
    bad:
      - "⚠️ A game reading `navigator.getGamepads()` directly bypasses the remap, the mapping wizard, the
         per-player assignment and the one-button mode. It is not a shortcut to the same place; it is a
         second input layer with none of the accessibility in it."

decision-outcome:
  chosen-option:
    link: "A1 - a range, and a deadzone per player"
    justification: |
      ===== 1. A SLOT MAY HAVE A RANGE =====

      `PadButtonLike` gains the value the API already offers, and a slot may be declared as RANGED. A ranged
      slot reports a magnitude in `0..1`; an unranged one reports what it always did.

      ⚠️ AND A DIGITAL TRANSPORT STILL CARRIES A RANGED ACTION, by ramping while held. A keyboard has no
      travel and a touch button has none either, so without this rule a game that used a trigger would be
      declaring itself unplayable on the two transports a school actually has (pillar 1). The ramp is the
      same shape as the charge in the record beside this one, and should share its curve rather than grow a
      second one.

      ===== 2. THE DEADZONE IS PER PLAYER, AND 0.5 IS THE DEFAULT =====

      ADR-0013's reasoning stands: a child who has been given no value meets a forgiving one. What changes
      is that it is a value and not THE value. Two seats at one screen may hold opposite ones.

      ===== 3. WHAT THIS RECORD DOES NOT DO =====

      ⚠️ It does not decide how a ranged action reaches a game that reads `held()`. That is the migration,
      it is the same shape as issue #103's, and it belongs with the issue that executes it rather than
      here - where it would be a plan rather than a decision.

  consequences:
    positive:
      - "Triggers and sticks stop being switches, and a sports game becomes possible without a second input
         layer."
      - "A deadzone can be set for the hand in front of the machine."
    neutral:
      - "The mapping wizard already classifies an axis by behaviour rather than by magnitude, so it needs
         nothing new to keep working."
    negative:
      - "⚠️ A migration across every consumer of `held()`, immediately after one just like it."
      - "One more persisted per-player setting."
      - "A boolean that is really a threshold is now a lie a reader can believe, until every call site has
         been visited."

  confirmation: |
    Feeding a fake pad a button with `{ pressed: true, value: 0.4 }` yields a magnitude of 0.4 on a ranged
    slot and `true` on an unranged one. Two players with different deadzones produce different directions
    from the same stick position. A keyboard produces the full range of a ranged action by holding.

more-information: |
  The football game would use this for three things and is playable without any of them: sprint that is a
  degree rather than a switch, a stick that aims a pass, and a trigger whose travel is the power. It is
  currently written against booleans and would lose nothing by keeping them - which is why this record is
  proposed on the engine's own recorded defect rather than on a game's need.
