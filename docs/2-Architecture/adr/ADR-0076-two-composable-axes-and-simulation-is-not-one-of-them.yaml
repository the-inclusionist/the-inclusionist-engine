decision-outcome:
  chosen-option:
    link: "S2 — theme × colour correction compose; simulation exists only from the default of both"
    justification: |
      ===== 1. THE TWO AXES, AND THEY ARE THE ONLY TWO =====
      **TEMA (contraste)** — standard, 3:1, 4.5:1, 7:1 (ADR-0011). A rendering theme, no colour matrix.
      **CORREÇÃO DE COR** — none, protan, deuter, tritan. A colour matrix.

      They are INDEPENDENT and compose. A child may hold a contrast level and a colour correction at the same
      time, which is the whole of ADR-0075 and is unchanged.

      Their defaults have their own names: **`Tema padrão`** and **`Visão tricromática`**.

      ===== 2. SIMULATION IS NOT AN AXIS =====
      `sim-protan`, `sim-deuter`, `sim-tritan`, the five low-vision modes and blind mode are **SIMULAÇÕES DE
      VISÃO**, and they live in the empathy menu, where ADR-0011's erratum already put them.

      ⚠️ THE RULE, AS THE DEV STATED IT: **a simulation can only exist when the vision is DEFAULT for both
      high contrast and colour blindness.** Both axes at their default, or no simulation.

      The reason is what a simulation is FOR. It exists so somebody can feel what another person sees. From
      a corrected screen it shows neither the deficiency nor the correction; from a high-contrast theme it
      shows what high contrast does, not what deuteranopia does. ⚠️ A demonstration that runs over an
      adaptation is not a weaker demonstration — it teaches something false.

      ===== 3. THE NAME, WHICH IS WHAT ACTUALLY WENT WRONG =====
      ⚠️ **THEY ARE `SIMULAÇÕES DE VISÃO`, NEVER `FILTROS DE VISÃO`.** ADR-0075 called the group a filter
      because filter is what the code does. Correction is also a filter. Grouping by MECHANISM is what merged
      an accessibility feature with an empathy feature — twice, now, in two records.

      The rule that follows, and it is the transferable part of this whole record: **a group of settings is
      named for what it is FOR, never for how it is implemented.** `Correção de cor` is for who needs it;
      `Simulação de visão` is for who wants to understand. No name in the menu, in the code or in a record
      may put them under one word again.

      ===== 4. WHAT REFUSING LOOKS LIKE =====
      A simulation is offered only from the default of both axes. When an axis is not at its default, the
      simulation is shown as UNAVAILABLE with the reason — never silently removed, and never accepted and
      then ignored. ⚠️ And the reason is stated as a fact about the demonstration, not as a scolding: the
      simulation shows what a person sees, and it can only do that from the unadapted screen.

  consequences:
    positive:
      - "A child can have a contrast level and a colour correction together — ADR-0075's decision, kept."
      - "The menu about NEEDING and the menu about PRETENDING stop sharing a control, permanently, with a
         naming rule that says why."
      - "A simulation always demonstrates the thing it claims to demonstrate."
      - "`simulatesDisability`, which the code already has, becomes the boundary of a decision instead of an
         implementation detail."
    negative:
      - "⚠️ A GATE IS A REFUSAL, and refusals need an explanation somebody can read. The empathy menu has to
         say why a simulation is unavailable, in the footer, without adding prose to the rows."
      - "Three concepts to hold instead of two, in a menu read by children."
      - "The migration of ADR-0075 §4 is unchanged and still the dangerous part: `p.viz` is read across the
         engine and the saved value must survive the split."
    neutral:
      - "Everything ADR-0011 decides other than the exclusivity — Direct Rendering, the three contrast levels,
         the CB-safe palette on non-scenery — governs unchanged, and is carried here rather than restated."

  confirmation: |
    · A player can have `7:1` and `fix-deuter` at once, and a test asserts BOTH are applied.
    · With either axis away from its default, every simulation is UNAVAILABLE and says why.
    · With both axes at default, every simulation is available.
    · No control, dictionary key or record groups a correction and a simulation under one name. Checkable:
      no menu group contains both a `fix-*` and a `sim-*`.
    · A setting saved before the split restores the same visible state after it.

    ⚠️ NONE OF THESE PASSES TODAY. Nothing is implemented; only the interim label changed (`Modo padrão`).

more-information: |
  SUPERSEDES ADR-0075 WHOLE, one day after it was written, and whole rather than in part for the reason
  ADR-0057 gives: the case is MIXED. Part of ADR-0075 was never true — it invented a `vision filter` axis the
  Dev never asked for, with facts about the correction/simulation split already available in ADR-0011's own
  erratum — and part is a genuine change, because the Dev then stated a rule that record does not contain.
  A mixed case supersedes whole.

  ⚠️ AND WHAT ADR-0075 GOT RIGHT IS CARRIED, NOT REPLACED: contrast and correction compose; ADR-0011's
  exclusivity was the defect; the migration is the dangerous part; `modo sem deficiência visual` is refused
  because a label may not diagnose the reader. Those sentences are this record's too.
