title: TWO composable axes — theme and colour correction — and SIMULATION is not one of them

context-and-problem-statement: |
  ADR-0075 decided the thing that mattered: contrast and colour correction must be able to be on at the same
  time. That decision is right and is carried forward here without a comma changed.

  ⚠️ AND IT INVENTED A BUCKET THAT THE DEV NEVER ASKED FOR. Its §1 created a second axis called **VISION
  FILTER**, holding *a correction, OR a simulation, OR a low-vision mode, OR blind mode — one at a time*.
  That list puts an ACCESSIBILITY feature and an EMPATHY feature in the same control, which is precisely the
  error ADR-0011's own erratum had already corrected once: the corrections had been listed in the Empathy
  panel, *"so the child who NEEDED the correction had to look for it in the menu about pretending"*, and the
  catalogue gained a `sim` field because `kind` could not tell the two apart.

  ⚠️ AND THE NAME IS THE CAUSE, WHICH IS THE REASON THIS IS A RECORD AND NOT A PATCH. "Vision filter" names
  the MECHANISM. Correction and simulation are both filters, and they are opposite purposes: one lets a child
  PLAY, the other lets someone FEEL what it is like not to. A vocabulary that groups by mechanism will keep
  re-merging them — it has now done so twice, in two different records, written two weeks apart, by people
  who both knew the difference.

  The Dev stated the rule that settles it: **a vision simulation can only exist when the vision is DEFAULT
  for both high contrast and colour blindness.**

decision-drivers:
  - "⚠️ Correction and simulation must never share a control or a name. The project has now merged them
     twice; the second time was in a record written to fix the first."
  - "A simulation only MEANS anything from the default. On top of a correction it shows neither; on top of a
     contrast theme it measures the theme."
  - "The two things a real person may need at once — a contrast level and a colour correction — must compose,
     which is ADR-0075's decision and is not in question."
  - "The code already knows the difference and says so: `simulatesDisability` exists precisely because `kind`
     could not answer it."

considered-options:
  - "S1 — ADR-0075 as written: theme × one `vision filter` axis holding correction, simulation, low vision
     and blind"
  - "S2 — TWO composable axes (theme × colour correction) and SIMULATION as a separate mode, available only
     when both axes are at their default"
  - "S3 — three fully independent axes: theme × correction × simulation, all composable"
  - "S4 — simulation composes with the theme but not with a correction"

