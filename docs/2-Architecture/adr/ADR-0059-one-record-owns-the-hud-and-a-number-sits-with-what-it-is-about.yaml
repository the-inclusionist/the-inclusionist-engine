decision-outcome:
  chosen-option:
    link: "H3 — one record owns HUD placement; both predecessors superseded in the part that legislated it"
    justification: |
      ===== 1. THE RULE, WHICH OUTLIVES THE ADDRESSES =====
      A number sits with WHAT IT IS ABOUT. Three bands, and every number belongs to exactly one:

        · **IDENTITY — top left.** What is true of the PERSON, and survives the round.
        · **SESSION — top centre.** What is true of this SITTING, and dies with it.
        · **ROUND — top right.** What this round granted, and resets with the round.
        · **LEARNING — bottom centre.** Where the child stands in a SKILL, which outlives every activity.

      ⚠️ AND THE RULE IS WHY THE SCORE MOVED, not the Dev's preference. The point count is a record of the
      PERSON's work — both sources, academic answers and good deeds (ADR-0049 §1) — and it does not reset with
      the round. Under the rule it can only sit in the identity band, which is where their own words put it:
      "a contagem de pontos embaixo do nome do jogador no topo à esquerda". ADR-0050 §3 had grouped it as one of
      "the player's own numbers on the right", which was a defensible grouping and the wrong one: it put a
      persistent number in the band that resets.

      ===== 2. THE ADDRESSES =====
      Top of screen, beneath the quick accessibility bar (ADR-0044 item 7):

        · **LEFT — identity:** the avatar, the player's FIRST NAME to its right, and the POINT COUNT directly
          under the name.
        · **CENTRE — session:** the clock pie, with the digital countdown directly below it. The pie and its
          behaviour are ADR-0050 §3 and are not decided here.
        · **RIGHT — round:** the SUPER-POWER, and the platformer's ten-coin objective counter. Both die with
          the lap (ADR-0049 §7).

      Bottom of screen, centred: the **ten-segment BARS — one per enabled skill, one to three of them**
      (ADR-0049 §5). They are bottom rather than top because they are the only element that belongs to a SKILL
      TREE rather than to the session, and the bottom edge is the one place nothing else competes for.

      ⚠️ AND IN MULTIPLAYER THE WHOLE THING REPEATS INSIDE EACH `.player-screen` (ADR-0027's grid), because
      each child has her own name, her own points and her own skills. It is not one HUD with four names.

      ===== 3. WHAT THIS RECORD DOES **NOT** DECIDE =====
      Written out because a record that owns a surface will be read as owning everything on it:

        · The CLOCK — the pie, the countdown, the unit change at five minutes, the red slice for a scheduled
          break, and the rule that it measures the session and never the activity. That is ADR-0050 §3, intact.
        · What a bar SEGMENT MEANS — the colours, that only an academic question paints one, that an "erro" is
          the third wrong attempt, and that eight blues raise the level. That is ADR-0049 §5, intact.
        · Whether the number exists at all. This record places numbers; it does not create or remove any.

      ===== 4. WHY A THIRD FILE INSTEAD OF A THIRD EDIT =====
      Because the two edits already made are what produced the problem. ADR-0049 §5b was ADDED to an accepted
      record on 2026-08-28; ADR-0050 §3 was REWRITTEN on 2026-09-04. Both left `status: accepted` and neither
      left a trace in metadata, so a reader — and, measurably, an automated diagnostic — had no way to tell that
      either record had moved. ADR-0057 §1 decides that a replaced decision is superseded; this is the first
      application of `superseded-in-part`, which exists precisely so that replacing ONE clause does not cost the
      other clauses their address.

  consequences:
    positive:
      - "The HUD has one owner, so the next element to be placed is a pointer away from a rule instead of an
         argument between two records."
      - "The rule (`a number sits with what it is about`) places elements nobody has proposed yet, which is what
         makes it worth more than the list of addresses."
      - "Both predecessors keep the half that is properly theirs, so no argument had to be re-made."
      - "Issue #94, which faithfully implements ADR-0050 §3, now has one record to follow instead of two that
         disagree."
    negative:
      - "Three records now describe one screen, and a reader reconstructing the history opens all three."
      - "`superseded-in-part` on two records is bookkeeping that a single authoritative edit would not have
         needed — the price of the mechanism, paid on purpose."
      - "The bands are named after what a number is ABOUT, which requires a judgement for any number whose
         subject is ambiguous. The first such case will test whether the rule is real."
      - "Nothing here is implemented. The HUD in the code today matches neither predecessor completely."
    neutral:
      - "ADR-0049 §5b keeps its full text under its own pointer, so the reasoning that produced the score's
         address stays where it was written."

  confirmation: |
    THE GATE, in the shape of `pausa-44px.browser.test.js` — it mounts the production markup and MEASURES,
    rather than reading a stylesheet:
      · The point count's box is inside the same band as the name, and its top edge is below the name's bottom
        edge. (Fails if the score returns to the right.)
      · The clock pie's centre is within the middle third of `#game-hud`'s width.
      · The bars are at the BOTTOM of `#game-region`, horizontally centred, and there are between one and three
        of them.
      · In a two-player layout, each `.player-screen` contains exactly one of each. (Fails on one shared HUD.)

    Born failing, with the mutation confirmed: moving the score into the right-hand band must go red.

    ⚠️ WHAT NO GATE CONFIRMS: whether a child finds the numbers faster this way. The rule is an argument from
    what each number is about, not a measurement of where eyes go, and this project has never put the HUD in
    front of a child. Issue #7 (field test with five children) is where that would be answered.

more-information: |
  WHAT THIS RECORD SUPERSEDES, and only in part:
    · **ADR-0050 §3** — the HUD LAYOUT paragraph. Everything else in §3, which is the clock, stays there.
    · **ADR-0049 §5b** — the addresses of the point count, the bars and the coin counter. The semantics of the
      bar, which is most of §5b, stay there.

  ⚠️ AND ADR-0049 STILL OWES A CLASSIFICATION. Four of its sections (§5, §5b, §6b, §7) were amended into an
  accepted record on 2026-08-28 and none was declared. This record settles only the part it needed; the rest
  is a separate step, and until it lands ADR-0049 is in the `validate-adr.py` amendment-debt list.

  THE REVERTED EDIT: the commit tagged `adr-0050-reverted-amendment` amended ADR-0050 §3 in place — tagged
  rather than named by hash, per ADR-0057 §1c. It is undone; the same content, decided
  properly, is §1 and §2 above.
