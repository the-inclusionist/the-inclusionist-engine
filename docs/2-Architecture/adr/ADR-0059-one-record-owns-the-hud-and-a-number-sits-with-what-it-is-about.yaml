title: ONE record owns the HUD's layout, and a number sits with what it is ABOUT — identity, session, learning

context-and-problem-statement: |
  Two accepted records legislated the same surface and disagreed about it.

    · ADR-0050 §3 (2026-08-27): "the numeric score on the RIGHT with the super-power below it".
    · ADR-0049 §5b (added 2026-08-28): "TOP LEFT, UNDER THE PLAYER'S NAME: the point count".

  Both said `accepted`. Nothing said which one governed. A HUD built from either was defensible and one of the
  two was going to be wrong, and issue #94 — the implementation issue — had faithfully copied the older one.

  ⚠️ AND THE FIRST ATTEMPT TO FIX IT WAS THE WRONG MECHANISM, which is why this record exists. On 2026-09-04
  the conflict was resolved by EDITING ADR-0050 §3 in place, under the house rule then in force. ADR-0057
  retired that rule the same day: a record that said what was decided and was then replaced is SUPERSEDED, not
  overwritten. The edit is reverted, ADR-0050 §3 is restored to its own words, and the two predecessors are
  marked `superseded-in-part` pointing here.

  ⚠️ AND THE DEEPER PROBLEM IS NOT THE SCORE'S ADDRESS — IT IS THAT TWO RECORDS OWNED ONE SURFACE. Fixing only
  the disagreement would leave the mechanism that produced it: ADR-0049 is about REWARDS and ADR-0050 is about
  CONTROL SURFACES, and both had reason to say something about the HUD. The third record to touch it would have
  disagreed with one of them again.

decision-drivers:
  - "A surface with two owners has no owner. The disagreement is a symptom; the shared ownership is the defect."
  - "A child who cannot hold two places in her head needs each number ALWAYS in the same place — so the layout
     is an accessibility decision, not a visual-design one, and it belongs where accessibility decisions go."
  - "The layout must survive being read by someone who has only one of the records in hand."
  - "The rule that generates the addresses matters more than the addresses: the next number to be added must
     have an address before anyone argues about it."

considered-options:
  - "H1 — ADR-0050 §3 keeps ownership; the score stays on the right and ADR-0049 §5b is struck"
  - "H2 — ADR-0049 §5b keeps ownership; the score moves left and ADR-0050 §3's layout paragraph is struck"
  - "H3 — a NEW record owns HUD placement entirely; both predecessors are superseded in the part that legislates
     it, and each keeps the half that is properly its own"
  - "H4 — leave the layout split across both records and add a written precedence rule (`the later record wins`)"

