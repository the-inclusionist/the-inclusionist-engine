  date: 2026-09-05
  superseded-in-part:
    - by: ADR-0079
      what: "§3, and ONLY the reachability question it asked — `can every action the GAME uses be reached by
             THIS transport?`, with a shortfall refusing the game. A transport DECLARES SLOTS and the player
             assigns actions to them; one control method never removes another, so a method that demands
             skill (a mouse) is an option and not an exclusion. The guarantee moves from per-transport to
             per-SET: at least one AVAILABLE transport carries this game's action set. The nine transports,
             the two families and the built/backlog/no-foundation labels are untouched."
    - by: ADR-0077
      what: "§1, and ONLY the fourth verb: `action1-mod` becomes `action4`, and the modifier reasoning
             attached to it is withdrawn — it was meaning in a vocabulary written to have none, and it
             described one genre out of three hundred. Whether an action is HELD or LATCHED moves to the
             control options, per action, which reaches every action of every game instead of one verb of
             one genre. Everything else here governs: the nine positions, the game supplying the words, no
             abstract name reaching a person, the nine transports, `start` on two transports of nine, the
             pointer not existing, and §4 refusing to collapse the keyboard schemes."
    - by: ADR-0085
      what: "§1, and ONLY the SIZE of the set: nine becomes FOURTEEN. `action5`..`action8` and `select` join
             it, on the Dev's statement of 2026-09-06 that more elaborate games need them. THIS RECORD
             ANTICIPATED IT AND SAID SO IN ITS OWN CONS — `nine actions is a CEILING that a genre may want
             to exceed, and the record has to say what happens`. ADR-0085 is what happens. Everything else
             in §1 governs, and is in fact what decided the NAMES: positions and not meanings, the game
             supplying the words, and no abstract name reaching a person — which is why the request's own
             vocabulary (`L1`, `L2`, `R1`, `R2`) became a gamepad BINDING and not an action name."
    - by: ADR-0086
      what: "§1, and ONLY the PLATFORMER PRESET — the sentence `what today is jump is action1; run is
             action1-mod; swap is action2; especial is action3`. The Dev corrected three of the four on
             2026-09-06: run is `action1`, jump is `action2`, especial is `action3` (unchanged), swap is
             `action4`. ⚠️ AND THE CORRECTION IS THE CONSERVATIVE READING, WHICH IS THE OPPOSITE OF HOW IT
             LOOKS: measured against `input/keyboard.ts:36-37` and `input/gamepad.ts:111`, the corrected
             preset moves ZERO of four verbs off the key and button a child uses today, and the mapping
             written here would have moved THREE. Everything else in §1 governs — positions not meanings,
             the game supplying the words, no abstract name reaching a person. ADR-0085's clause about the
             SIZE of the set is separate and also still in force."
    - by: ADR-0112
      what: "§2, and ONLY the sentence that transports 8 and 9 «are therefore not partially built: they have
             no foundation». That was true when written — `input/` had keyboard, gamepad and touch and no
             pointer at all — and ADR-0112 is the foundation: a POINTER as a declared capability beside the
             fourteen, bound from mouse, touch, stick or gaze, with the Dev's clause that on a keyboard the
             continuous signal IS the mouse. ⚠️ The fourteen positions stay DISCRETE and untouched, which is
             the point of the shape chosen: every accessibility mechanism defined over them — remapping,
             one-button, latching, reach — keeps working without answering a second question. What decided it
             was measurement rather than taste: category 19 of 35 in the catalogue («Desenho / Criativo») is
             impossible without continuous input, in full, and magnitude on the fourteen would not have
             unblocked it, because drawing is POSITION and not magnitude. Everything else in §2 governs — the
             nine transports, the two families, and the built/backlog/no-foundation labels for the rest."
