metadata:
  status: "accepted"
  date: 2026-08-26
  decision-makers: [Dev]
  consulted:
    - "Xbox Accessibility Guideline 106 (screen narration) — https://learn.microsoft.com/en-us/gaming/accessibility/xbox-accessibility-guidelines/106"
    - "Game Accessibility Guidelines — screenreader support incl. menus & installers — https://gameaccessibilityguidelines.com/ensure-screenreader-support-including-menus-installers/"
    - "NN/g — Screen Readers on Touchscreen Devices — https://www.nngroup.com/articles/touchscreen-screen-readers/"
    - "NN/g — Challenges for Screen-Reader Users on Mobile — https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
    - "WCAG 2.2 §2.5.8 Target Size (Minimum) — https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html"
    - "arXiv:2301.08031 — My Zelda Cane: strategies used by blind players"
    - "ADR-0011 (visual a11y), ADR-0020 (z-order + post-fx), ADR-0028 (menus), ADR-0029 (changed-from-default mark)"
  informed: []

title: ONE menu per screen, the exit first, and narration that can be interrupted — the quick accessibility bar leaves the pause card and becomes HUD

context-and-problem-statement: |
  The Dev looked at the pause card and said it did not seem right for a blind child. He was reading a
  structure, not a bug report, and measuring it turned the intuition into numbers.

  MEASURED on the built game (`main-875a43c`), pause card open:

    · 22 interactive elements in ONE card, in two blocks with two different interaction models —
      a strip of TEN emoji-only toggles (`role="group"`) and TWELVE word items (`role="menu"`),
      with an `<h2>` between them.
    · Touch targets were NOT the problem, which is the part that surprised: the icons are 44×44 CSS px
      (WCAG 2.5.8 asks 24×24; Apple's HIG recommends 44) and the menu items are 262 × 35,6 px.
    · The problem is ORDER and VOLUME. `resume` — the way OUT — is the FIRST item of the options
      list and the ELEVENTH stop of the card, because the ten icons precede it in reading order.

  A child who pauses and cannot see must sweep ten accessibility toggles and a heading before
  reaching "Continuar". Screen readers present in strict sequential order, and the listener has to
  hold everything in short-term memory while searching (NN/g). Visual grouping does not survive that
  linearisation: what a sighted child reads as "a bar and a list" is, to a screen reader, twenty-two
  things in a row.

  Three more gaps came out of the same reading, all of them things XAG 106 requires and this game
  does not do:

    · NO INDEXING anywhere. XAG is explicit that position and total "help non-sighted players remain
      oriented and confident that they have found all of the controls", and that the number belongs at
      the END of the string ("Gamma, slider, 38%, 6 of 9"), with an option to turn it off.
    · NARRATION IS NOT INTERRUPTIBLE. XAG requires that moving focus stops the running string
      IMMEDIATELY and starts the new one. Without it, navigation waits on sentences.
    · THE INTERACTION HINT IS HIDDEN FROM THE PEOPLE IT IS FOR. `.pause-legend` — the line that says
      which button does what — carries `aria-hidden="true"`. It is exactly what XAG says to narrate
      ("A to Select"), and it is explicitly removed from the accessibility tree. Probably because it
      shows controller glyphs that read badly — but then the information has to exist in another form,
      not disappear.

decision-drivers:
  - "The exit must be the first thing found, not the eleventh. A menu you cannot leave is a trap, and the
     trap costs most for the child who cannot see it."
  - "One reading order per screen. A card with two interaction models and no heading between them makes the
     listener discover mid-sweep that the rules changed."
  - "A11y-first (ADR-0010): when structure and convenience disagree, structure for the child wins."
  - "Whatever is decided must be MEASURABLE, or it is decoration — this project already gates contrast,
     precache, types and boundaries the same way."

considered-options:
  - "M1 — keep one card and reorder it: `resume` first, then the icons"
  - "M2 — keep one card, add a heading before the icon bar and index everything"
  - "M3 — SPLIT: pause holds ONE options list; the quick accessibility bar becomes HUD"

pros-and-cons-of-the-options:
  M1:
    good: ["One line of markup. Fixes the worst symptom immediately."]
    bad: ["Leaves 22 stops in one card and two interaction models with no boundary between them.",
          "The icons stay in the way of every other option."]
  M2:
    good: ["Honest structure; the listener is told where the rules change."]
    bad: ["Still 22 stops. A heading makes the card comprehensible, not short."]
  M3:
    good: ["ONE menu per screen — so every menu in the game can be a single doubly-linked ring, and
            'what happens at the end of the list' has one answer everywhere.",
           "The quick bar reaches the HUD, where it is available DURING play instead of only after pausing.",
           "The options list drops from 12 items to 7, and `resume` becomes 1 of 7 in any counting."]
    bad: ["Two surfaces to build instead of one, and the HUD bar needs its own tip/hover affordance.",
          "Keyboard reach for the quick bar has to be defined, because a HUD strip is not in the tab order
           during play."]

decision-outcome:
  chosen-option:
    link: "M3 — split the two menus, and make ONE menu per screen the rule"
    justification: |
      ===== 1. TWO MENUS, AND THEY GET NAMES =====
      The Dev named them, and the names are the decision: what used to be one card is the QUICK
      ACCESSIBILITY MENU (the ten toggles) and the OPTIONS LIST (the words).

      ===== 2. THE PAUSE HOLDS ONLY THE OPTIONS LIST, WITH SEVEN ITEMS =====
      In this order, and the order is part of the decision:

        1. resume (voltar)          ← FIRST. The exit is what a pause is for.
        2. accessibility            ← returns to the normal screen, but the directional input drives the
                                      QUICK ACCESSIBILITY MENU instead of the player. START or BACK
                                      (X on PlayStation / B on Xbox / A on Nintendo) gives control back.
        3. add player
        4. options                  ← opens the options submenu, below
        5. help
        6. print                    ← not only "go back and look at the frozen screen": it lets the player
                                      PAN THE WHOLE MAP with the directional. It does NOT lift fog — not on
                                      the minimap, not on canvas fog. Revealing the map is progress, and a
                                      pause must not hand out progress.
        7. quit (sair)              ← LAST. It is the least wanted outcome of pausing, and one press UP
                                      from `resume` reaches it, because the list is a ring (see 5).

      ===== 3. THE OPTIONS SUBMENU =====
      Comunicação · Empathy Mode · Hearing Accessibility · Motor Accessibility · Tipography ·
      Visual Accessibility · Visual Sensitivity.

      ===== 4. THE QUICK ACCESSIBILITY MENU MOVES TO THE HUD =====
      It lives on the HUD with a tip on hover or on keyboard selection. Keyboard reach is ONLY through
      the pause (item 2 above) — a HUD strip that joined the tab order during play would put ten stops
      between the child and the game.

      ===== 5. ONE MENU PER SCREEN, SO EVERY MENU IS A RING =====
      Because there is never more than one menu on a screen, every menu can be a DOUBLY-LINKED list:
      past the last item you are at the first, and before the first you are at the last. XAG 106 permits
      this precisely for linear menus (and forbids it for 2-D tile grids, which this decision no longer
      has). It is what makes `quit` reachable in ONE press from `resume` without being anywhere near it.

      ===== 6. SIZE AND SHAPE =====
      Option buttons go to 44 px tall (from 35,6). The list is CENTRED and WIDER. 44 is not the WCAG
      minimum — that is 24 — it is Apple's recommendation, and this project takes a floor as a floor.

      THE NUMBER WAS CHALLENGED, and the challenge improved the record. The Dev asked whether 44 was
      excessive: the screen is DRAWN for 320×180, the smallest size in real use is 640×360, so a button
      would only need 22 in the base drawing to land on 44 on screen.

      The reasoning is CORRECT for anything drawn INSIDE the canvas — and these buttons are not. MEASURED
      on the built game: 320×180 is the canvas BUFFER, which the browser upscales 2×; `#game-region` and
      `#dom-layer` are 640×360 CSS with `transform: none`. The pause card, the accessibility bar and the
      touch controls are DOM, laid out in CSS pixels at the region's real size — a button declared 44px
      measures 44 CSS px, not 88, and 22 would measure 22 (below the WCAG floor of 24).

      AND THE DECIDING ARGUMENT IS NOT EITHER STANDARD — it is this project's own physical ruler, already
      fixed in the touch panel: "11–12,5 mm = mão de criança (6–12 anos)… mínimo 11 mm: abaixo disso o
      polegar erra mais e segurar cansa antes (base: alvo de polegar ~9,6 mm)". At 96 px/in, 44 CSS px is
      11,6 mm — inside the child-hand band. 22 px would be 5,8 mm, under the thumb target the panel itself
      cites. (The conversion assumes 96 px/in; on the school hardware only the device answers.)

      ⚠️ THE LIST SCROLLS AT 640×360, and that is a measurement and not a problem: the card holds 413 px of
      content in 353 visible px. For a child navigating by ear it costs nothing (the ring wraps and every item
      announces itself); for a finger it is one scroll.

      THE CLAUSE THAT USED TO SIT HERE — a paragraph asking whether to keep the scroll, shrink the gaps or hide
      the heading — was REMOVED on 2026-08-27 at the Dev's instruction. It never described a decision he had asked
      for: I invented the question, he answered "eu nunca pedi para remover a rolagem da lista de pausa", and an
      open question standing in an accepted record is an invitation for someone to close it. The scroll is simply
      how the card behaves.

      ===== 7. THE SCREEN HAS THREE ZONES, AND FUNCTION — NOT PROXIMITY — DECIDES WHICH =====
      Added 2026-08-27, in the Dev's words, and it belongs in THIS record because it is the general rule that
      item 4 above (the quick bar leaving the pause card for the HUD) is one instance of:

        "O menu de acessibilidade é uma coisa, e deve ficar no CABEÇALHO; o menu de opções com botões amarelos é
         outra e deve ocupar o ESPAÇO DE TRABALHO na tela; e a legenda é outra coisa, e deve ficar no RODAPÉ."

      It is Gestalt read correctly: proximity groups things, so putting unlike things near each other MAKES A
      CLAIM — that they belong together. Three functions, three places, and the placement carries the meaning:

        · HEADER — the accessibility controls. Reachable during play, above everything, never inside the work.
        · WORK AREA — the options list, the activity, whatever the child is actually doing right now.
        · FOOTER — the caption and the explanation line, which comment on the work without being part of it.

      ⚠️ AND IT IS A RULE ABOUT WHAT NOT TO MOVE. It exists because of a complaint that arrived twice: "eu peço
      para mudar um ponto e você muda vários outros desnecessariamente". With the zones written, "it was nearby"
      stops being a reason to relocate anything — an element moves when its FUNCTION changes, never because there
      was room next to something else.

      ===== 8. THREE RULES THAT APPLY TO THE WHOLE GAME, NOT ONLY TO THE PAUSE =====
        · INDEXING: every navigable item announces its position and total, at the END of the string
          ("Alto contraste, ativado, 6 de 10"), with an option to turn indexing off.
        · INTERRUPTIBLE NARRATION: moving focus stops the running string immediately and starts the new
          one. Everywhere — pause, title, options, activities.
        · INTERACTION HINT AUDIBLE: the legend stops being `aria-hidden`. It has to be written so it
          reads well, which is a rewrite and not an attribute removal.

  consequences:
    positive:
      - "`resume` goes from the 11th stop of the card to 1 of 7 in any counting."
      - "The quick accessibility bar becomes reachable DURING play, which is when a child needs to change
         a setting that is hurting her right now."
      - "'What happens at the end of a menu' gets ONE answer for the whole game."
      - "Indexing and interruption make navigation measurable: both are assertable in a test."
    negative:
      - "The `accessibility` item introduces a second INPUT MODE (directional drives the HUD bar, not the
         player). A mode the player can enter and not know how to leave is the very trap this record is
         about — so its exit (START or BACK) is part of the decision, not an implementation detail."
      - "`print` panning the map is new behaviour with a hard constraint attached (no fog lifted). Getting
         that wrong hands out progress from a pause screen."
      - "The HUD gains ten elements. They must not join the tab order during play."
    neutral:
      - "Touch targets were already compliant (44×44 icons, 35,6 px items) — this record raises the items
         to 44 by choice, not to fix a violation."

  confirmation: |
    Every clause above was written to be checkable, and every one of them now HAS its check. Recorded here
    with the file that proves it, because a criterion without a named gate goes back to being an intention:

      · ORDER — `tests/pausa-sete-itens.node.test.js`. The root list is exactly the seven items, `resume`
        first and `quit` last, and no act appears in both lists.
      · RING — `tests/menu-nav.node.test.js` (`passoNaPausa`) and `tests/barra-rapida-no-hud.node.test.js`.
        It could only close once the icon bar left the card: while the pause had two zones, XAG 106 FORBADE
        the wrap. Measured in the built game: from `resume`, one press UP lands on `quit`.
      · SIZE — `tests/pausa-44px.browser.test.js`, and it is a BROWSER gate on purpose. The other CSS gates
        here read `style.css` and check declarations; that would prove the line exists, not that the button
        is 44 px. The old height (35,6 px) was declared nowhere — it RESULTED from padding, font and leading.
        The gate imports the real stylesheet, mounts production markup and measures; written failing first,
        it reproduced the 35,6 px on its own.
      · INDEXING — `tests/item-announcement.node.test.js`. The string ENDS with "N de M", turning indexing
        off removes only the index, and an impossible position is not announced at all.

        ⚠️ "EVERYWHERE" HAS A BOUNDARY, and it is a decision, not an omission. The clause above says pause,
        title, options and activities. Pause and title got the index because they select by CLASS and by
        game-driven focus: nothing announces them on its own, so the game must. The SETTINGS DIALOGS are the
        opposite — `navDialog` moves BROWSER focus and the screen reader already announces the control.

        Adding `srSay` there would recreate the very divergence this record fixed elsewhere: the reader
        saying the control and the game saying a second version of it, on top. `tests/menu-nav.browser.test.js`
        pins that `navDialog` stays silent, so nobody "completes" the clause by making it talk.

        And the index cannot arrive by ARIA either without a bigger change: `aria-posinset`/`aria-setsize`
        are only valid on roles like `listitem`, `menuitem`, `option`, `radio`, `row`, `tab`. MEASURED on
        the built game: the audio panel's 13 controls are `button`/`select`/`input` inside `role="group"`,
        so the attributes would be invalid ARIA there. This project already refused that same trade for the
        title menu, in writing: `role="menu"` would require `menuitem` children plus the arrow pattern,
        which it does not implement — and claiming the role without the pattern violates WCAG 1.3.1.

        Indexing the settings dialogs therefore means changing their roles and implementing the full ARIA
        pattern. That is real work and it is NOT done; what is done is making sure nobody does half of it by
        accident.
      · INTERRUPTION — `tests/interruptible-speech.node.test.js`, against the speech port with fakes. It
        also pins the race the generation token exists for: a slow synthesis finishing after a newer one.
      · LEGEND — `tests/pause-legend.node.test.js`. `.pause-legend` is no longer `aria-hidden`; the CHIPS
        are, and beside them lives one `.sr-only` sentence with the glyphs turned into words.
      · THE MODE'S EXIT — `tests/modo-acessibilidade.node.test.js` plus eight browser cases. It is listed
        here, and not only under the negative consequences, because "there are two exits and SAIR wins the
        precedence" is the clause of this record most likely to be quietly simplified away.

    ALSO WORTH RECORDING, because it was NOT in the plan and the browser found it: with the list at 44 px
    the card began to scroll, the scrollbar ate width on one side, and the "centred" list sat 7,5 px off
    centre. And with the sticky submenu heading on the title screen, wrapping from the last item to the
    first left the first button 12 px COVERED — the browser considered it already visible and did not
    scroll. Neither would have been caught by reading the CSS.

    ⚠️ WHAT NO TEST OF MINE CAN CONFIRM: whether the result is USABLE by a blind child. Issues #6 (manual
    screen-reader audit with NVDA/JAWS/VoiceOver), #7 (field test with five children) and #8 (target
    hardware) are where this record is actually validated. Everything above is necessary and none of it is
    sufficient.

more-information: |
  The measurement that started this is in the session of 2026-08-26 and reproduced in the tests named
  above. Related: ADR-0011 (visual accessibility), ADR-0028 (menus restore their own defaults), ADR-0029
  (the changed-from-default mark, which is how a player undoes a mode without seeing it), ADR-0020
  (amended the same day — the post-fx chain and the three scales).

  Deliberately NOT decided here: whether the quick accessibility bar is also reachable by touch during
  play, and where on the HUD it sits. Both are layout questions for the screen it lands on.
