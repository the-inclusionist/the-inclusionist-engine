title: The pause options split into «opções gerais» and «opções do jogo»

context-and-problem-statement: |
  ADR-0145 decided that an accommodation belongs to a GENRE rather than to every game, because a wheelchair
  toggle in a chess game is a control with no subject. That answers what may be mounted. It leaves open a
  question a child meets before any of it: **where does she look?**

  📏 Measured today, the pause card is seven root items (`resume`, `acessibilidade`, `addplayer`, `options`,
  `ajuda`, `print`, `quit`) with `options` opening a submenu of eight (`pmback` plus the seven settings
  panels). Everything a game might adjust would land in that one submenu, next to typography and narration.

  🔴 **AND THAT MIXES TWO THINGS A CHILD LEARNS DIFFERENTLY.** Typography, narration, sound and contrast are
  the SAME in every game she opens — she learns them once and carries them. Piece sets, wheelchair mode,
  difficulty: those are this game's, and she has to learn them again each time. Putting them in one list
  teaches her that neither is reliable.

  📌 The Dev's examples are the argument: «modo empatia cadeira de rodas só pode aparecer no gênero
  plataforma […] assim como peças diferentes é algo que somente existe em jogos de tabuleiro (xadrez, damas,
  gamão)». A menu that cannot tell those from «Tipografia» is a menu that has given up on the distinction.

  ⚠️ **AND A SECOND QUESTION HAS BEEN BLOCKED ON THE SAME SPOT.** The remapping panel — the cheapest of the
  eight to mount, one extra node beyond what the shell builds — has no home: it never had an overlay of its
  own (its header records that the open/close was «o toggle de `hidden` do `#options`»), and there is no
  `controles` item in `PM_OPTIONS_BTNS`. It has been waiting on ADR-0131 since 2026-09-09.

decision-drivers:
  - "D1 — WHAT SHE CARRIES BETWEEN GAMES AND WHAT SHE DOES NOT ARE DIFFERENT KINDS OF THING. A child who
     found her font once should find it in the same place in the next three hundred games."
  - "D2 — AND WHAT IS THIS GAME'S MUST BE FINDABLE WITHOUT SEARCHING THE GENERAL LIST. A board game's piece
     sets buried under «opções» beside «Narração» is a setting nobody finds twice."
  - "D3 — DEPTH COSTS MORE THAN LENGTH FOR THE PEOPLE THIS MENU EXISTS FOR. Each level is a decision and a
     way back; a longer list is one sweep."
  - "D4 — AND THE ROOT LIST IS A DECISION, NOT AN ARRANGEMENT (ADR-0044 §2). Adding to it has to be argued,
     not done."

considered-options:
  - "A — One submenu, as today: everything under `options`, general and game-specific together."
  - "B — A second ROOT item: `options` becomes «opções gerais» and a new «opções do jogo» sits beside it."
  - "C — A section inside the existing submenu: one list, with a heading separating the two families."

pros-and-cons-of-the-options: |
  **A — leave one submenu.**
  ✅ No change to a list that was argued once and settled.
  ❌ It is the state that produced the question. The child cannot tell what travels with her from what does
     not, and a board game's piece sets sit next to narration as if they were the same kind of choice.

  **B — a second root item.**
  ✅ The distinction is visible before she enters anything, which is where it is useful.
  ✅ Depth stays at two for both families, so nothing gets further away.
  ✅ ADR-0106 §5 already gives the absence rule for free: a game with nothing of its own does not get the
     item, exactly as `raizQueAcciona` already drops `options` when the submenu would be empty.
  ❌ The root list goes from seven to eight, and ADR-0044 §2 treats that list as a decision.
  ❌ Two doors named «options» need names a child tells apart by sound and not only by sight.

  **C — a section inside the submenu.**
  ✅ The root list is untouched.
  ❌ A heading inside a menu is exactly the «manual» shape the Dev rejected for panels («o menu virou um
     manual»), and a screen reader announces the heading as one more stop.
  ❌ And it hides the distinction behind a door, which is the one place it does not help.

decision-outcome:
  chosen-option:
    link: "B — `options` becomes «opções gerais», and a new root item «opções do jogo» sits beside it"
    justification: |
      ===== 1. TWO DOORS, AND THE ROOT LIST BECOMES EIGHT =====
      `options` is renamed «opções gerais» and keeps the engine's panels. A new root item, «opções do jogo»,
      opens what THIS game — through its genre and its own additions (ADR-0145) — declared.

      ⚠️ The root list moving from seven to eight is a change to ADR-0044 §2, and it is argued rather than
      assumed: §2's reasoning is about ORDER and about the cost of a long sweep before the exit. The exit
      stays first and `quit` stays last; what grows is the middle, where the sweep is cheapest.

      ===== 2. THE GENERAL DOOR IS NOT DECLINABLE; THE GAME DOOR IS NOT MOUNTED WHEN EMPTY =====
      «Opções gerais» exists in every game, by ADR-0122. «Opções do jogo» is mounted only when the game
      declared something of its own — which is ADR-0106 §5, and the machinery already exists: `raizQueAcciona`
      drops `options` when its submenu would be empty, «uma porta para uma sala vazia».

      ===== 3. AND THE NAMES HAVE TO BE TOLD APART BY EAR =====
      Two doors whose names share a word are two doors a screen reader reads almost the same. The words are
      the Dev's — «opções gerais» and «opções do jogo» — and what this record requires of the work is that the
      distinguishing word come FIRST where the language allows it, so the two do not share a prefix when
      spoken.

      ===== 4. THE REMAPPING PANEL LIVES IN «OPÇÕES GERAIS», WITH ITS OWN ITEM =====
      This settles the part of ADR-0131 that blocks work. Remapping is not a sub-need of motor accessibility:
      it serves the child who cannot reach a key, the one who plays with one hand, the one with a foreign
      keyboard and the one who simply wants another key. Nesting it under «motora» would put it three levels
      deep for all of them.

      📌 And it is general rather than game: the keys are the same object in every game (`KeyScheme`,
      ADR-0086), even though the ACTIONS shown are the game's.

      ===== 5. WHAT THIS DOES NOT DECIDE =====
      The rest of ADR-0131 — whether captions and accommodations move between panels — stays open. And this
      record does not say which panels are general: that is ADR-0145's classification.

  consequences:
    positive:
      - "A child can tell, before entering anything, what she carries between games and what she does not"
      - "A genre's own settings get a findable home instead of being buried among the engine's"
      - "The remapping panel stops being blocked, and it is the cheapest of the eight to mount"
      - "A game with nothing of its own shows no extra door, by machinery that already exists"
    negative:
      - "The pause root list goes from seven to eight — the first change to a list ADR-0044 §2 settled, and
         one more stop before `quit` for whoever sweeps it"
      - "Two items whose names share a word, which is a real cost for whoever navigates by ear and the reason
         §3 constrains the wording"
      - "Every consumer that learned «options opens the settings» meets a renamed item"
      - "It commits the project to the general/game classification being RIGHT: a panel filed on the wrong
         side is now findable in the wrong place, where before it was merely in a long list"

  confirmation: |
    ✅ In part (erratum of 2026-09-27): a game that declares nothing of its own gets no live door to the game's options,
    and a game that declares something gets it live, opening a list with that something in it — the gates in
    confirmed-by. 📌 Since ADR-0161 that door is shown locked with its reason rather than absent; the root's count and
    the remapping panel's place are ADR-0151's.

    ⚠️ Not gated: that the two doors' accessible names share no spoken prefix — true today in pt, en and es. Issue #144
    closed without it, and no open issue carries it.

more-information: |
  📌 **This record exists because the Dev drew the consequence themselves**, in the same message that corrected
  the accommodation classification: the menu split is not an inference from ADR-0145, it is the clause they
  attached to it with «logo».

  ⚠️ **The cost this record is most likely to be wrong about is the eighth item.** ADR-0044 §2 cut the root
  from twelve to seven precisely because `resume` had been the eleventh stop, and a child who pauses and
  cannot see «varria dez alternadores e um cabeçalho antes de achar Continuar». Going back up is movement in
  the direction that record fought, even by one. What makes it defensible is that the new item sits in the
  middle rather than before the exit — but if the list grows again, this is the record to re-read first.

  📏 **And the remapping panel's cost was measured**: beyond the shell's own ids it needs exactly ONE extra
  node, `#ctrl-players`. It is the cheapest of the eight and has been blocked by a question about WHERE, not
  about work.
