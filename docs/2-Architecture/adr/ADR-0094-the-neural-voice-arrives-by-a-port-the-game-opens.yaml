title: A voz neural chega por uma PORTA que o jogo abre — a engine não nomeia fornecedor

context-and-problem-statement: |
  O ADR-0093 fechou, no mesmo dia, um defeito grave: a `6.36.1` publicada não podia ser compilada por
  consumidor nenhum, porque `platform/tts` fazia `import('@mintplex-labs/piper-tts-web')` — código
  EMBARCADO — com o pacote declarado em `devDependencies`, que o npm não instala para quem consome.

  Aquele registro moveu o pacote para `dependencies` e escreveu, como parte da justificação, que o preço
  era baixo: **«0,5 MB e ZERO dependências transitivas»**.

  ⚠️ O NÚMERO ESTAVA ERRADO, E O ERRO TEM UMA IRONIA EXATA: eu li o campo `dependencies` do fornecedor, que
  está vazio, e **não li o `peerDependencies`** — que é o campo que causou o defeito todo. O fornecedor
  declara `onnxruntime-web` como peer NÃO-opcional, e o npm 7+ instala peers sozinho.

  MEDIDO NUM CONSUMIDOR LIMPO, instalando o tarball:

      onnxruntime-web    135,4 MB   (quatro variantes .wasm, a maior de 26,5 MB)
      pixi.js             12,3 MB
      a engine             2,3 MB
      TOTAL              165,6 MB

  Ou seja: `dependencies` consertava o build e impunha **135 MB a todo consumidor**, incluindo um jogo de
  quebra-cabeça que nunca vai falar por voz neural. Foi o consumidor que reparou, outra vez.

decision-drivers:
- "⚠️ 135,4 MB medidos, e não 0,5 MB. Com o número certo, o argumento do ADR-0093 contra a porta — «custaria
   a11y por omissão para poupar 0,5 MB» — inverte-se sozinho: são 135 MB impostos a uma escola pública para
   um motor pt-BR-only de fornecedor DESCONTINUADO, e o pilar 1 (hardware e banda de escola) passa a pesar
   do outro lado do pilar 2."
- "⚠️ `optionalDependencies` NÃO resolve, e isto é uma correção de premissa: o npm instala
   `optionalDependencies` por omissão — ele só tolera a FALHA da instalação. Trocaria 135 MB obrigatórios
   por 135 MB obrigatórios mais um modo de falha intermitente."
- "Peer opcional também não: o npm não o instala, então o `Rolldown failed to resolve` volta idêntico."
- "⚠️ O fallback já existe e é bom: sem motor neural a narração cai no Web Speech, que fala o idioma certo,
   é imediato e não pesa nada. A ausência da porta não CALA o produto — e é isso que separa esta decisão de
   um corte de acessibilidade."

considered-options:
- "P1 - manter `dependencies` (o estado do ADR-0093)"
- "P2 - a PORTA: `carregarVozNeural` em `CreateGameOptions`, o jogo é que nomeia"
- "P3 - `optionalDependencies`"

pros-and-cons-of-the-options:
  P1:
    good:
    - "A voz neural funciona por omissão para todo consumidor, sem ninguém ter de saber que ela existe."
    bad:
    - "⚠️ 135,4 MB de `onnxruntime-web` no `node_modules` de quem nunca a vai usar — num produto cujo pilar 1
       é hardware e banda de escola pública brasileira."
    - "A engine passa a depender, em execução, de um fornecedor descontinuado; a troca do ADR-0022 seria um
       segundo abalo de contrato para todos os consumidores ao mesmo tempo."
  P2:
    good:
    - "Medido: o consumidor limpo cai de **165,6 MB para 23,1 MB**, e o `platform/tts.js` emitido deixa de
       ter QUALQUER especificador de terceiros — só imports relativos, nada para o empacotador resolver."
    - "⚠️ A troca do ADR-0022 deixa de ser um abalo: quem quiser sherpa-onnx-wasm muda a sua própria linha,
       quando quiser, sem esperar por uma versão da engine."
    - "⚠️ E ELA DESTRANCOU UM CAMINHO QUE NINGUÉM CONSEGUIA TESTAR: o cabeçalho de `tests/tts.node.test.js`
       dizia por escrito «NÃO exercito o caminho Piper, que faz import() de CDN». Com a porta, o carregamento
       inteiro corre contra um falso, sem rede e sem fornecedor instalado. Era o único caminho do módulo que
       nenhum teste percorria."
    bad:
    - "⚠️ A narração neural fica DESLIGADA por omissão, e isso é um custo real de acessibilidade — mitigado,
       não anulado, pelo facto de o fallback falar o idioma certo."
    - "Mais uma opção em `CreateGameOptions`, que já tem muitas."
  P3:
    bad:
    - "Não faz o que quem a propôs esperava: `optionalDependencies` É instalada por omissão. O peso fica
       exatamente igual e ganha-se um modo de falha a mais."

decision-outcome:
  chosen-option:
    link: "P2 - a porta. Decidido pelo Dev em 2026-09-06, depois de ver a medida que corrigiu 0,5 MB para
           135,4 MB — e ANTES de publicar, que é o que impediu a segunda versão errada"
    justification: |
      ===== O QUE MUDA, E É POUCO CÓDIGO =====
      `TtsCtx` ganha `carregarVozNeural?: CarregarVozNeural`, e `CreateGameOptions` repassa-o. Do lado do
      jogo é uma linha:

          carregarVozNeural: () => import('@mintplex-labs/piper-tts-web')

      ⚠️ `main.ts` — a raiz de composição do JOGO deste repositório, que fica FORA do pacote publicado — é o
      ÚNICO ponto da árvore que nomeia o fornecedor. É por isso que ele continua em `devDependencies` aqui, e
      é por isso que o pacote publicado passa a não ter `dependencies` nenhuma.

      ===== E O TIPO TAMBÉM NÃO VEM DO FORNECEDOR =====
      `ModuloNeural`/`SessaoNeural` são escritos à mão, com as DUAS chamadas que a engine faz. Importar o
      tipo do fornecedor obrigaria o pacote a estar instalado para o `tsc` do consumidor correr — seria o
      mesmo defeito do ADR-0093 mudado de campo, do `dependencies` para o espaço de tipos.

      ===== A AUSÊNCIA É DITA, NÃO SILENCIOSA =====
      Três consequências, e nenhuma é «não acontece nada»:
        · `sr.tts.neuralNotBundled` — uma frase NOVA, e diferente de `sr.tts.noNeuralForLanguage` de
          propósito. Dizer «não há voz para este idioma» mandaria a criança trocar de idioma à procura do
          que não está lá em idioma nenhum.
        · a guarda vem ANTES da pergunta do idioma, pela mesma razão.
        · o painel de áudio deixa de OFERECER o motor neural (`opcoesDeMotor`). Uma opção que não pode
          funcionar é pior que uma opção a menos: quem a escolhe fica à espera de um download que nunca
          começa, e quem navega por escuta não tem como ver que não começou.

      ===== O QUE ESTE REGISTRO NÃO TOCA =====
      O gate das duas direções do ADR-0093 fica inteiro, e é ele que torna esta decisão aferível em vez de
      declarada: com a porta, `[Zero]` passa a ser verdade por CONSTRUÇÃO — nenhum módulo embarcado nomeia
      pacote nenhum —, e a recíproca continua a vigiar o `pixi.js`.

  consequences:
    positive:
    - "O consumidor limpo cai de 165,6 MB para 23,1 MB."
    - "O pacote publicado deixa de ter `dependencies`: a única coisa que ele pede ao consumidor é o peer que
       ele de facto nomeia."
    - "O caminho de carregamento da voz neural passa a ser testável sem rede."
    negative:
    - "⚠️ Um consumidor que queira voz neural tem de saber que ela existe. Mitigação escolhida: a opção
       DESAPARECE do painel em vez de aparecer morta, e o `CreateGameOptions` carrega o exemplo de uma linha
       na própria prosa do campo — a documentação vive onde quem integra já está a olhar."
    neutral:
    - "O `@mintplex-labs/piper-tts-web` continua em `devDependencies` deste repositório, porque este
       repositório é também o APP que o usa. O `pixi.js` continua peer, pela razão do ADR-0093."
  confirmation: |
    ⚠️ PROVADO ONDE O DEFEITO VIVIA — instalação limpa do tarball, com e sem a porta:

        antes (ADR-0093, `dependencies`)   165,6 MB · onnxruntime-web presente
        depois (porta)                      23,1 MB · onnxruntime-web AUSENTE, fornecedor ausente

    E `dist-pkg/platform/tts.js` do pacote instalado não tem especificador de terceiros nenhum — as duas
    ocorrências do nome que lá restam são COMENTÁRIO, que é exatamente a distinção que o `linhasDeCodigo` do
    gate faz.

    Os quatro casos novos de `tests/tts.node.test.js` nasceram com DUAS mutações confirmadas, aplicadas por
    script a ficheiro e restauradas de cópia: trocar `neuralNotBundled` por `noNeuralForLanguage` (o aviso
    perde a distinção) e `neuralDisponivel` fixo em `true`. As duas ficaram vermelhas.

    O app deste repositório NÃO regrediu: `npm run build` continua a emitir `ort.bundle.min` e
    `voices_static` em chunks à parte, ou seja o `import()` do `main.ts` segue lazy e code-split.

    Suítes: 190 ficheiros / 3345 testes verdes nos dois projects · `tsc --noEmit` limpo.

more-information: |
  ⚠️ ESTE É O SEGUNDO REGISTRO DO MESMO DIA SOBRE O MESMO DEFEITO, e a sequência é a informação: o ADR-0093
  consertou o sintoma com uma medida incompleta, e a medida completa chegou porque um consumidor pôs um
  número no papel — «27 MB de WASM» — que não batia com o meu. Conferir o número dele foi o que impediu a
  publicação de uma segunda versão errada.

  A lição não é sobre npm. É que **o custo de uma dependência não se lê no campo `dependencies`**: um peer
  não-opcional é instalado na mesma, e foi um peer não-opcional que causou as duas metades desta história —
  o defeito e o número errado do primeiro conserto.

  ⚠️ E há uma consequência para a issue #113 que muda de sinal: o repositório do consumidor tinha
  acrescentado o pacote como devDependency SUA, com um teste para reprovar quando a engine o movesse para
  `dependencies`. A engine NÃO o moveu — ele volta a ser devDependency aqui, e lá o remendo pode sair de
  vez: quem quiser voz neural declara a porta, quem não quiser deixa de carregar 135 MB.
