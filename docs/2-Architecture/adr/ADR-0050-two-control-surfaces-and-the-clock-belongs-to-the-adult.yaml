  errata:
    - date: 2026-09-27
      what: >-
        THE CONFIRMATION WAS STALE IN PART. It said nothing was built while the clock stood on the HUD (engine
        `2cc76738`, `263ec0c9`): the pie and the digits in the HUD row, measured in the browser on production markup,
        and nothing of the clock's length or ending kept on the child's side. Those gates are in `confirmed-by`. Most of
        §3's clock and its layout belong to ADR-0236, ADR-0239 and ADR-0059 now; what this record still owes is §2's
        adult panel, the negative gate for THE CLOCK IS NOT A GAME TIMER, §4's break and §5's night window — issue #94,
        open, which the confirmation did not name.
  superseded-in-part:
    - by: ADR-0236
      what: "§3, the clock itself: it becomes a continuous Time Timer pie, never numbers only and with no unit change
              as a warning, and the session defaults to 50 minutes when no adult has set one."
    - by: ADR-0059
      what: "§3, the HUD LAYOUT paragraph — where the name, the pie, the score, the power and the bars sit.
              The CLOCK itself (the pie, the countdown, the unit change at five minutes, the red slice for a
              scheduled break) is decided HERE and is not touched."
  date: 2026-08-27
  decision-makers: [Dev]
  consulted:
    - "ADR-0028 (every settings menu persists and restores its own defaults)"
    - "ADR-0044 (one menu per screen; the quick accessibility bar on the HUD)"
    - "ADR-0046 (simulation is not accessibility; the experience × control partition)"
    - "ADR-0048 (the journey; the adult logs in, the child never does)"
    - "requerimento §49.b (measured, visible, limitable screen time), §49.c (night window), §49.i (single point of configuration)"
