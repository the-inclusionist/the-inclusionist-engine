metadata:
  status: "accepted"
  date: 2026-08-27
  decision-makers: [Dev]
  consulted:
    - "ADR-0028 (every settings menu persists and restores its own defaults)"
    - "ADR-0044 (one menu per screen; the quick accessibility bar on the HUD)"
    - "ADR-0046 (simulation is not accessibility; the experience × control partition)"
    - "ADR-0048 (the journey; the adult logs in, the child never does)"
    - "requerimento §49.b (measured, visible, limitable screen time), §49.c (night window), §49.i (single point of configuration)"
    - "Folkhälsomyndigheten (Sweden), 2024 screen-time recommendations — used as design reference, not as a ceiling for schoolwork"
  informed: []

title: TWO control surfaces — the child's menus adjust how she plays, the adult's panel decides what and for how long — and the only clock in the game is the adult's

context-and-problem-statement: |
  §49.i of the requerimento promises "um único lugar" for every parameter of time, content and resources, "com
  efeito sobre todos os sistemas", and gives the reason: "controle parental espalhado por cinco menus é controle
  parental inexistente".

  Read carelessly, that is an instruction to merge the eight accessibility menus — the exact opposite of what
  ADR-0044 measured, where splitting the pause card was what let a blind child reach the exit in one press instead
  of eleven. The two are not in conflict once the question is asked properly: **they are different surfaces for
  different people.** Nothing in the ADRs said so, so nothing stopped the careless reading.

  Two more §49 promises had no record at all: the NIGHT WINDOW (§49.c) and the measured, visible, limitable
  SCREEN TIME (§49.b) — of which the pillars carried only the two words "session limit".

decision-drivers:
  - "A control the child uses mid-game and a control the adult sets once a week do not belong on the same screen,
     and merging them would put the adult's decisions inside a menu a child navigates by ear."
  - "A limit that is not displayed does not exist — the requerimento's own argument, and the reason the clock is on
     the HUD rather than in a settings panel."
  - "Nothing in the time system may become a countdown on the ACTIVITY. The child must be able to take as long as
     she likes on a question (ADR-0048 §7b)."
  - "The night window must not require knowing a child's age, or it buys a protection with the personal data the
     whole project exists to avoid collecting."

considered-options:
  - "C1 — one settings surface for everything, as §49.i reads literally"
  - "C2 — two surfaces: the child's in-game menus, and the responsible adult's panel"

pros-and-cons-of-the-options:
  C1:
    good: ["Literal compliance with §49.i, and one place to look."]
    bad: ["It undoes ADR-0044: the adult's parameters would sit inside the menu a blind child sweeps to change
           contrast.",
          "It puts screen-time limits within reach of the person they limit."]
  C2:
    good: ["Each surface is shaped by who uses it and when — the child's is navigable by ear mid-game; the adult's
            is a report-and-configure screen used rarely and elsewhere.",
           "§49.i is satisfied where it actually applies: the ADULT's parameters are in one place and cross the
            systems. The child's adjustments were never what it was about."]
    bad: ["Two surfaces to build and to document, and the boundary between them will be argued over — which is why
           this record draws it explicitly."]

decision-outcome:
  chosen-option:
    link: "C2 — two surfaces, and the boundary is who the control belongs to"
    justification: |
      ===== 1. THE CHILD'S SIDE IS TWO MENUS, NOT EIGHT =====
      A correction of vocabulary that matters for reading §49.i: the game does not have eight menus. It has **two
      navigable menus, each paged** — one at the pause and one at the start — and they configure and reset
      accessibility settings and disability simulations. That is the whole of the child's surface, and ADR-0044
      governs it.

      ===== 2. THE ADULT'S PANEL IS IN BÚSSOLA ESCOLAR, AND IT IS PER CHILD =====
      ⚠️ AND THIS WAS NEVER AN OPEN QUESTION. An earlier version of this record left "where does it live" as a
      dependency to be resolved, and it was already answered by the journey the Dev had described: screen 1 is where
      the adult LOGS IN, and the login is Bússola Escolar's (ADR-0048 §2). The panel reads reports and picks skills —
      and reports per skill for teachers, management and families are literally what Bússola Escolar IS. Asking
      again turned an answered thing into a consultation, which is the failure this project keeps correcting.

      SO THE SPLIT IS NOT ABOUT WHERE THE PANEL IS, IT IS ABOUT WHO ENFORCES: the panel lives in Bússola Escolar and
      is where the adult sets everything below; the ENGINE enforces the time parameters locally, because a clock
      that needs the network to stop a session does not work in the school this project is built for.
      Used by the teacher, the parent or the health professional. Four things:

        · **REPORTS**, and the choice of the up-to-three skills the child works on today — with an **AUTO** setting,
          which is the DEFAULT, drawing new skills every thirty minutes.
        · **THE DEFAULTS OF THE CHILD'S PAUSE MENU** — whether blind mode is on at entry, which control scheme
          starts, and so on. This is the join between the two surfaces: the adult sets where the child begins, and
          the child still changes it. ADR-0029's changed-from-default mark is what makes that visible rather than
          confusing.
        · **MAXIMUM SCREEN TIME PER DAY**, outside school and clinic.
        · **MAXIMUM CONTINUOUS TIME, plus the break length and a limit on pausing** — the Swedish model available
          as an option, not imposed.

      ===== 3. THE CLOCK IS ON THE HUD, BECAUSE A LIMIT THAT IS NOT SHOWN DOES NOT EXIST =====
      A pie chart that starts full and empties: green inside a white circle. Beside it a countdown in HOURS:MINUTES,
      white. At five minutes it becomes MINUTES:SECONDS — the change of unit is itself the warning, without a
      banner.

      If the session contains a scheduled break, it appears as a RED SLICE of the pie, and the digital readout
      becomes three timers: time until the break, length of the break, time from there to the end.

      HUD LAYOUT, top of screen, beneath the quick accessibility bar (ADR-0044 item 7): the player's FIRST NAME on
      the left with the avatar to its left; the pie in the CENTRE with the digital timer directly below it; the
      super-power on the RIGHT. At the bottom, centred, the ten-segment BARS — one per enabled skill, one to three
      of them (ADR-0049 §5).

      ⚠️ AMENDED 2026-08-28: **THE POINT COUNT MOVED TO THE LEFT, UNDER THE NAME**, and this record had it on the
      right. ADR-0049 §5b settled the position later the same week, from the Dev's own words — "a contagem de
      pontos embaixo do nome do jogador no topo à esquerda" — and the reason is not layout taste: the count belongs
      to the PERSON, not to the round, so it sits with the identity block. Two accepted records disagreed on where
      a number goes, and a HUD built from this one would have put it in the wrong place. **ADR-0049 §5b is the
      authority on every number's position; this record keeps only the CLOCK.**

      ✅ THE SUPER-POWER STAYS ON THE RIGHT. His two sentences had it "à esquerda" and then "abaixo da pontuação
      numérica"; he settled it on the second. With the score gone to the left the power is now the whole right
      column, which does not disturb the grouping the HUD follows — identity and the person's numbers on the left,
      session state in the centre, what the round granted on the right.

      ⚠️ AND THE CLOCK IS NOT A GAME TIMER. It measures the session, never the activity. Nothing counts down on a
      question, and running out ends nothing the child was in the middle of learning (ADR-0048 §7b).

      ===== 4. THE BREAK STOPS THE GAME, AND ONLY AN ADULT LIFTS IT =====
      When break time starts the screen goes red and cannot be un-paused — except by the command of the teacher,
      parent or professional. The reasoning is the plain one: a break a child can dismiss is not a break. And an
      adult who does not want that has a simpler instrument than a dismissible break — not configuring one.

      ===== 5. THE NIGHT WINDOW, AND THE COMPROMISE THAT KEEPS IT HONEST =====
      §49.c promises no activity at night for child accounts. This record implements the half that does not require
      knowing a child's age, and says plainly why the other half is not built:

        · WHERE THERE IS A LOGGED ADULT, the night window is one more parameter of §2 — the adult sets it, like the
          daily limit, and the default follows the references the requerimento cites (no service between 22h and
          6–8h).
        · WHERE THERE IS NO LOGIN, there is no account, no age and no way to know a child is at the machine. The
          product does not ask.

      ⚠️ AND §49.k — activities only at school up to age six — CANNOT BE ENFORCED AT ALL, which is the Dev's own
      conclusion and is recorded here because it is a promise the software cannot keep: "não tem como criar este
      controle sem obter dados PII de criança […] impedi-los de cadastrar a criança é forçá-los a mentir a idade".
      A gate that makes honest families lie is worse than no gate. What replaces it is a RECOMMENDATION shown to
      the responsible adult, carrying the studies and foreign policies the requerimento already cites. The
      protocolled document has to soften §49.k from rule to recommendation to match.

  consequences:
    positive:
      - "§49.i is satisfied where it applies and ADR-0044 is left standing — the careless reading is now blocked in
         writing."
      - "The clock is the first thing a child sees about her own time, which is what §49.b was actually asking for."
      - "The night window and the daily limit are the same kind of parameter, so they are one screen and not two."
    negative:
      - "The adult's panel is a surface this repository does not have and probably belongs to Bússola Escolar, which
         makes it a dependency (ADR-0048's J3 again)."
      - "The HUD gains a pie, a digital timer, a name, an avatar and a power slot, on a screen the ADR-0044 work
         already found crowded at 640×360."
      - "The night window protects only the logged path. The un-logged path is exactly where a family without a
         school account plays, so the protection is thinnest where supervision is likeliest to be thin."
    neutral:
      - "The Swedish parameters are a design reference, not a ceiling on directed pedagogical activity — the
         requerimento states this and it is repeated here so nobody imports them as a cap on schoolwork."

  confirmation: |
    Nothing here is built. What each clause will be measured by:

      · THE TWO SURFACES — a gate that fails if any parameter of §2 is reachable from the child's pause menu.
      · THE CLOCK IS NOT A GAME TIMER — the strongest one, and it must assert the negative: no activity, question
        or minigame reads the session clock, in any code path.
      · THE BREAK — un-pausable without the adult's command, asserted over the pause path.
      · THE HUD — a browser gate on production markup, in the ADR-0044 style: measure, do not read the stylesheet.
      · THE NIGHT WINDOW — a pure function over (allowance, now) with no age input, which is also how the record
        proves it collects nothing.

    ⚠️ AND WHAT CANNOT BE CONFIRMED HERE: whether a red screen a child cannot dismiss is experienced as care or as
    punishment. That is issue #7, and it is the clause most likely to need changing after five children have met it.

more-information: |
  Files this will touch when built: `ui/hud.ts` (the clock, the name, the power), `ui/settings-*` (unchanged — the
  point of this record is that they are unchanged), and a surface that does not exist here yet for §2.

  Deliberately NOT decided here: where the adult's panel lives (this repository, Bússola Escolar, or both), how the
  thirty-minute AUTO draw picks skills, and what the report looks like.
