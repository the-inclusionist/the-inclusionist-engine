title: Vosk runs without eval — an isolated page tests it, and a kept Vosk is rebuilt

context-and-problem-statement: |
  ADR-0189's first go/no-go failed: `vosk-browser` cannot run under the engine's policy, because it evaluates text as code. Three
  ways were shown to the Dev — `'unsafe-eval'` in the policy, a patched worker, or an isolated page — and a fourth, rebuilding Vosk
  with Emscripten's `-sDYNAMIC_EXECUTION=0`, which emits no evaluation of code. The Dev, 2026-09-13: «Vamos de página isolada só
  para teste. Se ele se mostrar superior em algum aspecto, não quero usar unsafe eval nem remendar, quero recompilar o vosk com a
  flag do Emscripten que desliga a avaliação de código (-sDYNAMIC_EXECUTION=0), ou pegar no huggingface esse trabalho já feito.»

decision-drivers:
  - "D1 — THE GAME'S PAGE KEEPS ITS POLICY: no evaluation of code where a game's or a cartridge's text lives"
  - "D2 — WHAT SHIPS IS BUILT, NOT PATCHED: a hand-patched bundle is redone at every release and hides what it changed"

considered-options:
  - "A — `'unsafe-eval'` in the engine's policy"
  - "B — patch `vosk-browser`'s worker"
  - "C — an isolated page with its own policy, for the test only"
  - "D — Vosk rebuilt with `-sDYNAMIC_EXECUTION=0`, or such a build already published"

pros-and-cons-of-the-options: |
  **A.** ✅ Nothing to build. ❌ Every game page may evaluate text, in every delivery, microphone or not.
  **B.** ✅ The policy stays. ❌ An evaluation still unfound; a fork of a 4.3 MB bundle redone at every release.
  **C.** ✅ The game page's policy unchanged; `vosk-browser` as published. ❌ A second document and a message bridge; the
  evaluating page must never reach a delivery.
  **D.** ✅ Runs under the engine's policy as is. ❌ An Emscripten and Kaldi build to set up, unless a build is found done.

decision-outcome:
  chosen-option:
    link: "C to test, D to keep"
    justification: |
      1. **The test runs Vosk in an isolated page**: same origin, its own policy admitting evaluation, holding no game or
         cartridge text, embedded in a game page that keeps the engine's policy; it sends the recognised word by message. It is a
         test instrument and ships in no delivery.
      2. **If Vosk proves superior in any aspect** — commands or reading — the engine ships a Vosk **built with
         `-sDYNAMIC_EXECUTION=0`**, compiled here or taken from a build already published (Hugging Face among the places to look),
         running under the engine's policy unchanged.
      3. **Never `'unsafe-eval'` in the engine's policy, and never a patched bundle.**
      4. If Vosk is superior in nothing, the recognisers are those of ADR-0190.

  consequences:
    positive:
      - "The comparison runs in a game with the game's page as it ships"
    negative:
      - "Keeping Vosk costs a build of Vosk (or finding one), before any child uses it"

  confirmation: |
    ⚠️ NOT BUILT YET — **issue #184** in `the-inclusionist-engine`. Gates: the isolated test page drives a game by voice with the
    game page's policy unchanged; the comparison with Moonshine/Whisper written with its numbers; if kept, the rebuilt Vosk loads
    under the engine's policy with no violation and its `.wasm` is a checked heavy file.

more-information: |
  What is measured so far favours Vosk for commands, where a grammar restricts what it can hear, and is thin for reading: one
  adult reading, Vosk's small Portuguese model against Whisper's smallest; the larger Whisper models and Vosk's large Portuguese
  model are unmeasured.
