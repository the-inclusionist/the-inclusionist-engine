title: The font library lives with the heavy files; the engine keeps only the faces it uses itself

context-and-problem-statement: |
  The engine packages about 210 font families (340 files, ~7 MB) in its repository, its npm package and every install's
  precache, though it uses only a handful itself: the typography button's faces (Andika, Atkinson Hyperlegible, Lexend,
  the country's Playwrite hand and its fallbacks) and the mathematics face. The rest is a library for cartridges to load.
  The heavy files already have a home with the right properties — `the-inclusionist-lfs`, copied into a delivery on
  request, checked by sha256, each folder with its licence (ADR-0177) — and one copy per delivery answers a cartridge
  shipping its own fonts, which would repeat them across games.

decision-drivers:
  - "The engine carries what the engine uses; a library for cartridges is delivered when a cartridge asks for it"
  - "One copy of a font per delivery, however many cartridges use it"
  - "The faces a child reaches from the engine's own controls are on the device from the first day, whatever the delivery"

considered-options:
  - "A · The library moves to `the-inclusionist-lfs` as heavy files; the engine keeps its own faces"
  - "B · Everything stays in the engine"
  - "C · Each cartridge ships the fonts it uses"

pros-and-cons-of-the-options: |
  **A.** ✅ The engine's repository and package lose ~7 MB of binaries; a delivery carries only the fonts its cartridges
  declare, once each; licences travel per folder by the machinery the models already use. ❌ The heavy catalogue grows
  by the library's files, a delivery gains a font step, and a cartridge declares its fonts (a contract field, additive).
  **B.** ❌ Every install carries 7 MB of faces most games never draw. **C.** ❌ The same font repeated per cartridge.

decision-outcome:
  chosen-option:
    link: "A — the library lives with the heavy files"
    justification: |
      1. The engine keeps, packaged and precached, only the faces it uses itself: the typography button's (ADR-0149,
         ADR-0150) and the mathematics face. Their licences ship beside them as now.
      2. Every other family moves to `the-inclusionist-lfs`, one folder per family with its files and its licence text
         and notice; the engine keeps its catalogue (files, sha256, weights), as it does for the models.
      3. A cartridge DECLARES the families it uses (in `uses`, beside `reading` and `neuralVoice`); the delivery copies
         the declared families into `heavy/` (`inclusionist-heavy`), and at boot the engine caches them verified and
         declares their `@font-face` itself. A family asked for and not delivered is said in `problems` (ADR-0169).
      4. ADR-0254 holds in its new home: the reserved-name families are their authors' originals, compressed only; and
         Merriweather does not enter the library.
      Superseded in part: ADR-0150's and ADR-0176's packaging of every catalogue family with the engine, and ADR-0254's
      «ship» (the files, not the choice of originals).

  consequences:
    positive:
      - "The engine's repository and package shrink by the library; an install carries only the fonts its games use"
    negative:
      - "A cartridge that uses a library face must declare it, and a delivery must be built with it"
      - "The mirror (Cloudflare) receives the fonts' folders — the Dev's upload, as for every heavy folder"

  confirmation: |
    ✅ The gates in confirmed-by. `what-fonts-the-package-carries` holds `fonts.css` to EXACTLY the engine's faces, every hand
    the cycle can pick for any tag packaged, one home per family, and no face offered without a way to get it (packaged, in the
    library, or `off` with a remedy). `font-library` holds the catalogue's shape, the rules at the delivery's `heavy/` with the
    subsets' ranges, and the files kept by the heavy download — checked by sha256, before the catalogue's files — with an
    undelivered or tampered face said once with the fix; `a-cartridge-declares-a-library-font` holds the same in a real
    document booted by `createGame`. `heavy-into-the-delivery` holds `--fonts`: each face written verified against the engine's
    catalogue, a tampered one refused and its family not delivered, an unknown family refused by name. `font-licences` holds a
    licence with a text for every library family and — where the mirror is on the machine (`INCLUSIONIST_LFS`, else beside the
    repository; elsewhere those cases skip) — every folder's licence, notice and `SHA256SUMS` as the generator writes them, and
    the library-wide sums. The build's `dist/vendor/fonts` carries the engine's 29 files, and the precache fell from 361 entries
    (11 312.9 KiB) to 49 (1 923.4 KiB).

more-information: |
  Games are not edited from the engine's session: a cartridge that uses a library face declares it when it moves to the
  version that has this.
