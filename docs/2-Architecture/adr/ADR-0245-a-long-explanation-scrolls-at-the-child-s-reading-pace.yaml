title: An explanation longer than the footer scrolls, at the child's reading pace

context-and-problem-statement: |
  The footer shows two lines (ADR-0164). A longer explanation — the BNCC text of a skill in the demo quiz, a long reason
  on a locked item — was cut with an ellipsis, and only narration carried the rest. A child who reads but does not listen
  (deaf mode, narration off) never saw the end of it.

decision-drivers:
  - "What the footer explains must be readable whole, by eye, not only by ear"
  - "Beginning readers and low-vision readers set the speed, not the text's length"
  - "Moving text must not take control away (WCAG 2.2.2), nor move for a child who asked for reduced motion"

considered-options:
  - "A · Clamp at two lines, as today"
  - "B · The footer grows to fit the text"
  - "C · The text scrolls up inside the two lines, at the child's caption rate"

pros-and-cons-of-the-options: |
  **A.** ❌ The end of the text is never seen. **B.** ❌ A growing footer covers the game and moves what is above it.
  **C.** ✅ The footer keeps its place and size, and the whole text passes. ❌ Moving text: it needs a pace, a pause and a
  still form.

decision-outcome:
  chosen-option:
    link: "C — the text scrolls inside the two lines"
    justification: |
      §1 · WHEN THE TEXT DOES NOT FIT, IT SCROLLS. It waits first — two lines' worth of reading — then moves up line by line,
      each line staying as long as its words take at the child's caption rate (ADR-0183 §4: 125, 145 or 175 words a minute),
      holds at the end, and starts again from the top while the item is still pointed. A text that fits never moves.

      §2 · REDUCED MOTION: NO GLIDE. With reduced motion on, the text does not slide: it turns like pages, two lines at a
      time, at the same pace.

      §3 · IT CAN BE HELD. The footer's text stops moving while the pointer is over it or while it has focus, and resumes
      when they leave (WCAG 2.2.2).

      §4 · THE WHOLE TEXT IS STILL SAID. Narration and the live region carry the whole text once, as before; the scrolling is
      for the eye.

  consequences:
    positive:
      - "A deaf child, or one with narration off, reads the whole explanation"
    negative:
      - "Moving text on screen, which some children find distracting; reduced motion is the way out"

  confirmation: |
    ✅ The gates in confirmed-by, on the real stylesheet at 640×360 with faked timers: a text that fits gets no mark and no
    timer and has not moved a minute later; a longer one reaches each line, and its last, when the words before it are read,
    at 125, 145 and 175 words a minute, shows its last two lines whole and no slice of another, holds, and starts again from
    the top; reduced motion (the system's, and the calm icon's) turns pages of two, in place at once, with no smooth scroll;
    a pointer over it or focus in it holds it with no timer left, and leaving lets it go on; a new text starts from the top,
    the same text written again does not; hiding the band or closing a panel leaves no timer; the scrolling band's box is the
    clamped one to the pixel and `--footer-band-h`; beside the sound caption it scrolls through one line; the live region
    keeps one text node. 27 mutations red.

more-information: |
  The pace is the caption rate because it is the one reading speed the child already chose; a second speed setting would
  be a second answer to the same question.
