title: The labour is VOLUNTEER, so discovery stops being marketing and becomes the production line

context-and-problem-statement: |
  The plan of record assumed the 300+ games would be made by CONTRACTED pixel artists — it is written in
  `CLAUDE.md` §1 in those words. On 2026-09-05 the Dev stated the constraint plainly: **nobody is going to
  contract any artist; the work only exists on a volunteer basis.**

  That is not a preference and it is not a detail of staffing. It changes what the project must optimise
  for, and it changes who owns the code.

decision-drivers:
  - "If the only labour is volunteer, then the number of people who FIND the project is an input to
     production, not a vanity metric. A project nobody finds has no workers and therefore no games."
  - "⚠️ The ownership argument that has carried this project — art. 4º of Lei 9.609, the employer owns what
     the employee writes — describes a repository written by one public employee. It stops describing it the
     moment somebody outside commits."
  - "⚠️ Art is governed differently from code here (Lei 9.610; `docs/LICENSES.md` §2), and the project's art
     is deliberately NOT free. A volunteer who contributes art under a licence they assumed was open has
     been misled by omission, and that is discovered late and repaired never."
  - "Both problems have a natural gate: nothing outside can arrive while the repositories are private."

considered-options:
  - "L1 — keep planning for contracted artists and wait for a budget"
  - "L2 — volunteer labour, and treat discovery as a production requirement"
  - "L3 — volunteer labour, but keep the project private indefinitely and recruit privately"

pros-and-cons-of-the-options:
  L1:
    good: ["Contracted work is directable, schedulable and has a single owner of copyright by contract."]
    bad: ["There is no budget, so it is a plan that produces nothing while it waits.",
          "It also assumes an approval that was never asked for in the requerimento."]
  L2:
    good: ["It is what is actually available, and it matches the licence posture: an AGPL public good is the
            kind of thing volunteers contribute to.",
           "It supplies the reason ADR-0066's choice of host never wrote down — the platform where a
            drive-by contributor already is, is worth more than any of the conveniences that were weighed."]
    bad: ["⚠️ It opens the ownership question above, which has to be answered BEFORE the first outside
           commit, not after — retroactive fixing means finding every contributor again.",
          "Volunteer labour is unschedulable: the 300 games have no date and cannot be given one.",
          "Quality and accessibility conformance now depend on review, because they cannot depend on a
           contract."]
  L3:
    good: ["No ownership question, because there are no strangers."]
    bad: ["Private recruitment from a network of one person is the same as no recruitment.",
          "It keeps the cost of the public move (which only grows) without ever taking the benefit."]

decision-outcome:
  chosen-option:
    link: "L2 — volunteer labour, and discovery treated as a production requirement"
    justification: |
      ===== 1. DISCOVERY IS NOW A REQUIREMENT, AND IT SETTLES A HOST ARGUMENT =====
      With no contracted labour, the question "where do the workers come from" has one honest answer: they
      find the project, or there is none. That makes reach an engineering constraint, and it is the reason
      the GitHub organisation of ADR-0066 is right — a reason ADR-0066 itself never gave, because on the day
      it was written the labour model was assumed to be contracts.

      ⚠️ AND IT CHANGES NOTHING ABOUT ADR-0066 §3. Discovery pays off only after publication, publication is
      the Município's act (pedido `e`), and wanting volunteers is not a reason to publish first. Until the
      ato the repositories are private and the reach is worth exactly zero — that is a cost of waiting, and
      it is the correct cost to pay.

      ===== 2. WHAT THE FIRST OUTSIDE COMMIT DOES =====
      Today the ownership picture is one sentence: art. 4º of Lei nº 9.609/1998, the Município owns what its
      employee wrote. The first external contribution makes it a work with several holders, and the AGPL
      alone does not fix that — a licence says what a recipient may do, not who holds the rights.

      ===== 3. THE TWO THINGS THIS RECORD LEAVES OPEN, AND THE TRIGGER THAT MAKES THEM DUE =====
      ⚠️ **THE TRIGGER: before the first repository becomes public.** Not "before the first contribution" —
      by then somebody has already sent one, and a project that changes its terms after receiving work is
      asking people to agree retroactively.

        · **The instrument for code.** DCO (`Signed-off-by`, checkable in CI, no paperwork) or CLA
          (assignment or licence to the Município, heavier, and someone has to hold it). Not decided here
          because it is a legal instrument, not an architecture, and the Procuradoria is already being
          asked in pedido `c`.
        · **The terms for ART.** ⚠️ This one is sharper than the code question and easier to miss. The code
          is AGPL and a volunteer programmer knows what that means. The ART IS NOT FREE — restricted use is
          a product requirement (`docs/LICENSES.md` §2), and no free licence can carry it. A volunteer
          artist must be told, in the place where they would contribute, that what they are giving does not
          come back as free art.

      ===== 4. WHAT DOES NOT CHANGE =====
      The accessibility pillars, the licence split, the record discipline and the gates are not relaxed for
      volunteer work. ⚠️ They get MORE load, not less: a contract can require conformance, and a pull request
      cannot — so the checks in CI are the only thing that will hold the line, which raises the price of the
      CI port (ADR-0066 §4) that is still owed.

  consequences:
    positive:
      - "The plan matches the resources that exist, instead of waiting for a budget nobody asked for."
      - "ADR-0066's host choice gains the reason it was missing, without the record having to be reopened."
      - "The two ownership questions are named with a trigger that has not fired yet, which is the only
         moment they can be answered cheaply."
    negative:
      - "⚠️ The 300 games lose their schedule. Volunteer labour cannot be planned, and any date attached to
         the catalogue from here is fiction."
      - "Conformance moves entirely onto review and CI, because it can no longer be required by contract."
      - "The art question may have no comfortable answer: people who volunteer art usually expect it to be
         free, and here it is deliberately not."
    neutral:
      - "`CLAUDE.md` §1 said the games would be made by contracted pixel artists. Corrected in the same
         change as this record."

  confirmation: |
    · No repository is public while the contribution terms for CODE and for ART are undecided.
    · When they are decided, they are visible where a contributor arrives: `CONTRIBUTING.md` and the
      pull-request template, not only in a record.
    · If DCO is the instrument, CI FAILS on a commit without `Signed-off-by` — a term nothing enforces is a
      term that will be missing exactly where it matters.

more-information: |
  This record supersedes nothing. It states a labour model no record had stated, and everything it touches
  it touches by CONSEQUENCE — ADR-0066's reasoning gains a reason, ADR-0068's 300 repositories lose their
  schedule, and the CI port gets more expensive because review is now the only lever.

  ⚠️ AND THE TWO OPEN QUESTIONS ARE OPEN ON PURPOSE, in the shape ADR-0066 §4 used for the package registry:
  named, dated by a trigger, and not answered by a record that has no business answering them.
