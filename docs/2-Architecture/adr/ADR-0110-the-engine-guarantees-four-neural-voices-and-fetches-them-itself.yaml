title: The engine GUARANTEES four neural voices and fetches them itself — because in an educational game the screen reader is for everyone, not for the few

context-and-problem-statement: |
  ADR-0065 decided three things at once and one of them has now lost its premise.

  It decided the LOCALES (`en_US`, `pt_BR`, `es_MX`), the SOURCE (csukuangfj, `vits-piper` only, never `ncnn`,
  never `int8`) and the DELIVERY (runtime cache on FIRST USE, never precache). The delivery clause carried its
  own argument, and the argument is what changed:

      "Neural speech is an ACCOMMODATION, not a feature everyone uses. Precaching would make every machine in
       the school pay 200 MB so that the machines which need it are ready — the cost lands on everyone and the
       benefit on few, and the few are the ones the project exists for."

  ⚠️ THE DEV DID NOT CONTRADICT THAT REASONING. He withdrew its premise:

      "Baixar ~200MB é o preço para deixar o jogo inclusivo, e vale a pena. Sem falar que o jogo é educativo e
       precisa de leitor de tela mesmo para pessoas não cegas."

  If the screen reader is for every child — because the game teaches READING, and a child who cannot yet read
  needs the words spoken whether or not she is blind — then the cost and the benefit land in the SAME place,
  and "few benefit" stops being true. That is a change of fact, not of taste, and it is why this is a
  supersession rather than a reversal.

  And there was a second half, measured in issue #91: `carregarVozNeural` was declared by three of the six
  local games and NOT by `game-soccer`, `whackwhack` and `game-chess`. In those three there was no neural
  voice at all, `neuralDisponivel` was merely `!!ctx.carregarVozNeural`, and nothing said so — against
  ADR-0065 §3's written promise that a cartridge "does not have to know one exists". A commit in `7212479`
  made the silence audible (`declines.semVozNeural`). This record removes the silence's cause.

decision-drivers:
  - "A promise that a cartridge does not have to know the voices exist is broken by a door the cartridge must
     open. One of the two has to give, and it is the door."
  - "Three hundred games cannot each answer a question about speech synthesis."
  - "A 200 MB npm tarball would be paid by every `npm ci` in every one of those repositories, forever, and
     most of those runs never open a browser."
  - "A school Chromebook is the target, not a developer laptop — pillar 1."
  - "The child must not be waiting in silence while a model downloads. ADR-0065 already answered this and the
     answer survives intact."

considered-options:
  - "D1 — keep ADR-0094's door as the only path: each game declares `carregarVozNeural`"
  - "D2 — the voices ship INSIDE the npm package, so `npm install` brings them"
  - "D3 — the engine GUARANTEES the voices and fetches them itself on first boot, in background; the package
     stays light and the cartridge declares nothing"

pros-and-cons-of-the-options:
  D1:
    good: ["Already built. A game that wants a different supplier keeps full control."]
    bad: ["Measured to fail in practice: three of six games forgot, and forgetting is silent.",
          "It asks three hundred cartridges to answer the same question once each."]
  D2:
    good: ["Simplest to reason about: the files are there, offline, with no fetch to fail."]
    bad: ["~244 MB in the tarball, pulled by every `npm ci` of every consuming repository — including CI runs
           that never render a page. The built game goes from 29 MB to roughly 273 MB.",
          "A game that genuinely never speaks still pays, and a quiz for a sighted class is exactly that."]
  D3:
    good: ["The child gets what D2 gives her: every game on this engine speaks, from the first screen.",
           "The cartridge declares nothing — ADR-0065 §3's promise becomes true instead of aspirational.",
           "The package stays light, so the 300 repositories are unaffected.",
           "Background means the game is playable while it downloads, with the fallback voice already speaking."]
    bad: ["A fetch can fail, and now it is the ENGINE's failure to report rather than the game's.",
          "Thirty machines in a computer lab booting at once is thirty downloads. This record does not solve
           that, and says so below."]

decision-outcome:
  chosen-option:
    link: "D3 — the engine guarantees the voices and fetches them itself"
    justification: |
      ===== 1. THE ENGINE OWNS THEM AND NOW ALSO DELIVERS THEM =====
      ADR-0065 §3 already said the voices belong to the engine — "uma vez que se abre a engine, isso deve
      permanecer dentro dela". What it did not settle is who makes them ARRIVE, and ADR-0094 answered that with
      a door the game opens. The door was right about one thing and wrong about another: right that 135 MB of
      WASM cannot be paid by a game that never speaks, wrong that the game must therefore ASK.

      ⚠️ THE DOOR STAYS, AND ITS MEANING CHANGES. `carregarVozNeural` remains an option for a game that wants a
      DIFFERENT supplier. What it stops being is the only way a voice arrives. A game that declares nothing now
      gets the four voices, which is what `declines.semVozNeural` was accusing it of lacking.

      ===== 2. THE VOICES, AND THEY ARE FOUR RATHER THAN THREE =====
      Named here because the Dev named them, and NOT because this record thinks voice files are architecture —
      ADR-0065 §6 is explicit that "which voice file is DATA, not a decision", and that clause stands. What
      makes these worth writing down is the SET, not the files: two English voices rather than one.

        · pt-BR — `vits-piper-pt_BR-faber-medium`  (already shipping)
        · en-US — `vits-piper-en_US-ryan-medium` and `vits-piper-en_US-amy-medium`
        · es-MX — `vits-piper-es_MX-claude-high`

      ⚠️ A CORRECTION THAT MATTERS AND IS NOT A QUIBBLE: the Dev's links for the two English voices pointed at
      the `ncnn-` mirrors. `ncnn` is a different INFERENCE ENGINE — the models are `.param`/`.bin`, not
      `.onnx` — and this project runs sherpa-onnx. ADR-0065 §5 already forbids it ("`vits-piper` only, never
      `ncnn`") and that clause is untouched. The voices he chose exist in the ONNX form; only the mirror was
      wrong, so the choice is honoured and the format corrected.

      📌 `es_MX-claude-high` is `high` and the others are `medium`. `high` costs real-time factor, which on a
      school Chromebook is a child waiting. It is recorded as the Dev's choice, and `es_MX-ald-medium` is the
      only `medium` alternative that exists at the source if the wait proves too long in the field.

      ===== 3. DELIVERY: GUARANTEED, FETCHED, IN BACKGROUND, NOT IN THE TARBALL =====
      The package does not carry the models. On first boot the engine fetches them itself, in background, and
      caches them. From the cartridge's side this is indistinguishable from them having always been there,
      which is the whole point.

      ⚠️ THIS IS WHAT SUPERSEDES ADR-0065 §4, and only that clause. "Runtime cache on FIRST USE" becomes "fetch
      on first BOOT", because "first use" was the accommodation model: it waited for a child to ask. When the
      answer is "every child", waiting for the ask means every child waits.

      ⚠️ AND THE MITIGATION SURVIVES WHOLE. ADR-0065 said the child must not sit in silence while 61 MB
      arrives — eSpeak or Web Speech speaks WHILE the model downloads, "because without that the mitigation is
      useless to exactly the person who depends on it". Background delivery makes that MORE important, not
      less: now the download starts before anyone asked for it, so the fallback must be the thing that answers
      until it lands.

      ===== 4. WHAT THIS RECORD DOES NOT SOLVE, SAID PLAINLY =====
      Thirty machines in a school computer lab, booting at once, is thirty independent downloads of ~244 MB.
      This is a real consequence of the choice and it is not addressed here. The shapes that could address it —
      a LAN cache, a school-side mirror, shipping the models on the image the school installs — are
      deployment decisions, and pillar 9 (LAN + store-and-forward) is where they belong. Naming it here is the
      point: it must be found by measurement in a school, not discovered by a teacher.

  consequences:
    positive:
      - "Every game on this engine speaks, from the first screen, without declaring anything."
      - "ADR-0065 §3's promise — a cartridge does not have to know the voices exist — becomes true."
      - "The npm package stays light, so 300 repositories and their CI are unaffected."
      - "`declines.semVozNeural` keeps its meaning for a game that genuinely refuses speech, and stops being
         the accusation that three of six games silently earned."
    negative:
      - "A network failure is now the ENGINE's to report. Failing silently here would recreate, one level up,
         exactly the defect issue #91 measured."
      - "~244 MB per device, and a computer lab multiplies it. Not solved here."
      - "`es_MX-claude-high` is the slowest of the four on the target hardware."
    neutral:
      - "ADR-0094's door survives as an override rather than as the path."
      - "Which voice files these are remains DATA (ADR-0065 §6): swapping one is a line, not an amendment."

  confirmation: |
    ⚠️ NOT YET BUILT. This record is the decision; the delivery is its issue. Written before the code so that
    the code cannot quietly choose D2 by putting the models in the package "just for now".

    The gates this owes, and each one guards a failure that is silent by nature:

    · NO MODEL FILE TRAVELS IN THE PACKAGE — an inventory sieve over what `npm pack` actually produces, in the
      shape of `tests/fontes-empacotadas.node.test.js`. ⚠️ A size assertion is not enough: it would pass a
      build that ships one voice and drifts.
    · THE FOUR ARE NAMED IN ONE PLACE and the source host is the pinned one, with `ncnn` and `int8` refused by
      the same gate that ADR-0065 §5 already justifies. A second list of voice names is the defect this
      repository has already paid for three times.
    · A FETCH THAT FAILS IS REPORTED, not swallowed. The child falls back to eSpeak / Web Speech — and the
      engine says which voice it is actually using, because a fallback that presents itself as the real thing
      is the `reflectTTS` family again.
    · THE FALLBACK SPEAKS WHILE THE MODEL DOWNLOADS — ADR-0065's clause, now load-bearing, so it needs a case
      rather than a sentence.

more-information: |
  Supersedes ADR-0065 in part: §2's count (three locales, four voices) and §4's delivery model. Its §3
  (ownership), §5 (one source, no `ncnn`, no `int8`, with the measured reason that int8 runs ~3x SLOWER in the
  WASM backend) and §6 (voice files are data) are UNTOUCHED and still govern.

  Supersedes ADR-0094 in part: the game's door stops being the only path a neural voice can arrive by. Its
  argument about 135 MB of WASM not being a cartridge's to pay is intact — that is exactly why the engine pays
  it once.

  Deliberately NOT decided here: how a school-scale deployment avoids N devices fetching N times (pillar 9),
  which voice a child hears by default within a locale that has two, and whether a fifth locale is ever added.
