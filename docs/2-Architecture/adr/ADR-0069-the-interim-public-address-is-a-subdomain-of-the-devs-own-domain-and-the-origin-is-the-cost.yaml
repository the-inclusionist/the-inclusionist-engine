  D1:
    good: ["Zero cost, zero registration, and it is already how the build is published.",
           "Nobody could mistake it for an institutional address."]
    bad: ["Cloudflare's own documentation treats `*.pages.dev` as a free-plan site for personal or hobby use,
           not business-critical, and recommends a real domain for production.",
          "The `*.pages.dev` subdomain CANNOT be renamed — changing it means deleting the project and making
