title: The interim public address is a subdomain of the Dev's own domain — and the thing it costs is the ORIGIN

context-and-problem-statement: |
  The project needs an address to be SEEN at, before the Município has one to give. `.gov.br` is federal;
  states and municipalities receive a subdomain under `<uf>.gov.br`, so `…monteaprazivel.sp.gov.br` is not
  the Prefeitura's to grant alone — it goes through whoever administers `sp.gov.br`. That is why it is slow,
  and the slowness is structural rather than bureaucratic bad luck.

  ⚠️ AND THE OBVIOUS SHORTCUT WAS REJECTED FOR A MEASURED REASON. A project domain in the Dev's CPF —
  `oinclusionista.pro.br` — looked right and is not: `.pro.br` is a domain of a NATURAL PERSON, and
  registro.br does not allow domains of the pessoa física / profissional liberal categories to be
  transferred to a pessoa jurídica. It is a one-way street. The generic categories (`.com.br`, `.org.br`)
  do transfer, CPF to CNPJ, by ordinary procedure — so the shortcut existed, but not the one first proposed.

  The Dev chose a third thing, and it is better than either: **a subdomain of a domain he already has**.

decision-drivers:
  - "The address must not read as the Município's. ADR-0066 §2 decided that for the organisation name; an
     address is read by even more strangers than a repository is."
  - "No new registration, no new cost, and — because the WHOIS of the parent domain already exists — no new
     exposure of personal data. `.br` publishes the holder's name and part of the CPF, and permits no privacy
     proxy, so an ADDITIONAL registration would have been an ADDITIONAL exposure."
  - "⚠️ Whatever is chosen becomes the ORIGIN, and in a PWA the origin is the application's identity. This is
     the cost nobody had priced."
  - "The requerimento promises national territory, municipal control and municipal hosting. An interim
     address for DEMONSTRATION does not touch that promise; a deployment would."

considered-options:
  - "D1 — `oinclusionista.pages.dev`, the free Cloudflare subdomain, no registration at all"
  - "D2 — `oinclusionista.jrocha.dev.br`, a subdomain of the Dev's own domain"
  - "D3 — `oinclusionista.pro.br`, a new domain in the Dev's CPF"
  - "D4 — `oinclusionista.com.br`, a new GENERIC domain in the Dev's CPF, transferred to the Município later"
  - "D5 — wait for `…monteaprazivel.sp.gov.br` and demonstrate nothing until it exists"

