---
metadata:
  status: "accepted"
  date: 2026-09-06
  superseded-in-part:
    - by: ADR-0094
      what: "A ESCOLHA DO CAMPO, e só ela: `dependencies` para o `@mintplex-labs/piper-tts-web`, com o
             parágrafo da opção D2 que rejeitou a porta. A rejeição apoiava-se num preço medido de `0,5 MB
             e ZERO dependências transitivas`, e esse número está ERRADO — ver a errata no
             `more-information`. Com 135,4 MB no lugar de 0,5 MB, o argumento inverte-se, e o motor neural
             passa a chegar por porta. ⚠️ O GATE DAS DUAS DIREÇÕES, que é a outra metade e a mais durável
             deste registro, NÃO é superseded: ele fica, e é o que torna a decisão do ADR-0094 aferível."
  decision-makers: [Dev]
  consulted:
    - "O relato de um CONSUMIDOR REAL, verbatim: `Rolldown failed to resolve import
       \"@mintplex-labs/piper-tts-web\" from \".../@the-inclusionist/engine/dist-pkg/platform/tts.js\" ...
       So the published engine cannot be built against by anyone, not just this game`"
    - "ADR-0072 §4 — o build do pacote e o gate que o prende; este registro acrescenta o segundo crivo ao
       mesmo ficheiro, pelo mesmo motivo (crivo na FONTE, porque um gate que só funciona depois do build
       falha ABERTO)"
    - "ADR-0022 — a migração pendente para `sherpa-onnx-wasm`: o fornecedor de hoje está DESCONTINUADO, e é
       isso que torna o gate mais importante do que o nome"
    - "ADR-0035 — `render/port`: o precedente de não nomear fornecedor, e a razão pela qual ele NÃO se
       transfere para cá"
    - "ADR-0010 pilar 2 — a11y-first, que é o que decide entre a porta e a dependência"
  informed: []

title: O que o código EMBARCADO nomeia, o pacote tem de declarar — e o gate olha as duas direções

context-and-problem-statement: |
  A `6.36.1` foi publicada em 2026-09-06 e verificada anonimamente: pública, AGPL-3.0-or-later, LICENSE
  presente, 224 ficheiros emitidos com zero SPDX em falta. Todas as verificações que este repositório sabia
  fazer passaram.

  ⚠️ E ELA NÃO PODIA SER COMPILADA POR NINGUÉM. Quem descobriu foi um consumidor a instalar do registro:

      Rolldown failed to resolve import "@mintplex-labs/piper-tts-web"
      from ".../@the-inclusionist/engine/dist-pkg/platform/tts.js"

  `platform/tts` é código EMBARCADO — o `tsconfig.pkg.json` alcança-o, e o `boot/create-game.ts:255` chama
  `createTts`, de modo que a superfície `.` do pacote (a que um consumidor importa como `createGame`) chega
  lá. O `package.json` declarava `@mintplex-labs/piper-tts-web` em `devDependencies`, que o npm **não
  instala para quem consome**.

  ⚠️ E O DEFEITO ERA INVISÍVEL DAQUI DE DENTRO, ESTRUTURALMENTE. Nesta árvore o pacote está presente (é
  devDependency da própria árvore), então `npm run build`, o `tsc`, o Vitest e até o `npm pack` +
  `npm i` num projeto limpo — as 26 verificações de 05/09 — resolvem tudo. O que falhava só falhava do
  outro lado, e o outro lado não existia até alguém sair do `file:`.

  ⚠️ E ESCONDEU-SE NA FORMA DINÂMICA. A linha é `import('@mintplex-labs/piper-tts-web')` dentro de uma
  função, não um `from` no topo do ficheiro. Qualquer crivo escrito para `from '...'` ficaria verde por
  cima dela para sempre.

decision-drivers:
- "⚠️ Medido: dos 112 módulos embarcados, TRÊS especificadores de terceiros ao todo — `pixi.js` em
   `render/canvas` e `render/minimap` (estáticos), e `@mintplex-labs/piper-tts-web` em `platform/tts`
   (dinâmico). Exatamente UM não estava declarado, e é exatamente o que o consumidor encontrou."
- "⚠️ O resíduo honesto é ZERO, e é isso que decide a forma do gate: não há dívida legítima a tolerar, logo
   um teto que encolhe seria mentira — é `[Zero]`."
- "Medido o preço do fornecedor: 0,5 MB e ZERO dependências transitivas. Os 25,6 MB da voz não vêm do npm —
   são baixados em runtime do HuggingFace e cacheados em OPFS."
- "⚠️ O fornecedor está DESCONTINUADO e o ADR-0022 já marca a troca. O nome de hoje é temporário; o buraco
   que ele abriu não é."

considered-options:
- "D1 - mover para `dependencies`"
- "D2 - uma PORTA: `ctx.carregarPiper`, injetada pelo jogo, como o `render/port` faz com o PixiJS"
- "D3 - `optionalDependencies`"
- "D4 - peer opcional (`peerDependenciesMeta`)"

pros-and-cons-of-the-options:
  D1:
    good:
    - "Conserta o sintoma medido: o especificador passa a resolver de dentro do `dist-pkg` instalado."
    - "A narração neural continua a funcionar POR OMISSÃO, que é o que o pilar 2 pede de um recurso de
       acessibilidade."
    - "O `import()` continua lazy: o pacote entra num chunk à parte e só é buscado se a criança escolher o
       motor neural. `dependencies` é peso de `node_modules`, não de bundle."
    bad:
    - "⚠️ A engine passa a depender, em execução, de um fornecedor descontinuado. Mitigado pelo gate, não
       pelo nome: quando o `sherpa-onnx-wasm` entrar, o crivo obriga a declaração a acompanhar."
  D2:
    good:
    - "A engine não nomearia fornecedor nenhum, e o precedente existe: o ADR-0035 tirou o PixiJS de toda a
       engine menos duas portas."
    bad:
    - "⚠️ REJEITADA PELO MOTIVO PELO QUAL O PRECEDENTE EXISTE, e ele não se transfere: o `render/port` nasceu
       do perigo do SINGLETON — duas cópias do PixiJS são dois renderizadores a disputar a mesma canvas. Não
       há perigo equivalente aqui."
    - "⚠️ E o custo cai onde não deve: a narração neural ficaria desligada POR OMISSÃO para todo consumidor
       que não soubesse ligá-la. Um recurso de acessibilidade que só existe para quem já sabia que ele existia
       é o oposto do pilar 2 — e a ~0,5 MB sem dependências transitivas, é caro em a11y para poupar pouco."
  D3:
    bad:
    - "⚠️ É a D1 com um buraco aleatório: o npm instala `optionalDependencies` por omissão, mas segue em
       frente quando a instalação falha. O build passaria quase sempre e falharia às vezes, com a mesma
       mensagem e sem causa visível. Falha intermitente é pior que falha franca."
  D4:
    bad:
    - "Não conserta o sintoma medido: um peer opcional NÃO é instalado pelo npm, então o `Rolldown failed to
       resolve` acontece exatamente na mesma."

decision-outcome:
  chosen-option:
    link: "D1 para o nome + um segundo crivo em `tests/engine-package.node.test.js` para a CLASSE"
    justification: |
      ===== O CONSERTO É DE UMA LINHA; O REGISTRO É PELA OUTRA METADE =====
      Mover o pacote de `devDependencies` para `dependencies` fecha o defeito. Se fosse só isso, este
      registro não existiria.

      ⚠️ O QUE FALHOU NÃO FOI A SECÇÃO ERRADA DO `package.json`. Foi não haver NADA que relacionasse o que o
      pacote NOMEIA com o que o pacote DECLARA. O ADR-0022 já promete trocar este fornecedor por outro; sem
      o crivo, a troca reabre o mesmo buraco em silêncio, e outra vez só um estranho descobre.

      ===== O CRIVO OLHA AS DUAS DIREÇÕES, E A SEGUNDA É A QUE PRENDE O PIXIJS =====
        · nomeado e NÃO declarado → o pacote publicado não compila (o defeito de hoje).
        · declarado e NÃO nomeado → o consumidor instala o que ninguém importa; se é só do app deste
          repositório, é `devDependency`.

      ⚠️ A SEGUNDA DIREÇÃO É A RESPOSTA AO ACHADO MENOR DO MESMO RELATO: o consumidor observou que o
      `pixi.js@7.4.2` é instalado mesmo num jogo que ABANDONOU o PixiJS, e verificou que nada o empacota. O
      peer FICA, e fica com razão medida — `render/canvas` e `render/minimap` nomeiam-no estaticamente, e o
      perigo do singleton do ADR-0035 é real, enquanto torná-lo opcional partiria o caminho de renderização
      principal por omissão para quem o usa. 12,3 MB em `node_modules` que não viajam no bundle são um custo,
      não um defeito. ⚠️ Mas a reciprocidade fixa a data em que isso deixa de ser verdade: no dia em que as
      duas portas saírem do pacote, o gate fica VERMELHO e diz que o peer virou peso morto.

      ===== E O CRIVO É NA FONTE, PELA RAZÃO QUE O FICHEIRO JÁ TINHA ESCRITO =====
      O cabeçalho do gate do ADR-0072 §4 diz que testar `dist-pkg/` exigiria o build ter corrido, e que um
      gate dependente de um passo que alguém pode esquecer **falha ABERTO — o pior tipo, porque parece
      verde**. Vale igual aqui, e por isso o segundo crivo mora no mesmo ficheiro, lê a mesma lista de
      módulos vinda do `tsconfig.pkg.json`, e lê o `package.json` em vez de copiar nomes.

  consequences:
    positive:
    - "A versão seguinte pode ser compilada por um consumidor — que é o mínimo para a primeira versão pública
       ser recrutamento de voluntários (ADR-0070) e não uma porta fechada."
    - "A troca de fornecedor do ADR-0022 já nasce vigiada nas duas direções."
    negative:
    - "⚠️ A `6.36.1` fica no registro, quebrada e imutável. O npmjs só desfaz dentro de 72 h, e desfazer
       partiria quem já instalou; a correção é uma versão nova, não um `unpublish`."
    neutral:
    - "O `pixi.js` continua em `devDependencies` E em `peerDependencies`, porque este repositório é também
       um APP que se compila a si próprio. O `@mintplex-labs/piper-tts-web` NÃO precisa da duplicação: o npm
       instala as `dependencies` do próprio pacote."
  confirmation: |
    O gate nasceu VERMELHO SOBRE O DEFEITO REAL, e não sobre uma mutação — que é a birth mais forte que
    existe: escrito antes do conserto, apontou `app/js/platform/tts.ts:83 — @mintplex-labs/piper-tts-web`, e
    as outras 11 asserções do bloco passaram, de modo que o vermelho não vinha de um crivo partido.

    Provado do LADO DE FORA, que é onde o defeito vivia: `npm pack` → o manifesto do tarball declara a
    dependência; `npm i <tgz>` num projeto limpo → `node_modules/@mintplex-labs/piper-tts-web` existe; e
    `import.meta.resolve('@mintplex-labs/piper-tts-web', <o dist-pkg/platform/tts.js instalado>)` devolve o
    ficheiro, sob a condição `import` — que é a que o Rolldown usa.

    ⚠️ E a resolução por `require` FALHA, sem que isso seja defeito: o `exports` do fornecedor só publica
    `import` e `types`. Fica escrito porque a primeira sonda o mediu e a leitura fácil seria dar o conserto
    por incompleto.

    Suítes: 190 ficheiros / 3337 testes verdes nos dois projects; `tsc --noEmit` limpo.

more-information: |
  ⚠️ ERRATA (2026-09-06, no mesmo dia) — UM NÚMERO TROCADO, e é o número que sustentava a escolha do campo.
  Este registro afirma, na opção D1 e no `comment:dependencies` que dele saiu, que o preço do fornecedor era
  «0,5 MB e ZERO dependências transitivas». **É FALSO.** Foi lido o campo `dependencies` do fornecedor, que
  está vazio, e NÃO o `peerDependencies` — o mesmo campo que causou o defeito que este registro conserta. O
  `@mintplex-labs/piper-tts-web` declara `onnxruntime-web` como peer NÃO-opcional, que o npm instala
  sozinho: **135,4 MB** num consumidor limpo, não 0,5 MB.
  Entra como ERRATA e não como revogação porque é da definição de errata do ADR-0057 — número trocado —, e a
  DECISÃO que o número sustentava é que foi revogada, pelo ADR-0094. Fica escrito aqui para este registro
  não voltar a argumentar com um número falso na próxima conversa, que é a patologia que o ADR-0057 existe
  para impedir.

  ⚠️ ESTE DEFEITO É O ÚNICO DA SÉRIE QUE VEIO DE FORA. Os outros três de hoje (o id de armazenamento não
  podia vir da declaração, o `main.ts` não podia entrar no escopo do `engine-boundary`, as camadas legíveis
  eram seis e não quatro) foram medidas internas a contrariar uma proposta interna. Este ninguém aqui podia
  medir, porque a propriedade que falhava só é observável de um sítio onde este repositório não está.

  É o argumento mais forte que existe para o ADR-0083 §2 (o jogo instala por TARBALL antes de haver
  registro) e para a issue #113: um consumidor que consome por `file:` **não é um consumidor** para efeitos
  de prova — ele lê esta pasta ao vivo, com as devDependencies todas presentes.

  ⚠️ E fica a consequência de processo para a issue #113: o repositório do consumidor carrega hoje o pacote
  como devDependency SUA para conseguir compilar, com um teste (`tests/docs.node.test.ts`, do lado dele) que
  fica VERMELHO no momento em que a engine mover o pacote para `dependencies`. Ou seja: o remendo de lá foi
  construído para não sobreviver à razão dele. Ele vai ficar vermelho com esta versão, e isso é o combinado
  a acontecer — não uma regressão.
