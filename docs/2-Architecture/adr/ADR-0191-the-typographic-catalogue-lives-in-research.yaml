title: The typographic catalogue lives in research/

context-and-problem-statement: |
  ADR-0176 §1 put `catalogo_tipografico.json` «at the engine repository root», where the Dev had placed it. The Dev, 2026-09-13:
  «Criei uma pasta chamada research, e coloquei nela um áudio de 25s assim como os dois arquivos sobre catálogo tipográfico.»
  📏 Both files moved byte-identical; three gates read the old path and failed with ENOENT.

decision-drivers:
  - "D1 — THE CATALOGUE IS THE DEV'S, AND SO IS WHERE IT LIVES"

considered-options:
  - "A — keep it at the root (ADR-0176 §1)"
  - "B — `research/`, where the Dev put it"

pros-and-cons-of-the-options: |
  **A.** ✅ No path changes. ❌ Not where the Dev keeps it.
  **B.** ✅ The research material together. ❌ The gates read a new path.

decision-outcome:
  chosen-option:
    link: "B — research/"
    justification: |
      1. **`research/catalogo_tipografico.json` and `research/catalogo_tipografico_INSTRUCOES.md`** are the catalogue and its
         instructions; the engine reads them there. Everything else ADR-0176 decides stands, the catalogue still unedited.
      2. `research/` is not packaged; a recording of a voice put there is not committed (personal data).

  consequences:
    positive:
      - "The research material the Dev hands over has one place"
    negative:
      - "A tool or document that names the root path has to follow"

  confirmation: |
    Built in `engine:9fd7be1`: `tests/catalogo-tipografico.node.test.js`, `tests/fontes-carregam.node.test.js` and
    `tests/fontes-empacotadas.node.test.js` read `research/catalogo_tipografico.json`.

more-information: |
  Whether `research/` should be ignored by git, so that recordings never reach a commit by accident, is the Dev's to say.
