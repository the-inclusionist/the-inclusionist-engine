title: The games adopt the engine's pause — the decline is retired for good, and the keyboard cost was conditioned on a card being VISIBLE

context-and-problem-statement: |
  Issue #132 asked one question with two answers: either the four games that decline the engine's pause ADOPT
  it (A), or the engine keeps the escape hatch under a truer name — `semPausaDaEngine`, «I mount my own» (B).

  The Dev answered A, and re-stated the reason they had already given when ADR-0106 was written: the pause menu
  and the quick accessibility buttons in the HUD are supposed to be in EVERY game, and that is precisely why
  they are the engine's responsibility rather than each cartridge's.

  🔴 AND THE PREMISE THAT MADE B LOOK NECESSARY WAS MINE, AND IT IS WRONG. ADR-0121 reverted the retirement on
  a cost written in `pixi-15-puzzle`'s own source: «if `semMenuDePausa` were omitted, every arrow, Enter and
  Space would start being eaten the moment anything created an element with a pause id.» I quoted it and did
  not measure it.

  📏 MEASURED ON 2026-09-09, IN THE ENGINE, BY READING BOTH CONSUMERS OF THE CARD:

    · `ui/menu-nav.ts:485` — `if (menu && !menu.hidden) { consumir(e); navPause(menu, pi, k); }`
    · `input/gamepad.ts:619` — `const menu = ctx.getPauseMenu(pi); if (menu && !menu.hidden) …`
    · `ui/pause-icons.ts:1180` — `sp.hidden = true`, three lines into `buildScreenPause`

  A key is consumed only while the card is OPEN. The card is born hidden and the engine opens it when the
  child asks for pause. So the sentence is true of a VISIBLE menu — where it is also correct, because an open
  menu owns the keyboard — and false of a mounted one.

  📏 AND THE GUARD IS NOT NEW: it landed in `1519682` on 2026-08-25 and is contained in `v7.0.1`, which is the
  version all four games install. The cost they wrote down was already stale in the version they run.

  📏 ONE MORE MEASUREMENT DECIDES THE ORDER, AND IT IS THE ONE THAT MAKES A CHEAP. Mounting — of the card
  (`092a670`) and of the accessibility bar (`fb1116c`) — is contained in `v8.0.0-rc.1` and in NO earlier tag.
  In `7.0.1` nothing creates `#vp-pause-0` at all. Retiring the field therefore changes nothing for any game
  until the day it bumps, and on that day it is a typecheck error on the exact line that must change.

decision-drivers:
  - "The Dev's own rule, twice stated: every game has the same pause and the same accessibility bar, from the first screen"
  - "A contract field with two meanings — «I have none» and «I mount my own» — is what made the ADR-0120 mistake possible"
  - "Pillar 2: nothing here may cost a child her keyboard, and that is now a measured claim rather than a quoted one"
  - "A breaking change should fail LOUDLY at the moment of adoption, not silently afterwards"
  - "The engine cannot verify another repository; what it can do is make the break impossible to miss"

considered-options:
  - "A · The games adopt the engine's pause, and `Declinios.semMenuDePausa` is retired"
  - "B · The engine restores the escape hatch under a truer name (`semPausaDaEngine`)"
  - "C · Keep ADR-0121's revert and decide later"

pros-and-cons-of-the-options:
  A:
    good:
      - "It is the rule the Dev stated when ADR-0106 was written, applied instead of deferred."
      - "One pause menu and one accessibility bar across the catalogue: a child who learns them in one game knows them in all three hundred."
      - "📏 The keyboard cost is measured to be conditioned on the card being VISIBLE, so adoption does not take the arrows from a game played with arrows."
      - "📏 The break lands at the bump, as a typecheck error on the declaration line — the loudest possible moment and the cheapest to fix."
    bad:
      - "🔴 `game-chess` has its OWN pause menu (`app/js/ui/pause-menu.ts`), written on purpose; adopting is real work there, not a deletion."
      - "⚠️ The engine will mount a card into `#game-region` by default, which is DOM inside somebody else's layout unless they declare `host.pauseHost`."
      - "Four repositories have to move, and none of them is this one."
  B:
    good:
      - "Honest about what the four games actually mean today, and cheap: a rename plus a migration note."
      - "Keeps every game's keyboard untouched with no work in any other repository."
    bad:
      - "It writes the divergence into the contract: three hundred games may each draw a different pause."
      - "⚠️ It answers a question about ACCESSIBILITY with a field that lets a cartridge opt out of it."
      - "The Dev's rule would then exist in a record and be contradicted by the contract that implements it."
  C:
    good:
      - "No work today, nothing breaks today."
    bad:
      - "It is what ADR-0121 already did; repeating it is not a decision, it is the absence of one."
      - "The ambiguity that caused the original mistake stays in the contract for another release."

decision-outcome:
  chosen-option:
    link: "A — the games adopt the engine's pause; `Declinios.semMenuDePausa` is retired"
    justification: |
      **`Declinios.semMenuDePausa` IS RETIRED AGAIN, restoring ADR-0120's outcome, and the four games adopt
      the engine's pause at the moment they bump to `8.0.0`.**

      Three clauses:

      1. **THE PAUSE AND THE ACCESSIBILITY BAR ARE THE ENGINE'S, IN EVERY GAME.** Not offered, not declinable:
         a game that boots through `createGame` gets the same card and the same bar. That is the Dev's rule
         from ADR-0106, and this record stops treating it as an aspiration.
      2. **THE OTHER THREE DECLINES STAY.** `semAtorDePausa`, `semVozNeural` and `semAssistenteDePad` describe
         absences the engine still cannot fill. This one described an absence the engine filled in ADR-0106
         stages 2 and 3.
      3. **THE ONLY THING A GAME STILL DECLARES IS WHERE IT FITS** — `host.pauseHost`, with `#game-region` as
         the fallback and a `problems` line when neither is usable. Where the card goes is the one question a
         cartridge can answer and the engine cannot.

      ⚠️ AND THIS RECORD OVERTURNS A FACT, NOT A JUDGEMENT. ADR-0121 was right about method and wrong about
      the number: it repeated a consumer's comment as if it were a measurement, which is the same failure it
      was written to condemn, one level up. The measurement is now in `context-and-problem-statement`, with
      file and line, and it is what makes A cost less than ADR-0121 assumed.

      📌 WHAT ADR-0121 GOT RIGHT SURVIVES INTACT and is why this record exists at all: a contract field is not
      retired on the evidence of the consumer that ships in the same repository. That rule is in `CLAUDE.md`,
      it produced the catalogue sweep that found the four users, and it produced this decision too — the four
      repositories were opened and read before this file was written.
  consequences:
    good:
      - "One pause menu and one accessibility bar across the catalogue, which is what the whole ADR-0106 direction was for"
      - "The contract loses a field that meant two different things, which is the ambiguity that caused ADR-0120's mistake"
      - "The break is a typecheck error on the declaration line at bump time — impossible to ship unnoticed"
      - "`consumer-quiz` loses the field first, in this repository, where the engine's own example must obey its own rule"
    bad:
      - "🔴 `game-chess` must retire its own `ui/pause-menu.ts` or feed its items to the engine's card through `getPauseActs`, and that is design work in another repository"
      - "⚠️ A game that declares no `pauseHost` gets engine DOM appended to `#game-region`; three of the four have styling that assumes what lives there"
      - "The four games cannot bump one at a time without each doing the adoption in the same commit — the lockstep of #104 stage 6, now with a second reason"
  confirmation: |
    ⚠️ THE ENGINE-SIDE GATE IS THE REMOVAL ITSELF, and it is asserted by the SHAPE portrait rather than by a
    test that names the field: `scripts/shape-surface.mjs` reports a required-member removal from
    `Declinios`, which is what makes it a declared breaking change instead of a silent one. A test that
    asserted «the field is absent» would be a second copy of the type.

    The gates this record owes:

    · **THE CARD IS MOUNTED FOR EVERY GAME THAT BOOTS THROUGH `createGame`** — no declaration removes it, and
      the only outcome for a host with nowhere to put it is a `problems` line. Born red by keeping a
      `semMenuDePausa: true` in a fixture and asserting the card is mounted anyway.
    · **THE MOUNTED CARD DOES NOT EAT A GAME'S KEYS WHILE HIDDEN** — the measurement above turned into a case,
      in the browser project, because it is a DOM behaviour: with the card mounted and hidden, an arrow
      dispatched at the window reaches the game's own listener; with the card shown, it does not. 🎯 This is
      the case that would have prevented ADR-0121 from being written on a quotation.
    · **THE FOUR CONSUMERS ARE NAMED IN THE MIGRATION NOTE, WITH THE LINE EACH ONE CHANGES** — this cannot be
      a test in this repository (the catalogue is four other repositories, and a gate that read them would
      make this repo's CI depend on their state); it is a step in the procedure and it belongs beside the
      other 8.0.0 adoption instructions in `docs/6-DevOps-SRE/`.

more-information: |
  Supersedes ADR-0121 in part: the revert. Its method lesson — measure the CATALOGUE, never the example
  consumer that lives in the same repository — is re-affirmed, not superseded, and is now in `CLAUDE.md`.

  Restores ADR-0120's outcome. That record's reasoning about WHY the field existed (the engine had nothing
  that suited a game without a pause of its own, and ADR-0106 stages 2 and 3 built that away) was correct all
  along; what it lacked was the catalogue.

  📏 What each of the four changes, measured on 2026-09-09 in their own trees:

    · `game-2048`      — `app/js/boot/main.ts:96`, drop the field from `declines`
    · `game-whackwhack` — `app/js/boot/main.ts:94`, the same, plus the comment in `app/js/input/actions.ts:21`
      that explains the declaration
    · `pixi-15-puzzle` — `app/js/boot/main.ts:108`, the same, and the comment above it (lines 105-107) states
      a cost that this record measures as conditioned on a VISIBLE card
    · `game-chess`     — `app/js/boot/game-shell.ts:439`, and the real work: `app/js/ui/pause-menu.ts` is its
      own menu, opened by START, holding «leave the lesson». Its items are `getPauseActs` material

  Deliberately NOT decided here: whether a chess-shaped game keeps game-specific items by feeding them to the
  engine's card or loses them; what «pause» means in a game with no clock to stop (`ui/pause-menu.ts:18`
  raises it and it is a real question); and whether `host.pauseHost` should become required rather than
  falling back to `#game-region`.
