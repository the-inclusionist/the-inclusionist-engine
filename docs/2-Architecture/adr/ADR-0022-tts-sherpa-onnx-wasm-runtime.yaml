title: Adopt sherpa-onnx-wasm as the neural TTS runtime (supersedes the lib choice in ADR-0021)

context-and-problem-statement: |
  ADR-0021 shipped neural pt-BR TTS via @mintplex-labs/piper-tts-web. Playtests + code reading exposed hard limits:
  (1) the lib is **discontinued/unstable** (Dev); (2) its `PATH_MAP` is fixed and `HF_BASE` (rhasspy/piper-voices) is
  hardcoded, so it can load ONLY `pt_BR-edresson-low` (unusable) and `pt_BR-faber-medium` — no high-quality community
  voices, no self-host; (3) `TtsSession` is a global singleton that never reloads the model on a voice change.
  Meanwhile the browser lab confirmed **Kokoro-js and KittenTTS are English-only** → useless for pt-BR. We need a
  runtime that runs ANY VITS/Piper `.onnx` in the browser, from any (CORS-enabled) host, fully offline after first fetch.

decision-drivers:
- "Voice freedom: run high-quality pt-BR voices (miro-high) + faber/jeff-medium, not just what one lib's map allows."
- "Host freedom: load models from any CORS URL — decouples us from a lib's hardcoded host."
- "Offline (pillar): WASM + model cached (OPFS/Cache API) → offline after the first fetch; schools have no IT/LAN."
- "Stability/maintenance: sherpa-onnx (k2-fsa) is actively maintained across 12 languages/platforms; Mintplex is not."
- "**Tiered quality by hardware** (Dev): the baseline must run on the weakest school machine in use, BUT better
  hardware must be allowed to opt into better voices (e.g. Kokoro multi-lang, a ~340 MB model) — progressive
  enhancement, not lowest-common-denominator-only."
- "Research-first: validated model availability + the lib API before deciding."

considered-options:
- &mintplex "Stay on @mintplex-labs/piper-tts-web"
- &sherpa "sherpa-onnx compiled to WebAssembly (k2-fsa) as the runtime"
- &kokoro "Kokoro-js"

pros-and-cons-of-the-options:
  mintplex:
    cons:
    - "Discontinued/unstable; 2 pt-BR voices only; hardcoded rhasspy host; singleton can't switch voice."
  sherpa:
    pros:
    - &any "Runs ANY VITS/Piper .onnx in-browser; models loaded from any CORS URL at runtime via the Emscripten FS (fetch → Uint8Array → FS.writeFile → OfflineTts)."
    - &offline "WASM + model cacheable → fully offline after first fetch."
    - &maint "Actively maintained (k2-fsa); huge model catalog (tts-models release), incl. pt_BR miro-high/faber/jeff/cadu."
    cons:
    - &build "Needs an Emscripten/asset build step (Dev runs Node) and ships the espeak-ng-data + WASM (~a few MB) alongside the model."
  kokoro:
    cons:
    - "kokoro-js@1.2.1 is English-only in the browser (pt-BR exists only in the Python lib via misaki g2p)."

decision-outcome:
  chosen-option:
    link: *sherpa
    justification: |
      Adopt **sherpa-onnx-wasm** as the neural TTS runtime and drop @mintplex-labs (and Kokoro-js/Kitten for pt-BR).
      **Approach B (universal loader):** build the sherpa-wasm engine WITHOUT a baked model; at runtime fetch each
      voice's files → `FS.writeFile` → init `OfflineTts`. Voices are then a config/JSON table — adding one is a data
      change, not a code change. **Tiered by hardware:**
        · baseline pt-BR VITS/Piper from k2-fsa `tts-models`: **miro-high** (high) + **faber-medium** + **jeff-medium**
          (all real pt-BR; `dii` is pt-PT, there is no pt-BR `dora-high`); and
        · a HIGH-END option for better machines: **Kokoro multi-lang** via sherpa (`kokoro-multi-lang-v1_0.onnx` ~340 MB
          + `voices.bin` + `tokens.txt` + `dataDir`; pt-BR voices `pb_dora`/`pb_alex`).
      **Default = lazy-fetch** (nothing bundled): use **eSpeak** (and Web Speech) to talk WHILE the neural model
      downloads, then decide per device whether Piper/Kokoro actually runs. **eSpeak stays** the engine for the raw
      **phoneme / spell-letter / spell-syllable** drills (sherpa takes text, not phonemes); neural does **words +
      sentences**. **Web Speech + eSpeak are kept as fallbacks** even if rarely hit (browser-inconsistent / dated, but
      zero-download).
      **Hosting = Cloudflare R2** (REVERSES ADR-0021's 'no R2'): HuggingFace does not have the bandwidth to serve raw
      un-tarred model files; R2 (CORS `*`) hosts the `.onnx`/`tokens.txt`/`voices.bin`/`espeak-ng-data`. Weights still
      fetch once and then run 100% locally, cached (OPFS/Cache API), disclosed to schools.
  consequences:
    positive:
    - *any
    - *offline
    - *maint
    neutral:
    - "The CDN-only lab can't run sherpa (needs a build) → it is KEPT for eSpeak + Web Speech comparison; the neural A-B (miro/faber/jeff/Kokoro) happens in-game or in a Dev-built harness."
    - "sherpa = words+sentences (and letters/syllables via Piper, which reads letters well). The PHONEME layer is UNDER REVIEW: playtest rejected eSpeak as too robotic (unusable for speech therapists / literacy teachers), so 'eSpeak = phonemes' from the earlier plan is NOT settled — open research on how to voice true isolated phonemes naturally. Web Speech + eSpeak stay as last-resort fallbacks only."
    negative:
    - *build
    - "Larger first-load footprint (WASM engine + espeak-ng-data + model) — mitigated by caching + a small default voice."
  confirmation: |
    A working in-game prototype speaking pt-BR with miro-high (and switchable to faber/jeff) from a runtime-loaded model,
    offline on the 2nd load. Then tts.ts routes phoneme/letter/syllable → eSpeak, words/sentences → sherpa.

more-information: |
  ===== EMENDA 2026-08-27 — O ROSTER MUDOU, E O `int8` SAIU COM MOTIVO MEDIDO =====
  This record names "miro-high/faber/jeff" in five places, including its index row. The Dev changed both the roster
  and the quantisation after listening to all of them, and the change never reached here. What is FACT goes in now;
  what still needs a number is marked as such rather than written as if settled.

  **JEFF IS OUT.** Their word, after the listening round: "Remova jeff." Their notes on why: jeff and faber sounded like
  the same model — "Parece ser o mesmo modelo. Mesmo ritmo, mesmo sotaque" — so it was a duplicate, not a choice.
  MEASURED TODAY: the game ships exactly one voice, `pt_BR-faber-medium` (`app/js/platform/tts.ts`); jeff survives
  only as lab files under `docs/research/sherpa-wasm/`. The code had already followed them; only the record had not.
  ⚠️ `docs/CREDITS.md` still credits jeff. Left alone on purpose — a wrong attribution removal is worse than a stale
  one, and the lab files are still there. It is a separate pass, not a side effect of this amendment.

  **ONE SOURCE.** "Usaremos somente modelos de fangjun (csukuangfj)" — https://huggingface.co/csukuangfj/models.
  vits-piper only, never ncnn.

  **`int8` IS OUT, and the reason is the valuable part** — they asked for it in writing ("Documente isso e remova
  int8") and it was never written down. In the WASM backend, int8 runs ~3× SLOWER than fp32, measured in their own log
  (int8 RTF 5.6 against fp32 2.5); and int8 on ORT-web produces incorrect or silent output, a known problem of the
  WASM backend with the quantised ops (MatMulInteger / DynamicQuantizeLinear). Quantising does not shrink the wait
  here — it lengthens it. Without this paragraph the next person tries int8 believing it is an optimisation.

  **THE ROSTER IS THREE, AND THEY BELONG TO THE ENGINE.** The seven-locale target was cut by the Dev the moment the
  sum was put in front of them. Their words: "deixe somente três modelos para offline: en_US, pt_BR e es_MX (latino-
  americano neutro) e empacote-os no PWA. Eles fazem parte da engine, e não do jogo em si, uma vez que se abre a
  engine, isso deve permanecer dentro dela."

  Two decisions in one sentence, and the second is the structural one:

    · WHICH: en_US, pt_BR, es_MX. Three locales, not seven, and es_MX chosen as NEUTRAL LATIN AMERICAN rather than
      es_ES — the audience is Brazilian public schools and their neighbours, not Spain.
    · WHOSE: they are ENGINE assets. Every game opened on this engine finds them already there; a cartridge does not
      ship its own voice and does not have to know one exists. This is the same cut ADR-0038 made for state and
      ADR-0032 for curriculum — it says who OWNS the thing, which is what decides where it travels.

  ⚠️ MEASURED, AND THE NUMBER IS THE OPEN PART. One Piper medium voice, on disk, in this repository today:

    · `model.onnx` — 61 MB (measured on `vits-piper-pt_BR-faber-medium`)
    · `espeak-ng-data` — 18 MB, SHARED across every voice
    · tokens + config — under 6 KB

  So three voices ≈ **183 MB of models + 18 MB shared ≈ 200 MB**. For comparison, the whole built game today is
  **29 MB**, and the precache gate holds **100 entries / 28,5 MB**.

  PRECACHE AND RUNTIME-CACHE ARE NOT THE SAME PROMISE, and the difference is what needs the Dev's word:

    · PRECACHE (`globPatterns`, which is what "empacotar no PWA" does literally) downloads everything BEFORE the app
      is usable offline. It would take first load from 29 MB to ~230 MB on a school network.
    · RUNTIME CACHE keeps the same end state — the voice lives on the machine and works offline forever after — but
      pays for it on first use, per voice, and only for the locale actually in use.

  ✅ **DECIDED 2026-08-27: RUNTIME CACHE, ON FIRST USE.** The Dev, once the sum was in front of them: "Ok, cachear
  conforme primeiro uso, assim somente alunos que precisam baixam."

  And that last clause is the argument, not a side effect. Neural speech is not a feature every child uses — it is
  an accommodation. Precaching it would make every machine in the school pay 200 MB so that the machines which need
  it are ready, which inverts who carries the cost: a classroom of thirty downloads the voices thirty times for the
  two children who speak through them. Fetching on first use puts the download where the need is, once per machine,
  and offline holds from then on — which is the promise ADR-0021 made in the first place ("fetch once → 100% local").

  It also keeps the Dev's own budget rule intact: "A busca é por ter o menor tamanho possível, e 25MB para um jogo é
  algo incrível." First load stays at the 29 MB the game already costs.

  ⚠️ WHAT THIS OWES, and it is a real cost of the choice rather than a caveat: the FIRST time a child needs the
  voice, she waits for 61 MB on a school network. The mitigation already exists in this record — eSpeak and Web
  Speech talk WHILE the neural model downloads — but it has to actually be wired, and the wait has to be announced,
  because a blind child cannot see a progress bar.

  ⚠️ AND THE VOICE NAMES ARE NOT DECIDED — only the locales. Which `en_US-*` and `es_MX-*` model to ship is a
  LISTENING test, and this project has a history of that judgement being made by ear and being right (jeff left the
  roster because the Dev heard it as the same model as faber). Nobody should pick them from a filename.

  Supersedes the LIB half of ADR-0021 (npm @mintplex-labs). The 'no R2, weights from HF' half is **REVERSED**: models now
  live on **Cloudflare R2** (HF lacks raw-file bandwidth); the 'fetch once → 100% local → disclose to schools' principle
  is retained. Dev decisions locked this round: **Approach B** (universal loader); **R2** hosting; **lazy-fetch** default
  (eSpeak/Web Speech cover the download gap); **keep** eSpeak + Web Speech as fallbacks; **tiered by hardware** (baseline
  VITS/Piper for weak machines, Kokoro multi-lang opt-in for better ones). Still open: how the WASM + espeak-ng-data ship
  in Vite/`dist` and are cached for PWA/offline. **NOT YET VALIDATED by a passing user test** — even eSpeak is still
  unconfirmed in the browser lab; nothing here is "done" until the Dev tests it. Plan: docs/research/tts-sherpa-onnx-plan.md.
  VITS/Piper models: k2-fsa/sherpa-onnx releases (tag tts-models). Kokoro multi-lang: kokoro-multi-lang-v1_0.onnx (~340 MB)
  + voices.bin + tokens.txt + dataDir (sherpa config `kokoro:{model,voices,tokens,dataDir}`, voice `pb_dora`/`pb_alex`).
  Why ONNX and not NCNN (sherpa-ncnn also does vits-piper TTS + WASM): docs/research/tts-ncnn-vs-onnx.md — ONNX wins on
  voice-ecosystem breadth + fidelity + WASM maturity for a browser; NCNN's edge (tiny ARM binary) isn't our bottleneck.
