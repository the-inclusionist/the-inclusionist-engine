title: The public contract includes what a cartridge reads from CSS, the DOM and the dictionaries — and only what a cartridge needs is exported

context-and-problem-statement: |
  The Dev, on 2026-09-13, on the four candidates of the principles study: «As quatro.»

  📏 Measured in one day: the surface gate compares TypeScript names and shapes, and three kinds of contract passed it.
  `--barra-a11y-h` changed meaning (issue #160); the classes `.rodape-da-tela`, `.legenda-de-som`, `.pause-icons-cap` and
  the attribute `data-glifo` are read by games and tests and held by nothing. And the other way: `numerarItens` and
  `ATRIBUTO_DO_NUMERO` were exported with no consumer in any sibling repository, and removing them was a `BREAKING CHANGE`
  nobody had benefited from.

decision-drivers:
  - "D1 — WHAT A CARTRIDGE CAN READ, IT CAN DEPEND ON. A variable or class it reads breaks it as surely as a renamed function"
  - "D2 — A NAME NOBODY NEEDS IS A BREAK WAITING. Every export is a promise"

considered-options:
  - "A — the contract is the TypeScript exports only"
  - "B — the contract is what a cartridge can read, and exports are kept to what a cartridge needs"

pros-and-cons-of-the-options: |
  **A.** ✅ Already gated. ❌ Measured: three kinds of break passed it in one day.
  **B.** ✅ Breaks are named where cartridges feel them. ❌ A list of CSS and DOM surface to keep, and exports to prune.

decision-outcome:
  chosen-option:
    link: "B — what a cartridge reads is contract; only what it needs is exported"
    justification: |
      1. **Public surface = what a cartridge may read**: the TypeScript exports, AND the CSS custom properties the engine
         writes for games (`--barra-a11y-h`, `--alvo-min`, `--ui-fs`, `--tap`, `--rodape-h`…), the classes and `data-*`
         attributes of what the engine mounts that a game is told to read or style, and the dictionary keys a game is
         told to use. Changing one of them — name, or MEANING — writes a migration note, as an export does.
      2. **That surface is LISTED and gated**: a list in the repository, and a gate that fails when the stylesheet or the
         root stops writing a listed name.
      3. **Only what a cartridge needs is exported.** A new export says which cartridge needs it; an export no sibling
         repository uses is a candidate to become internal — measured across the catalogue first (`CLAUDE.md`: measure
         the catalogue, not the house consumer).

  consequences:
    positive:
      - "A change a game feels is named before it ships"
      - "Fewer breaks that break nobody"
    negative:
      - "A second list to keep beside the TypeScript snapshot"

  confirmation: |
    `tests/superficie-da-pagina.node.test.js` and `tests/exports-sem-consumidor.node.test.js` (issue #164, closed): the listed
    CSS variables, classes and attributes are all still written; a new export without a named consumer is flagged.

more-information: |
  Parnas' question — «what does this module hide?» — is the test for point 3: an export that only exposes an internal
  step hides nothing and costs a promise.
