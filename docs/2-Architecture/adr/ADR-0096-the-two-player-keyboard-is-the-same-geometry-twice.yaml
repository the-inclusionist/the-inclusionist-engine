title: O teclado de dois jogadores é a MESMA geometria duas vezes — e as setas mudam de dono

context-and-problem-statement: |
  O Dev especificou o teclado de dois jogadores nas quatorze posições. Antes de registrar, foi conferido
  contra o que já existe, e o resultado tem duas metades:

  ⚠️ O JOGADOR 1 DELE É EXATAMENTE O `KEYBOARD_SOLO` QUE JÁ ESTAVA REGISTRADO — as quatorze, tecla por tecla.
  Não é decisão nova; é a confirmação de uma que já estava escrita, o que é informação e não redundância.

  ⚠️ O JOGADOR 2 É NOVO, E PREENCHE UMA LACUNA MEDIDA: o esquema `p2` vivo em `input/keyboard.ts` tem OITO
  posições das quatorze — quatro direcionais e quatro ações. Faltavam os dois ombros, os dois gatilhos, o
  `start` e o `select`, para os DOIS jogadores. E as oito que lá estão batem exatamente com as oito
  correspondentes da especificação, o que diz que o Dev está a completar o próprio esquema, não a trocá-lo.

decision-drivers:
- "⚠️ A geometria do jogador 2 é a do jogador 1 TRANSPOSTA para o teclado numérico, e isso é o argumento da
   tabela e não um enfeite: `U I / J K` e `8 9 / 5 6` têm a mesma forma, os ombros ficam na linha DE CIMA nos
   dois (`7 8` · `/ *`) e os gatilhos nas PONTAS da linha das ações (`Y … O` · `7 … +`). O padrão ensina-se
   uma vez e serve aos dois lados da mesa."
- "⚠️ E ISSO ESTENDE A ROTAÇÃO DE 45° que o `default-bindings` já documentava para o Xbox: se `U I / J K`
   pousa no losango do controle girando um oitavo de volta, `8 9 / 5 6` pousa igual."
- "⚠️ O Dev escreveu «alphanumeric» e «numeric» POR EXTENSO, e o esquema só fecha por causa disso:
   `Digit7` é o L1 do jogador 1 e `Numpad7` é o L2 do jogador 2. São teclas distintas em
   `KeyboardEvent.code` e a MESMA em `key` — mais uma razão de este projeto nunca ler `key`."

considered-options:
- "K1 - registrar a tabela como veio, e aferir cada esquema como já se afere qualquer tabela"
- "K2 - registrar e reutilizar o `KEYBOARD_SOLO` para o jogador 1"

pros-and-cons-of-the-options:
  K1:
    good:
    - "É o que o Dev especificou, e o gate cruzado apanha o único ponto onde os dois esquemas podem colidir."
  K2:
    bad:
    - "⚠️ REFUTADA POR UMA TECLA: o `KEYBOARD_SOLO` tem as SETAS como segundo caminho do direcional do jogador
       1, e em dupla as setas são o direcional do jogador 2. Reutilizar a tabela inteira faria os dois bonecos
       andarem juntos — e é um defeito que não produz erro em lado nenhum, passa em `bindingProblems` (cada
       esquema é são SOZINHO) e só aparece jogando a dois."

decision-outcome:
  chosen-option:
    link: "K1 - `KEYBOARD_DUO` em `input/default-bindings`, dois esquemas de quatorze, com um crivo CRUZADO"
    justification: |
      ===== O QUE MUDA DO SOLO PARA A DUPLA É UMA COISA SÓ =====
      As setas saem do jogador 1. Todo o resto do esquema dele é o `KEYBOARD_SOLO`, e um caso do gate afirma
      essa igualdade posição a posição — para que a dupla não vire, com o tempo, um segundo esquema que
      ninguém decidiu.

      ===== O CRIVO CRUZADO É DE OUTRA FAMÍLIA QUE O CRIVO DE DUPLO =====
      `bindingProblems` olha UMA tabela e apanha a mesma tecla em duas ações. `conflitosEntreTabelas` olha
      DUAS e apanha a mesma tecla em dois JOGADORES. O segundo precisou de existir porque o primeiro dá verde
      sobre o defeito das setas: cada esquema é impecável por si.

      ===== O QUE FICOU DE FORA, DITO =====
      `NumpadEnter` NÃO entra no jogador 2. `ui/menu-nav` já o usa como CONFIRMAR em qualquer menu (`KEY_YES`)
      e `input/keydown` registra, verbatim, que ele não pausa. Dar-lhe um terceiro trabalho seria sobrepor
      duas decisões existentes para poupar uma tecla que não falta.

  consequences:
    positive:
    - "As quatorze posições passam a existir para DOIS jogadores, e não oito."
    - "O padrão é ensinável uma vez: a mesma forma de mão dos dois lados da mesa."
    negative:
    - "⚠️ O jogador 2 depende do teclado NUMÉRICO, que muitos portáteis de escola não têm. Isso não é defeito
       desta tabela — é exatamente o que o aviso de alcance da issue #112 existe para dizer ANTES de começar,
       e a régua do ADR-0091 já sabe contá-lo."
    neutral:
    - "O `Space` continua no `action2` do jogador 1 e o `Enter` no `start` dele; nenhum colide com o numérico."
  confirmation: |
    ⚠️ HÁ DUAS TABELAS DE TECLADO NA ÁRVORE, E ESTE REGISTRO NÃO AS UNE: `input/keyboard.ts` tem o esquema
    `p2` VIVO com oito posições, e `input/default-bindings.ts` tem o `KEYBOARD_DUO` novo com quatorze. As
    oito coincidem, o que torna a divergência benigna HOJE e não amanhã. A união é trabalho à parte, com
    issue própria — e fica escrito aqui para não passar por descuido.

    O gate é `tests/default-bindings.node.test.js`, e o caso que importa nasceu vermelho sob mutação
    confirmada: devolver `ArrowUp` ao jogador 1 reprova em TRÊS casos, incluindo o crivo cruzado. O crivo tem
    ainda um caso próprio que lhe passa uma tabela com a seta repetida e exige que ele nomeie os DOIS donos —
    senão ele poderia estar a devolver lista vazia por não olhar.

more-information: |
  ⚠️ ESTE REGISTRO EXISTE PORQUE UMA ESPECIFICAÇÃO NO CHAT É UMA DECISÃO PERDIDA — é a frase que o próprio
  `default-bindings.ts` já carregava no cabeçalho, escrita quando a primeira metade deste padrão chegou. A
  segunda metade chegou hoje e teve o mesmo destino.

  E vale registrar o que a CONFERÊNCIA deu, além do registro: a especificação bateu tecla a tecla com o que
  já estava escrito para o jogador 1, e completou — em vez de contradizer — as oito posições que o
  `keyboard.ts` já tinha para o jogador 2. Da última vez que um padrão destes chegou, a simetria denunciou um
  `I` atribuído duas vezes. Desta vez não havia o que denunciar.
