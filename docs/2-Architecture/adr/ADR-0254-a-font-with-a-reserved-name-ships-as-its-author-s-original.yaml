title: A font with a reserved name ships as its author's original, compressed and nothing else

context-and-problem-statement: |
  The engine packages the latin and latin-ext subsets the Google Fonts service serves. A subset is a Modified Version
  (OFL-FAQ 2.6), and 22 of the packaged families carry their Reserved Font Name as their own name (Lato, Lora, Merriweather,
  OpenDyslexic, Playfair Display, Press Start 2P, Quicksand, Source Sans 3, Source Serif 4, UnifrakturMaguntia, Abril
  Fatface, Alfa Slab One, Bowlby One SC, Cookie, Lilita One, Lobster, Monofett, Petit Formal Script, Plaster, Ranchers,
  Sancreek, Titan One); Ubuntu's licence asks the same of a modified copy. Google Fonts serves them under separate
  agreements with the authors, which do not pass to whoever redistributes the files.

decision-drivers:
  - "Every copy of the engine is a redistribution; what it carries must be in order, not merely unlikely to be noticed"
  - "One font library in the engine, not a copy per cartridge"
  - "The installed size on a school device"

considered-options:
  - "A · Ship each author's original, converted to WOFF2 by compression only, metadata intact"
  - "B · Rename the subsets to names with no word of the reserved one"
  - "C · Ask each author for written permission"
  - "D · Leave the families out"
  - "E · Each cartridge ships the fonts it uses"

pros-and-cons-of-the-options: |
  **A.** ✅ The Original Version keeps its name and its full coverage; WOFF2 compression alone is not modification. ❌ The
  package grows (measured on the originals' sizes: about 3 MB without Merriweather). **B.** ❌ Names nobody recognises for
  the same design. **C.** ❌ Slow, and some authors cannot be reached. **D.** ❌ Loses faces for nothing A cannot keep.
  **E.** ❌ The same font repeated in every cartridge.

decision-outcome:
  chosen-option:
    link: "A — each author's original, compressed only; Merriweather leaves"
    justification: |
      The 21 families that stay, and Ubuntu, ship as the original files their authors distribute (the `google/fonts`
      repository, with its licence), converted to WOFF2 by compression alone with every table and its metadata intact,
      in the weights the engine already offers — a variable original ships whole, since cutting a weight out of it is a
      modification. Their `@font-face` rules lose `unicode-range`: one file covers the family. Merriweather LEAVES the
      package: its original is a 4.5 MB variable font. OpenDyslexic is checked against its author's release and replaced
      only if it is not already the original.

  consequences:
    positive:
      - "Every packaged font is either free of reserved names or its author's original — nothing to rename, nothing to explain"
      - "The families gain their full character coverage"
    negative:
      - "About 3 MB more in every install"
      - "Merriweather is no longer offered"

  confirmation: |
    ✅ The gates in confirmed-by. `font-licences` holds every reserved-name family of the library to its original — a source
    named, no unicode-range — and, where the mirror is on the machine, decompresses each of its files and compares every table,
    written without a transform, to the sha256 of the same table of the author's original (`tests/fixtures/reserved-name-
    originals.json`, measured from the originals; `head` with the checksum WOFF2 recomputes zeroed, `DSIG` out), and
    OpenDyslexic's whole file to its author's; it also holds the notices and licence texts of every family, packaged or in
    the library. `what-fonts-the-package-carries` holds Merriweather nowhere — package, library, kit, dictionaries — and the
    typographic catalogue's `removida` with its reason.

more-information: |
  Downloads — the originals from `github.com/google/fonts` and the `fonttools`/`brotli` tools — authorised by the Dev on
