title: The webcam controls a game by hand gestures, face and eyes — the first mappings

context-and-problem-statement: |
  Issue #182 lists webcam control by gestures, face and eyes, and the study left the first mappings to the Dev. Shown suggestions,
  the Dev, 2026-09-14, gave the mappings to start with, for three transports, and a construction note for the moving gestures
  (track the index tip against the previous frame with a minimum distance; a composed shape-plus-speed gesture from the wrist's
  vertical speed; three fingers from tips above their middle joints; a cool-down after each command; thresholds measured against
  the palm's size, not fixed pixels).

decision-drivers:
  - "D1 — WHAT A CHILD'S BODY CAN DO BECOMES A POSITION, never a key (study recommendation 1)"
  - "D2 — NO GESTURE FIRES TWICE FOR ONE INTENT: a cool-down after every command"

considered-options:
  - "A — the study's suggestions (four static gestures; head and mouth; dwell on menus; blinks left out)"
  - "B — the Dev's mappings below"

pros-and-cons-of-the-options: |
  **A.** ✅ Fewer signals to learn. ❌ Not the mappings the Dev chose.
  **B.** ✅ Up/down and confirm/back/menu reachable from each transport. ❌ Blinks are read (the study had left them out as
  involuntary); no left/right from the hands or the eyes.

decision-outcome:
  chosen-option:
    link: "B — the Dev's mappings"
    justification: |
      1. **Static hand gestures**: closed fist → confirm; open palm → menu; pointing up → up; thumb down → down; thumb up → up;
         victory → back; «I love you» → menu.
      2. **Moving hand gestures** (hand landmarks): index moving up → up; index moving down → down; open hand down quickly → confirm;
         closed hand down quickly → cancel (back); three fingers → menu. Movement is measured from frame to frame against the palm's
         size, past a minimum distance.
      3. **Face and head**: turn the head left and right → left and right; tilt up and down → up and down; open the mouth →
         confirm; smile → menu; raise the brows → back.
      4. **Eyes**: look up → up; look down → down; two quick blinks → confirm; one slow blink → back; two quick blinks while
         looking down → menu.
      5. **Every command is followed by a cool-down** (about 0.5 s) before the same transport can command again.
      6. «Confirm» is the game's confirming position, «back» its going-back position and «menu» the one that opens the menus
         (ADR-0155): each maps to a POSITION, so the game's own words and the child's remapping still rule.

  consequences:
    positive:
      - "A child can move through a game and its menus with a hand, a face or the eyes"
    negative:
      - "Reading blinks can command on an involuntary blink; the slow and double patterns and the cool-down are what guard it"
      - "Two static gestures command «up» and two «menu»; the hands and the eyes have no left and right"

  confirmation: |
    ⚠️ NOT BUILT YET — **issue #189** in `the-inclusionist-engine`. Gates: each mapping recognised from recorded landmarks and
    blendshapes raises its position once, then waits its cool-down; a moving threshold scales with the palm; a single normal blink
    commands nothing; with a camera, measured on the developer's face and hands, each mapping written with its result.

more-information: |
  Measuring with a camera needs the MediaPipe runtime and models the catalogue already names, downloaded with the Dev's
  permission, and the developer's camera. A child's hands and face are not the developer's: the thresholds are a first reading.
