title: There is no Libras mode, there is a deaf mode — sounds get captions, and the sonar calls the interpreter

context-and-problem-statement: |
  ADR-0051 designed Libras in two levels: an interpreter that appears on its own while audio plays, and a first-language
  level where the player taps the Libras icon and then the written thing. Neither was built, and issue #59 left open
  how overlapping messages queue. The Dev reframes the feature by its user: the person is deaf, and what she needs is
  every sound made visible and the screen's content available in her language on demand.

decision-drivers:
  - "Name the mode by the person it serves, not by the tool"
  - "Libras is a language (Lei 10.436/2002); written Portuguese stays beside it (art. 4)"
  - "The sonar already reads what is on screen on demand; one gesture should serve both the blind and the deaf child"

considered-options:
  - "A · ADR-0051 as written: interpreter appears while audio plays, plus tap-icon-then-text"
  - "B · Deaf mode: every sound gets a caption; the sonar, with the interpreter on, has the interpreter sign what is on screen"

pros-and-cons-of-the-options: |
  **A.** ❌ An interpreter that appears on every sound buries the activity; it also needed a queue policy nobody could
  choose well. **B.** ✅ The deaf child asks, with the same button the blind child uses, for what is on screen; sounds are
  never lost because they are captioned. ✅ No queue: the interpreter signs what the screen holds when asked.
  ❌ Libras then depends on the sonar being reachable, which the quick bar and the action map already guarantee.

decision-outcome:
  chosen-option:
    link: "B — a deaf mode: captions for sounds, and the sonar calls the interpreter over the screen's content"
    justification: |
      The Dev's decision. Deaf mode turns on two things together: (1) every interface sound is captioned (the caption
      host exists, ADR-0164 regra 4); (2) the sonar, pressed with text on screen, has the interpreter appear in front of
      the screen and sign that text, where the blind child hears it read. Written Portuguese is never removed (Lei
      10.436 art. 4). This replaces ADR-0051's level one (appear while audio plays) and its tap-icon-then-text gesture;
      ADR-0051's choice of VLibras and the retirement of the zdog engine stand.
      📌 Adequacy, as measured: GAG asks to «provide signing» (Advanced) and this does; WCAG 1.2.6 concerns audio in
      synchronised media, which the engine has none of, and captions cover the audio the engine does have.
      ⚠️ What still blocks the build is not the design: the documented VLibras integration loads a script from
      vlibras.gov.br, a third-party host, against the delivery's own-origin policy and the offline pillar; whether its
      translation runs on the device is undocumented and must be measured before choosing how to ship it.

  consequences:
    positive:
      - "One gesture — the sonar — serves the blind and the deaf child"
      - "No message queue to design"
    negative:
      - "The interpreter depends on a tool whose offline behaviour is unmeasured"

  confirmation: |
    ✅ In part (errata of 2026-09-25): deaf mode captions every interface sound, and the sonar reads the screen's text and,
    in deaf mode, hands it to the interpreter port (`confirmed-by`). 📋 Still owed under issue #59: the Libras player behind
    that port — route A now, route B after it — and the build-time glosses.

more-information: |
  Automatic Portuguese-to-Libras avatars are criticised by deaf organisations as less faithful than a human interpreter;
  this record chooses the tool that exists under a free licence and keeps the written text beside it.
