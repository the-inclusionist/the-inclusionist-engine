title: The UI rules for blind and low-vision players — what every menu and screen the engine draws must do

context-and-problem-statement: |
  Reading the quiz and the settings panels on 2026-09-12, the Dev found, in one sitting: the quiz statement behind the
  quick bar; controls in the footer zone; options that are not read aloud and not numbered; a close button at the end
  of a panel instead of «Voltar» at the start; explanations in parentheses inside labels; and menus a touch-only child
  cannot move through. Each was fixed or recorded separately, and the Dev asked for the root: «Pesquise as guidelines
  para criação de UI para pessoas cegas ou com problemas visuais para criarmos uma ADR para este fim.»

  📌 The rules existed in pieces — ADR-0044 has the ring and the spoken index, ADR-0158 the numbers, `CLAUDE.md` §4 the
  footer — and nothing held them together, so every new panel could miss a different one. This record is the list a
  new menu is built against and tested against.

decision-drivers:
  - "D1 — A BLIND CHILD MUST CONFIGURE, START AND PLAY WITHOUT HELP. XAG 106's scoping test: if a player could not read
     the screen, would they be blocked from configuring, starting or playing?"
  - "D2 — THE EYE AND THE EAR GET THE SAME INFORMATION, in the same order, from the same source"
  - "D3 — ONE RULE, WRITTEN ONCE, CHECKED BY A GATE. A rule that lives in the reviewer's memory is missed by the next panel"

considered-options:
  - "A — keep the rules scattered across the records that introduced them"
  - "B — one record with the UI rules for blind and low-vision players, each with its source and its gate"

pros-and-cons-of-the-options: |
  **A.** ✅ Nothing to write. ❌ Exactly the situation that produced six defects in one reading.
  **B.** ✅ One list for building and reviewing a menu, with sources. ❌ Several rules are not met today, and the list
  makes that debt visible at once.

decision-outcome:
  chosen-option:
    link: "B — the rules below govern every menu, panel and screen the engine draws"
    justification: |
      ===== 1. EVERY ITEM IS NARRATED — name, role, value, position =====
      On focus, an item is spoken as **label, control type, value or state, «N de M»** (XAG 106: «Quality, drop down,
      collapsed, High, 3 of 9»), with the enumeration at the END. The enumeration can be turned off (ADR-0044 item 3).
      The row's explanation is spoken once when the item is first reached, not repeated on every value change.

      ===== 2. NARRATION IS INTERRUPTED BY THE NEXT FOCUS, and can be repeated =====
      Moving focus stops the running string and starts the new one (XAG 106; ADR-0044). The child can ask to hear the
      current item again from any input, the virtual pad included.

      ===== 3. EVERY CHANGE OF CONTEXT IS ANNOUNCED =====
      Opening a menu or panel speaks its title; closing it speaks where the child is back to; entering play is
      announced (XAG 106: without it «a blind player might not know when they're in the active game environment»).
      A context change is started by the child, never by the engine on its own, except loading.

      ===== 4. A QUESTION IS COMPLETE BY EAR =====
      A prompt that asks for a choice speaks the statement and then every option with its number: «1 Gato, 2 Galinha,
      3 Cavalo, 4 Peixe» (ADR-0158).

      ===== 5. THE MENU SHAPE IS THE SAME EVERYWHERE =====
      Linear, one column; «Voltar» is item 1; items are numbered; the list wraps at both ends (XAG 112, ADR-0044
      item 1); no close button after the rows (ADR-0158). The same interaction everywhere: directions move, action 2
      confirms, action 3 goes back — from keyboard, controller AND the virtual pad (ADR-0157; XAG 112: «fully navigable
      by keyboard and controller digital input alone»).

      ===== 6. A LABEL IS SHORT; THE EXPLANATION IS IN THE FOOTER =====
      No parentheses, no sentence inside a label. The explanation goes to the footer (`CLAUDE.md` §4) and to the spoken
      description of rule 1. The three zones stay separate: the quick bar in the header, the menu in the workspace, the
      explanation in the footer — and no game content is drawn over the bar (ADR-0148).

      ===== 7. SMALL CHOICES CYCLE; LARGE ONES DROP DOWN =====
      Five or fewer exclusive positions are one row «◀ Label: value ▶» stepped with left/right, spoken as label and new
      value; more than five, a dropdown (ADR-0130 erratum).

      ===== 8. CONTRAST — the numbers of XAG 102 and WCAG =====
      Standard text and informative elements **4.5:1**; large text and inactive text **3:1**; non-text UI and the
      focus indicator **3:1** (WCAG 1.4.11); the high-contrast levels reach **7:1** (WCAG 1.4.6) — already the quick
      bar's top level. Text over a varying background is measured against its lowest-contrast area, or given an outline
      or a solid backing (XAG 102).

      ===== 9. FOCUS IS ALWAYS VISIBLE AND NEVER HIDDEN =====
      A focus indicator at least **2 px** thick and **3:1** against its surroundings (WCAG 2.4.13); the focused item is
      never covered by the bar, the pad or the footer (WCAG 2.4.11); scrolling brings it into view.

      ===== 10. NOTHING BY COLOUR ALONE =====
      State is also said in words or shape — «Ligado/Desligado», a lock, a mark (WCAG 1.4.1; XAG 103). A disabled item
      carries its reason (ADR-0113 clause 3). Colour-coded game information can use the Okabe-Ito palette (ADR-0151).

      ===== 11. TEXT SIZE AND SCALING =====
      Menu text is never below the engine's floor at the target screen, and text scales to **200%** without loss and
      without scrolling in two directions (XAG 101; WCAG 1.4.4, 1.4.10). Spacing follows WCAG 1.4.12 at minimum and the
      BDA values by default (ADR-0149).

      ===== 12. NO UNICODE PICTURE STANDS IN FOR A LABEL =====
      An emoji or symbol in a menu is decorative and hidden from narration, or it carries a real label: a screen reader
      reads a glyph by its Unicode name, not by what it means in the game (XAG 103).

  consequences:
    positive:
