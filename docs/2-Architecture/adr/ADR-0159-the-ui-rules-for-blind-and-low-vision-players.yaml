         confirming a state"
      - "Rule 11's 200% conflicts with the 640×360 target and ADR-0095's floor; meeting it will need reflow and scrolling
         in one direction, measured, not assumed"

  confirmation: |
    The gates in `confirmed-by`, one per rule (issue #153, closed). What was known on 2026-09-12, before they were built:
      · MET, measured: the ring (rule 5, ADR-0044); the spoken index «N de M» (rule 1, part); the footer for step rows
        (rule 6, `engine:4a877ef`); the quiz statement below the bar (rule 6, `engine:cd3e0c1`); the 7:1 top contrast
        level (rule 8).
      · NOT MET, measured: numbers on items and «Voltar» first (#152); options read aloud (#152); the pad driving menus
        (#151); labels with parentheses (#152).
      · NOT YET MEASURED: role and value in the spoken string (rule 1); repeat narration (rule 2); context-change
        announcements (rule 3); focus indicator thickness and contrast (rule 9); 200% scaling (rule 11); glyphs in menu
        labels (rule 12). These are measured before they are claimed either way.

more-information: |
  📏 The concrete numbers this record adopts come from the sources read, not from memory: XAG 106's narration order and
  «Gamma, slider, 38%, 6 of 9»; XAG 102's 4.5:1, 3:1 and 7:1; XAG 101's text scaling to 200% and spacing 0.12 / 0.16;
  WCAG 2.4.13's 2 px at 3:1. The AFB deep dive adds what blind players report in practice: interruptible speech, hints
  that say which keys to press, on-demand reading of status, and distinct audio cues for objects — rules 1–3 and the
  sonar/earcon categories the engine already has.
