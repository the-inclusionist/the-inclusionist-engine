title: The scanlines stay under the colour-vision modes

context-and-problem-statement: |
  ADR-0047 made the decorative CRT yield to every visual accessibility mode with no exception. Its measured reason was
  luminance: a vignette darkening the edges works against a mode that exists to raise contrast. The colour-vision modes —
  the 🚥 correction for protanopia, deuteranopia and tritanopia, and their simulations — change hues, not contrast or
  sharpness, and the Dev found the scanlines switched off under them for nothing.

decision-drivers:
  - "A decoration yields where it works against the mode, not merely because a mode is on"

considered-options:
  - "A · ADR-0047 as written: the scanline yields to every visual mode"
  - "B · The scanline stays under the colour-vision modes; it yields to every other visual mode, and the vignette to all"

pros-and-cons-of-the-options: |
  **A.** ❌ Takes the look away from a child whose mode does not conflict with it. **B.** ✅ The scanline yields only where
  it costs the child something. ❌ The rule becomes «every visual mode but these», one list to keep true.

decision-outcome:
  chosen-option:
    link: "B — the scanline stays under the colour-vision modes"
    justification: |
      The Dev's decision. Under a colour-vision correction or simulation, and no other visual mode, the scanline is drawn
      as the stored CRT says. The vignette still yields to every visual mode, and the scanline still yields to high
      contrast, low vision, blindness and every other visual mode, as ADR-0047 decided.

  consequences:
    positive:
      - "A child using a colour-vision mode keeps the look"
    negative:
      - "The list of modes the scanline ignores must follow the colour-vision modes that exist"

  confirmation: |
    ✅ The gate in confirmed-by: each colour-vision correction and simulation keeps the scanline and drops the vignette; low
    vision, blindness, the theme and the contrast enhancement drop both; 12 mutations red.

more-information: |
  Scope read from the Dev's words: «modos de daltonismo» covers the correction (`fix-*`) and the simulation of the same
  deficiencies; it does not cover high contrast or low-vision simulations.
