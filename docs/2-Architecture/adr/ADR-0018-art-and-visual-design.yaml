---
metadata:
  shape: bundle          # consolidation of the REGISTRO-DE-DECISOES; see README
  status: "accepted"
  superseded-in-part:
    - by: ADR-0133
      what: >-
        the same clause, now as a RULE rather than as one exception. ADR-0107 lifted «outside art only as
        design reference» for the Liberated Pixel Cup alone; the Dev stated the general form on 2026-09-09:
        art enters by two doors — PROCEDURAL, when the artist grants the right to derive from their work, and
        works under one of FOUR NAMED LICENCES: CC0, CC BY 3.0, CC BY 4.0 and OGA-BY. ND, NC and share-alike
        are refused by name, with no quarantine. ⚠️ And what this old clause had, given up here deliberately,
        is that it could never produce a licensing mistake: nothing was ever taken, so nothing could be taken
        wrongly.
    - by: ADR-0107
      what: "The clause on where outside art may come from — «PixelLab/Magnific only as design reference».
              Written in 2026-07-04, when the only outside art in view was a GENERATOR and the answer was
              «reference, never asset» (the same answer ADR-0042 then gave the City parallax). The Dev
              decided on 2026-09-08 to use the Liberated Pixel Cup as ASSETS, which that sentence does not
              contemplate — an existing, licensed, purpose-built set is not a generator, and treating it as
              reference-only would throw away the labour that is the reason to reach for it.
              ⚠️ Everything else here stands, and one part of it stands HARDER: «art = procedural data/code»
              is what makes the quarantine of ADR-0107 §3 enforceable, because a semantic image has a
              provenance a PNG does not."
  date: 2026-07-04
  decision-makers: [Dev, AI]
  consulted: []
  informed: []

title: Art & visual-design decisions (art=data, flat colours, juice, CRT, CB-safe)

context-and-problem-statement: |
  The art/visual-design decisions. Was REGISTRO §8. Visual system in ../../game-design/Art-Bible.md; juice/feel in
  ../../game-design/Game-Feel.md.

decision-outcome:
  justification: |
    Art is data/code (procedural, GPL-clean); every juice/post-processing effect is toggleable so it can be turned off
    on weak hardware and for reduced-motion.

more-information: |
  Decisions (was REGISTRO §8):
  - "**Art = procedural data/code** (PixelLab/Magnific only as design reference); pixel-art PNG now → procedural
    later. [game-design/plan-procedural-art, research/LICENSES-IMAGE-GENERATION]"
  - "**Flat colours, no outline/shadow/light on characters** (ADHD hypothesis); 320×180 / 16px kept (48×48 cancelled
    — \"too rich a resolution can be a problem for ADHD\"). ⚠️ noted as a hypothesis to validate (no formal study
    cited)."
  - "**Juice** (dust/glow/squash/hit-stop/screenshake/shimmer/camera-easing) — **each toggleable in ?debug** + a
    low-performance profile that disables all. [commit 5e18fc0] Juice × reduced-motion mapped 1:1 to existing RM
    keys; hit-stop is a pause, not motion (out of RM)."
  - "**CRT post-processing** (scanlines/vignette/24px corners) as CSS classes on #game-region, **default OFF**;
    z-index above the game, below pause/dialogs (menus keep legibility); prefers-reduced-transparency disables it.
    [cf07b5a]"
  - "**Contrast enhancement Linear→Quadratic slider** (0=off; start=linear stretch; end=quadratic S-curve), GPU via
    feComponentTransfer sRGB, global. [RESEARCH-HIGH-CONTRAST, commit 78995de]"
  - "**CB-safe palette (optional) = Okabe & Ito 2008**, applied ONLY to players/items/effects — scenery keeps natural
    colours. **Colour-blocking customizable**: 4 roles (hazard/climbable/water/gate) with a picker + restore-default.
    Items in owner colour = an OPTION (default on); off keeps owner-dimming in MP. [commit 51df79c]"
  - "**4 scene layers** (tileset+game / 3 parallax) — cheap depth via TilingSprite."
