title: Three wires the engine built and never connected — and a disconnected wire is worse than a missing one

context-and-problem-statement: |
  `boot/create-game.ts` is the engine's boot sequence, written so a consumer cannot get the order wrong. Three
  things it set up were never switched on, and a game booted through it inherited all three.

  · `MenuNavApi.attach()` existed and was never called. In a game booted through the engine, the accessibility
    dialogs and the pause menu answered THE MOUSE ONLY — pillar 2 failing whole. `consumer-quiz` had to call it
    by hand after `createGame`, which is the symptom rather than the fix.
  · There was no focus trap ANYWHERE in the engine — not "createGame does not install one". With an overlay
    open, Tab walked into the board underneath.
  · `core/loop.aoFalhar` was declared, called on a throwing frame, and passed by nobody. `main.ts` called
    `startLoop` with TWO arguments.

  ⚠️ THE PATTERN IS THE FINDING, AND IT IS WORTH MORE THAN THE THREE FIXES. All three are things the engine
  BUILDS and leaves unconnected, so nothing is missing at a glance: the object HAS a `nav`, the loop HAS an
  `aoFalhar` field, and both look ready. ABSENCE WOULD HAVE BEEN VISIBLE. A disconnected wire is not.

  ⚠️ AND ONE OF THEM WAS A PROMISE THE KEYBOARD DENIED. Every `.overlay__card` in `index.html` carries
  `aria-modal="true"`, telling assistive technology the rest of the page is inert. That is worse than saying
  nothing: a screen-reader user leaves the dialog for a game whose state they cannot perceive.

decision-drivers:
- "⚠️ Measured: `main.ts` does NOT go through `createGame`. It assembles the engine by hand and it is what
   calls `startLoop`. A fix living only in the engine's composition root would miss the game that exists."
- "A frozen screen is a VISUAL symptom. In blind mode a stopped game and a thinking game are the same silence."
- "The browser already gets tab order right — a trap that reimplements it can only get it more wrong."

considered-options:
- "T1 - connect all three inside `createGame`"
- "T2 - connect what the engine owns, and EXTRACT what a hand-built root also needs into modules both import"
- "T3 - leave the loose ends and document them, since each consumer can wire its own"

pros-and-cons-of-the-options:
  T1:
    good:
    - "One place, and the boot order stays the engine's promise."
    bad:
    - "⚠️ REFUTED BY MEASUREMENT: the platformer does not call `createGame`. It would fix the quiz and the
       15-puzzle and leave the only shipping game exactly as broken."
  T2:
    good:
    - "Both roots get the same behaviour from the same code, so the two cannot drift — and drift here is
       invisible, because two error messages never appear at the same time to be compared."
    bad:
    - "Two more modules in `ui/`, and the engine's root no longer looks like the single place things happen."
  T3:
    bad:
    - "It is the state that produced the defect. Each consumer wiring its own means each consumer FORGETTING
       its own, and the forgetting is silent by construction."

decision-outcome:
  chosen-option:
    link: "T2 - connected where the engine owns it, extracted where a second root needs it"
    justification: |
      ===== 1. `nav.attach()` — CONNECTED IN `createGame` =====
      Safe before the game finishes booting: with no dialog open and no pause menu, `menuNavKey` consumes no
      key and lets it through. `consumer-quiz`'s hand call is deleted — a second consumer should not carry the
      first one's correction.

      ===== 2. THE FOCUS TRAP — A NEW MODULE, AND IT ONLY TOUCHES THE EDGES =====
      `ui/focus-trap.ts`. The rule is ONE PURE FUNCTION, gated with no DOM; only "who is focused" and
      "call .focus()" need a browser.

      ⚠️ IT INTERVENES ONLY AT THE ENDS OF THE RING, and that is a decision. Reimplementing the whole tab
      order means reproducing rules the browser already gets right — positive `tabindex`, DOM order, what
      `contenteditable` makes focusable. A trap that walks the middle can get the middle wrong; one that only
      closes the ring cannot, because it never touches it.

      ⚠️ AND THE CASE THAT JUSTIFIES IT is neither end: focus ALREADY OUTSIDE the dialog is pulled back in.
      Without it the trap serves only whoever was already inside — that is, whoever did not need it.

      ===== 3. `aoFalhar` — DELIVERED, NOT INSTALLED =====
      `ui/loop-crash.criarAvisoDeQueda`, imported by both roots; `createGame` returns it as `Engine.aoFalhar`.
      It is delivered rather than installed because WHO CALLS `startLoop` IS THE GAME — it owns the ticker. A
      game that assembles the loop without it still STOPS; stopping is not optional, saying so is what it
      loses.

      Three channels in a deliberate order: console FIRST (a broken DOM is a plausible reason the frame threw,
      and whoever debugs cannot lose the error), then the screen reader, then the visible banner. Each isolated
      from the next — a throwing narrator cannot swallow the written warning.

      ⚠️ IT DOES NOT USE `core/a11y-sr.srAlert`, which is a choice. That helper clears, waits for a
      `requestAnimationFrame` and then writes — a dance that exists to make a screen reader RE-announce
      REPEATED text. A crash is announced once and never repeats, so it buys nothing here, and it makes the
      warning depend on a future frame at the moment frames stopped. It also reads the GLOBAL document, losing
      the warning for anyone handed one by injection.

      ⚠️ THE VISIBLE TEXT LIVES IN AN ATTRIBUTE (`data-incl-parou`), shown by `content: attr(...)`. That is
      what keeps the sentence TRANSLATED — a warning hardcoded in CSS would be in English for a Brazilian
      child. Its colours are raw rather than theme tokens, also deliberately: this banner appears when
      something broke, and the theme machinery is a plausible candidate.

      ===== 4. WHY NO `Declinios` FLAG FOR ANY OF THE THREE =====
      Issue #109's fourth item asks that declining be explicit. It is answered by SHAPE instead: each of the
      three is INERT when the game has nothing for it — the trap does nothing with no overlay open, the nav
      consumes no key with no dialog, and the crash notice writes nowhere when the markup is absent. A flag
      would add a way to say what the code already cannot get wrong.

  consequences:
    positive:
    - "A game booted through the engine gets keyboard-operable dialogs, a modal that is modal, and a loop that
       says when it died — without asking for any of the three."
    - "`consumer-quiz` stops carrying a workaround for an engine gap."
    negative:
    - "⚠️ The focus trap is installed by both roots and, in a page that mounts the engine twice, both would
       trap. `detach()` exists for exactly that and nobody calls it yet — `demos` switches games without
       reloading, and that is where it will matter."
    neutral:
    - "The trap deliberately does not manage the INITIAL focus when a dialog opens; each panel's own open/close
       already does that, and `ui/settings-panel` explains at length why those stayed separate."
  confirmation: |
    `tests/focus-trap.node.test.js` (the rule, no DOM), `tests/focus-trap.browser.test.js` (the wiring, real
    focus), `tests/loop-crash.node.test.js` and two cases in `tests/boot-create-game.node.test.js`.

    Sixteen confirmed mutations across the three wires. The ones worth naming: the ring not closing in either
    direction, trapping with no dialog open, installing on the bubble phase, the selector catching
    `tabindex="-1"` again, a throwing narrator swallowing the written warning, and the root going back to a
    two-argument `startLoop`.

    ⚠️ TWO OF THOSE GATES ONLY EXIST BECAUSE SOMETHING SURVIVED FIRST.

    · The engine-side trap assertion counted capture-phase keydown listeners — and the menu navigation already
      installed one, so removing the whole trap left the count intact and the test GREEN. Counting listeners
      answers "somebody registered", not "the trap exists". It dispatches a Tab now and asserts the focus.
    · `domFalso`'s `win.addEventListener` was a no-op that recorded nothing. A double that swallows the call
      cannot answer "did this get CONNECTED?", which is this issue's whole question. That is the fourth time
      this file's double has answered a question it could not see.

    ⚠️ AND ONE JUSTIFICATION OF MINE WAS REFUTED BY ITS OWN TEST: I wrote that `offsetParent` is `null` for
    any element in `position: fixed`. It is null for the FIXED element; its descendants return that container.
    The assertion went red and the explanation was what was wrong. Kept in writing rather than quietly fixed.

    ⚠️ WHAT NO GATE CONFIRMS: that the crash banner is legible on a school Chromebook, and that a child using
    a screen reader actually recovers from the announcement. Both are screen measurements.

more-information: |
  This closes issue #109 and finding §6 of ADR-0080. It also completes ADR-0054, whose `confirmation` clause
  said in its own words that the record was "only half true" until a composition root wired `aoFalhar`.

  ⚠️ ONE THING DELIBERATELY LEFT UNDONE: nobody calls `detach()`. It exists because a test proved a trap that
  cannot be uninstalled keeps trapping — and the same is true of a page that mounts the engine twice. Wiring a
  teardown is the `demos` shell's question, not this one's.
