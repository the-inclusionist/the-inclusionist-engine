metadata:
  status: "accepted"
  errata:
    - date: 2026-08-28
      what: "§5 dizia `a barra de dez segmentos`, no SINGULAR, e chamava-a `the child's window onto §5 of
             ADR-0048` — mas o ADR-0048 §3, escrito no MESMO DIA, já decidia `ONE TO THREE SKILLS`. Uma barra
             não pode ser a janela para três árvores de skill: mediria a média de duas crianças diferentes.
             O registro nasceu incoerente com uma decisão do mesmo dia, e a frase de 28/08 do Dev (`podem haver
             uma barra no centro, duas ou três, sempre uma barra por skill`) não mudou nada — disse o que já
             estava decidido. ERRATA e não supersessão, pelo ADR-0057 §1: uma frase que não carregou uma
             propriedade que a decisão já tinha. Aplicada no corpo em 2026-08-28; DECLARADA aqui em 2026-09-04."
    - date: 2026-09-04
      what: "§6b (a placa de proibido) e §7 (a décima moeda) foram EXTRAÍDAS para os ADR-0061 e ADR-0062. Nenhuma
             das duas é sobre recompensa; foram escritas aqui em 2026-08-28 porque este registro estava aberto.
             Tirá-las não sobrescreve história: o hospedeiro nunca as decidiu, estavam mal arquivadas, e
             desarquivar restaura o que ele de fato decidiu (ADR-0057 §1b)."
    - date: 2026-08-28
      what: "§1 said `one point per correct QUESTION`, which is NARROWER than what was decided: a point has two
             sources of equal worth — an academic answer AND a good deed in the world (sorting a recyclable,
             returning something lost, putting out a fire). The clause never said what the decision was, so
             correcting it restores the record. Applied in the body on 2026-08-28; DECLARED here on 2026-09-04,
             under ADR-0057."
  superseded-in-part:
    - by: ADR-0059
      what: "§5b, the ADDRESSES only — where the point count, the bars and the coin counter sit on screen.
              Everything §5b says about what a segment MEANS (the colours, that only an academic question
              paints one, that an erro is the third wrong attempt) is decided HERE and is not touched."
  date: 2026-08-27
  decision-makers: [Dev]
  consulted:
    - "ADR-0006 (ethical engagement: no dark patterns, no session-prolonging mechanics)"
    - "ADR-0010 (pillar 2 a11y-first; pillar 6 child-privacy)"
    - "ADR-0048 (the journey; §7 scoring and §5 the bands)"
    - "requerimento §49.a and §49.g — the named forbidden mechanics, with their legal basis"
    - "CLARK, L.; ZACK, M. Engineered highs: reward variability and frequency as potential prerequisites of
       behavioural addiction. Addictive Behaviors, v. 140, 107626, 2023. DOI 10.1016/j.addbeh.2023.107626 —
       https://pubmed.ncbi.nlm.nih.gov/36701907/  ⚠️ é REVISÃO, e é ela que reporta o achado de neuroimagem;
       o estudo primário não foi lido por mim, e a afirmação no requerimento é atribuída à revisão"
    - "Marx, Hacker, Yu, Cortese & Sonuga-Barke (2021), meta-analysis of delay aversion in ADHD — https://journals.sagepub.com/doi/abs/10.1177/1087054718772138"
    - "Reward feedback in serious games for children with attention deficits, JMIR Serious Games 2025 — https://games.jmir.org/2025/1/e67338/"
    - "Overjustification effect — https://en.wikipedia.org/wiki/Overjustification_effect"
    - "Do Immediate External Rewards Really Enhance Intrinsic Motivation? — https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9150741/"
  informed: []

title: Every reward is DETERMINISTIC, points are a work record that buys nothing, and the only celebration is the child's own growth

context-and-problem-statement: |
  The requerimento commits the Município to something specific and verifiable, and §49.g names the mechanics rather
  than gesturing at them — "nomear as mecânicas transforma um princípio em especificação técnica verificável, e
  permite que qualquer pessoa audite o código para conferir". Six are disabled by default and FORBIDDEN in child
  accounts: infinite scroll, autoplay, pull-to-refresh, **reward cycles**, consecutive-access streaks, and
  **competitive gamification between students**.

  Read against ADR-0048 as it stood, two of those six were a problem:

    · the core loop was item → minigame → three wins → power, which is a reward cycle;
    · scoring carried a Guitar-Hero streak multiplier (×2 at five in a row, ×3 at ten, ×4 at fifteen).

  The Dev removed the multiplier in one sentence — "prática predatória sim para manter a criança jogando e se
  estressar se sair do streak. Jogo educativo definitivamente não pode ter isso" — and redesigned the rest.

decision-drivers:
  - "A named mechanic can be audited; a general clause cannot. This record exists so someone outside the project can
     check the code against it."
  - "A reward that varies is the mechanism of dependency, not a matter of degree. Removing variability is the whole
     intervention."
  - "Whatever is celebrated is what the child learns to want. If the biggest moment in the game is a prize, the
     prize is the subject."
  - "Nothing may punish slowness. A score that pays more for harder questions ranks the class by ability and calls
     it work."

considered-options:
  - "R1 — keep a conventional game economy (variable rewards, streaks, unlockables), which is what engages best"
  - "R2 — remove variability only, keeping accumulation and prizes"
  - "R3 — three kinds of reward, all deterministic: points as a work record that buys nothing, powers as structural
     keys, and celebration reserved for demonstrated growth"

pros-and-cons-of-the-options:
  R1:
    good: ["It is what the evidence says works best for engagement, including in serious games — see the
            confirmation section, where this is measured and not assumed."]
    bad: ["It is exactly what §49.g forbids and what the Lei 15.211/2025 art. 17 §4 II targets.",
          "It teaches, before any content, that the screen is irresistible — the requerimento's own argument."]
  R2:
    good: ["Cheap: one property of the reward changes and the rest of the design stands."]
    bad: ["Accumulation toward a prize is still a reason to keep playing that has nothing to do with learning.",
          "It leaves the celebration on the prize, which is the part that decides what the child values."]
  R3:
    good: ["Each of the three has a different job, so none of them has to carry engagement.",
           "The only thing celebrated is something the child actually did, which is the one reward that cannot be
            farmed.",
           "It is auditable clause by clause."]
    bad: ["It gives up a measured engagement advantage — stated in the confirmation, not hidden.",
          "It asks the pedagogy to carry motivation that the game economy usually carries. If the activities are
           dull, nothing here rescues them."]

decision-outcome:
  chosen-option:
    link: "R3 — three deterministic rewards, and the celebration belongs to growth"
    justification: |
      ===== 1. POINTS — A RECORD OF BEHAVIOUR, AND THEY MOVE NOTHING =====
      ⚠️ CORRECTED 2026-08-28, because the first version of this clause said "one point per correct QUESTION" and
      that is narrower than the decision. The Dev: "é um número que registra comportamento: aumenta quando o
      jogador faz atividade, aumenta quando faz uma boa ação (cuidar do ambiente), encontrar itens perdidos de
      pessoas e devolvê-los (social), apagar incêndio etc."

      SO A POINT HAS TWO SOURCES, worth the same:
        · an ACADEMIC question answered correctly;
        · a GOOD DEED in the world — sorting a recyclable into the right bin, returning something someone lost,
          putting out a fire.

      ONE POINT EACH, regardless of difficulty and regardless of which source. Nothing is bought with them and
      nothing is unlocked by them. No animation when the counter rises. They reset at the end of the day; the
      day's total is kept, and the adult (and the student from 13) can see it.

      ⚠️ AND THE DECISIVE PROPERTY IS THAT **POINTS CHANGE NOTHING**. They do not paint the bar, they do not move
      a level, they do not feed the adaptation. They are a number that says the person worked — which is why a
      good deed can carry one without any of the consequences an academic answer carries.

      ⚠️ THE FLAT POINT IS THE ACCESSIBILITY DECISION HIDDEN IN THE SCORING. An earlier version paid by difficulty.
      The Dev corrected it so "os alunos com mais dificuldade consigam tirar tantos pontos quanto os alunos com
      menos dificuldade". A difficulty-weighted score is a class ranking wearing the costume of a work log.

      ⚠️ AND WHY GOOD DEEDS PAY AT ALL, since nothing else in this record rewards anything the child was not asked
      to do: because what a game counts is what it teaches a child to value. A counter that rises for putting a can
      in the right bin says that caring for the place is work, in the same currency as answering a question. It
      costs nothing to the pedagogy precisely BECAUSE points move nothing — the reward is the record itself.

      ===== 2. POWERS — KEYS, NOT PRIZES =====
      Super-powers stop being something the minigames award and become part of the LEVEL: they lie in the world,
      in the right place, and they open what was unreachable. Flight reaches a ledge in the platformer; super
      strength pushes rocks in the top-down; green breaks green robots in the shooter, green blocks in the breaker.

      They are deterministic, they are found and not rolled, and they are earned by GAME skill — never by academic
      performance. **And accessibility features may make them easier with no penalty whatsoever**, which is the
      clause that keeps a motor or executive difficulty from blocking the school content behind it.

      ===== 3. CELEBRATION — ONLY FOR GROWTH, AND NOTHING MAY OUTSHINE IT =====
      Two moments, both quiet, both about the child's own curve:

        · **MASTERY.** When she leaves the zone upward, a simple animation of her growth graph:
          "Parabéns! Você dominou o conceito ⟨nome⟩!"
        · **SELF-SURPASSING.** When the day's points beat the last two days, a simple bar chart of the last five:
          "Parabéns! Você se superou e trabalhou mais que nos últimos dias!"

      THE RULE THAT ORDERS THEM: "Nenhuma recompensa pode ser superior à percepção de crescimento pessoal." That is
      a design constraint with teeth — it decides which animation is the biggest thing on screen.

      ===== 4. FORBIDDEN, NAMED =====
      No extravagant reward: no flashing lights, no intense festive sounds, no mystery chests, no casino
      animations. No variable rewards, no loot boxes, no random chests. **Every reward is subtle and
      deterministic.** And, from §49.g, also forbidden in child accounts: infinite scroll, autoplay,
      pull-to-refresh, consecutive-access streaks, and competitive gamification between students — the last of
      which ADR-0048 already satisfies, since there is no ranking and the end screen is collective.

      ===== 5. THE TEN-SEGMENT BAR — ACADEMIC ONLY, ONE PER SKILL, AND PERMANENT =====
      Centred at the BOTTOM of the screen, it is the child's window onto §5 of ADR-0048 and the only always-visible
      feedback.

      ⚠️ COMPLETED 2026-08-28 with the three properties the first version left out, and each one changes what has to
      be built. The Dev: "Ela é permanente, não muda de atividade para atividade, e podem haver uma barra no centro,
      duas ou três, sempre uma barra por skill que o professor/pai/profissional da saúde decidiu aplicar. […] Repare
      que é uma barra por skill porque cada uma controla o progresso em uma árvore de skill diferente."

        · **ONE BAR PER SKILL, one to three of them**, side by side and centred at the bottom. The count is not a
          layout preference: it is however many skills the adult enabled in screen 1 (ADR-0048 §3, §6b). Two bars
          means two skill trees are being worked at once, and each advances on its own.
        · **PERMANENT.** It does not change from activity to activity and it does not reset when one ends. The
          activity is the vehicle; the bar is the reading of the child in a SKILL TREE, and a tree outlives any
          single activity — this is what makes the bar the child's progress and not the round's scoreboard.
        · **THE BAR THE SEGMENT LANDS ON IS THE ONE OF THE SKILL THE QUESTION EXERCISED.** A question belongs to a
          tree; its segment paints that tree's bar and no other. Without this clause, two enabled skills would share
          one history and the ZPD bands of §5 would be measuring an average of two different children.

      ⚠️ AND THE UPPER BOUND OF THREE IS THE ACCESSIBILITY CLAUSE, not an arbitrary cap: three ten-segment bars are
      thirty always-lit elements at the bottom of a 320×180 screen. A fourth stops being a reading and becomes
      visual noise for exactly the child this project is for. If a fourth skill is ever wanted at once, the decision
      to revisit is this one.

      ===== 5b. WHERE EACH NUMBER LIVES ON THE SCREEN =====
      Settled 2026-08-28, and it is spatial rather than aesthetic — a child who cannot hold two places in her head
      needs each number to be always in the SAME place:

        · **TOP LEFT, UNDER THE PLAYER'S NAME: the point count** (§1 — the work record, both sources, buys nothing).
          Under the name because it belongs to the PERSON, not to the round.
        · **BOTTOM CENTRE: the segmented bars** (§5 — one per skill), because they belong to the LEARNING.
        · The platformer's own objective counter (the ten coins, §7) stays where the HUD counter already is; it is
          the round's counter, and it is the one number that resets.

      In multiplayer this repeats INSIDE each `.player-screen` (ADR-0027's grid), because each child has her own
      name, her own points and her own skills.

      ⚠️ ONLY AN ACADEMIC QUESTION PAINTS A SEGMENT. A good deed gives a point and paints nothing, because the bar
      is not a record of work — it is the reading of where the child stands in a skill, and a can in the right bin
      says nothing about that skill. Confusing the two would let a child who is good at the platforming raise her
      academic level without answering anything, which is the failure this clause exists to prevent.

        · BLUE  — right on the first attempt (no support)
        · GREEN — right on a later attempt (with mediation)
        · RED   — failed: the third attempt was also wrong. The first two wrong attempts paint nothing.
        · It scrolls: the oldest leaves as the newest enters, endlessly.
        · **ALL ORANGE** — four reds in a row, or five scattered: the level drops.
        · **ALL PURPLE** — eight blues: the level rises, and the count resets.

      ✅ ONE SEGMENT IS ONE QUESTION, AND "ERRO" HAS A DEFINITION. Settled by the Dev, and his wording is the
      clarification: **two wrong attempts are not an "erro"** — they are the tolerance. A segment turns RED only
      after the THIRD wrong attempt, which is the point at which the question counts as failed.
      That is what makes every number in ADR-0048 §5 line up: eight blues is 8/10 first-try; four reds in a row is
      the 2,56% event (four failed QUESTIONS, each after three attempts); five scattered reds sits inside the
      0–6/10 band. Had a segment been painted per attempt, one hard question would have shown three reds and
      demoted a child who was merely thinking.

      Those thresholds are the five-alternative case. Other question types keep the SAME two cuts, restated in
      their own arithmetic: below the guessing floor the level drops, above 80% first-try it rises.

      ===== 6. AFTER THE THIRD ERROR: AN EXPLANATION, NOT THE ANSWER =====
      Corrects ADR-0048's first version, which said the answer is told. It is not, not yet:

        · Three attempts. After the third error the child receives an EXPLANATION so she can get there — worth no
          points, because the segment is already red.
        · Three more attempts on that explanation, also worth nothing.
        · Only if those three also fail does the answer appear for her to COPY — and the level drops immediately,
          without waiting for four failed questions (the bar goes orange at once).

      ⚠️ WHY THE ANSWER IS GIVEN AT ALL, and this is the line that separates it from the practice §49.e condemns
      ("uma ferramenta que entrega a resposta produz a aparência de aprendizagem e a ausência dela"): six failed
      attempts with an explanation in the middle is not a child thinking, it is a child clicking at random. The
      answer arrives when there is **no learning left to protect** — after the attempt, never in place of it. The
      requerimento's §49.e gains the same distinction, because as written it does not carry it.

      ===== 6b e 7 — EXTRAÍDAS (2026-09-04) =====
      Duas cláusulas decididas em 2026-08-28 foram escritas aqui porque este registro estava aberto naquele dia,
      e nenhuma das duas é sobre RECOMPENSA. Saíram para registros próprios, na forma do ADR-0057 §1b — um
      registro aceito não cresce, e cláusula sobre coisa que o hospedeiro nunca decidiu estava MAL ARQUIVADA.

        · **§6b, a placa de PROIBIDO JOGAR LIXO** → **ADR-0061**. Uma placa que impede uma criança de andar
          adiante não é recompensa. O que fica aqui, e é do §1, é a razão de a placa nunca PUNIR: "a criança não
          pode escolher ter um comportamento ruim, visto que a perda de pontos ainda é vista como recompensa
          para crianças que estão procurando fazer uma má ação".

        · **§7, o que a décima moeda faz** → **ADR-0062**. É o ciclo de vida da RODADA, e o próprio cabeçalho
          anunciava a mistura com um "and": "CLOSE A LAP, AND A LAP COSTS NOTHING". ⚠️ E a metade que PARECIA
          recompensa não decidia nada: "a volta não custa nada" DECORRE do §1 (os pontos zeram no fim do DIA,
          não da volta) e do §5 (só questão acadêmica pinta segmento). Cláusula que deriva não é cláusula que
          decide, e por isso nada precisou ficar para trás.

  consequences:
    positive:
      - "Every one of the six named mechanics is answered by a clause someone can check against the code."
      - "The flat point makes the score usable by a child who works slowly, which is most of the intended audience."
      - "Powers moving into the level means accessibility can ease them without touching anything academic."
    negative:
      - "A measured engagement cost — see the confirmation. This design deliberately gives up the schedule that
         performs best, and it will not be free."
      - "Motivation now rests on the activities themselves. If they are boring, nothing in the reward system hides
         it, which is a feature at design time and a risk at delivery time."
      - "Two celebration animations and UP TO THREE ten-segment bars are new UI on a 320×180 screen that is already
         full — and in four-player split-screen that is four times over, which is the layout case §5 has to survive."
      - "A permanent bar needs somewhere to persist that is not the round (ADR-0038), and today nothing in the
         engine outlives a round except PAGE settings. The bar's home is undecided and this record does not decide
         it; what it decides is that the round is the wrong place."
    neutral:
      - "Points resetting daily means there is no long-term accumulation to display, which removes a whole class of
         screens nobody now has to design."

  confirmation: |
    ⚠️ THE LITERATURE CHECK THE DEV ASKED FOR, AND IT DOES NOT CONFIRM EVERYTHING. Reporting only the supporting half
    would be the same failure this project keeps correcting elsewhere.

    WHAT THE EVIDENCE SUPPORTS:
      · REMOVING VARIABILITY IS THE RIGHT LEVER. Striatal dopamine release is observed for reward delivered on a
        VARIABLE-ratio schedule and NOT detected for the equivalent sum on a FIXED-ratio schedule; behaviour
        reinforced on variable schedules resists extinction even when it has become harmful. The "casino effect" is
        variability, so a deterministic reward is not a milder version of the same thing — it is a different thing.
      · THE ADHD DELAY ARGUMENT HOLDS. Delay aversion in ADHD is established by meta-analysis (Marx et al., 2021):
        children with ADHD choose small immediate over large delayed rewards more often than controls. The Dev's
        "o progresso escolar para o TDAH não pode demorar muito para aparecer" is supported, and it is the argument
        for the ten-segment bar being always visible.
      · IMMEDIACY AND VISIBILITY MATTER for children with ADHD, which is what a per-question segment delivers and a
        weekly report does not.
      · POINTS THAT BUY NOTHING ARE THE SAFER FORM. The overjustification literature finds that expected external
        incentives can crowd out pre-existing intrinsic interest. A counter that purchases nothing is closer to
        feedback than to payment.

    WHAT THE EVIDENCE DOES NOT SUPPORT, AND IT IS THE COST OF THIS DECISION:
      · **VARIABLE-RATIO PERFORMS BETTER IN SERIOUS GAMES.** A comparison of reward schedules in serious games
        reports the variable-ratio schedule outperforming the fixed-ratio one on the outcome measures. So this
        record is not choosing the better-performing design; it is choosing the safer one, and paying for it. That
        trade is the decision. Anyone who later measures worse engagement here has found the expected result, not
        a defect.
      · "DOPAMINA SAUDÁVEL DE CONCLUSÃO DE TAREFA" IS NOT A CLAIM TO MAKE. The defensible statements are about
        PREDICTABILITY and DELAY, which the studies address; the neurochemistry of a "healthy" release is not
        something this evidence establishes, and the requerimento should not assert it.
      · THE OVERJUSTIFICATION STORY IS NOT ONE-DIRECTIONAL EITHER: immediate rewards delivered right after task
        completion have been found to RAISE intrinsic motivation compared with delayed ones. So "extrinsic is bad"
        is too flat. What survives is narrower and still supports the design: unpredictable and delayed is the bad
        combination; immediate and predictable is not.

    WHAT WILL BE GATED once built: the flat point (same history, same score, at every difficulty); the score
    unaffected by any accessibility setting or simulation, in both directions; the bar's per-question colouring;
    and the absence of any random element in a reward, asserted over the reward code rather than promised here.

    ⚠️ AND WHAT NO TEST OF MINE CAN CONFIRM: whether a child keeps playing without the schedule that the evidence
    says engages best. Issue #7 is where that is answered, and it is the question this record is most likely to be
    wrong about.

more-information: |
  The requerimento gains three things from this record: the §49.g clarification that a DETERMINISTIC skill reward is
  not the "ciclo de recompensa" the norm targets (or, failing that, this design has to change); the §49.e
  distinction between delivering the answer INSTEAD OF the reasoning and revealing it AFTER the attempt; and the
  removal of any "healthy dopamine" phrasing in favour of predictability and delay.

  Deliberately NOT decided here: what the powers do in each genre beyond the examples; how the growth graph is
  drawn; and whether points ever unlock the story the Dev described in one sentence and withdrew in another
  (ADR-0048 §7 records the conflict).
