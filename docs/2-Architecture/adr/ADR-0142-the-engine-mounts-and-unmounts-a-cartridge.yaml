       contract (`core/contract.d.ts:219`), so nothing here changes the contract. What is frozen is the
       pause-icons CONTEXT, which is an engine defect and an issue, not a clause of this record"
    - "ADR-0141 — the game side of ADR-0080 §2's RNG rule. Same family of defect, opposite direction: there a
       cartridge reaches shared state, here the engine holds it"
