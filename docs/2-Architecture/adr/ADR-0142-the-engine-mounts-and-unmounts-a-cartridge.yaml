       loud that `engine.problems` and `engine.alcance` are not to be trusted in platform mode meanwhile"
    - "ADR-0038 — THE BOUNDARY WAS ALREADY NAMED. State is cut PAGE / RUN / GAME, and a cartridge swap is
       exactly the RUN-to-GAME cut. This record does not invent a lifetime; it says which of the three each
       eager read belongs to"
    - "ADR-0080 — the engine holds nothing per game, and its test is «would a second game want a different
       value here?». §5 below shows why a mount pointer passes that test rather than breaking it"
    - "ADR-0084 — a value read once where a function was meant, going stale in silence. The same defect, at
