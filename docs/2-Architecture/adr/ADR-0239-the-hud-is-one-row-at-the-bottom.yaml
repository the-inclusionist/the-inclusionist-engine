title: The HUD is one row at the bottom — learning bars, clock, score and power, and the game's map

context-and-problem-statement: |
  The HUD was split between the top corners (points and mission on the left, clock and power on the right, ADR-0175) and
  the footer (the learning bars, ADR-0168). The Dev reorganised it into one row along the bottom of the game region, with
  Super Mario World's clock and score as the visual reference: a label over the digits, the digits bold, legible at a glance.

decision-drivers:
  - "The Dev's layout, position by position"
  - "The top belongs to the quick accessibility bar (ADR-0148); the HUD no longer shares it"

considered-options:
  - "A · Keep ADR-0175's two top columns and ADR-0168's footer bars"
  - "B · One bottom row, as the Dev laid it out"

pros-and-cons-of-the-options: |
  **A.** ❌ Not what the Dev chose. **B.** ✅ The top of the game region is the bar's and the game's; every number the child
  tracks sits on one line. ❌ The bottom is also the footer's (captions, button legend, explanation) and, in games that ask
  for it, the on-screen pad's; the rules below settle who sits over whom.

decision-outcome:
  chosen-option:
    link: "B — one row at the bottom of the game region"
    justification: |
      The Dev's decision, left to right:
      1. **Bottom left — the learning bars** (the ZPD bars, one to three, as built by issue #162).
      2. **Bottom centre — the clock:** a label over the time left in digits, and the Time Timer pie to its right. The
         label is a dictionary word («TEMPO» / «TIME» / «TIEMPO»), since every interface string is localisable (pillar 3).
         The digits count down; their format is fixed for the whole session, so they never change unit as a warning
         (ADR-0236).
      3. **Between the centre and the right — the score**, five digits with leading zeros (ADR-0238), and **above it the
         power in use** (the `power` band).
      4. **Bottom right — the game's map**, only in games that have one: the engine reserves the slot and the game mounts
         its map in it (the minimap left the engine with the tile world, ADR-0228).
      5. **The mission stays at the top left** (ADR-0175 §1): the Dev's layout does not move it.
      6. **Who sits over whom at the bottom:** the sound caption and the button legend sit above the HUD row; the
         explanation band covers the row while a menu is open (the game is paused then); where a game shows the
         on-screen pad, the HUD row sits above the pad. These placements are interface choices, logged, and the Dev sees
         them in the running app.
      Super Mario World is the reference for the look (label over bold digits), not a source of assets: no art or font is
      taken from it.

  consequences:
    positive:
      - "The top of the game region carries only the quick bar and the mission"
      - "Every number the child tracks during play is on one line"
    negative:
      - "The bottom is shared by the HUD, the footer and the pad; the order above is what keeps them apart"
      - "A game with a map gains a slot to fill (additive)"

  confirmation: |
    ✅ The gates in confirmed-by: every number in one row at the bottom around the session clock, the score in five digits
    with the power above it, the learning bars at the bottom left and the map slot at the bottom right, the mission at the
    top centre, and §6's order at the bottom — including the row standing above the on-screen pad from the frame it shows.

more-information: |
  ZPD (zona de desenvolvimento proximal) names the learning bars in the Dev's words.
