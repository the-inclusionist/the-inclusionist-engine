title: The session clock has no settings on the child's side — one hour, red at the end, always on

context-and-problem-statement: |
  ADR-0236's erratum made the length and the ending (red, red pulsing, screen lock) options, and the build stored them as
  engine settings with no menu line yet, leaving open where they would live and who lifts a lock. The Dev answered: these
  belong to the teacher's or parent's menu, reachable only through Bússola Escolar and never by the student.

decision-drivers:
  - "What limits the child's session is the adult's to set, on the adult's surface"
  - "A setting with no surface is a hook with no consumer"

considered-options:
  - "A · Keep the options as engine settings, awaiting a menu"
  - "B · No settings: the engine runs one hour, red at the end, always on; the options come with Bússola Escolar's adult menu"

pros-and-cons-of-the-options: |
  **A.** ❌ Stored settings with no surface, on the child's device, for a decision that is not the child's. **B.** ✅ Nothing
  the student can reach changes the limit. ❌ No length other than an hour until Bússola Escolar exists.

decision-outcome:
  chosen-option:
    link: "B — one hour, red at the end, always on; no setting on the child's side"
    justification: |
      The Dev's decision. The clock is always shown and always measures one hour; at the end it turns red. There is no
      setting to turn it off, to change the length, or to make it pulse or lock, and nothing about it is stored on the
      device. The pulse and the lock endings leave the engine with the stored settings (never pushed); they return, if
      they return, as Bússola Escolar's adult menu decides, through its own record.

  consequences:
    positive:
      - "The student cannot change their own limit"
    negative:
      - "An hour for everyone until the adult's menu exists"

  confirmation: |
    ⏳ Not built. Debt: issue #94 — the stored length and ending, their setters and keys, and the pulse and lock endings
    removed; the clock reads a fixed hour and turns red.

more-information: |
  Bússola Escolar is the backend the Dev names for adult-side settings (see ADR-0235 on multiplayer waiting for it too).
