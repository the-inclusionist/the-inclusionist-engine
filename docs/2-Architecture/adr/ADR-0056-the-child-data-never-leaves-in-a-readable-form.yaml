title: No child datum leaves the device in a form anyone can recognise — E2E for the individual, RBAC for the institution, and telemetry that cannot rebuild a classroom

context-and-problem-statement: |
  An earlier design let the school CHOOSE its server: ours, or one installed locally. The Dev dropped it — "estou
  desistindo da ideia de servidor local e adotando a ideia de criptografia de ponta a ponta" — and that is a bigger
  improvement than it looks: two deployment modes are two security surfaces, two support paths and two things to
  audit, and the likelier breach was never our cloud, it was a local server misconfigured by a school's IT.

  What the new posture demands is that four questions be answered together, because each one can silently void the
  others: what the telemetry may carry, who can decrypt what, how a share ends, and what happens when a key is lost.

  ⚠️ AND ONE OF THEM WAS FOUND MID-SENTENCE BY THE DEV HIMSELF, which is why it is recorded rather than smoothed
  over: the first sharing design encrypted the payload and still leaked, because THE FACT OF THE SHARE IS THE DATUM.
  "Fica registrado no nosso sistema que eu atendo o filho do pai do João por eu ter compartilhado algo com ele." A
  server that mediates the share learns the relationship even when it cannot read a byte of the content.

decision-drivers:
  - "⚠️ THE PURPOSE IS TO COLLECT, AND PRIVACY IS THE CONSTRAINT — not the other way round. The Dev, correcting a
     drift in this record: 'o nosso objetivo é coletar dados! O máximo que conseguirmos mantendo anonimato, pois se
     o objetivo fosse anonimato, não coletaríamos dado nenhum.' A design that collects nothing is perfectly private
     and perfectly useless. So every measure here is judged by BOTH sides: what it protects AND what it costs the
     inference layer — and the floor of the anonymity comes from the law and from the requerimento's own promises,
     never from taste. This driver is why two proposed measures are REFUSED below."
  - "The datalake is deliberately poor: no socioeconomic data, no sex, no age, no kinship — 'um mundo de dados que
     seriam de grande ajuda para fazer previsão de desempenho', given up on purpose. What is left is assistive
     technology in use and performance inside the games. A narrow feature space is itself a privacy property, and
     it changes the arithmetic of every measure that would narrow it further."
  - "Metadata is personal data. A design that protects payloads and mediates relationships has protected the wrong
     half."
  - "A claim the document makes must be checkable in the code (requerimento §49). So the record must state the
     boundary it actually defends, never the strongest-sounding sentence."
  - "Nothing may charge the teacher a recurring toll to keep the class running — the ADR-0049 §7 argument, made
     there about the child and here about the adult who is the child's only route in."
  - "Pillar 1 hardware is a locked-down school Chromebook: anything that needs an installer does not exist there."

considered-options:
  - "P1 — choose your server (ours or local), data readable server-side (the design being replaced)"
  - "P2 — E2E with an ongoing shared feed, revoked by key rotation"
  - "P3 — E2E where sharing is a PAST-ONLY snapshot handed over off our network, plus RBAC inside the institution"

pros-and-cons-of-the-options:
  P1:
    good: ["Simplest to build; reports and inference are trivial when the server can read."]
    bad: ["Two deployment modes, two security surfaces.",
          "A breach of our server exposes children, which is the failure this project cannot have."]
  P2:
    good: ["Revocation of FUTURE data is instantaneous if the wrapped keys live server-side."]
    bad: ["The server mediates every share, so it holds the relationship graph — the exact metadata leak above.",
          "Pre-sharing N periods of keys makes revocation granularity N: the trigger that must cut immediately
           (the child changes school) would cut N weeks late."]
  P3:
    good: ["Our server never learns a share happened, because it does not participate.",
           "A snapshot cannot be revoked, but it also cannot GROW — the revocation problem is removed rather than
            solved, which is stronger than solving it.",
           "The institution is a controller with RBAC, not a share recipient, so the hardest case stops being a
            cryptography problem and becomes an access-control one."]
    bad: ["Handing the file over needs a channel that is not ours — device to device, USB, the teacher's own mail.",
          "Longitudinal continuity across teachers exists only on the device."]

decision-outcome:
  chosen-option:
    link: "P3 — past-only snapshot off our network, RBAC inside the institution"
    justification: |
      ===== 1. THE THREE PLACES DATA CAN BE, AND WHAT EACH ONE HOLDS =====
        · THE DEVICE (teacher, parent, health professional) — everything, in the clear, decrypted with that
          person's credential. Reports with PII are computed HERE.
        · OUR CLOUD — the individual's base as CIPHERTEXT only, and separately the telemetry stream, which carries
          no PII (§3). We can read neither.
        · THE INSTITUTION (school, clinic) — its own base, ON ITS OWN NETWORK, which it can read, because it is
          the CONTROLLER of that data and legally obliged to hold it. Confirmed 2026-08-28: the institutional
          account lives in the school's account on the school's network, we hold only an ENCRYPTED BACKUP, the
          account opens on ONE COMPUTER AT A TIME by default, and it arrives through an INSTALLER, not a browser.

          ⚠️ SO THE E2E CLAIM SURVIVES INTACT FOR OUR INFRASTRUCTURE: we never hold readable institutional data.
          This was the last hole in the design, and this is what closes it.

          ⚠️ AND THE PWA/INSTALLER SPLIT IS A CONSEQUENCE WORTH NAMING, because it turns a constraint into a
          criterion: the TEACHER gets a PWA because she cannot install anything — a school Chromebook locked down
          by the municipality's IT is pillar 1, and an installer there is the difference between working and not
          existing. The INSTITUTION gets an installer because it needs one and can have one: disk encryption and
          peer-to-peer do not fit inside a browser, and the machine belongs to the school. The hardware
          restriction stopped being an obstacle and became the line.

      ⚠️ TEXT ONLY, AND THIS IS A GATE AND NOT A GUIDELINE: no photos, no video. A scan enters as OCR TEXT and the
      image is discarded. A photograph of a report card carries a signature, a letterhead and handwriting — it
      identifies the school and the person even when every field is stripped. Enforced at the ingestion point by
      rejecting any binary that is not the expected type; a rule that depends on somebody remembering is not a rule.

      ===== 2. SHARING IS A PAST-ONLY SNAPSHOT, HANDED OVER OFF OUR NETWORK =====
      The professional picks the student(s) and a time range, and the program produces an ENCRYPTED FILE. The QR
      code carries the KEY; the file travels device to device on the local network, by USB, or through the
      teacher's own mail. The password is given in person.

      ⚠️ OUR SERVER DOES NOT PARTICIPATE, AND THAT IS THE WHOLE POINT. It is what keeps the relationship —
      "this teacher attends this parent's child" — from existing anywhere in our infrastructure.

      ⚠️ AND PAST-ONLY IS A SECURITY PROPERTY, not a limitation: a snapshot cannot be revoked, and it also cannot
      grow. The recipient holds what was shared, frozen. This is why there is no key rotation anywhere in this
      record — the requirement was removed instead of satisfied.

      WHAT IS SHARED IS THE DERIVED REPORT, not the raw statement log: mastery per entity, counts, curve points.
      A QR (iQR, ISO/IEC 23941, ~15 KB) fits a report and does not fit three weeks of raw xAPI — and the smaller
      channel forces the better privacy behaviour, which is to share the conclusion rather than the record.

      ===== 3. THE TELEMETRY CARRIES NO PII, AND CANNOT REBUILD A CLASSROOM =====
      What reaches FastAPI/DuckDB is: `id`, coarse date, elapsed time within the session, and the xAPI record.
      No age, no classroom, no school, no year, no sex, no teacher.

        · THE `id` IS DRAWN, NEVER DERIVED. A CSPRNG on the device (`crypto.getRandomValues`,
          `secrets.token_bytes`), which also works offline — and enrolment happens in a school lab, which is
          exactly where the network is missing. ⚠️ A HASH OF A PERSONAL DATUM WOULD NOT DO: the space of CPFs is
          eleven digits with a check digit, small enough to enumerate on a laptop over a weekend. Hashing does not
          protect a low-entropy secret.
        · IT IS BORN WHEN A TEACHER ADDS A STUDENT, and students are NEVER MERGED. Merging two ids requires knowing
          they are the same person, and knowing that is holding the identity. Refusing the merge is refusing to
          hold the link.
        · ⚠️ TIME IS STORED SO THAT CO-OCCURRENCE DIES, and the attack is the reason rather than taste: thirty ids
          active in the same fifty-minute window, on the same weekdays, on the same school calendar ARE a
          classroom — the grouping reappears by co-occurrence with no school field anywhere.

          THE CLOCK AXIS IS UNIFORMISED AWAY (the Dev's design, and stronger than the jitter first proposed here):
          every record lands on a CANONICAL SCHOOL GRID — day 1 is always Monday, day 2 always Wednesday, weeks
          numbered from the start of the school year — the 200 Brazilian school days over 40 weeks of weekdays.
          A class meeting Tuesday/Thursday and one meeting Monday/Friday both record as day 1 / day 2, so the
          cadence — which identified more than the hour did — stops existing. An axis with no variance groups
          nobody.

          ⚠️ AND NORMALISING TO "THE FIRST ACCESS OF THE WEEK" WOULD HAVE DONE THE OPPOSITE, which is why the
          rejected variant is written down: it anchors all thirty ids to the SAME event and sharpens the
          co-occurrence instead of dissolving it. Uniformising against a fixed external grid works; uniformising
          against each id's own first event does not.

          ⚠️ ONLY BRAZIL SENDS, FOR NOW: no telemetry is collected from other countries until there is legal
          guidance for each and an entity established there. That is what lets the canonical grid simply BE the
          Brazilian school year — the hemisphere problem (a Portuguese school starts in September, and on a
          Brazilian grid its country would become the thing that stands out) does not arise while nobody else
          reports.

          ⚠️ AND WHAT EXCEEDS THE LAST WEEK IS DISCARDED, NEVER FOLDED BACK. Discarding rests on law rather than
          on privacy: the Brazilian school year IS 200 days, so activity outside it is outside the school context
          that legitimises collecting it at all. Folding December onto November was rejected for the privacy
          reason — it doubles November's density and turns "studied only in December" into an anomaly, and an
          anomaly identifies.

          Elapsed time WITHIN a session keeps full precision — that is what the learning curve uses, and with the
          ceiling of about one hour of screen a week there is rarely a second session in the same week for the
          grid to blur.

        · ⚠️ AND THE RESIDUAL ATTACK MOVES FROM THE CLOCK TO THE CONTENT, where the parameter is RARITY and not
          proportion. Thirty children on a RARE activity in the same window are a class whether that is 10% or
          100% of their time; thirty on the country's commonest activity are invisible at any proportion. So a
          fixed "share at most X% of activities" does not protect: it cannot tell the two apart.

          ⚠️ AND THE DEFENCE IS AT THE SOURCE, NOT AT THE QUERY — the Dev's correction to this record's first
          answer, and it matters: "como saber se e atividade rara sem enviar a atividade pra gente?" Suppression
          at query time is DISCLOSURE CONTROL, not minimisation. The rare activity would still arrive, still be
          held, and we would merely decline to publish it — and LGPD asks what the controller HOLDS.

          SO THE FILTER RUNS ON THE DEVICE, AGAINST A PUBLIC LIST: the COLLECTIVE lesson may only draw from an
          external, published curation of essential skills — in Brazil, the Instituto Reuna's Mapa de Foco over
          the BNCC. Three things follow, and the first dissolves the circularity:
            · the list is EXTERNAL and PUBLIC, so no data of ours is needed to build it;
            · by construction it is what most schools already work on, so the anonymity set is large before
              anyone measures anything;
            · and it stands on its own pedagogically — "the collective lesson works the essential" is a good
              teaching rule with no privacy argument attached.

          ⚠️ AND OUR OWN COUNTS MAY NARROW THAT LIST, NEVER WIDEN IT. Widening from what we measured would
          require having held the rare thing first, which is the circularity returning through the side door.

          k-ANONYMITY APPLIES TO WHAT LEAVES, NOT TO WHAT IS HELD. An earlier version of this clause ERASED small
          cells, and that erasure existed to sustain an anonymity claim the record no longer makes — while costing
          exactly the rare cases the inference layer is for. With a legal basis, a RIPD and a retention period,
          holding them is lawful; publishing them is what needs the cut.

          So: **k >= 10 on every OUTPUT** — a published report, a shared aggregate, an export. Nothing resolving
          to fewer than 10 distinct ids leaves. The threshold is borrowed rather than invented: it is the cut
          education statistics already use for small cells (INEP suppresses; US states suppress below 10 under
          FERPA), and adopting the threshold of those who already publish school data is more defensible in an
          audit than one of ours.

          ⚠️ AND THE COUNT IS NATIONAL, NEVER PER SCHOOL. A school with five students is not the problem; a
          COMBINATION that only five children in the country share is. The grace period matters for the same
          reason: every cell has exactly one id at the moment it lands, and only reaches ten as other schools
          report the following week.

          ⚠️ WHEN A PUBLISHED CELL IS TOO SMALL, GENERALISE THE TIME — NEVER THE CONTENT. A rare cell is a pair
          (entity, week), and there are two axes to loosen. An earlier version of this clause loosened the ENTITY,
          replacing it with its parent curriculum item, and the Dev refused it for the right reason: the resulting
          row says almost nothing. "(id, week 12, EF04MA05)" records that a child worked in an area that week
          without saying what was done or whether she GAINED OR LOST — and gaining or losing is the whole point of
          a trajectory.

          What the inference needs is the full row: (id, EF04MA05, "apply: division with remainder", +1, ...).
          What it does NOT need is week-level precision on the calendar. So the axis to coarsen is TIME: the
          published cell becomes (entity, TERM) instead of (entity, week 12), and the entity, the outcome and the
          ordering all survive intact while the cell gains everyone who worked that entity across the term.

          ⚠️ AND THE DETAILED ROW IS NEVER LOST ANYWAY, because the k rule now applies only to what LEAVES: the
          lake keeps (id, entity, outcome, week) in full. Generalisation touches a published aggregate, not the
          record. It is not discarding information; it is deciding what a published figure is allowed to resolve
          to.

          ⚠️ AND THE SHAPE IS TWO LESSON MODES, EACH SAFE BY A DIFFERENT MECHANISM:

            · COLLECTIVE — the teacher picks 1 to 3 activities and the whole class works the same skill. Safe
              because the choice is restricted to the PUBLIC LIST, so what the class shares is by construction
              what thousands of other classes also share. It exists for the teaching reason: group discussion,
              and a child seeing she is not alone in the difficulty.
            · REINFORCEMENT — the system proposes activities PER STUDENT and the teacher picks 1 to 3 from the
              proposals, up to the day of the lesson; if the recommendation changes before then she picks again,
              and she may go AGAINST the recommendation and choose other skills. Safe because there is no
              co-occurrence to begin with: every child is doing something else.

          ⚠️ SO THE RARE SKILL IS NEVER LOST, and an earlier reading of this record got that wrong: "discard the
          uncommon" applies ONLY to the collective lesson, where an uncommon activity should not appear anyway.
          The rare skill lives in the reinforcement mode, where collecting it costs nothing. Having both modes is
          what makes it possible to work rare needs safely — the Dev's reason for wanting both: "sem reforco nao
          ha skills raras".

        · ⚠️ AND THE TRANSPORT LEAKS WHAT THE PAYLOAD NO LONGER DOES: thirty uploads from a school's public IP
          inside the same fifty-minute window ARE a classroom, whatever the timestamps inside them say. The
          canonical grid does not touch this channel, because the channel is not in the content — it is in when
          the packets arrive and where from.

          THE DEV'S ANSWER CLOSES THE CHANNEL INSTEAD OF BLURRING IT: ⚠️ ONLY THE INSTITUTION EVER SENDS
          TELEMETRY. Parents and individual professionals never do.

          The path: during the lesson there is only encrypted sync BETWEEN THE COMPUTERS, and everything the child
          does queues in the teacher's account. When that account syncs with the school, the queue empties INTO
          the school's machine and is backed up encrypted to our cloud so it cannot be lost. At the scheduled
          moment — after 00:00 on the following Saturday, in practice the Monday when the machines are switched
          on — the school fires the queue to our servers.

          ⚠️ SO WE SEE ONE UPLOAD PER SCHOOL PER WEEK, NOT THIRTY DEVICES IN A FIFTY-MINUTE WINDOW. There is
          nothing left to correlate: the classroom co-occurrence in the transport is not blurred, it does not
          exist. The source IP is still the school's, but a weekly bundle carries no lesson inside it.

          ⚠️ AND THE RELAY BUYS A SECOND THING, worth its own line because the design would keep it even if
          co-occurrence were not an issue: GOING THROUGH THE SCHOOL'S SERVER MEANS WE NEVER COLLECT IP ADDRESSES,
          BROWSER DATA OR ARRIVAL TIMES FROM A CHILD'S DEVICE. What reaches us comes from one institutional
          server, so the whole client-side fingerprinting surface — the one every analytics stack collects by
          default and then has to justify — simply never exists here.

          ⚠️ AND THE CONSEQUENCE IS THAT THE INFERENCE LAYER IS FED EXCLUSIVELY BY INSTITUTIONS. A child who only
          plays at home contributes nothing to the datalake — which is also the cleaner legal posture, since the
          school is the controller that holds the contract.

        · ⚠️ AND IF THE EXAM AND HOMEWORK STREAM IS EVER ADDED, IT SENDS JUDGEMENT AND NEVER TEXT. The Dev
          described analysing exam questions, homework and coursework with a strong local model and sending them
          sanitised by the school (Presidio plus a ~9B model, where there is a GPU). Sanitising by named-entity
          recognition gives the FEELING of a solved problem without solving it: Presidio finds names, CPF, phone
          numbers and addresses, and a child's writing identifies through CONTEXT — "my father works at the
          council", "when I moved from Monte Aprazível", "my sister in year five". Three of those in a town of
          twenty thousand are a name.

          ⚠️ AND THE DEV HAS MEASURED WHAT I ONLY ARGUED: a ~9B Qwen running under Ollama does find the
          contextual identifiers, including the hard ones — nicknames like "Dona Mocinha", "Seu Neguinho", "Mano
          Dois", "Perninhas". So detection is better than the NER-only argument above assumed. That correction
          stands, and so does one asymmetry that is not about model quality:

          SANITISING IS A RECALL PROBLEM WITH NO GROUND TRUTH. What the model caught is verifiable; what it MISSED
          is not. One miss in a thousand essays is a re-identification, and it is silent — nobody finds out.
          Structure has no recall problem because there is nothing to sanitise: a closed vocabulary cannot leak
          what is not in it.

          SO THE LOCAL MODEL RETURNS A RICH STRUCTURED JUDGEMENT — not a five-code rubric, which would throw away
          the pedagogical signal that usually lives exactly where a rubric has no code: entity, correctness, error
          type, misconception identified, strategy used, evidence REFERENCED BY POSITION rather than quoted. Where
          free text is genuinely irreplaceable (assessing writing quality, say), the sanitised path exists with the
          model the Dev measured — as an EXCEPTION with its own justification, never the default, because there
          the residual risk is one no test can zero.

          ⚠️ AND A CLAIM MADE HERE EARLIER IS WITHDRAWN: that structure would lighten the GPU requirement. The
          model must read the whole text either way; only the generated output shrinks. Modestly cheaper, not
          decisively.

      ⚠️ AND THIS DATA IS PSEUDONYMISED, NOT ANONYMOUS — AND THAT IS NOW THE PREMISE, NOT A CAVEAT. Settled by
      the Dev on 2026-08-28, and it is the maturest decision in this record: "o que devemos fazer: aceitar que não
      conseguimos anonimização (pelo menos não ainda) e verificar o melhor que é possível fazer de dentro da lei."

      This is not a downgrade. It is the refusal to claim a property the data does not have — LGPD art. 13 §4º
      says pseudonymised data remains personal, and art. 5º XI releases only what is irreversible by reasonable
      available means. Every measure in this record stands; what changes is that they are described as REDUCING
      risk rather than as producing anonymity.

      ⚠️ AND ACCEPTING IT BRINGS MACHINERY THAT MUST BE BUILT, not merely written: a LEGAL BASIS (for a municipal
      school, art. 7º III — the execution of public policy — is the strong candidate, and art. 14 requires the
      treatment to be in the child's best interest); a RIPD; a data-protection officer; a retention period; and
      the data-subject rights of art. 18. Which basis sustains art. 14 is a lawyer's answer, not mine — this
      record's job is to state the question precisely enough to be answered in one sitting.

      ⚠️ AND WHY LGPD APPLIES AT ALL, since we cannot tell one child's rows from another's — the Dev's question,
      and it deserves the specific answer rather than a hedge:

        · THE TEST IS NOT "CAN THE CONTROLLER IDENTIFY". Art. 5º I says "identified OR IDENTIFIABLE", and art. 5º
          XI releases only what cannot be identified "considering reasonable and available technical means". The
          path back exists INSIDE OUR OWN PRODUCT — the school maps id to child, and the erasure flow above
          deliberately uses that path. Arguing the means are unavailable, when we designed and operate the system
          that holds the mapping, is a weak argument to build a project on.
        · ART. 12 §1 CLOSES THE SPECIFIC DOOR: data used to form the BEHAVIOURAL PROFILE of a natural person is
          personal data when that person is identified. The lake exists to build a profile the school then applies
          to a named child; the identification happens on the other side of the boundary, but the decision lands
          on someone identified.
        · AND THE ARRANGEMENT ITSELF IS IN SCOPE: the school is CONTROLLER and we are OPERATOR. Both are covered.
          Even a perfectly anonymous copy on our side would leave us processing on the controller's behalf, with
          art. 39 (follow the controller's instructions), art. 42 (liability), security and breach notification.

      ⚠️ AND THE PRACTICAL CONSEQUENCE IS LIGHTER THAN IT SOUNDS: the heavy half — legal basis, RIPD, consent
      where required, subject rights — falls on the SCHOOL as controller, which is where the law already puts it
      and where it already sits today for the class register. Our operator obligations are the smaller half. The
      design does not lose its reason either: it exists so that A BREACH OF OUR SERVERS IS HARMLESS, and that is
      worth more than an exemption, because an exemption protects no child.

      ⚠️ AND ONE OF THOSE RIGHTS LANDS DIRECTLY ON THE ARCHITECTURE — THE RIGHT TO ERASURE (art. 18 VI). We
      cannot honour it server-side, because the server does not know which id is which child, and that ignorance
      is the property this whole record protects. THE DEVICE KNOWS: the request reaches the school, the school's
      application resolves child → id, and it sends an ERASURE ORDER CARRYING THE id. The server deletes without
      ever learning who it was, and the id doubles as the erasure token. Written here because a subject request
      we cannot fulfil is a fine, not an inconvenience.

      ===== 3b. THE SERVER DOES NOT LINK ONE id TO ANOTHER =====
      A student who changes teacher gets a new id, so the server holds EPISODES and not lifetimes. It was proposed
      that behaviour could re-link them; the Dev then narrowed it himself, and the narrowing is the decision:
      the objective is to find behaviour patterns and SEGMENT INTO GROUPS, not to personalise absolutely.

      ⚠️ AND A GROUP CURVE DOES NOT NEED THE LINK. A student who changes id contributes two episodes, and the
      group's average is over ids, not over people — it does not move. The link only matters for per-individual
      longitudinal prediction, which is not the goal. So the analysis is unaffected and "we hold no identity
      graph" stays true without a footnote.

      IF THAT EVER CHANGES, two things bind: the link is COMPUTED at query time and never stored as a fact, and it
      is not exposed when it resolves to fewer than *k* candidates. The size of the anonymity set is a measurement,
      not an intention — the same data serves grouping and identification, and high-dimensional behavioural data
      gets SPARSER with time, so a set that is large today is small in two years.

      ===== 4. THE INSTITUTION IS A CONTROLLER, NOT A RECIPIENT =====
      Schools and clinics hold accounts by CNPJ, verified by us, and receive a CERTIFICATE. A professional may
      share with a certified account on the network directly, peer to peer, for a period set at share time (weeks,
      months, to the end of the school or fiscal year), under contract and terms of acceptance.

      ⚠️ "NOT END-TO-END" IS NOT "IN THE CLEAR", and the Dev corrected his own wording here: the transport IS
      encrypted on the intranet. P2P on a school LAN without TLS means any machine on that LAN reads student data;
      WebRTC data channels carry DTLS by default, and another transport has to earn the same.

      ⚠️ AND IT SYNCHRONISES, IT DOES NOT SHOW. The institution receives a COPY by sync; it does not read the
      professional's machine live. That is a better model and not merely a clarification: a live view would need a
      live session and a permission check held open, while a sync is a transfer with a MOMENT — auditable, loggable
      on the institution's side, and it makes the period govern exactly the thing that can be revoked, which is
      when the next sync happens.

      ⚠️ TWO KEYS, NOT ONE, AND THE SYNC RE-ENCRYPTS. Each professional holds the key to HER OWN working base;
      the institution holds the key to the INSTITUTIONAL base; and the sync between them re-encrypts. Installing
      the school's key on every teacher's machine — the first proposal — would make one stolen laptop the whole
      network, and it would have to be installed there anyway, because a teacher reads her own data daily. The
      blast radius this design aims for is the students of ONE professional.

      ⚠️ AND THREE THINGS THAT MUST NEVER TOUCH: ACCOUNT LOGIN (who you are to the service: passkey, password,
      SSO — recoverable by ordinary means, and losing it costs access, not data); the DATABASE KEY (what decrypts:
      the printed sheet, and losing it costs the data); and ACCOUNT RECOVERY, which must never restore the
      database key. If it did, whoever can reset an account can read the children — and the promise would die in
      a support queue rather than in the cryptography.

      ⚠️ WHO HOLDS THE KEY TO THE SCHOOL'S BACKUP is the §5 problem again, one size up: the whole school record
      rather than one professional's base, and harder, because a head teacher changes every few years and custody
      has to survive the handover. Same printed-sheet answer, plus a transfer procedure attached to the post.

      ⚠️ AND THE PERIOD GOVERNS THE FLOW, NOT THE RETENTION. The school is the controller and is legally required
      to keep school records; its copy does not evaporate when the year ends. What the period stops is the arrival
      of NEW data, and that is revocable with a switch. Written this way because the other reading promises
      something the law does not allow us to deliver.

      ⚠️ AND SO THE E2E SENTENCE HAS A BOUNDARY, which must be stated and not implied: no child datum leaves the
      device readable BY US. Inside the institution, the institution reads — because it is the controller. Both
      sentences are true; only one of them is the strong-sounding one, and the document must carry the accurate one.

      CERTIFICATES ARE SHORT-LIVED, renewed each term. It makes us a certificate authority, and short lifetimes are
      how a small CA avoids operating revocation infrastructure: revoking becomes letting it expire.

      ===== 5. KEY LOSS: PAPER, VERIFIED ONCE, AND THE GAME NEVER LOCKS =====
      E2E with no server-side recovery means a lost key is a lost history, and in a school that WILL happen —
      reimaged machines, a teacher who leaves, a swapped laptop.

        · TWO PRINTED SHEETS with DIFFERENT codes; one stays in the school's custody.
        · VERIFIED ONCE AT ENROLMENT, by typing one code — which proves the sheet was printed and is legible, the
          failure that actually occurs (a printer out of toner).
        · THEN RARELY, AND ON AN EVENT: once a term, or when signing in on a new device. Tied to an event, never
          to a calendar.
        · THE COORDINATOR CONFIRMS CUSTODY by entering the employee's code in her own account — which turns custody
          from a promise into a check. ⚠️ Store a VERIFIER (salted hash), never the code: otherwise a paper key
          becomes a digital copy in the coordination's database and the sheet stops being the only one.
        · ⚠️ THE GAME NEVER LOCKS. Escalate visibility, never capability: the warning goes red, sharing and report
          export may degrade — the lesson may not.

      ⚠️ A WEEKLY TYPED CODE WAS PROPOSED AND REJECTED, and the reasoning is kept because it will be proposed
      again. It does not protect against key loss; it protects against misplacing the sheet, which is the smaller
      problem, at a recurring cost. It charges that cost to the teacher who is the child's only route into the
      game — the ADR-0049 §7 argument, made there about a child. And it fails on its own terms: a locked lab is a
      class that does not happen, so the real-world response is the codes on a sticky note taped to the monitor,
      which destroys the scheme. "Banking-grade" argues against it: banks make recovery possible through a second
      channel precisely because lockout is worse than the marginal risk.

      ⚠️ AND THE PRINTED SHEET IS THE KEY. Whoever holds it decrypts. That is the point, and it means physical
      custody is part of the security model — a sheet in an unlocked drawer is the weakest link in the whole
      design, and it is the school's custody, not something we can enforce.

      ===== 6. AUTHENTICATION AND DECRYPTION STAY SEPARATE =====
      Sign-in may be passkeys, user+password, or SSO, with OAuth 2.1 + OIDC granting service access. ⚠️ SSO IS
      NEVER THE ONLY DOOR: it requires internet at login (pillar 8 — a lab with no network could not start), it
      tells the identity provider who uses this program and when, and an account disabled by a school's IT would
      make a teacher's base unreachable — key loss triggered by HR instead of by hardware.

      ⚠️ AND SIGNING IN NEVER UNLOCKS THE BASE. The printed key unlocks; OIDC only proves who you are to the
      service. If the SSO login decrypted, then whoever controls the account decrypts, and the whole promise would
      die inside an IT configuration screen. This separation is what keeps the E2E claim alive with SSO enabled.

  consequences:
    positive:
      - "A breach of our infrastructure exposes ciphertext and a pseudonymised stream — never a named child."
      - "The relationship graph (who attends whom) exists nowhere in our systems, because we do not mediate shares."
      - "Reports with PII run on the device with duckdb-wasm, which needs no installer — and on the locked-down
         school hardware of pillar 1, an installer is the difference between working and not existing."
      - "Removing the ongoing feed removed key rotation, weekly synchronisation and revocation lists from the
         design entirely."
    negative:
      - "Longitudinal continuity across teachers exists only on the device; the server holds episodes."
      - "Handing a file over off our network is a worse user experience than a link, and it is the price of the
         property that makes this record worth having."
      - "We become a certificate authority, with issuance and renewal to operate, even with short-lived certs."
      - "A lost sheet with a lost device is a lost history, and no clause here prevents it — it is made unlikely,
         not impossible."
    neutral:
      - "The datalake can never answer 'how did this individual progress over the years', by construction. It can
         answer it about groups, which is what it is for."

  confirmation: |
    GATES, and each is something a person outside the project can run:
      · NO PII IN THE STREAM: a schema assertion over what the ingestion endpoint accepts — the allowed field list
        is closed, and anything else is rejected rather than ignored.
      · THE id IS DRAWN: the enrolment path calls the CSPRNG and no hash function; asserted over the code, and it
        is the kind of thing a test can pin because a derived id would have to come from somewhere.
      · CO-OCCURRENCE IS DEAD: given a synthetic classroom of thirty students on a fixed timetable, a clustering
        pass over the stored stream must NOT recover the grouping. This is the gate that matters most, and it is
        the one that would have caught the "anchor everyone to the first access of the week" idea.
      · TEXT ONLY: the ingestion point rejects every binary that is not the expected type.
      · THE GAME DOES NOT LOCK: with the recovery code missing and overdue, the game still starts and still plays.
      · SIGN-IN DOES NOT DECRYPT: no code path from the OIDC token to a decryption key.

    ⚠️ WHAT NO GATE CAN CONFIRM: whether a school keeps the custody sheet somewhere safe, and whether a teacher
    hands a file to the right parent. The design puts the decisions where the law puts the responsibility; it does
    not follow anybody home.

more-information: |
  THE ONE ARCHITECTURE THAT WOULD CHANGE THE ANSWER, recorded because the Dev asked why LGPD applies and this is
  the only honest way out: NEVER RECEIVE A ROW PER id. The school already has a machine, already runs DuckDB,
  already runs the local model — it could send STATISTICS OR MODEL UPDATES instead of records, which is federated
  learning. Then we hold no personal data because we hold no person's data.

  ⚠️ REFUSED FOR NOW, and the cost is why: with few schools and sparse data, federated aggregation converges
  badly; and debugging a model over data you can never look at is brutal — when a result comes out strange there
  is no row to open. It is the opposite of "collect the maximum", which is the driver this record adopted. It is
  written down so the day the base is large enough for federation to work, and the legal cost outweighs the
  debugging cost, the option is already understood rather than re-argued.

  NOTHING ELSE IS LEFT OPEN IN THIS RECORD. BOTH REMAINING QUESTIONS WERE CLOSED WITH A "NO" ON 2026-08-28, under the driver above — and they are recorded
  because a measure refused without a written reason comes back:

    · A CONSTANT PER-id WEEK OFFSET ON TOP OF THE GRID — REFUSED. The Dev found the flaw: it breaks at the
      boundary of a bounded grid. A child with offset +5 has her week 36 land on week 41, which does not exist.
      Wrapping puts December's work in February; extending the grid to 45 creates weeks populated ONLY by children
      with large offsets, which reveals the offset; clamping destroys the very interval the offset existed to
      preserve. And the deeper cost is semantic: THE WEEK OF THE YEAR MEANS SOMETHING. Week 1 is diagnosis and
      revision, week 40 is consolidation — shifting a child by five weeks reassigns her work to a different PHASE
      of the school year, and "she struggled at the start and recovered by the end" is exactly the reading the
      datalake exists for. It was proposed to blur a residual that three other layers already remove (the public
      list in the collective mode, the absence of co-occurrence in the reinforcement mode, and one weekly upload
      per school). It buys little and costs the phase of the year.

    · ANNUAL PSEUDONYM ROTATION — REFUSED, WITH A TRIGGER. It would cost the most valuable thing a learning
      datalake can hold: the trajectory ACROSS years. "Did this child recover the gap over two years" is literally
      the question the Mapa de Foco exists to answer. And it buys little in THIS dataset, which is deliberately
      poor — a year-long trajectory over a narrow feature space identifies far less than a short one over a rich
      space.

      ⚠️ AND THE TRIGGER FIRST WRITTEN HERE — "if the exam stream is added, rotation returns to the table" — WAS
      REMOVED BY THE DEV: "não volta, precisamos disso." The multi-year trajectory is needed even when the vector
      gets rich, and rotation would destroy it. The consequence is not hidden: a richer vector over several years
      identifies more, and the answer is no longer a technical measure but the legal one above — accept that this
      is personal data, hold it under a lawful basis with a RIPD and a retention period, and do the best that can
      be done inside the law. Refusing the measure and naming what it would have covered is the honest pair.
