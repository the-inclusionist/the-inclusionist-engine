title: The pause decline comes back — the retirement was measured on ONE consumer out of five

context-and-problem-statement: |
  🔴 ADR-0120 RETIRED A FIELD THAT FOUR OF FIVE GAMES USE, and this record puts it back.

  📏 MEASURED ON 2026-09-09, ACROSS THE LOCAL CATALOGUE, which is the measurement ADR-0120 should have made
  and did not:

    · `game-chess`      — `boot/game-shell.ts:439`, plus TWO spikes
    · `pixi-15-puzzle`  — `boot/main.ts:108`
    · `game-2048`       — `boot/main.ts:96`
    · `game-whackwhack` — `boot/main.ts:94`
    · `game-platformer` — does not use `createGame` at all (the monolith of origin, no `GameDeclaration`)

  ⚠️ AND IT IS NOT MARKUP — IT IS THE KEYBOARD. `pixi-15-puzzle` wrote the cost beside its own declaration,
  weeks ago: «if `semMenuDePausa` were omitted, every arrow, Enter and Space would start being eaten the
  moment anything created an element with a pause id.» With a pause card mounted, the engine's menu navigation
  captures the arrows, `Enter` and `Space`. In a game played with arrows, that is a game that stops being
  playable by keyboard — an accessibility regression, in an accessibility-first engine.

  📌 It also explains a failure this AI first read as selector ambiguity: `game-chess`'s «the HUD came back:
  expected 'none' to be 'flex'» is behavioural interference, not a `querySelector` accident.

  🔴 THE METHOD FAILED, NOT THE CARE. ADR-0120 measured `consumer-quiz` — the consumer that lives inside this
  repository — and generalised to a catalogue of five that was never opened. Three of those four would not
  even have failed a typecheck: they consume the published `7.0.1` and would not have seen the change until
  the day they bumped, which is the day `8.0.0` ships. Without this measurement the regression arrived at four
  games at once, in production, in the release.

decision-drivers:
  - "A regression that removes keyboard access is the worst failure this engine can ship, by its own pillar 2"
  - "A decision taken on false information is corrected by correcting the information, not by defending it"
  - "The consumer that proves a contract is the CATALOGUE, never the example consumer living in the same repo"
  - "The direction of ADR-0106 is not in question; only the speed and the order are"

considered-options:
  - "R1 · Leave the retirement and migrate all four games to the engine's pause now"
  - "R2 · Leave the retirement and let the games discover it at the 8.0.0 bump"
  - "R3 · REVERT the retirement, and let the choice happen without a broken contract"

pros-and-cons-of-the-options:
  R1:
    good:
      - "It is the direction ADR-0106 states, and it would end the divergence in one pass."
    bad:
      - "🔴 Four repositories, each with a keyboard risk, under the pressure of a contract that is already broken."
