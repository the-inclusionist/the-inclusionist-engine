      - "It reverses code, not the Dev's decision: what is being corrected is the information he decided on."
      - "ADR-0120's correct half survives in the record — «no pause at all» is not a thing a game needs to declare."
    bad:
      - "The contract keeps a field ADR-0106 would rather not exist, for longer."
      - "⚠️ Two records now disagree unless this one is read, which is exactly why it exists."

decision-outcome:
  chosen-option:
    link: "R3 — revert the retirement; the decision about the pause's future lives in issue #132"
    justification: |
      **`Declinios.semMenuDePausa` COMES BACK, unchanged, by `git revert` of the commit that removed it.**

      1. **THIS DOES NOT OVERRULE THE DEV.** He decided «Aposentar» on the information this AI gave him: that
         the field's reason had died. It had died for `consumer-quiz` and for nobody else. Correcting a
         decision's premise is not reversing the decision — and the choice, with the true measurement, is now
         issue #132, where he answers with the catalogue in front of him.
      2. **A REVERT AND NOT A REDESIGN**, deliberately. Naming a new field (`semPausaDaEngine`, «I mount my
         own») is the likely answer and it is still a DESIGN choice; taking it now, to fix a regression this
         AI introduced, would be a second unilateral decision stacked on the first.
      3. **ADR-0120's CORRECT HALF STANDS and is not re-litigated**: a game with NO pause at all does not need
         to declare anything, because the engine now mounts a card that offers only what the game can action.
         What was wrong was believing that describes every declining game.

      ⚠️ AND THE RECORD OF THE ERROR IS THE POINT OF THIS FILE. ADR-0120 stays exactly as written — it is
      history, and a record is not edited to look better. What this one adds is the measurement that should
      have preceded it.
  consequences:
    good:
      - "Four games keep their keyboard, and nothing regresses into the 8.0.0 release"
      - "The choice between adopting the engine's pause and keeping a truthful escape hatch is made with numbers"
      - "The method failure is written where the next contract change will be read: measure the CATALOGUE"
    bad:
      - "⚠️ The contract keeps a field with two meanings — «I have none» and «I mount my own» — and that ambiguity is what made the mistake possible in the first place"
      - "ADR-0106's rule that every game has the same pause stays unrealised for longer"
      - "Two records must be read together, and a reader who stops at ADR-0120 gets the wrong answer"
  confirmation: |
    The revert is its own confirmation: the suite that was green before ADR-0120 is green again, and
    `game-chess` compiles against the tree once its `seguraTeclas` is added.

    What this record owes, and it is one gate:

    · ⚠️ A CONSUMER-SIDE SWEEP BEFORE ANY FUTURE REMOVAL FROM `Declinios` — a contract field is not retired on
      the evidence of the consumer that ships in the same repository. `git grep` across the catalogue costs two
      minutes and would have prevented this entirely. 📌 It cannot be a test in THIS repository (the catalogue
      is five other repositories, and a gate that reads them would make this repo's CI depend on their state);
      it is a step in the procedure, and it belongs in `CLAUDE.md` beside «fato duplicado apodrece».

more-information: |
  Supersedes ADR-0120 in part: the retirement itself. Its reading of why the field EXISTED — the engine had
  nothing that suited a game with no pause of its own, and stages 2 and 3 of ADR-0106 built that away — is
  correct and untouched.

  Deliberately NOT decided here: whether the field returns permanently under a truer name, or whether the four
  games adopt the engine's pause. That is issue #132, and it is the Dev's.
