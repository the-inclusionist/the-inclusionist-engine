title: No pictogram set until one is licensed — only ARASAAC and PCS are candidates

context-and-problem-statement: |
  ADR-0028 sorted pictogram sets by licence and kept Mulberry as the bundled floor. None was ever built: every set in
  the engine is unavailable, and the list in code still names sets the amended record had dropped. The Dev settles the
  roster: the only candidates are ARASAAC and PCS, each only once a licence is obtained — and no licence exists today.

decision-drivers:
  - "A set the project may not use must not be presented as one it offers"
  - "Only the two sets with real reach for the project's audience are worth the licensing effort"

considered-options:
  - "A · Keep ADR-0028's roster (Mulberry bundled, ARASAAC fetched, the rest negotiating)"
  - "B · Only ARASAAC and PCS, each only once licensed; none today"

pros-and-cons-of-the-options: |
  **A.** ❌ It promises a bundled floor nobody has built, and lists sets the Dev has dropped.
  **B.** ✅ The list says what is true: nothing is licensed, so nothing is offered. ❌ A child who reads symbols gets none
  until a licence arrives — which is also true today under A.

decision-outcome:
  chosen-option:
    link: "B — only ARASAAC and PCS, and only once licensed; officially none today"
    justification: |
      The Dev's decision. ADR-0028's persistence and reset rules stand; its roster and tiers are replaced. Mulberry,
      Blissymbolics, Tawasol, Sclera, SymbolStix and Widgit leave the list. ARASAAC and PCS stay as the two candidates,
      shown as unavailable with the reason (no licence) in the same way the pause card shows a locked item with its
      reason (ADR-0161), and selectable only when a licence is recorded. ARASAAC's CC BY-NC-SA terms do not change
      this: the project uses it only with a licence, not by asking the player to download it.
      📌 «PECS» is read as **PCS**, the Picture Communication Symbols set (the one the code already names): PECS is the
      Picture Exchange Communication System, a teaching method that uses symbols rather than a symbol set. To confirm
      with the Dev.

  consequences:
    positive:
      - "The AAC menu stops listing sets the project cannot use"
    negative:
      - "The AAC menu holds only the upper-case letters switch and two locked sets until a licence is obtained"

  confirmation: |
    ✅ The gates in confirmed-by: `ui/aac-sets.ts` holds ARASAAC and PCS and nothing else, neither selectable; a gate
    fails if a set without a recorded licence becomes selectable, and its pair proves a licensed one would be; and the
    menu's door is disabled and says only that it is disabled (erratum of 2026-09-25). 📋 The menu's exercises and
    keyboard wait for a licence, under issue #57.

more-information: |
  The question of what the AAC menu is FOR (a symbol set that replaces written text, exercises, or a virtual keyboard)
  is open and is not settled here; see issue #57.
