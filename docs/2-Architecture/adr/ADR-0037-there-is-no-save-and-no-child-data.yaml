metadata:
  status: "accepted"
  date: 2026-08-25
  decision-makers: [Dev]
  consulted: [ADR-0010 (pillars 1, 4, 8 and 9), ADR-0027 (the cartridge idiom), ADR-0034 (SUPERSEDED here),
              ADR-0035 (the engine stays ours), ADR-0036 (this repository becomes the engine),
              "requerimento_monte_aprazivel_5.docx, items 4.1, 5, 7, 8 and 15"]
  informed: []

title: There is NO save — and the Inclusionist stores no child's data at all; the only password is the teacher's room, the room is a machine on the school LAN, and the backend is Bússola Escolar

context-and-problem-statement: |
  ADR-0034 built a password so a child could recover her literacy level on a school machine that is restored
  every night. It was written, tested and committed on 2026-08-25, and the Dev retired it the same day with a
  sentence that dissolves the problem instead of solving it:

      "Não existe salvar jogo no inclusionista e nem deve existir."

  The games are minigames: five phases when they are sequential, about three minutes each, roughly fifteen
  minutes end to end. A password that restores progress inside a session that ends before recess is machinery
  with no load. ADR-0034 was not wrong about the school machine being wiped; it was answering a question the
  product no longer asks.

  What replaces it is not a smaller save. It is a different location for the whole problem. The Dev's design:

    · The teacher logs in on every machine, because a child under thirteen cannot have an email account.
    · Inside the teacher's account are the classes. The child clicks her class, then her AVATAR — the way a
      fighting game picks a character, with no two children allowed the same one, and with the teacher able to
      log out a child who picked the wrong one and will not fix it herself.
    · At home the parents log in. Only when the child is old enough for an account of her own does she log in
      and see her own data. Home data does not mix with school data; parents may see the school data if the
      teacher allows it, and the teacher may allow the school administration to see the data of its students.
    · All of that lives in BÚSSOLA ESCOLAR. The backend is not the Inclusionist's.

  AND THE REQUERIMENTO ALREADY SAYS SO, which is what turns this from a preference into a commitment. Item 4.1
  of the petition being filed with the Município states that the networked mode "opera exclusivamente em rede
  interna, sendo vedados o uso sem supervisão e o funcionamento pela internet aberta — RESTRIÇÃO DE PROJETO, E
  NÃO CONFIGURAÇÃO". Item 5 states that "o que o Inclusionista registra alimenta o Bússola Escolar". The
  architecture is already promised in a document signed by the author, to the owner of the code.

decision-drivers:
  - "Pillar 4, at its strictest: a system that stores nothing about a child cannot leak, cannot be
     re-identified, and needs no consent instrument of its own. The cheapest privacy control is absence."
  - "The avatar picker removes the free-text NAME, which was the only personal datum the earlier design had.
     There is nothing left to hash, encrypt or pseudonymise — the whole HMAC-with-a-class-key proposal exists
     only to protect a name, and there is no name."
  - "Item 4.1 of the requerimento is a written commitment with a technical shape: 'restrição de projeto, e não
     configuração' means the code must have NO configurable room address, or the sentence is false and
     verifiably so."
  - "ADR-0034's own rule decides the timing: a password is a contract with paper, and it may not be changed in
     silence. It has zero installed base — nothing displays one — so this is the free moment, and the only one."

considered-options:
  - "N1 — keep ADR-0034's progress password alongside the new design"
  - "N2 — retire the progress password; the only code is the teacher's room key; no child data here (chosen)"
  - "N3 — keep a local, anonymous save (localStorage only, no identity)"

pros-and-cons-of-the-options:
  keep-the-progress-password:
    good: ["The work is already written and tested."]
    bad: ["It restores state that no longer exists: a fifteen-minute minigame has nothing to restore.",
          "Sunk cost is not a reason. Keeping it means keeping a second identity concept beside the roster
           that Bússola Escolar already holds, and two identities is how data leaks."]
  no-save-no-child-data:
    good: ["The Inclusionist stops being a data controller or operator of anything.",
           "The avatar picker is better than any encryption scheme, because it removes the datum instead of
            protecting it — and it is friendlier: a child recognises her character faster than her typed name.",
           "It matches the requerimento already being filed, so the code and the petition say the same thing."]
    bad: ["The game becomes useless for progression without Bússola Escolar; the two ship together or the
           teacher gets a toy with no record.",
          "`core/password` is left with no caller — a tested module waiting for a screen that does not exist."]
  anonymous-local-save:
    good: ["No identity, and it survives a browser refresh."]
    bad: ["It does NOT survive the nightly restore, which was the entire motivation of ADR-0034 — so it buys
           the complexity of a save without buying the property the save existed for."]

decision-outcome:
  chosen-option:
    link: "N2 — no save, no child data, and the only code is the teacher's room"
    justification: |
      WHAT IS DELETED, and it is deleted rather than deprecated: `app/js/game/progress.ts` and
      `tests/progress.node.test.js`. Their whole subject — which activity and which level a child was on — is
      not the game's to remember under the new design. Deprecating them would leave two answers to the same
      question in the tree, and the wrong one would be found first.

      WHAT SURVIVES, and why it is not sentiment: `core/password`. The teacher's room code is the same
      engineering problem the progress password was — a handful of bits copied off a blackboard by a
      seven-year-old, where a mistyped code that is ACCEPTED is worse than one refused. The failure just
      changed shape: instead of loading another child's progress, it drops her into another class's room, doing
      another teacher's activity. The exhaustive verification is exactly as load-bearing as it was.

      The module is now WITHOUT A CALLER, and that is written in its own header rather than left for someone to
      discover in three months. It stays because the room screen will need it and because deleting it would
      mean rewriting a proof that is already green — not because anything uses it today.

      THE PRIVACY POSITION, stated so it is not softened later: the Inclusionist stores NOTHING about a child.
      Not a name, not a nickname, not a hash of a name. The roster is Bússola Escolar's, the identity is an
      avatar chosen from that roster, and the room is a machine on the school's own LAN. An earlier draft of
      this design had the child type her first name, protected by an HMAC under a class key held by the
      teacher. That draft is recorded here as rejected, with its reason: a hash of a first name is NOT
      anonymous — the space is a few thousand common names and enumerable in under a second — so it would have
      required a key we do not hold, which is machinery to protect a datum the avatar picker simply does not
      collect.

      LAN ONLY, AS A PROJECT RESTRICTION. There must be no configurable room address anywhere: no setting, no
      environment variable, no build flag pointing at a host outside the local network. This is not a
      deployment preference — it is the sentence the requerimento already commits to, and a gate is what makes
      the commitment auditable instead of merely stated.

  consequences:
    good:
      - "The whole LGPD surface leaves this repository. Not mitigated — absent."
      - "One day of work is discarded at the only moment it was free: no password exists anywhere in the world,
         because nothing has ever displayed one."
      - "The engine gets a smaller job, which ADR-0035 argues is the accessibility budget itself."
    bad:
      - "`core/password` is a tested module with no consumer, which is debt however well it is documented."
      - "The Inclusionist's usefulness for progression now depends on a system in another repository that this
         record does not control."
    neutral:
      - "SUPERSEDES ADR-0034 in full. That record is kept and marked, not deleted: it holds the analysis of why
         a password beats an account and a save file for a wiped school machine, and that analysis is what the
         teacher's room code will be judged against."
      - "The room server itself — where it runs, what protocol, whether Colyseus — is not decided here. What IS
         decided is that it is not on the open internet and that the data it carries is not this project's."

  confirmation: |
    Three checks, of which only the first exists today:

      · `tests/password.node.test.js` still passes (26 cases), and `app/js/game/progress.ts` is gone — the tree
        no longer contains a second answer to "what does the game remember".
      · A GATE IS OWED, and this record is where the debt is written down: no source file may contain a
        configurable address for the room — no `http(s)://` outside the local network, no env var, no setting.
        It is the machine-checkable form of item 4.1 of the requerimento, and it should be written before the
        room screen is, not after.
      · The room code, when it exists, must be verified by the same exhaustive standard: every single-symbol
        substitution and every transposition rejected, because the failure mode is a child in the wrong class.

more-information: |
  The requerimento (`requerimento_monte_aprazivel_5.docx`, filed with the Município de Monte Aprazível) is the
  external document this record depends on. Its item 15 recognises that the patrimonial rights over software
  produced in the course of the author's duties belong to the Município — which is also why ADR-0036 scoped the
  package `@pm-monte` rather than to the developer.

  A LICENSING ITEM IS PENDING AND IS NOT DECIDED HERE. The requerimento proposes publication under AGPLv3, and
  the server side of a classroom room is precisely where AGPL differs from GPL: running a service is not
  distributing, so GPL-3.0 obliges nobody to release a hosted server's source, and AGPL does. This repository
  and the demos repository are still GPL-3.0-or-later, in 274 SPDX headers. Relicensing is an act on code whose
  patrimonial owner is the Município and whose publication licence is the subject of a pending petition — so it
  waits for the act the petition asks for, rather than being done ahead of it by a script.
