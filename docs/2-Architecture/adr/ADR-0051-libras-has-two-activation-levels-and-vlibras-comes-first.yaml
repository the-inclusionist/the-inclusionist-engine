  errata:
    - date: 2026-09-27
      what: >-
        THE CONFIRMATION WAS STALE, and what this record still decides is built. ADR-0234 replaced level one and the
        tap-the-icon gesture with deaf mode and the sonar; what stands here is held. Written content reaches Libras —
        the sonar hands the screen's text to the interpreter (engine `c8b18e83`) — and the text stays written beside it;
        turning deaf mode off takes the interpreter away and the sonar speaks as before; nothing is built from zero —
        the free player signs the GPL-3.0 signs of the VLibras suite's makers, LAViD-UFPB (engine `a3827e63`); and the
        licence travels with them, each delivered clip with its `.blend` pinned as Corresponding Source and the GPL-3.0
        beside it.
  superseded-in-part:
    - by: ADR-0234
      what: >-
        Level one (the interpreter appears while audio plays) and the tap-the-icon-then-the-text gesture: replaced by a deaf mode in which every sound is captioned and the sonar calls the interpreter over what is on screen. VLibras first and the retirement of the zdog engine stand.
