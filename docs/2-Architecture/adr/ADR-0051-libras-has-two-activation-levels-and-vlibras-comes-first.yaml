title: Libras has TWO activation levels — an interpreter on demand, and Libras as FIRST language — and VLibras is used before anything is built

context-and-problem-statement: |
  Two things were wrong, and they pulled in opposite directions.

  FIRST, THE ADRs UNDERSTATED THE OBLIGATION. Pillar 2 and issue #59 treat Libras as an interpreter that appears
  when audio plays. The requerimento (§55.f) states the law more strictly: art. 60-A of the LDB, added by Lei
  14.191/2021, defines bilingual education of deaf students as Libras as FIRST language and written Portuguese as
  SECOND. Its conclusion is blunt — "um sistema educacional não cumpre a lei apenas legendando". Captioning is not
  the ceiling; it is the second language.

  SECOND, THE ADRs OVERSTATED WHAT WE SHOULD BUILD. Pillar 2 said "Libras em motor zdog à parte" — our own engine.
  The requerimento (IV.4) sets the opposite priority, and the reason is public money: "construir do zero aquilo que
  já existe sob licença livre é desperdício de recurso público". The VLibras Suite (UFPB, Brazilian Public
  Software, LGPL-3.0) is named there as "a primeira opção, e não uma entre outras".

decision-drivers:
  - "For a deaf child, Libras is not an accessibility feature bolted onto the content — it is the language the
     content is in. The distinction changes what has to be translated, not merely when."
  - "Written Portuguese cannot be replaced either: Lei 10.436 art. 4º says Libras does not substitute it. The
     requirement is coexistence, so both channels stay."
  - "Building a sign-language engine with public money while a free one exists is the definition of waste, and the
     requerimento already committed the Município to the opposite."
  - "Reversibility: a better engine may appear, and the decision must not have to be re-argued when it does."

considered-options:
  - "L1 — one level: an interpreter that appears with audio (what the ADRs had)"
  - "L2 — two levels: interpreter on demand, plus Libras as first language over written content"
  - "L3 — build our own engine (zdog), as pillar 2 said"

pros-and-cons-of-the-options:
  L1:
    good: ["Cheapest, and satisfies WCAG 1.2.6 (AAA) for prerecorded audio."]
    bad: ["Does not satisfy art. 60-A for a deaf student: everything WRITTEN stays inaccessible in her first
           language, and most of a school activity is written."]
  L2:
    good: ["Answers the guideline and the law separately, because they ask different things.",
           "The second level is opt-in per player, so the child who does not need it never sees it."]
    bad: ["Translating arbitrary written content is where automatic sign translation is weakest — the requerimento
           itself carries that caveat, and this record must not promise more than the technology gives."]
  L3:
    good: ["Full control of quality and of the avatar."]
    bad: ["Duplicates a working, free, federally maintained solution.",
          "It was never costed, and no genre outside this game needs it before VLibras is exhausted."]

decision-outcome:
  chosen-option:
    link: "L2 for the feature, and VLibras first for the engine — L3 only if something better appears"
    justification: |
      ===== 1. LEVEL ONE — INTERPRETER ON DEMAND =====
      What WCAG 1.2.6 (AAA) asks. The window appears automatically while audio or video plays and leaves when it
      ends. This is the level every player can turn on, deaf or not, and it is the one issue #59 already describes.

      ===== 2. LEVEL TWO — LIBRAS AS FIRST LANGUAGE =====
      For the deaf student, under art. 60-A. It applies **also to everything WRITTEN**, because written Portuguese
      is the second language: the player taps the Libras icon and then taps the written thing she wants in her
      first language.

      ⚠️ THE INTERACTION IS TAP-THE-ICON-THEN-TAP-THE-TEXT, and that is deliberate rather than automatic
      translation of the whole screen. Translating everything at once would bury the activity under a video; and
      pointing at what you want is how a first language is used, not how a subtitle works.

      ⚠️ AND BOTH CHANNELS STAY. Lei 10.436 art. 4º parágrafo único is explicit that Libras does not replace
      written Portuguese. Level two adds a language; it never removes the text.

      ===== 3. VLIBRAS FIRST, AND THE ZDOG CLAUSE IS RETIRED =====
      The VLibras Suite is the implementation, with a fallback. Pillar 2's "Libras em motor zdog à parte" is
      withdrawn — it committed this project to building what already exists under a free licence.

      A better engine may replace it later, and the record is written so that swapping is a decision about quality
      and not a reversal of principle. Two constraints travel with any replacement:

        · LICENCE FIRST. The requerimento warns (IV.4) that not every public sign-translation project is free
          software — several carry non-commercial clauses that are incompatible with AGPLv3. Compatibility is
          checked before incorporation, never after.
        · VLIBRAS ITSELF NEEDS THE AUDIT. The same section notes that some repositories of that organisation have
          no declared licence. LGPL-3.0 covers the Suite; it does not cover everything published beside it.

      ===== 4. THE OTHER SIGN LANGUAGES ARE NAMED, NOT PROMISED =====
      The requerimento lists what would be considered, with the correct codes: Libras (bzs), LSA (aed), LSM (mfs),
      LSC (csn), LSCh (csg) and ASL (ase). None is committed here.

      ⚠️ AND "INTERNATIONAL SIGN" IS NOT A LANGUAGE and never a route to content. The World Federation of the Deaf
      recommends it not be classified as a natural language; it is a contact variety for international meetings. It
      does not substitute for Libras under any circumstance.

  consequences:
    positive:
      - "The legal obligation is stated where engineers read it, instead of only in the document filed with the
         Prefeitura."
      - "Public money stops being committed to rebuilding VLibras."
      - "Level two is opt-in, so nothing changes for the player who does not need it."
    negative:
      - "Level two depends on automatic translation of arbitrary text into Libras, which is the weakest part of the
         available technology. The record must not be read as promising fluent translation of everything written."
      - "A dependency on another project's roadmap and quality, mitigated only by the fallback."
    neutral:
      - "WCAG 1.2.6 is AAA and the project targets AA overall — level one is already above the declared floor, as
         §53 of the requerimento intends for entry screens and accessibility menus."

  confirmation: |
    ✅ The gates in confirmed-by: level two reaches WRITTEN content — the sonar hands exactly the screen's text to the
    interpreter (ADR-0234); the text is written beside the signing and never removed; turning deaf mode off takes the
    interpreter off the screen and the sonar speaks as it did; and the licence gate over the sign-language dependency —
    every delivered clip pinned with its `.blend` as Corresponding Source, the GPL-3.0 and its notice in the folder.

    ⚠️ WHAT NO TEST CAN CONFIRM: whether the translation is GOOD. Only deaf users and Libras interpreters can say, and
    that is issue #6 and issue #7 territory. A green gate here means the text reached the interpreter, not that it said
    anything.

more-information: |
  Retires the "Libras em motor zdog à parte" clause of ADR-0010 pillar 2 and widens issue #59 from one level to two.
  Related: ADR-0014 (auditory accessibility), ADR-0046 (the caption is CONTROL and a simulation may not degrade it —
  the same reasoning applies to the Libras window).

  Deliberately NOT decided here: the avatar's appearance, whether the window is resizable, and whether the
  additional sign languages are ever built.
