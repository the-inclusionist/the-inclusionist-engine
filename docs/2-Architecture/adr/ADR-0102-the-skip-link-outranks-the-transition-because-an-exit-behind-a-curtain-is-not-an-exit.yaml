title: The skip-link outranks even the phase transition, because an exit behind a curtain is not an exit — and during the transition nobody is tabbing anyway

context-and-problem-statement: |
  The z-order table of ADR-0020 assigned the skip-link to `CAPTIONS` (26000). Read literally, that places the
  keyboard's way OUT of a screen underneath every menu and every modal scrim on it.

  Nothing broke, because nobody implemented the table for that element: `.skip-link` in `style.css` carried a
  literal `z-index:100`, which sits above the sheet's own 60 for menus. The defect lived entirely in the
  record — and the adoption ledger in `tests/z-order-css.node.test.js` had it written down verbatim, as the
  only entry in that list whose note says the TABLE is what is wrong.

  ⚠️ A record that states the wrong order is not harmless while unimplemented. It is what the next person
  implements. The engine's own page had no skip-link element at all until this record was written, so the
  first implementation would have been made from the table.

decision-drivers:
  - "An emergency exit must not sit behind anything the person does not control. That is the whole argument,
     and everything below follows from it."
  - "The 1000-step scale of ADR-0020 exists so a new slot never forces a renumber — and there is no free room
     between `MENU_MAX` (39999) and `TRANSITION` (40000), so 'just above the menus' is not available without
     moving the transition."
  - "The skip-link is visible only on focus (`top:-60px` until `:focus`), so placing it high costs no pixels
     to anyone who is not using it."
  - "The stylesheet already worked. Whatever this record decides has to keep working, not start working."

considered-options:
  - "S1 — SKIP_LINK: 41000, above TRANSITION, below LOOP_CRASH"
  - "S2 — a slot between MENU_MAX and TRANSITION"
  - "S3 — declare the skip-link 'not a layer', the way the CRT is not a layer"
  - "S4 — leave the table as it is and keep the literal 100 in the stylesheet"

pros-and-cons-of-the-options:
  S1:
    good: ["The exit is never behind anything a person does not control, including a phase fade.",
           "Costs nothing visually: the link only appears on focus.",
           "Fits the existing scale with no renumbering — 41000 is free, and 45000 (LOOP_CRASH) stays above."]
    bad: ["The link can render over a transition animation, which looks odd for the half second it lasts."]
  S2:
    good: ["Keeps the transition as the topmost normal layer, which reads tidily."]
    bad: ["⚠️ There is no room: MENU_MAX is 39999 and TRANSITION is 40000. It requires renumbering the
           transition — the exact cost the 1000-step scale was designed to avoid.",
          "And it leaves the exit behind the fade, which is the thing being fixed."]
  S3:
    good: ["Zero work."]
    bad: ["Category error in the other direction. The CRT is post-process and has no element; the skip-link IS
           a DOM element with a z-index, and something has to decide what that number is.",
          "Leaves the record stating the wrong order, which is what the next person implements."]
  S4:
    good: ["Nothing to change today, since the stylesheet is already correct."]
    bad: ["Keeps a record that argues against the code. The project has already measured what that costs: a
           record stating the old position 'volta a argumentar contra ele na conversa seguinte'."]

decision-outcome:
  chosen-option:
    link: "S1 — SKIP_LINK: 41000, and the transition stops being able to hide the exit"
    justification: |
      ===== 1. THE SLOT =====
      `SKIP_LINK: 41000`, between `TRANSITION` (40000) and `LOOP_CRASH` (45000). Only the dead-loop notice and
      the debug panel outrank it, and both are correct: a frozen frame has nothing left to skip to, and the
      debug panel is for the developer.

      `--z-skip-link: 41000` joins the `:root` block, and `.skip-link` adopts it. The gate that ties every
      overlay slot to its CSS variable covers the pair, so the two cannot drift.

      ===== 2. THE COST, AND WHY THE DEV'S AMENDMENT REMOVES IT =====
      The single cost of S1 is that the link could appear over a phase transition. The Dev removed it rather
      than accepting it, and the rule is the second half of this decision:

        ⚠️ DURING THE TRANSITION IT IS NOT POSSIBLE TO TAB AT ALL. The focus position of the OUTGOING screen
        disappears, and half a second later focus lands on the FIRST ITEM of the incoming screen — or on the
        position saved for it.

      That is not only a fix for this record's cost. It is the correct behaviour on its own: focus that stays
      on a screen being wiped away is focus on something the person can no longer see, and a Tab press during
      a wipe would move it through a screen that is leaving. The rule makes the transition a moment with no
      keyboard surface, which is what it visually already is.

      ⚠️ IT IS A CONTRACT AND NOT YET CODE, and this record says so plainly: the engine has NO transition
      implementation. `Z.TRANSITION` is declared and nothing draws a wipe; `ui/activities-menu` receives
      `setPhase` by injection, from the game. So this clause binds whoever builds one — here or in a game —
      and the gate for it is owed the day the wipe exists.

      ===== 3. AND THE ELEMENT NOW EXISTS =====
      Writing this found that the engine's own page had no skip-link at all. The stylesheet had the rule, the
      dictionary had the sentence (`skip.toGame`), the Z table had an opinion about the layer — and no page
      rendered the element. `app/quiz.html` renders it now, first in the body, targeting `#game-region`,
      which already carries `tabindex="-1"` for exactly this kind of programmatic focus.

  consequences:
    positive:
      - "The keyboard exit is reachable from every state a person can reach."
      - "The adoption ledger of `z-order-css` shrinks by one entry, and by REPAIR rather than by exception —
         the first line to leave that list for the right reason."
      - "The engine's page gains a skip-link it had been fully specified for and never had."
    negative:
      - "One more slot in a table whose value is being small and stable."
      - "The focus rule is a promise with no gate until a transition exists to gate it. It is written here so
         that the first implementation is measured against it rather than inventing its own answer."
    neutral:
      - "The stylesheet's behaviour is unchanged: 100 and 41000 both sat above everything else declared."

  confirmation: |
    · `tests/z-order-css.node.test.js` — every overlay slot has a `--z-*` variable with the identical value,
      and the ledger no longer carries the `100`. Confirmed red by removing the variable.
    · `tests/layers.node.test.js` — the slot exists and sits above `TRANSITION` and below `LOOP_CRASH`.
    · The skip-link element is in the built page, and axe reports 0 WCAG A/AA violations on it.
    · ⚠️ NOT CONFIRMED, and owed: the focus rule of §2. There is no transition in this repository to measure
      it against. Whoever writes one owes the gate: no tabbable surface during the wipe, and focus landing on
      the first item or the saved position afterwards.

more-information: |
  The literal `z-index:100` was right all along, which is the part worth remembering. The ledger entry that
  recorded it — «O `Z` ERRA, não o CSS» — was written when the gate was built and sat there, correct and
  unactioned, until issue #52 was measured. A defect that is already written down is not thereby handled.

  Deliberately NOT decided here: whether the skip-link's target is per-page or per-screen, and what a game
  with several regions should offer beyond one link.
