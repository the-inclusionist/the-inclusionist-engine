title: The pointer is a DECLARED CAPABILITY beside the fourteen, not an axis on them — and on a keyboard the continuous signal is the mouse

context-and-problem-statement: |
  The virtual controller has fourteen positions and all of them are DISCRETE. Measured on 2026-09-08, the
  engine has no continuous input anywhere, and the loss is not the webcam's:

    · **gamepad** — has analog and throws it away AT THE SOURCE. `PadState = Record<string, boolean>` and
      `PAD_DEAD = 0.5`, whose own comment reads «zona morta = primeira METADE do curso do analógico
      (ergonomia — José 2026-07-02)». A child pushing the stick to 49% produces nothing; at 51% she produces
      the full value.
    · **touch** — HAS the continuous position (`PointerLike { clientX, clientY }`) and uses it only to
      hit-test which virtual button was pressed. The position dies at the button.
    · **webcam** — has it (`emFracao`, from issue #105) and `onGaze` discards it in three thresholds.
    · **keyboard** — has none, and never could.

  ⚠️ SO THE QUESTION WAS NEVER «SHOULD WE ADD ANALOG FOR THE CAMERA». It is whether this engine is discrete by
  CHOICE or by inheritance, and it had never been asked.

  What it costs was measured in the catalogue rather than argued: **category 19 of 35 — «Desenho / Criativo»
  — is impossible without continuous input, in full.** Etch-a-Sketch («2 knobs · linha contínua»), drawing
  canvas, pixel-art editor, colouring book, Pictionary, «desenho com 1 linha, sem levantar a caneta»,
  connect-the-numbered-dots. Plus parts of at least three more categories: twin-stick aiming, particles
  reactive to the pointer, rotation puzzles, drag-to-clean.

  And ADR-0074 already named the danger of not having it: a game that needs a pointer «invents its own input
  path beside the engine's — and the second is how an engine stops being one».

decision-drivers:
  - "One whole category of the catalogue is blocked, and pieces of three more. That is a product fact, not an
     aesthetic one."
  - "⚠️ Every accessibility mechanism already built — remapping, one-button, latching, reach — is defined over
     DISCRETE actions. Anything that makes them answer a second question costs three hundred games."
  - "A game must be able to say it needs a pointer, so a device without one can refuse BEFORE the child
     starts rather than failing mid-activity (ADR-0079, issue #112)."
  - "What is not decided must be decidable later without a second major."

considered-options:
  - "P1 — stay discrete: the fourteen and nothing else"
  - "P2 — analog MAGNITUDE on the fourteen: each position carries 0..1"
  - "P3 — a POINTER as a declared capability beside the fourteen, which stay discrete"

pros-and-cons-of-the-options:
  P1:
    good: ["Costs nothing today, and every a11y rule stays valid unchanged.",
           "Discrete + dwell is often the MORE accessible design for severe motor impairment — holding a
            precise analog value is exactly what is hard, which is why issue #11 designs the eyes as «8
            sectors, dwell»."]
    bad: ["Category 19 leaves the catalogue permanently.",
          "Transports 8 and 9 never get a foundation, and issue #105 closes by decision rather than by
           construction.",
          "⚠️ A game that needs a pointer builds its own input path beside the engine — the failure ADR-0074
           named."]
  P2:
    good: ["Serves aiming and proportional movement.",
           "Reuses the existing fourteen with no new concept."]
    bad: ["⚠️ IT DOES NOT UNBLOCK DRAWING, which is the measured cost: drawing is POSITION, not magnitude.",
          "It imposes a second grammar on every accessibility rule — what does «half pressed» mean for
           one-button, for latching, for the reach screen? — to serve a case almost no catalogue game asks
           for."]
  P3:
    good: ["It is what the catalogue actually needs.",
           "The fourteen stay discrete, so remapping, one-button, latching and reach keep working with no
            change at all.",
           "It plugs into machinery that exists: ADR-0079's per-SET reachability already refuses a device
            that cannot carry a game's needs, before the child starts.",
           "`input/pointer-space` is already half the foundation, and issue #105 is already open with the
            right title.",
           "It does not foreclose P2: magnitude can be added later as its own decision."]
    bad: ["A new capability is a new thing to keep stable across three hundred games.",
          "Not every device has one, so a game that declares it excludes hardware — which is why the refusal
           must happen before the child starts and not during."]

decision-outcome:
  chosen-option:
    link: "P3 — a pointer as a declared capability; the fourteen stay discrete"
    justification: |
      ===== 1. THE POINTER IS DECLARED, NOT ASSUMED =====
      A game declares that it needs a pointer. The engine binds one from whatever the child has: mouse,
      touch, gamepad stick, or gaze. The fourteen positions are untouched and remain discrete.

      ⚠️ AND THE DECLARATION IS THE HALF THAT MATTERS, because it is what lets a device REFUSE IN ADVANCE.
      ADR-0079 already decided that reachability is per SET — «at least one AVAILABLE transport carries this
      game's action set» — and a pointer requirement joins that set. A Chromebook with no mouse and no touch
      says so on the selection screen (issue #112), instead of a child discovering it halfway into a drawing.

      ===== 2. ON A KEYBOARD, THE CONTINUOUS SIGNAL IS THE MOUSE =====
      The Dev's clause, and it is what completes the record rather than decorating it: a keyboard has no
      continuous signal and never will, so the pointer beside it is the MOUSE.

      ⚠️ THIS IS WHAT GIVES TRANSPORTS 8 AND 9 THEIR FOUNDATION. ADR-0074 §2 labelled «full alphanumeric
      keyboard + mouse» and «half keyboard + mouse» as not partially built but WITHOUT FOUNDATION, because
      `input/` had keyboard, gamepad and touch and no pointer at all. That sentence stops being true here:
      the pointer is the foundation, and the mouse is how those two transports reach it.

      ===== 3. WHY NOT MAGNITUDE ON THE FOURTEEN, WHICH IS THE OPTION THAT LOOKS CHEAPER =====
      Because it does not buy the thing that is blocked. Drawing needs a POSITION; a stronger `action1` is not
      a line on a canvas. And it would make every accessibility rule already built answer a question no
      catalogue game is asking: what one-button does with a half-pressed action, what latching means for a
      value that is neither on nor off, what the reach screen says about a position that can be partially
      reached. That is the cost of a second grammar, paid across three hundred games, for a case nobody
      requested.

      📌 AND IT STAYS AVAILABLE. Magnitude on the fourteen is a separate decision that this record does not
      close; if a game ever needs proportional movement, it gets its own record and this one does not have to
      be undone.

      ===== 4. WHAT THIS SAYS ABOUT THE CHILD WHO MOVES ONLY HER FACE =====
      ⚠️ IT SAYS LESS THAN IT FIRST APPEARED, and the correction belongs in the record because the argument
      was nearly made the wrong way. Continuous control is NOT obviously better for severe motor impairment:
      holding a precise analog value is exactly what is hard, and discrete plus dwell is frequently the
      accessible design — which is why issue #11 specifies the eyes as «8 sectors, dwell».

      So the pointer is justified by the CATALOGUE, not by accessibility. What accessibility asks of it is
      different and narrower: that a child who reaches the pointer by gaze or by face can do everything a
      child with a mouse can do, and that a device without one refuses in advance rather than in the middle.

      ===== 5. A CONSEQUENCE NAMED RATHER THAN DISCOVERED =====
      ⚠️ IF THE GAMEPAD STICK EVER DRIVES THE POINTER, `PAD_DEAD = 0.5` COMES BACK TO THE TABLE. Half the
      stick's travel as dead zone is correct ergonomics for a BUTTON — it stops a resting thumb walking the
      character — and wrong for a CURSOR, where it would make the first half of every movement do nothing.
      Written here so that whoever wires it finds the question already asked.

  consequences:
    positive:
      - "Category 19 of the catalogue becomes buildable, and with it the parts of three more that need aiming
         or dragging."
      - "Transports 8 and 9 of ADR-0074 stop being foundationless; issue #105 closes by construction."
      - "Every existing accessibility mechanism keeps working unchanged, because the fourteen do not move."
      - "A game that needs a pointer can be refused by a device before the child starts."
    negative:
      - "A game that declares a pointer excludes hardware that has none. The refusal screen is what makes that
         honest rather than silent, and it is issue #112's work."
      - "The virtual controller grows a second concept, so it is a wider surface to keep stable."
      - "⚠️ Gaze as a pointer is imprecise, and a drawing activity driven by gaze may be frustrating in a way
         no gate can measure. That needs a child in front of it (issue #7)."
    neutral:
      - "Magnitude on the fourteen stays open and is compatible with this."
      - "`PAD_DEAD` is untouched until the stick is actually wired to the pointer."

  confirmation: |
    ⚠️ NOT YET BUILT. This is the contract; `input/pointer-space` is half the foundation and issue #105 is the
    work. Written first so the implementation has something to be measured against.

    The gates it owes:

    · A GAME THAT DECLARES A POINTER IS REFUSED BY A DEVICE THAT HAS NONE, before it starts — asserted through
      ADR-0079's per-set reachability, not by a separate mechanism, or there will be two answers to one
      question.
    · THE FOURTEEN STAY DISCRETE — a case that no position carries a magnitude. ⚠️ This is the gate that keeps
      P2 from arriving by accident, one convenient field at a time.
    · A POINTER REACHED BY GAZE OFFERS THE SAME OPERATIONS AS ONE REACHED BY MOUSE, so «declared capability»
      does not quietly mean «mouse only».
    · THE POINTER CARRIES ITS SOURCE, like every other command (ADR-0111) — a drawing made by gaze and one
      made by mouse must be distinguishable by the engine, because latching and the assisted-transport rules
      of ADR-0109 depend on knowing which device is in use.

more-information: |
  Supersedes ADR-0074 in part: §2's statement that transports 8 and 9 «have no foundation». Everything else in
  ADR-0074 governs — the fourteen positions, the game supplying the words, no abstract name reaching a person,
  and the nine transports.

  Deliberately NOT decided here: magnitude on the fourteen; how a pointer is calibrated for gaze; whether a
  game may declare a pointer as OPTIONAL enrichment rather than a requirement; and how many pointers a
  multiplayer game may have at once.
