             NO WAY OUT. `ITENS_DA_ENGINE` is `{options, pmback, acessibilidade}` and `create-game`'s own
             `acoesDaEngine` table never defined `resume`, so `itensQueAccionam` cut «continue» from the pause
             card of EVERY game that only calls `createGame`. And Escape did not close it either:
             `ui/menu-nav:403` calls `ctx.setPhase('playing')` and nothing else — no card is hidden — and that
             port was the cartridge's `setPhase` with an empty default. Nobody had noticed because NOTHING
             OPENED THE CARD. ⚠️ Opening a door with no way out is worse than not opening it: it is ADR-0106 §5
             in so many words, and the child who would be trapped is the one who navigates without seeing, who
             has no mouse to fall back on. ✅ So the engine now also SUPPLIES the exit: `acoesDaEngine.resume`
             hides its own card and asks the game to resume, and the `setPhase` handed to `ui/menu-nav` is the
             engine's, which hides the card before passing the phase on to the cartridge. The cartridge still
             overrides both — `getPauseActs` spreads the game over the engine — because resuming can mean
             unfreezing physics and audio, which is the game's. What the engine guarantees is that an exit is
             never MISSING. 📌 And this unlocks a third thing the `getPauseActs` field already recorded as a
             loss: `entrarNaBarra` calls `acts.resume?.()` before handing the d-pad to the accessibility bar;
             with an empty table that was `undefined`, and item 7 of ADR-0044 was «unreachable from any game».
