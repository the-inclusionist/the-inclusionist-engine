title: The pad wizard says when it closes, and the focus comes back to where it was

context-and-problem-statement: |
  The gamepad transport opens its own mapping wizard when an unknown pad (DirectInput) presses a button, and it may open
  over the pause card. When it finishes normally its `onClose` (input/gamepad.ts) hides the overlay but never gives the
  focus back: it drops to the page's body, and a screen reader loses the child's place. The code that knows the wizard
  ended is the transport's; the code that owns the focus is the root's. Nothing connects them.

decision-drivers:
  - "A child who uses a screen reader must never be left with the focus nowhere"
  - "The engine should be right first; the games adapt to it (the Dev)"

considered-options:
  - "A · A REQUIRED port on `GamepadCtx` the transport calls when its wizard closes"
  - "B · The same port, optional"
  - "C · No port: the root polls whether the wizard closed"

pros-and-cons-of-the-options: |
  **A.** ✅ Every consumer restores focus; the compiler names who has not. ❌ Breaks a game that builds `GamepadCtx` by
  hand (game-platformer) until it adds one line. **B.** ❌ A game that forgets it keeps the defect in silence. **C.** ❌ A
  poll every frame for an event.

decision-outcome:
  chosen-option:
    link: "A — a required port"
    justification: |
      `GamepadCtx` gains a required port the transport calls once when its wizard closes, whichever way it ends; the root
      answers by restoring the focus it held before the wizard opened (as `closeControl` already does for Escape).
      BREAKING, with a migration note: a game that builds the ctx passes a function (the root's own answer when it uses
      `createGame`).

  consequences:
    positive:
      - "The focus always returns after a pad wizard, for every game"
    negative:
      - "game-platformer's `initGamepad` call must add the port when it moves to this version"

  confirmation: |
    ✅ The gates in confirmed-by: the transport's wizard, opened by itself over the open pause card and finished normally
    (saved at its last step), leaves the focus on the card's item it left, the card no longer inert; the same when it is
    cancelled by «Voltar» or by Escape; the transport says the wizard closed once per close — saved, cancelled, by its cancel
    button — with the overlay already hidden, and, when it paused the game, after the game resumed; a `GamepadCtx` without
    `wizardClosed` does not compile. Red under each mutation: the port never called, the root's answer doing nothing, the
    port called before the overlay is hidden, the port called before the resume, and the port made optional (`tsc`).

more-information: |
  Games are not edited from the engine's session; game-platformer adds the port when it moves to the version that has it.
