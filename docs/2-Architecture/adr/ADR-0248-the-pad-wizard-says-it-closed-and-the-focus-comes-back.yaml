  decision-makers: [Dev]
  consulted:
    - "The Dev, 2026-09-26, choosing a REQUIRED field over an optional one or none: «Campo obrigatório. Os jogos já estão quebrados, melhor fazer a engine o mais \"certinha\" possível e fazer com que eles se adequem a ela em seguida.»"
    - "Commit 05fa4cbd — Escape and «Voltar» cancel whichever pad wizard is mapping, and restore focus; the NORMAL end of the transport's own wizard does not"
