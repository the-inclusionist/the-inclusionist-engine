metadata:
  status: "accepted"
  # A separação estrutural passou a ter gate em 07/09 (issue #85), e o registo dizia a dívida em vez de a
  # esconder — «the gate is owed». Ele afere as duas metades: o controlo FORA da `.screen-exp` e a
  # experiência DENTRO dela, porque um gate só do lado do controlo aprovaria esvaziar o outro.
  # O `alcanceDoModo` (§ do mesmo registo) continua aferido em `viz-setters`, e é por isso que ele está aqui.
  confirmed-by:
    - app/js/ui/hud.ts
    - tests/hud.browser.test.js
    - tests/viz-setters.node.test.js
  supersedes-in-part: [ADR-0020]
  date: 2026-08-26
  decision-makers: [Dev]
  consulted:
    - "ADR-0010 (pillars: a11y-first)"
    - "ADR-0011 (visual accessibility — the sim-* / fix-* families and their sources)"
    - "ADR-0020 (z-order + post-fx chain; amended 2026-08-26 and 2026-08-27)"
    - "ADR-0029 (the changed-from-default mark, which is how a mode is undone)"
    - "ADR-0044 (one menu per screen — the quick bar leaves the pause card for the HUD)"
    - "issue #82 — the two filter families and the brightness(0) trap"
  informed: []

title: A SIMULATION is not an accessibility feature — so the partition is by ROLE (experience × control), not by canvas × DOM

context-and-problem-statement: |
  The visual modes of this game are TWO families that had been treated as one, because they share a mechanism
  (a CSS filter) and a panel:

    · CORRECTION (`fix-*`, high contrast, L→Q enhancement) — exists to GIVE access. It must reach everything the
      child looks at, menus included. Not reaching the menus was a defect, fixed in `45bf345` / `875a43c`.
    · SIMULATION (`sim-*`, `lv-*`, `blind` — the Empathy Mode) — exists to TAKE it away, on purpose, so that a
      sighted adult or classmate feels what the barrier is like.

  The Dev put it in one sentence, and the sentence is the whole decision:

    "IMPORTANTE: Modo empatia são simulações, e simulação NÃO É ACESSIBILIDADE, é justamente o contrário, é criar
     dificuldade onde a facilidade não existe como forma de experiência."

  Treating the two families the same produces a specific trap, measured on issue #82: `blind` applies
  `brightness(0)`. If that filter reaches the menus, the pause card goes black — and the person inside the
  simulation has no way out of it, because the exit was painted over by the simulation itself.

  THE OBVIOUS PARTITION IS THE WRONG ONE. The frame is half PIXI canvas and half DOM, so "filter the canvas, spare
  the DOM" looks like the answer. It is not: the pedagogical activities (the quizzes) are DOM and MUST be degraded,
  and the HUD is DOM and must be degraded too. The Dev, on the proposal: "A partição não é 'canvas × DOM' — é por
  PAPEL. Correto."

decision-drivers:
  - "A simulation that degrades an accessibility feature is degrading the wrong thing: it removes the aid a DIFFERENT
     disability depends on, and teaches nothing about the one being simulated."
  - "Nobody may be trapped inside a simulation. Whatever the exit is, the simulation must not be able to paint over it."
  - "A correction must reach everything (ADR-0010, a11y-first). The rule that spares menus from simulations must not
     become a rule that spares them from corrections — that was the original defect."
  - "The classification has to be written per element, or it is not a rule: every future screen will ask 'and this one?'"

considered-options:
  - "P1 — one rule for both families: the filter reaches everything"
  - "P2 — partition by SURFACE: the PIXI canvas is filtered, the DOM is not"
  - "P3 — partition by ROLE: what is EXPERIENCE gets degraded, what is CONTROL never does"
  - "P4 — P3 plus a visible warning while a simulation is on"

pros-and-cons-of-the-options:
  P1:
    good: ["One mechanism, no classification to maintain, and corrections trivially reach the menus."]
    bad: ["`blind` blacks out the pause card: the simulation paints over its own exit.",
          "It degrades the caption track — a deafness feature — while simulating low vision."]
  P2:
    good: ["Mechanical, needs no judgement, and maps onto the two rendering paths that already exist."]
    bad: ["Wrong on both ends: the quizzes are DOM and MUST be degraded; the HUD is DOM and must be degraded.",
          "It would make the partition an accident of how the frame is drawn rather than a statement about what the
           mode is for — and the day an element moves from canvas to DOM its meaning would change silently."]
  P3:
    good: ["Says what the mode is FOR, so a new screen can be classified by asking one question.",
           "Corrections keep reaching everything; only simulations are bounded.",
           "The exit is a named part of the rule instead of a bug nobody hit yet."]
    bad: ["It is a judgement call per element, and two of them were genuinely hard (the caption, the touch controls).",
          "An element that is both experience and control has no home yet — the escape hatch has to be declared."]
  P4:
    good: ["Nobody wonders why the screen looks broken."]
    bad: ["The Dev rejected it, and the reason is pedagogical: 'facilita tirar e não viver a experiência caso o
           professor force a configuração'. A banner offering the way out defeats an exercise whose whole point is
           staying in it.",
          "It duplicates a signal that already exists — the ADR-0029 mark plus the indicator dot."]

decision-outcome:
  chosen-option:
    link: "P3 — partition by ROLE, with the exit declared as part of the rule"
    justification: |
      ===== 1. THE RULE =====
      A SIMULATION degrades EXPERIENCE and never touches CONTROL. A CORRECTION reaches everything.

      In code this is one function and one type, and they are deliberately small:
        · `AlcanceDoFiltro = 'mundo' | 'mundo-e-menus'`            (`render/port.ts`)
        · `alcanceDoModo(m) = simulatesDisability(m) ? 'mundo' : 'mundo-e-menus'`  (`render/viz-setters.ts`)

      In the DOM it is a SIBLING relationship and not a parent-child one, and that is not style — it is mechanism.
      CSS `filter` descends to every descendant and a child CANNOT cancel it. So `.screen-a11y` (the quick
      accessibility bar) is a SIBLING of `.screen-exp` (the experience). Anything that must survive a simulation has
      to live OUTSIDE the filtered subtree; there is no opting out from within.

      ===== 2. THE CLASSIFICATION, ELEMENT BY ELEMENT — because a rule without cases is an intention =====
      EXPERIENCE (a simulation must degrade it):
        · The world (canvas).
        · `#game-hud` — coins, power, objective. The Dev: "Experiência, o modo empatia precisa causar prejuízos aqui
          para que a pessoa experimente os prejuízos causados por uma deficiência." Losing track of your own score
          IS the lesson.
        · The PEDAGOGICAL ACTIVITIES — the quizzes, maths and literacy and whatever else is added. The Dev named
          them: "São as telas de atividade em curso, os quizes. A partir de agora vou me referir como atividades
          pedagógicas. As simulações de deficiência devem atrapalhar a experiência destes minigames." This is the
          case that kills option P2, since they are DOM.
        · The abandonment badge.

      CONTROL (a simulation must NEVER touch it):
        · The PAUSE menus. "os menus de pausa não devem ser atingidos pelo modo empatia."
        · The quick accessibility bar (`.screen-a11y`) — it is the panel where the mode gets switched off.
        · `#caption` — the caption track. The Dev: "Controle, são habilitados para facilitar a acessibilidade de
          outra deficiência." THIS IS THE SUBTLEST CALL IN THE RECORD and the one most likely to be "simplified"
          later: blurring a caption under a low-vision simulation is FAITHFUL to that simulation, and it is still
          wrong, because the caption is a DEAFNESS aid. A simulation of one disability may not remove the aid of
          another.
        · `#touch-controls` — and this one was argued and then settled. The touch pad IS the motor-disability aid:
          for a child with no physical controller it is the only input that exists, exactly as a wheelchair is.
          Blurring it under a low-vision simulation locks that child inside the mode with no way to pause. The Dev,
          on realising it: "MUITO BEM LEMBRADO! […] Isso bota um ponto final na discussão."

      ===== 3. THE EXIT IS PART OF THE RULE, NOT A DETAIL =====
      Two elements are named exits and are therefore OUTSIDE the filter, always:
        · The indicator dot — WHITE for blindness, GREEN for low vision (`vizDotFor`). In `blind`, `brightness(0)`
          would paint a white dot black, and the exit the whole no-warning decision depends on would vanish in the
          most severe mode of all.
        · `#touch-start`, for the same reason.

      This clause exists because the argument for having NO warning (§4) is only true if the exit is real. It is
      the condition that makes the other decision valid, not a refinement of it.

      ===== 4. NO WARNING WHILE A SIMULATION IS ON =====
      Rejected by the Dev, for a pedagogical reason: "O aviso me parece desconfortável: facilita tirar e não viver a
      experiência caso o professor force a configuração." What replaces it is already built: the indicator dot, and
      the ADR-0029 mark on any option that departs from its default — which is how a child undoes a mode she does
      not remember turning on.

      ===== 5. THE ESCAPE HATCH, DECLARED =====
      An element that is BOTH — a HUD that is itself the accessibility aid, say, in a game whose objective is read
      aloud — is CONTROL. The asymmetry is deliberate: misclassifying as experience can trap somebody; misclassifying
      as control only weakens a lesson. A SECOND such element is the signal to revisit this record, not to
      special-case it.

  consequences:
    positive:
      - "The pause card cannot be blacked out by the mode that blacks out the world, which is what issue #82 was."
      - "Corrections still reach every surface, so this record bounds simulations WITHOUT re-opening the defect that
         started the whole thread."
      - "A new screen is classified by one question — is this experience or control — instead of by precedent."
    negative:
      - "The DOM tree now carries a structural constraint that is easy to break by accident: putting a control INSIDE
         `.screen-exp` silently subjects it to every simulation, and nothing in the markup says so. It has to be a
         gate, not a comment."
      - "The caption call will look like an inconsistency to anyone who meets it without this record — a low-vision
         simulation that leaves one piece of text sharp."
      - "Classification at n=1 game. The quizzes are the only pedagogical activity that exists; the next genre may
         hold an element that is genuinely both."
    neutral:
      - "The two families already had separate prefixes (`fix-*` versus `sim-*`/`lv-*`/`blind`); this record gives the
         split a meaning instead of a naming convention."

  confirmation: |
    · REACH — `alcanceDoModo` in `render/viz-setters.ts`: simulation → `'mundo'`, everything else → `'mundo-e-menus'`.
      The correction path is asserted in the same place, so nobody can bound simulations by accidentally bounding
      corrections.
    · SIBLINGHOOD — `ui/hud.ts` builds `.screen-a11y` as a SIBLING of `.screen-exp`, with the reason written at the
      site: CSS `filter` descends and a child cannot cancel it.
    · THE EXIT — `vizDotFor` and `#touch-start` outside the filtered subtree.

    ⚠️ WHAT IS NOT YET GATED, said plainly rather than left to be discovered: there is no test that FAILS when a
    control is placed inside `.screen-exp`. Today the rule is enforced by two code comments and this record, which is
    exactly the strength of enforcement that the audit of `game-api.ts` calls "a rule that decays on the first hurried
    session". The gate is owed.

    ⚠️ AND NO TEST OF MINE CAN CONFIRM the pedagogy: whether a teacher running Empathy Mode on a class learns what the
    mode exists to teach. Issue #7 (field test) is where that is answered.

more-information: |
  Origin: issue #82, and the conversation of 2026-08-26 in which the Dev classified each element. Files:
  `app/js/render/viz-setters.ts` (`alcanceDoModo`), `app/js/render/port.ts` (`AlcanceDoFiltro`), `app/js/ui/hud.ts`
  (the sibling split), `app/css/style.css` (`.screen-exp` / `.screen-a11y`).

  Related: ADR-0011 (which sources the simulations themselves — Machado 2009 for the CVD family), ADR-0020 (the
  post-fx chain, and the 2026-08-27 amendment that every vision adjustment is per viewport), ADR-0029 (the mark that
  replaces the rejected warning), ADR-0044 (which moved the quick bar to the HUD, making the sibling split possible
  at all).

  Deliberately NOT decided here: whether Empathy Mode should degrade AUDIO in the same way, and what a simulation
  does on a screen that has no world at all (the catalogue, the teacher's room). Both wait for those screens.
