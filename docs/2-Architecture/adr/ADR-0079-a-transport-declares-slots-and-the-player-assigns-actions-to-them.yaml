title: A transport declares SLOTS, and the player assigns actions to them — one control method never removes another

context-and-problem-statement: |
  ADR-0074 §3 turned the accessibility promise into a question asked of each transport: *can every action the
  GAME uses be reached by it?* — with a transport that falls short REFUSING the game.

  ⚠️ THAT FRAMING PRODUCED A FALSE ALARM, and it is worth keeping the alarm on the record because it shows
  what the framing does. Writing the pointer issue, it led to the sentence *"a pointer that only works with a
  mouse would be the first transport in this engine to exclude someone"*. The Dev's answer is the correction:

    *"o controle de uso do mouse não exclui nenhum dos outros, aliás, este é o ponto: um controle não exclui
    outros na engine, o que ela faz é listar controle e todas as opções de alojamento de ações."*

  A mouse does require training and fine motor coordination. That is a fact about mice, not an exclusion —
  because choosing the mouse does not remove the gamepad, the keyboard, the touch controller, the voice or
  the eyes. **The engine's promise is the LIST, not the universality of each item on it.**

  ⚠️ AND THE CODE ALREADY WORKS THIS WAY, one transport at a time: `input/devices.ts` carries
  `TOUCH_DEFAULT`, a map from NINE TOUCH SLOTS to actions, and the gamepad wizard maps buttons by index to
  actions. What was missing is the word for it, and a word missing is how the engine ends up asking the wrong
  question of the next transport.

decision-drivers:
  - "A control method that demands skill is not an exclusion when eight others remain. Treating it as one
     leads to refusing useful transports, or to not building them at all."
  - "The player is the one who knows which of their limbs works. The engine offers slots; the person
     assigns."
  - "⚠️ The promise that has to hold is about the SET: at least one available transport must carry the
     game's action set. It was never about each transport carrying it alone."
  - "The touch layer and the gamepad wizard already do exactly this, so naming it costs nothing and stops
     the next transport from being designed against a different model."

considered-options:
  - "P1 — ADR-0074 §3 as written: each transport must reach every action the game declares"
  - "P2 — a transport DECLARES its slots; the player assigns actions to slots; the guarantee is that at
     least one available transport can carry the game's action set"
  - "P3 — the engine assigns automatically, per transport, with no player choice"
  - "P4 — every game declares which transports it supports"

pros-and-cons-of-the-options:
  P1:
    good: ["One rule, easy to check per transport."]
    bad: ["⚠️ It refuses transports that are useful to somebody because they are not useful to everybody —
           which is the opposite of offering a list.",
          "It makes a pointer, a switch or a blink-only input look like failures rather than options."]
  P2:
    good: ["It describes what the touch layer and the gamepad wizard already do.",
           "A transport with few slots is still worth having: it carries the games whose action set fits.",
           "The person who knows which input they can operate is the one who assigns."]
    bad: ["The guarantee moves from per-transport to per-SET, so it is harder to check: `some transport
           carries this game` needs the list of what the child actually has available.",
          "⚠️ A game with nine actions and a child who only has a two-slot transport is a real combination,
           and the engine has to say something honest about it rather than pretend."]
  P3:
    good: ["Nothing to configure; every game playable immediately."]
    bad: ["It decides for the person which of their movements is reliable, which is exactly the decision the
           person is better at.",
          "It contradicts pillar 2's remappable controls."]
  P4:
    good: ["A game could state that it needs a pointer."]
    bad: ["Three hundred games each declaring transport support is three hundred places for the list to go
           stale when a transport is added."]

decision-outcome:
  chosen-option:
    link: "P2 — transports declare slots, the player assigns, and the guarantee is about the set"
    justification: |
      ===== 1. A TRANSPORT IS A LIST OF SLOTS =====
      Each control method declares what it physically offers, and nothing about meaning:

        · **mouse** — movement (2 axes), three buttons, a wheel (2 directions)
        · **gamepad** — sticks and d-pad, the action buttons, START
        · **keyboard** — keys, in the per-player schemes of ADR-0013
        · **touch controller** — the nine slots `TOUCH_DEFAULT` already names
        · **speech**, **face**, **eyes + blink** — their own, when they are built

      The player chooses a control method and **assigns the game's actions to its slots**. That is the whole
      mechanism, and `TOUCH_DEFAULT` is already an instance of it: a default assignment the player may change.

      ===== 2. ONE CONTROL METHOD NEVER REMOVES ANOTHER =====
      ⚠️ Choosing the mouse does not turn off the keyboard, the gamepad or the touch pad. They coexist, and
      the engine's job is to OFFER them. A method that demands fine motor coordination is not an exclusion
      while the others are there — the exclusion would be a short list, not a demanding item on a long one.

      ⚠️ AND THAT RETIRES A SENTENCE I WROTE IN THE POINTER ISSUE: *"a pointer that only works with a mouse
      would be the first transport to exclude someone"*. It would not. It would be one option that some
      people use and others do not, like every other option.

      ===== 3. WHAT THE GUARANTEE BECOMES =====
      Not *"every transport reaches every action"* but: **for the transports available to this child, at
      least one carries this game's action set.**

      Checking it is arithmetic plus assignment: the game declares how many actions it needs; a transport
      declares how many slots it has; the player assigns. ⚠️ AND WHEN NOTHING FITS, THE ENGINE SAYS SO before
      the child starts — a game needing nine actions and a two-slot switch is a real combination, and the
      honest answer is a sentence, not a half-playable screen.

      ===== 4. WHAT THIS DOES NOT LOOSEN =====
      The pillar is unchanged and so is the work. A game still has to be reachable by somebody who cannot use
      a mouse — not because the mouse is at fault, but because the LIST has to be long enough. Building the
      pointer is now plainly worth doing on its own merits, which is what §2 unblocks.

  consequences:
    positive:
      - "The pointer stops being a liability and becomes an option, which is what it is."
      - "The model matches the code that already exists — `TOUCH_DEFAULT` and the gamepad wizard stop being
         special cases and become instances."
      - "A player assigns actions to what they can operate, instead of the engine deciding for them."
      - "A narrow transport — a switch, a blink — is worth building, because it carries the games that fit."
    negative:
      - "⚠️ The guarantee is now about a SET and is harder to check than a per-transport rule: it needs to
         know what the child has available, which the engine does not always know."
      - "Assignment is a screen, and a per-transport assignment screen for nine transports is a lot of UI
         governed by the footer-explanation rule."
      - "`some transport fits` can be true and still leave a specific child without the specific game."
    neutral:
      - "The nine transports and the two families of ADR-0074 are unchanged; only the question asked of them
         changes."

  confirmation: |
    · Each transport declares its slots as DATA, in one place, the way `TOUCH_DEFAULT` already does.
    · A player can reassign any action to any slot of the chosen transport, and it persists.
    · When a game's action count exceeds every available transport's slots, the engine says so BEFORE the
      game starts, naming what is missing.
    · No transport is refused for demanding skill; refusal happens only on arithmetic.

    ⚠️ NONE OF THIS PASSES TODAY. The touch layer is the only transport whose slots are declared as data.

