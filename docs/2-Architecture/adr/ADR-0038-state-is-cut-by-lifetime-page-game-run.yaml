metadata:
  status: "accepted"
  date: 2026-08-25
  decision-makers: [Dev]
  consulted: [ADR-0028 (two-scope persistence — the cut this record follows), ADR-0030 (the scene stack),
              ADR-0033 (the engine declares what the engine owns), ADR-0036 (demos consumes the engine),
              "SP-the-inclusionist-demos spec, D13 and D14"]
  informed: []

title: State is cut by LIFETIME — page, game, run — and the criterion is already written in the storage keys, not in anyone's taste

context-and-problem-statement: |
  ADR-0036 decided that the demos repository consumes this engine as a module. Its spec forbids, in D13, what
  this engine is built on:

      "No module-level mutable state in the engine. A module that holds state exports a `createX()` factory."

  `app/js/core/state.ts` is exactly that: 26 `export let`, read through live bindings by twelve modules. In a
  shell that loads game after game on ONE page — which is what the demos shell is — the previous game's state
  survives into the next unless somebody remembers to zero it. D13 exists because "somebody remembers" is not
  a mechanism.

  ⚠️ THIS RECORD FIRST CLAIMED D13 WAS TOO BROAD, AND THAT CLAIM WAS WRONG. The argument was that applying D13
  to `modoCego` would make a blind child re-enable blind mode at every game. That only happens if someone
  creates the instance PER GAME — and D13 does not say that; it says THE COMPOSITION ROOT OWNS THE INSTANCE.
  The shell calls `createSettings()` once per page and hands the same instance to every game. Factory-or-not
  decides WHO OWNS the state; it does not decide HOW LONG the state lives. The two are independent, and the
  first version of this record conflated them. The Dev caught it by asking whether all-factory was simply
  better. It is: D13 stands as written, and the target state is that everything a consumer can observe is
  created by a factory.

  WHAT SURVIVES THE CORRECTION is the question this record actually answers, which is a different one: not
  "factory or module", but HOW MANY INSTANCES, OWNED BY WHOM, LIVING HOW LONG. `modoCego` and `phase` still are
  not the same kind of state — one is created once per page, the other once per round — and nothing in D13
  says which is which. That is what the lifetime cut below decides, and it is orthogonal to D13 rather than in
  tension with it.

  THE CRITERION IS NOT A MATTER OF TASTE, AND IT IS ALREADY IN THE TREE. ADR-0028 cut persistence into two
  scopes — shared `incl_*` keys versus game-scoped `kJogo()` keys — and `platform/storage.ts` says so in its
  own comment ("ESCOPO DO JOGO"). The keys followed that decision. `core/state.ts` never did. So the classifier
  is mechanical:

      persisted to a shared `incl_*` key  → PAGE   (the machine's accessibility and preferences)
      persisted to a `kJogo()` key        → GAME   (this game's own choices)
      not persisted at all                → RUN    (dies with the round)

  Applied to the 26 exports it leaves no residue: 11 PAGE, 2 GAME, 13 RUN.

    · PAGE (11) — `vizMode`, `modoCego`, `letterCase`, `captionsOn`, `cbSafe`, `ownerColors`, `hcOutlineFg`,
      `hcOutlineBg`, `caneBlockDiv`, `wheelchair`, `oneButton`.
    · GAME (2)  — `cenario`, `activity`.
    · RUN (13)  — `phase`, `numPlayers`, `grassDensity`, `decorSeed`, `pauseActor`, `selVizPlayer`, `players`,
      `ended`, `gateTiles`, `gateOpen`, `gate`, `powerups`, `wcSolid`.

  The file already half-knows this. `selVizPlayer` carries the sentence "NÃO é persistido, e a distinção importa
  agora que todo menu persiste (ADR-0028): isto não é uma preferência, é qual aba está aberta." That is this
  record's criterion, written months earlier about one variable and never generalised.

decision-drivers:
  - "A blind child must not reconfigure accessibility when she changes game. That is a statement about
     LIFETIME — one instance per page — and it survives whether the state lives in a module or behind a
     factory the composition root calls once."
  - "A shell that loads game after game on one page leaks every run-scoped global into the next game, and the
     symptom is a game that starts already paused, already ended, or holding another game's players."
  - "The classifier must be checkable, or it decays into argument. Persistence scope is observable in the code
     and already carries a decision (ADR-0028), so it can be a gate instead of a convention."
  - "ADR-0036's 'consume the engine' cannot be written as a task list until the engine exposes the shapes the
     demos plan specifies (`createI18n()`, `attachInput(...)`, `createViz(...)`). This cut is that prerequisite."

considered-options:
  - "T1 — apply D13 literally: every stateful engine module becomes a factory"
  - "T2 — cut by LIFETIME: one instance per page, per cartridge or per round; all-factory is the end state,
     reached in the order a named consumer asks for"
  - "T3 — keep module-level state and add a `resetAll()` the shell calls between games"

pros-and-cons-of-the-options:
  factories-everywhere:
    good: ["Satisfies the demos spec as written; one rule, no judgement calls.",
           "It makes every dependency VISIBLE, which is the same discipline this engine spent the ADR-0027
            pipeline applying to imports and never applied to state. A module reading a live binding has a
            dependency that appears in no signature.",
           "It is the correct END STATE, and this record says so after the Dev challenged the first draft."]
    bad: ["Doing it in ONE sweep converts modules that are about to change repository, and threads instances
           through an untyped 1,549-line composition root where the compiler cannot help.",
          "It is ~840 call sites in ~59 files, of which the ones that matter — the RUN half — are about 13
           bindings. Staging by consumer demand gets the defect fixed first and the rest when it is asked for."]
  cut-by-lifetime:
    good: ["Each kind of state gets the lifetime it actually has, and the boundary is derived from a decision
            already taken (ADR-0028) rather than invented here.",
           "It is mechanically checkable, so it can be a gate.",
           "It answers what D13 leaves open — a factory says who OWNS the state and never how long it lives —
            so the two compose instead of competing."]
    bad: ["Three lifetimes instead of one; a new field has to be classified, and a wrong classification is a
           silent leak, which is why the gate is part of the decision.",
          "It is a STAGED conversion, so for a while the tree holds both shapes and a reader has to know which
           module is already converted."]
  reset-between-games:
    good: ["Smallest change: nothing moves."]
    bad: ["It is 'somebody remembers', promoted to a function. A field added later and forgotten in `resetAll`
           leaks silently, and the test that would catch it is the one nobody writes.",
          "D13 names this exact pattern as the smell: a module needing a cleanup ritual is the wrong module."]

decision-outcome:
  chosen-option:
    link: "T2 — state is cut by lifetime: PAGE stays, RUN becomes a factory, GAME follows the game"
    justification: |
      THE THREE HOMES:

        · PAGE — ONE INSTANCE PER PAGE. These eleven are the machine's accessibility profile: blind mode,
          contrast outlines, caption, letter case, cane width, wheelchair, one-button, colour-blind safety,
          owner colours, visual mode. One page, one child, one profile — the composition root creates it once
          and every game receives the same one. They keep their live bindings FOR NOW, because no consumer has
          asked otherwise and converting them today would thread instances through an untyped composition root
          for no gain; the end state is `createSettings()`, called once.
        · RUN — becomes an object created by a factory that the composition root owns, and no game may reach
          another game's instance. This is the half D13 is actually about, and it is also where the scene stack
          of ADR-0030 lands: `phase` is the first field that stops being a global and starts being the stack.
        · GAME — `cenario` and `activity` travel with the cartridge to the demos repository (ADR-0036), joining
          `quizLevel`, which already left in item 19. Nothing about them belongs to an engine.

      WHAT THIS DOES TO D13: nothing. The earlier draft of this record proposed amending it to "no module-level
      mutable RUN state" and that proposal is WITHDRAWN — see the correction in the context above. D13 is right
      as written, and the end state is all-factory: every piece of state a consumer can observe is created by a
      factory and owned by the composition root. This record decides the ORTHOGONAL question of how many
      instances each factory yields and how long each lives.

      WHY NOT CONVERT EVERYTHING AT ONCE, measured rather than felt: 18 engine modules hold module-level mutable
      state — 38 exported bindings plus 42 private ones — reached from roughly 840 call sites across ~59 files
      (`core/state`: 28 importers, ~515 uses; `core/i18n`: 31 importers, ~323 uses). The number is not the
      reason to stage it. These three are:

        1. THE GAME IS LEAVING (ADR-0036). Converting `cenario`, `activity` and the City theme modules is work
           that changes repository next week.
        2. THE COMPOSITION ROOT IS UNTYPED. `main.js` is 1,549 lines of JS under `checkJs:false`, so threading
           instances through it is precisely where a silent break would land, with the compiler blind. That has
           already happened once, with `WORLD_PX_W()` called on a constant: it passed build and tests and
           surfaced only in the browser.
        3. THE GAIN IS NOT UNIFORM. `core/i18n`'s singleton is CORRECT for one page — one language at a time —
           and converting it today buys reentrancy nobody uses. `core/state`'s RUN half is where a real defect
           lives: on a shell that loads game after game, it leaks.

      So the order is driven by the consumer, not by tidiness: RUN state first (the defect), GAME state leaves
      with the cartridge (never converted here), then each remaining module when a named requirement asks —
      `createI18n()` is next, because D10's per-game dictionaries genuinely need it. The 42 private caches are
      per-page by nature and are not what D13 aims at.

      THE ORDER OF WORK, because the cut touches twelve reading modules: GAME leaves first (it is two bindings
      and it is already decided), then RUN moves behind the factory, then PAGE is left alone and gains the gate
      that keeps it honest. Doing RUN before GAME would move `cenario` twice.

  consequences:
    good:
      - "The engine becomes consumable by a shell that loads many games, which is the whole point of ADR-0036."
      - "The leak that would be found in a demo, in front of a class — a game opening already ended — becomes
         structurally impossible rather than a thing to remember."
      - "Accessibility settings keep the lifetime a child needs — one instance per page — and the record says
         WHY, so the next reading of the lifetime table does not collapse it into per-game."
    bad:
      - "Twelve modules read these bindings; the RUN half is a wide, mechanical change with a real chance of a
         missed call site."
      - "A new field now needs a classification, and the wrong one is a silent leak — which is why the gate is
         part of the decision and not a follow-up."
    neutral:
      - "`numPlayers` classifies as RUN today because nothing persists it. If the shell later decides that 'how
         many children at this machine' outlives one game, the fix is to PERSIST it — a deliberate change with a
         visible diff — not to reclassify it by argument. The criterion follows the code, and the code is what
         gets edited."

  confirmation: |
    A gate in the node project, and it is the criterion itself turned into a test rather than a restatement of
    it: every binding exported by the page module must write to a shared `incl_*` key; no field of the run
    object may be written to `platform/storage` at all; and `core/state.ts` must export no game vocabulary,
    which the existing `engine-boundary` gate already checks.

    The behaviour that must not change while this moves: the settings panels keep reading live bindings, and
    `tests/` has coverage for the persistence of every menu (ADR-0028). A cut that breaks persistence will
    break those first, which is the point of doing it in this order.

more-information: |
  This record is the prerequisite ADR-0036 did not know it needed. The demos Phase 1 plan cannot be rewritten
  into "consume the engine" tasks while the engine exposes no factory: its own structure table specifies
  `createRng(seed)`, `createI18n()`, `createAnnouncer(root)`, `attachInput(el, players, kb)`, `mountPixi(host)`,
  `createViz(target)` and `createPixiScene(stage, visual)`. That table is, read the other way, a SPECIFICATION
  OF THE SURFACE this engine must expose — which turns this refactor from a matter of hygiene into a contract
  with a named consumer.

  The plan rewrite therefore follows this cut rather than preceding it, and the Dev was told the order changed
  and why.
