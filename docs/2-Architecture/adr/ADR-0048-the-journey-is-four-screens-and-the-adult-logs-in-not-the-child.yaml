title: The journey is FOUR screens, the ADULT logs in and never the child, and difficulty follows the child instead of the lesson plan

context-and-problem-statement: |
  Until now the shape of a session was scattered: ADR-0005 decided access (no login, a teacher activity code),
  ADR-0037 decided identity (an avatar from Bússola Escolar's roster, nothing stored here), ADR-0036 decided that
  the shell and the catalogue live in `inclusionist-demos`. Nobody had written down what a child actually DOES
  from opening the page to earning something — and the pedagogical half, which is the point of the product, had
  no record at all.

  A PROTOTYPE EXISTS and the Dev pointed at it: `Inclusionista-Jornada.dc.html`. His words: "está com a ideia
  próxima da correta, mas contém alguns erros." Read against this project's own decisions, the errors are
  specific and they are corrected by this record:

    · IT HAS THREE STEPS, NOT FOUR ("Passo 1 · 2 Escolher o minigame · 3 Jogar"). The AVATAR screen is missing
      entirely, and it is the screen where the child's identity happens.
    · IT SAYS "canvas 360×180". The canvas is 320×180 — pillar 5 of ADR-0010, and 360×180 was REJECTED by name
      in the demos spec (D5) for not being 16:9 and not scaling by integers.
    · IT SAYS "Alunos entram por código ou QR — sem cadastro, sem e-mail." True for the un-logged path and false
      as a general statement: there is now a login, and §2 below is about whose it is.
    · IT SAYS "As erradas custam pontos." The scoring below does the opposite — a wrong answer inside the
      tolerance costs nothing at all.
    · IT SAYS the games are "jogáveis só com teclado". Keyboard, gamepad, touch, and later face, eyes and voice
      (ADR-0033, issue #11).

decision-drivers:
  - "A child must never be asked to authenticate. Whatever identity exists has to be reachable by a six-year-old who
     cannot read, on a shared machine, in the time a lesson allows."
  - "The teacher must be able to say what the session is FOR — a curriculum and one to three skills — because the
     product is a pedagogical instrument and not a break from the lesson."
  - "The Inclusionist must keep storing nothing about a child (ADR-0037). Anything remembered is remembered by
     Bússola Escolar, under the adult's credentials, and the family must be able to keep it off the internet
     entirely."
  - "Difficulty must follow the CHILD, not the lesson plan. Too hard does not teach and makes her quit; too easy
     does not teach and bores her. Both failures look like 'the activity was set correctly'."
  - "Nothing about the pedagogy may punish the use of an accessibility feature — the moment a setting costs points,
     it stops being available."

considered-options:
  - "J1 — progress lives NOWHERE: every session is anonymous and ends with the machine (the pre-existing position)"
  - "J2 — progress lives in the Inclusionist, on the machine or in a service of ours"
  - "J3 — progress lives in BÚSSOLA ESCOLAR, end-to-end encrypted, with a LAN-only option that keeps it off the
     internet, and the Inclusionist keeps storing nothing"

pros-and-cons-of-the-options:
  J1:
    good: ["Nothing to protect, nothing to leak, nothing to answer for. It is what ADR-0037 chose and it is still
            what the un-logged path does.",
           "Works with no network, no account and no adult present."]
    bad: ["A child's progress dies with the session, so nothing can adapt across days and no report reaches the
           teacher, the family or the therapist — which is most of what the product is for."]
  J2:
    good: ["Full control of the data model; no dependency on another system's roadmap."]
    bad: ["It makes this project a controller of children's personal data, which ADR-0017 and the requerimento
           deliberately avoided: the accountable party has to be the school or the municipality, not a person or a
           game.",
          "It duplicates a roster that already exists and is already governed."]
  J3:
    good: ["The identity, the roster and the reports stay where they are already accountable, and the Inclusionist
            remains a program that stores nothing about a child.",
           "The LAN option lets a school keep every byte inside its own network — encryption in transit is not the
            same promise as never leaving the building, and for a school the second is the one that convinces.",
           "It composes with what exists: ADR-0037 already named Bússola Escolar as the roster's owner."]
    bad: ["A hard dependency on another system for the entire logged path.",
          "Three access paths to build and to explain, and the difference between them is exactly the part a hurried
           adult will not read."]

decision-outcome:
  chosen-option:
    link: "J3 — Bússola Escolar owns identity and progress; the Inclusionist owns none of it"
    justification: |
      ===== 1. FOUR SCREENS =====
        1. WHAT THIS SESSION IS FOR — access, curriculum, skills.
        2. WHO IS PLAYING — the avatar. ⚠️ ONLY EXISTS WHEN AN ADULT IS LOGGED IN. Without login there is no
           roster to pick from, so screen 2 does not appear and the journey goes straight to 3.
        3. WHICH GAME — the catalogue. The player picks whatever they want.
        4. THE GAME.

      ===== 2. THE ADULT LOGS IN. THE CHILD NEVER DOES. =====
      This is the clause that reconciles this record with ADR-0005, which said "no login", and it is a REFINEMENT
      and not a reversal: no CHILD ever authenticates. Screen 1 offers three ways in:

        (a) CHOOSE AN ACTIVITY AND PLAY — nothing is saved, nothing leaves the network. The promise that student
            data does not leave the school holds trivially, because no data exists.
        (b) LOG IN — progress is recorded in Bússola Escolar, end-to-end encrypted.
        (c) LOG IN AND POINT AT A LOCAL IP — Bússola Escolar on the school's own LAN, so nothing travels the
            internet at all, encrypted or not.

      ⚠️ (c) IS NOT (b) WITH EXTRA STEPS, and the difference is the reason it exists: end-to-end encryption is a
      promise about who can READ the data; a local address is a promise about where the data GOES. A school that
      accepts the first may still refuse the second, and it is entitled to.

      WHO LOGS IN, AND WHERE:
        · TEACHER — logs in on every computer and tablet on the network. The machines are shared; the account is not.
        · FAMILY — a parent logs in on every machine at home, and MAY SHARE THE ACCOUNT with the other parent, and
          with aunts, uncles and godparents. This is deliberate: a child's home is not one adult.
        · HEALTH PROFESSIONAL and TEACHER, seen from the family — reports may be SHARED, and the shared results are
          shown SIDE BY SIDE AND NEVER SUMMED. Family accounts pool into one history; a therapist's sessions and a
          teacher's sessions stay separate lines in the report, in both directions.

      ⚠️ AND THE SHARING CARRIES FOUR CONDITIONS AND A DEFERRAL, from Anexo VIII of the requerimento, which this
      record described as a plain feature and which is the most legally loaded thing in the system. Records
      produced by health professionals are SENSITIVE personal data (art. 11, LGPD) and are covered by professional
      secrecy **that the guardians' consent alone does not lift**. By design, therefore:

        1. consent that is SPECIFIC, HIGHLIGHTED and REVOCABLE PER PURPOSE — not one blanket agreement;
        2. SEGREGATED access profiles, each category seeing only what pertains to it;
        3. a LOG OF EVERY CONSULTATION;
        4. before implementation: manifestation of the data protection officer AND consultation with the relevant
           professional councils.

      ⚠️ **AND IT IS NOT PART OF THE FIRST IMPLEMENTATION STAGE.** The requerimento defers it deliberately; this
      record now defers it too, instead of describing as easy what the protocolled document describes as hard.

      ⚠️ THE NON-SUMMING IS THE WHOLE POINT and must not be "simplified" into one number later. A child performs
      differently with a therapist, with a teacher and at home, and averaging those three erases the very
      difference a professional reads. One number would be easier to draw and would destroy the instrument.

      ===== 3. THE CURRICULUM IS CHOSEN, NOT ASSUMED =====
      Logged in or not, screen 1 picks WHICH CURRICULUM governs the session — BNCC (Brazil), Aprendizagens
      Essenciais (Portugal), Currículo do Ensino Primário (Angola), LOMLOE (Spain), Plan de Estudio 2022 (Mexico),
      NAP (Argentina), CCSS (United States), National Curriculum (United Kingdom), and so on — and then ONE TO
      THREE SKILLS from it for the next session of THIRTY MINUTES.

      This is what ADR-0032 reserved when it made the curriculum a layer of its own instead of a folder of the
      game: the catalogue is the platform's, and each game pulls what suits it. A second curriculum is DATA here,
      not a code change, and that is the test this record puts on that decision.

      ===== 4. THE ITEM OPENS A MINIGAME, AND THREE WINS BUY A POWER =====
      Every game carries an item that, when collected, opens a MINIGAME — a gamified school activity. Win three
      and the player earns a POWER scaled to the activity's level: a fifth-year activity pays more than a
      fourth-year one. The minigame ends only after THREE CORRECT ANSWERS, and the reward is set by the level of
      the LAST one — so a child who climbs mid-minigame is paid at the level she reached, not the one she started.

      ===== 5. THE THREE BANDS, AND THEY ARE ARITHMETIC RATHER THAN TASTE =====
      REPLACES the first version of this clause, which set "20% of error costs nothing" and claimed the zone of
      proximal development as its target. The requerimento (Anexo XIII §73.c) is right and that version was wrong:
      measuring only unaided performance yields DIFFICULTY, not the zone. The Dev supplied the bands, and they are
      derived rather than chosen. For a five-alternative question with up to three attempts:

        · **8 or more of the last 10 right ON THE FIRST TRY → PROFICIENT.** Level up, even above what the adult
          configured. At this rate the child is barely erring and is not using the help.
        · **7 or more of the last 10 resolved, using the second and third attempts → THE ZONE.** She cannot do it
          alone and she can do it with mediation, which is the definition, not an approximation of it.
        · **6 or fewer of the last 10, OR four failed questions in a row → FRUSTRATION.** Level down immediately.

      ⚠️ WHERE THE NUMBERS COME FROM, written out because the next person will otherwise re-derive them wrong:

        · A child GUESSING with three attempts on five alternatives resolves the question with probability
          1 − (4/5 · 3/4 · 2/3) = **0,60**. So 60% is the noise floor, and it is why the proficiency bar sits at
          8/10 FIRST-TRY rather than at 8/10 resolved — resolved-8/10 is nearly what pure guessing produces.
        · Failing FOUR QUESTIONS IN A ROW therefore has probability 0,40⁴ = **0,0256**, under the conventional 5%
          cut. Four consecutive failures is evidence of guessing, not a bad streak.
        · ⚠️ AND THE UNIT IS THE **QUESTION**, NOT THE ATTEMPT. Four *attempts* wrong happens inside one ordinary
          question; four *questions* failed in a row is the 2,56% event. Confusing the two would make the game
          demote a child for one hard question.

      ===== 6. THE TWO MEASURES, RECORDED SEPARATELY — THIS IS WHAT MAKES §5 THE ZONE AND NOT DIFFICULTY =====
      The answer to "como?", and it costs almost nothing because the game already produces both signals and merely
      threw one away:

        · RIGHT ON THE FIRST ATTEMPT  → performance WITHOUT support.
        · RIGHT ON A LATER ATTEMPT    → performance WITH mediation (the retry IS the graduated support).
        · FAILED                       → beyond the zone.

      Three outcomes per question, stored per skill. That is the whole mechanism: not a new subsystem, a third
      value where there used to be a boolean. Without it the history accumulated over months cannot calibrate
      anything, and the Campo Magnético (below) has nothing to learn from.

      ⚠️ WHAT THE CAMPO MAGNÉTICO IS, in one paragraph, because this record now depends on it: it is the adaptive
      layer described in Anexo XIII of the requerimento, still in conception and NOT part of any request made to
      the Município. It would calibrate item difficulty and student proficiency on one scale (Item Response
      Theory, the family used in ENEM and SAEB), track per-skill mastery (Bayesian Knowledge Tracing), estimate
      the zone from the two measures above, and DISCOVER the prerequisite graph that the BNCC does not
      declare — with the network proposing edges and TEACHERS validating them, because dependency observed in data
      is not the same as a prerequisite. Until it exists, §5 is the placeholder, and it says so.

      ===== 6b. WHICH SKILL COMES NEXT, WHICH IS THE ADULT'S CHOICE AND THE CHILD'S HISTORY TOGETHER =====
      The teacher, parent or professional picks the curriculum skill. What the game does with it depends on what
      the child has already shown:

        · ALREADY PROFICIENT in it → the activities move ON: to a skill that USES it as a prerequisite, or to a
          SIBLING skill that is also required by a more complex one, same year or above.
        · NOT PROFICIENT → the activities STAY in that skill, to check whether proficiency has since arrived.

      ⚠️ AND THE ASYMMETRY IS THE POINT: **proficiency persists; the frustration band does not.** What a child
      demonstrated she can do is kept; the day she was guessing is not held against her tomorrow. A system that
      remembered frustration would keep punishing a bad afternoon for weeks.

      ===== 6c. WHERE IT IS REMEMBERED =====
      In the CHILD'S OWN profile from 13 years old — the age at which Brazilian practice admits an e-mail account —
      and in the RESPONSIBLE ADULT'S profile below that. The purpose is plain: so she does not restart at the same
      level every session. It rides on the same ownership as everything else (§2): Bússola Escolar holds it, the
      Inclusionist holds nothing.

      ===== 7. SCORING IS A WORK RECORD, AND NOTHING ELSE =====
      REPLACES the first version, which had points scaled by difficulty and a Guitar-Hero streak multiplier
      (×2 at 5, ×3 at 10, ×4 at 15). **Both are removed**, at the Dev's instruction, and the multiplier is removed
      as what it is: "prática predatória sim para manter a criança jogando e se estressar se sair do streak."

        · **ONE POINT PER CORRECT QUESTION. Full stop — difficulty does not scale it.** The reason is the one that
          matters: so that the child who struggles can end the day with as many points as the child who does not.
          A score weighted by difficulty would rank the class by ability while pretending to count work.
        · Points are a RECORD OF WORK. Nothing is bought with them, nothing is unlocked by them.
        · **No animation when the counter rises.**
        · They **reset at the end of the day**; what is kept is the day's total.
        · Visible to the adult and, from 13, to the student.

      ✅ SETTLED: POINTS ARE WORK, NEVER CURRENCY. Two of his sentences had conflicted — one had points unlocking
      story text, the other had them earning "absolutamente nada". He confirmed the second: "Pontos só devem
      significar trabalho realizado, não moeda." The story-unlock is not built, and the reason it should not be is
      now on the record rather than in a flag: anything points BUY turns them into an accumulation to chase, which
      is the shape ADR-0049 exists to keep out.

      NO GAME OVER, NO END, NO RANKING. Every minigame is an arcade for collecting points, and the collective
      total is what the screen shows at the end. "Não existe ranking, todo mundo é importante."

      ===== 7b. THE ONLY CLOCK IS SCREEN TIME, AND IT IS NOT A GAME TIMER =====
      This settles the tension with the requerimento's promise of "ausência de temporizadores" (IV.7.1, IV.7.3) and
      with WCAG 2.2.3 Sem Tempo (AAA), and it settles it in the game's favour because of what the clock measures:

        · There is NO timer on an activity, no countdown to a game ending, and no warning that time in THIS game is
          running out. A child may take as long as she likes on any question.
        · The only clock is the SCREEN-TIME allowance her responsible adult set (ADR-0050), and it belongs to the
          session and not to the task. When it runs out she has not lost anything and nothing was cut short.
        · She may change games at any moment and keep doing activities somewhere she likes better.

      That is what makes the guideline hold rather than being argued around: nothing in the game is timed. The
      requerimento's own wording gains the same distinction — a TIME-OF-USE limit is not an ACTIVITY timer.

      ===== 8. ACCESSIBILITY NEVER TOUCHES THE SCORE =====
      No accessibility option raises or lowers points. No disability SIMULATION raises or lowers them either.

      ⚠️ THE SECOND HALF IS EASY TO MISS AND IS THE SAME PRINCIPLE. A bonus for playing under a simulation would
      turn Empathy Mode into a way to farm points, and would price a child's real condition as a handicap someone
      else gets rewarded for enduring. Neither direction. The score measures the school work.

      ===== 9. THE ADAPTIVE RULE READS PERFORMANCE, NEVER ENGAGEMENT =====
      One line, and it exists to close a door rather than to open one. §49.m of the requerimento forbids
      algorithmic recommendation directed at minors that induces dependency, and §49.d promises no
      engagement-oriented recommendation. §5 IS algorithmic recommendation directed at a minor — aimed at
      LEARNING.

      What makes the difference real instead of rhetorical is the SIGNAL: the rule reads correctness and nothing
      else. Never session length, never how often she comes back, never how long she stayed. Written here so that
      nobody "improves" the adaptation later by feeding it a retention metric, which is precisely how a learning
      system becomes an engagement system without anyone deciding to do it.

  consequences:
    positive:
      - "The pedagogical loop — which is the product — finally has a record, and every clause in it is checkable."
      - "ADR-0037 is FULFILLED rather than contradicted: the Inclusionist still stores nothing about a child, and
         this record names exactly where the remembering happens instead."
      - "The curriculum being data, chosen per session, is the first real test of ADR-0032's layer."
      - "The un-logged path (a) keeps working with no network, no account and no adult — nothing regresses for the
         school that cannot or will not log in."
    negative:
      - "A hard dependency on Bússola Escolar for everything the logged path promises, including screen 2. If that
         system is not ready, the avatar screen has nothing to show."
      - "Account sharing among relatives is a deliberate weakening of authentication, chosen because a child's home
         is not one adult. It has to be designed knowing that, not discovered later."
      - "The difficulty rule can move a child off the skill the teacher configured, in the middle of a lesson. A
         teacher who does not expect that will read it as a bug."
      - "Three access paths, and the difference between (b) and (c) is exactly what a hurried adult skips."
    neutral:
      - "The prototype `Inclusionista-Jornada.dc.html` is now out of date in the five places listed above. It is a
         design study, not a spec, and this record outranks it."

  confirmation: |
    NOTHING HERE IS BUILT YET, and saying so is the point of writing it down before building: this record is a
    contract to hold the implementation to, not a description of the code.

    What each clause will be measured by, so the criteria are fixed before anyone is invested in an implementation:

      · FOUR SCREENS, and screen 2 absent without login — a navigation test over the shell in `inclusionist-demos`.
      · NO CHILD AUTHENTICATES — a gate that fails if any screen reachable by a child asks for a credential.
      · THE 20% TOLERANCE, the three-in-a-row drop and the eight-of-ten rise — pure functions over an answer
         history, node-testable without a screen, in the curriculum layer (ADR-0032) rather than in a game.
      · SCORE UNAFFECTED BY ACCESSIBILITY — the strongest one, and it must be asserted in BOTH directions: the same
         answer history scores identically with every accessibility setting on and with every one off, and
         identically under a simulation.
      · REPORTS NEVER SUM ACROSS ROLES — a test over the report model with a therapist's and a teacher's sessions
         for the same child.

    ⚠️ WHAT NO TEST OF MINE WILL EVER CONFIRM: whether "4 in a row down, 8 of 10 up" actually lands a child in her
    zone of proximal development. That is issue #7 (field test) and, in the end, a question for the teachers who
    use it. The rule is written as a default precisely because it has not been measured.

more-information: |
  ⚠️ THIS RECORD REFINES ADR-0005 AND MUST BE READ WITH IT. ADR-0005 says "no login". That remains true of the
  CHILD, which is what it was protecting, and is no longer true of the ADULT. The activity code it introduced is
  not superseded either — it is path (a), the one that needs no account.

  ⚠️ AND IT FULFILS ADR-0037 rather than overturning it. That record says "the Inclusionist stores NOTHING about a
  child. Not a name, not a nickname, not a hash of a name. The roster is Bússola Escolar's, the identity is an
  avatar chosen from that roster." Screen 2 IS that sentence built. What is new is that progress now travels to
  Bússola Escolar under an adult's credentials — the Inclusionist still keeps none of it.

  Deliberately NOT decided here: the wire protocol and the shape of the end-to-end encryption; how a report is laid
  out; how a curriculum document becomes skill data; the exact statistical test behind "three in a row" beyond its
  stated placeholder status; and what the powers earned from minigames actually do in each genre.
