    - "ADR-0008 (multiplayer scaling: 4/screen → classroom LAN → internet after study)"
    - "ADR-0015 (pedagogy & game modes)"
    - "ADR-0017 (compliance & data governance — local-law-wins, RN-01..04)"
    - "ADR-0032 (the curriculum is a layer of its own)"
