title: The engine's records live in the engine — `the-inclusionist-docs` keeps only what belongs to the whole project

context-and-problem-statement: |
  🔴 **THE DEV'S DECISION WAS READ BACKWARDS, AND THE READING WAS WRITTEN DOWN AS A DECISION.** On 2026-09-23 the Dev
  decided about the architecture records: «(i) a engine fica com eles». ADR-0226 carried it — «docs volta pra dentro
  do repositório da engine, ou melhor, o que for da engine» — and the same day ADR-0229 turned it into its opposite:
  `the-inclusionist-docs` stays the home, the engine's own decisions and the contract stay with it, and only what
  belongs to ONE GAME moves. Six records moved to `game-platformer`; the engine received none. Today the Dev asked
  why: «Por que se eu pedi para que os documentos em doc que fossem da engine fossem passados para a engine?»

  ⚠️ **ADR-0229's argument was a cost, and the cost was real — it was never the Dev's to weigh against their own
  decision.** A move across a repository boundary is where confirmations break without a sound (nine did on
  2026-09-22, with the engine's suite green). That is a reason to move CAREFULLY — copy byte for byte, verify by hash,
  run the validator with `--repo` on every side before and after — not a reason to move something else.

  📏 **READ, NOT COUNTED.** Every one of the 235 records was classified by one question: «whose repository breaks or
  must change if this decision changes?». A record that cites a game is usually not that game's; a record that
  cites the engine is not always the engine's. The answer: **182 are the engine's** (the engine, the contract it
  publishes, the UI it draws, delivery, accessibility, its tooling and the address of its own records); **44 belong
  to the whole project** (pillars, compliance, organisation and hosting, licences and art, the catalogue, the
  project's governance); **6 belong to systems that have no records tree yet** (the labs, the pixel-data pipeline);
  and **3 read as `game-platformer`'s** and did not move to it here. The full table, one line per record with its
  reason, is in `docs/2-Architecture/record-ownership-triage.md`.

