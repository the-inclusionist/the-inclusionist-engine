metadata:
  status: "accepted"
  errata:
    - date: 2026-09-04
      what: "cited the annual public report as `requerimento §49.j` in eight places. Item 49 ends at alínea `i`;
             the annual report and the compliance audit are alínea `j` of item 51, `compromissos adicionais,
             adotados por referência internacional`. The commitment is real and unchanged — only the address was
             wrong, and it was wrong from the first line this record was written. ERRATUM under ADR-0057 §1: the
             record never carried the right address, so correcting it restores the history."
  date: 2026-08-27
  decision-makers: [Dev]
  consulted:
    - "ADR-0043 (a known debt gets a budget that only goes down — the precedent for a gate that enforces a promise)"
    - "requerimento §51.j — annual public report and annual compliance audit"
    - "Decreto do Conselho de Estado nº 766/2023 (China), arts. 20 and 37 — the comparative source §51.j cites"
    - "requerimento §49 as a whole — the eleven child-protection principles"
  informed: []

title: The annual compliance report is a CI GATE that fails when the year's report is missing — a promise with no enforcement is a promise that decays

context-and-problem-statement: |
  §51.j of the requerimento commits the project to publishing, every year, in its own repository, a report on the
  observance of the eleven child-protection principles, "acompanhado de verificação técnica dos parâmetros
  efetivamente implementados no código".

  Its stated reason is the reason this record exists: **"compromisso sem prestação de contas periódica degrada
  silenciosamente"**. Of the twenty-two divergences found between the filed document and the ADRs, this was the
  only obligation that RECURS. Every other one is done once and stays done. This one is undone by the passage of
  time, quietly, and by nobody's decision.

  No ADR carried it, which means the first year nobody remembers is the year it stops being true.

decision-drivers:
  - "A yearly obligation that depends on someone remembering is an obligation that ends the first busy December."
  - "This project already knows the shape that works: ADR-0043 turned a tolerated debt into a ceiling that CI
     enforces and that only descends. The same mechanism fits."
  - "The report must be checkable against the code, not a text someone writes about the code — that is what
     'verificação técnica dos parâmetros efetivamente implementados' asks for."
  - "The alternative is honest and available: if the obligation is not going to be kept, it should leave the
     document rather than sit there being false."

considered-options:
  - "N1 — leave it as a written commitment and remember it each year"
  - "N2 — a calendar reminder or a scheduled task"
  - "N3 — a CI gate that fails the build when the current year's report is absent"
  - "N4 — remove the commitment from the requerimento"

pros-and-cons-of-the-options:
  N1:
    good: ["Costs nothing today."]
    bad: ["It is precisely what §51.j itself describes as degrading silently. The clause argues against this option
           in its own text."]
  N2:
    good: ["Cheap, and it does prompt somebody."]
    bad: ["A reminder can be dismissed and leaves no trace when it is. Nothing downstream notices."]
  N3:
    good: ["The obligation stops depending on memory: the repository refuses to build without it.",
           "It is visible to anyone auditing — a red pipeline is evidence, and the requerimento's whole argument is
            that the commitments should be verifiable by third parties.",
           "Precedent in this repository (ADR-0043), so it is a known shape rather than a new mechanism."]
    bad: ["It will one day block a release for a documentation reason, which is annoying exactly when it matters.",
          "A gate can be satisfied by an empty file — the content still needs a human, and no gate fixes that."]
  N4:
    good: ["Honest, and removes an obligation nobody is resourced to keep."]
    bad: ["It gives up the mechanism that keeps the other ten principles from decaying, which is most of what makes
           them worth writing."]

decision-outcome:
  chosen-option:
    link: "N3 — a CI gate; and if that is ever refused, N4 rather than N1"
    justification: |
      ===== 1. THE GATE =====
      A script in CI checks for the current year's report at a fixed path in the repository. Missing, the job
      fails. It is the ADR-0043 pattern with the direction reversed: there the number had to go DOWN every time,
      here a file has to EXIST every year.

      ⚠️ THE GATE IS ABOUT EXISTENCE, AND IT SAYS SO. It cannot judge whether the report is any good, and pretending
      otherwise would be the "sensação de rigor sem o rigor" this project has already caught itself doing. What it
      guarantees is that the year cannot pass without someone being made to write one.

      ===== 2. WHAT THE REPORT CONTAINS, AND WHY IT IS MECHANICAL =====
      §51.j asks for "verificação técnica dos parâmetros efetivamente implementados no código", so the report is
      not prose about intentions. For each of the eleven principles: the parameter as implemented, where it lives,
      and the gate that holds it. Most of those gates already exist and are named in other records — the forbidden
      mechanics (ADR-0049), the screen-time clock and the night window (ADR-0050), the score untouched by
      accessibility (ADR-0048 §8).

      That is the part worth stating plainly: **the report is mostly an index of gates that already run.** If a
      principle has no gate, the report is where that becomes visible, which is the second thing it is for.

      ===== 3. THE HONEST EXIT =====
      If at some point the report is not going to be produced, the decision is to REMOVE §51.j from the document,
      not to let it stand unmet. A commitment filed with a Prefeitura and quietly abandoned is worse than one never
      made, because the filing is what someone else relied on.

  consequences:
    positive:
      - "The one recurring obligation stops depending on memory."
      - "Writing the report each year surfaces principles that have no gate, which is a free audit of the audit."
      - "A third party can verify the commitment was kept by looking at the repository, which is what the
         requerimento promises throughout."
    negative:
      - "One day it will fail a pipeline over a missing document while something urgent is waiting."
      - "It can be satisfied badly. The gate buys the ritual, not the quality."
    neutral:
      - "The first report is due for the first calendar year in which the systems are in use, not now."

  confirmation: |
    The gate IS the confirmation, which is unusual and is the point: `scripts/check-annual-report.mjs` in CI, failing
    when `docs/compliance/relatorio-<ano>.md` does not exist. Written before the first report is due, so that the
    first failure is a reminder rather than a discovery.

    ⚠️ NOT YET BUILT. This record is the decision; the script is its issue.

more-information: |
  Comes from §51.j of the requerimento, whose comparative basis is arts. 20 and 37 of Decreto nº 766/2023 (China),
  which impose an annual social-responsibility report and an annual compliance audit on platforms with large numbers
  of minor users.

  Related: ADR-0043, the precedent for enforcing a written commitment with a gate rather than with discipline.

  Deliberately NOT decided here: who signs the report, whether it is also filed with the Município, and its format.
