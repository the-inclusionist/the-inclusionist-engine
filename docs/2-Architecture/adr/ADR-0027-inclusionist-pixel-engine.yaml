more-information: |
  The engine spine lives in `app/js/core/` (entity, state, layers, constants, collision, i18n, loop, rng,
  screens, tiles, world). The catalogue this record filters is
  `_IMATURE/EdSP/Research/minigames-catalog-v2.html`, outside the repository.

  Relates to: ADR-0010 (the ten non-negotiable pillars — 320x180, a11y-first, i18n, offline, GPL);
  ADR-0020 (canonical z-order and the post-FX chain, which this record amends: the flash limiter must run
  AFTER A11Y_CORRECTION); ADR-0013 (motor input, which the three/four-button controller and the
  held-to-toggle latch extend); ADR-0016 and `docs/game-design/Art-Bible.md` (which this record also amends:
  they declare a 16x32 sprite and the shipped art has six sizes); ADR-0018 (art and visual design);
  ADR-0024 (multi-repo versioned shared packages — the destination of step 6).

  The ordering rationale, and what is deliberately deferred, is kept in `docs/ROADMAP.md`; the per-step work
  lives in the GitLab issue board, not here.
