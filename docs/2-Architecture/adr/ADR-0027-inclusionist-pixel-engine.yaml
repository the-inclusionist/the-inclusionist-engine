---
metadata:
  status: "proposed"
  date: 2026-08-23
  decision-makers: [Dev]
  consulted: [five parallel research passes over code, catalogue, console hardware, a11y standards]
  informed: []

title: Inclusionist Pixel — the fantasy-console engine, its scope filter, and the boundary it must cut

context-and-problem-statement: |
  The Inclusionist just finished modularisation: a 2786-line `game.js` became `app/js/main.js` (a composition root)
  plus 100 modules, with 2194 tests. The next goal is an ENGINE for many 2D pixel-art games — the first of three
  planned (Pixel, SVG, 3D), and the only one aimed at old, weak hardware: the Positivo and entry Chromebook of a
  Brazilian public school.

  THE FRAMING THAT CHANGED EVERYTHING. 320x180 was initially read as a platformer's inheritance. It is not: it is a
  CONSOLE SPECIFICATION, chosen deliberately, and the limits it drags along are the point. That gives the project a
  principled scope filter it did not have — not "which of the catalogue's 280 subgenres can we build" but "which ones
  would have existed on a Master System, NES, SNES, Mega Drive or GBA", especially NES and GBA. The purpose is
  social: bring that experience to children who do not have it.

decision-drivers:
- The differentiator is not genre coverage. A generic 2D engine exists by the dozen; one where ACCESSIBILITY comes
  free in any genre does not. That is the product.
- The target hardware is weak and, today, absent. Any performance number is an estimate until devices exist.
- Pillar 2 (a11y) outranks fidelity to 1983 silicon whenever the two disagree.
- The modularisation separated RESPONSIBILITIES. An engine needs things separated by what TRAVELS TOGETHER — a
  different question, yielding a different cut.

considered-options:
- &console-filter "Scope by console filter: only genres that existed on those five machines"
- &catalog-all "Build for the whole 280-subgenre catalogue"
- &platformer-only "Stay a platformer; no engine"

pros-and-cons-of-the-options:
  console-filter:
    pros:
    - "A verifiable criterion — a real cartridge proves it — instead of taste."
    - "Excludes exactly what the hardware cannot serve: keyboard text entry, fluid/cloth/soft-body simulation,
       microphone FFT, offline idle accumulation."
    - "The excluded set is small: roughly 193 subgenres pass."
    cons:
    - "Rejects genres a JS engine could trivially do (typing, idle) — deliberately."
  catalog-all:
    cons:
    - "Requires a general 2D framework; the 320x180 console spec stops meaning anything."
  platformer-only:
    cons:
    - "Abandons the 35-game collection that is the project's stated reason to exist."

decision-outcome:
  chosen-option:
    link: *console-filter
    justification: |
      Scope by console filter. The engine builds what a cartridge could hold. Games requiring three simultaneous
      buttons are IN — held buttons convert to toggles and the Dev has designs for every case. INPUT CAPABILITY IS
      NEVER A SCOPING CRITERION.

  consequences:
    positive:
    - "The scope filter is a MEASURABLE question ('did this genre ship on a cartridge for these five machines?')
       instead of a matter of taste, so a game can be argued in or out with evidence."
    - "The 320x180 / 16px tile / limited-palette budget stops being a platformer inheritance and becomes the
       console specification every future game is written against — one target instead of one per game."
    - "Accessibility stays a property of the ENGINE rather than of The Inclusionist: the same sonar, high
       contrast, menu navigation, TTS, Libras and touch serve any game the filter admits."
    - "The step order front-loads the cheap, reversible work (entity model, input as data, i18n) and puts the
       irreversible split behind a test that can veto it."
    neutral:
    - "The DOUBTFUL bucket stays large on purpose — Snake and Pong are in it — because an honest 'I do not know'
       is verifiable and an invented example is not."
    - "Roughly sixteen cartridge genres the catalogue lacks (world bigger than the screen, progression between
       sessions, password/save) become known gaps rather than surprises."
    - "TypeScript everywhere until the MVP ships; the Rust/WASM analysis is recorded to be re-read, not re-derived."
    negative:
    - "Genres that need a keyboard, particle/fluid/cloth simulation, microphone FFT or idle accumulation are out,
       and some of them are genuinely good educational games."
    - "The packaging payoff arrives late: two packages only after a second consumer exists, so for several steps
       the work buys structure with no visible feature."
    - "Every performance number in this record is an estimate until the Positivo/Chromebook hardware exists."

  confirmation: |
    PARTIAL, and stated as such rather than ticked.

    Step 1 (entity model) is DONE and machine-checked: `app/js/core/entity.ts` holds one `Player`; all 23 module
    views derive from it via `PlayerView<K>`; `core/state.players` is `Player[]`. The confirmation is `tsc
    --noEmit` plus mutation — renaming `viz` in core/entity breaks seven files in one compile, and a misspelled
    player field is now TS2551 where it used to compile in silence.

    Step 3 (i18n of the announcements) is under way with `tests/i18n-dicts.node.test.js` guarding structure
    across pt/en/es, plus a browser scan of every aria-label for un-resolved keys.

    THE REAL CONFIRMATION OF THIS RECORD IS STEP 4. IT HAS NOW BEEN RUN — 2026-08-25 — AND IT SAYS NO.

    `coinTarget` was not a hypothetical: `ui/hud.vphudHtml(coinTarget: number = COIN_TARGET)` took it, and the
    HUD is engine — a game without coins had nothing to pass there, and got the platformer's 10 by default.

    FIXED 2026-08-25, and the verdict on that sentence has flipped: the target is now a REQUIRED parameter,
    injected by the consumer exactly as `powerShort` already was, and ui/hud no longer imports core/constants.
    What remains in that module is VOCABULARY — the 🪙 glyph, the `vphud-coins` class, the `coins` field of the
    view model. That is debt of a different kind and a smaller one: names are not followed by the compiler and
    do not stop a package from separating.

    The rest of the list below still stands, so step 5 still does not start — but it is one module shorter.

    But the answer is narrower and more useful than "the boundary is wrong", and the number is what makes it
    useful: THREE engine modules import from `game/`, across five edges —
      · render/draw.ts     → game/player.js (BOX), game/powerups.js, game/coin-spawning.js
      · render/textures.ts → game/activity-content.js (SOMASUB_SHAPES)
      · ui/activities-menu.ts → game/activities-registry.js
    Import edges are the hard evidence: not a name, but a dependency the compiler follows. A module with one
    cannot be packaged without dragging the game along.

    Five more modules speak of coins in CODE without importing: ui/hud (the case above), platform/audio-nav
    (the sonar's `Coin` type — the PURPOSE is engine, the TYPE is the game's), core/state (`coins: unknown[]`),
    platform/audio (an earcon keyed 'coin'), plus three that only carry the word inside a label or an
    announcement, which is prose and not dependency.

    So the verdict is: the boundary does not hold yet, and it is THREE MODULES away from holding. That is a
    work list, not a veto on the design.

    The heuristic itself is no longer prose: `tests/engine-boundary.node.test.js` runs it on every suite. The
    known debt is a list that may only SHRINK — the suite stays green today, the debt is countable, and any NEW
    edge fails immediately. A test that simply failed would have been weakened the first time someone was in a
    hurry.

    The end-state confirmation is step 6: a 200-line non-platformer consumer using the engine's a11y stack. Two
    packages without it would be a folder rename, and this record should not be read as satisfied before it.

  machine-spec:
    regimes: |
      FORM is imposed (API shape, validator or type — verifiable in a node test). BUDGET is advised (dev warning plus
      an expectation table) because there are no devices yet, and switching on automatic degradation before measuring
      invents a step that may make the frame worse rather than save it. A11Y is a gate: acceptance criterion, never
      a budget.
    resolution: "320x180, integer real-pixel scale, floor k=2. Already implemented in ui/layout.ts."
    safe-area: |
      304x170. ui/layout.ts already tolerates <=5 logical px cropped per side (the `-10` term) — an undeclared video
      limit until now. Nothing essential may spawn in that margin.
    tile: |
      16px — DECIDED. Consequence, now declared rather than implicit: 180/16 = 11.25 rows. THE GRID DOES NOT CLOSE
      VERTICALLY. Twelve rows are drawn; twelve pixels are always off-screen. No design may depend on the last tile
      row being fully visible. (10px and 20px do close; 16px was chosen anyway.)
    sprite-size: |
      NO fixed size — DECIDED. Preference for multiples of 16px, other sizes explicitly welcome because they make the
      art richer. THE DOCS ARE WRONG, NOT THE CODE: Art-Bible.md, character-animation.md and ADR-0016 all declare
      16x32, while the 83 shipped PNGs measure 25x34, 26x35, 31x35, 31x36, 25x36 and 31x34. Consequence: the atlas
      cannot assume a uniform grid, and every sprite carries its own pivot.
    palette: |
      64-colour parent palette, declared per game rather than fixed. Measured today: 158 distinct hex literals in
      app/js. The NES's 25 cannot hold per-surface contrast plus Okabe-Ito ramps plus a high-contrast mode, and
      PICO-8's fixed 16 fails the same way: FIXING COLOUR IS FIXING CONTRAST, AND CONTRAST IS A REQUIREMENT.
    draw-calls: |
      <=8 batches per viewport. This REPLACES the NES's 8-sprites-per-scanline, which protects nothing here: that was
      HBlank bandwidth, and WebGL has no scanline. It implies an atlas is mandatory — render/sprites.ts does 83
      individual Texture.from calls today.
    text-in-framebuffer: |
      0 glyphs. Already pillar 2 (text lives in the DOM). This is the deepest divergence from every existing fantasy
      console — PICO-8 and TIC-80 rasterise — and it is the right one: a screen reader cannot read a pixel. It also
      removes the font atlas and the bitmap-i18n problem entirely.
    audio-voices: |
      8 (six synthesised, two PCM), with TWO RESERVED for a11y: earcons, sonar, ledge guard. Voice stealing by
      priority; never silence by failure, never queue.
    audio-allocation: |
      Zero node allocations per note — pooled voices. This is the audio limit that actually protects the Chromebook,
      and no historical console could express it, because their channels were fixed registers rather than allocated
      objects. platform/audio.ts creates oscillator plus gain per event today.
    haptics: |
      Output channel. MANDATORY REDUNDANCY WHEN PRESENT, NEVER A FRACTION OF THE INFORMATION LOAD. The Dev proposed
      vibration as a third information source for deaf players in rhythm games; the research disagrees on the
      ACCOUNTING, not the value. It is inert on Safari/iOS (never supported), on Firefox (navigator.vibrate removed
      in 129), on desktop without hardware, in hidden tabs, before the first gesture, and on cheap generic
      controllers — and on the primary target device, a Chromebook with only a keyboard, the promise is ZERO. Light
      and animation carry 100% of the "when"; haptics is a fourth reinforcement. A toggle in the a11y menu is
      required from the first vibration.
    crt: |
      STAYS ON BY DEFAULT — DECIDED. Recorded consequence: the scanlines are a CSS repeating-linear-gradient on an
      ::after (app/css:217), composited at PHYSICAL resolution — up to 1280x720 on a Chromebook, roughly sixteen
      times the framebuffer's 57,600 pixels — and they never pass through PixiJS. This is very likely the most
      expensive item in the frame. It is a suspicion, not a measurement.
    fixed-timestep: |
      DEFERRED — no devices. core/loop.ts is variable-step with dt clamped at 2, which on a machine oscillating
      between 45 and 60fps means VARIABLE JUMP HEIGHT; in a game with an Easy mode for motor accessibility,
      non-deterministic physics is an a11y failure rather than a fidelity one. But TUNE and EASY were calibrated on
      the variable step, so migrating recalibrates the whole game. Revisit with hardware in hand.

  input-model:
    interlingua: |
      The interlingua today is the PHYSICAL KEY CODE. That works for the three modalities that have keys and breaks
      for the three that do not — which is why ui/webcam.ts synthesises KeyboardEvent and injects it underneath the
      other translators. Promote it to (player, action) carrying source, rate and confidence; the key code becomes an
      internal detail of the keyboard driver.
    latch: |
      Held-to-toggle conversion moves OUT of game/physics.ts:161-163 into a pure input/latch.ts. Today the policy
      lives inside the physics and exists only for horizontal movement — jump, run and swap have no latch path.
    scanning: |
      ONE steering mechanism, not six. Slow motion, active pause and turn mode are LOOP settings needing no
      cooperation from the game; scanning, high-level intent and aim assist all reduce to (list, cursor, commit).
      THE PROPERTY THAT CARRIES THE DESIGN: scanning never invents input — it emits the same signal any modality
      emits, so downstream a plan is indistinguishable from a very skilled player and the physics does not change a
      line. Voice reuses the same layer without a cursor: it NAMES an affordance instead of scanning to it, which is
      why the affordance label belongs to the contract and is not UI decoration.
    precedent: |
      game/quiz.ts is ALREADY an affordance scanner — enumerated list, `sel` cursor, driven by keyboard, gamepad and
      touch. Steering this engine at 0.2 Hz is not alien to it; it already happens in one corner.
    voice-offline: |
      OPEN. Chrome's SpeechRecognition sends audio to a server by default, failing pillar 8 and child-data governance
      (ADR-0017). Options: WASM keyword spotting — the project already ships a sherpa-onnx WASM runtime for TTS
      (ADR-0022) — or, as a guaranteed floor, whistle and intensity detection over an AnalyserNode: zero model,
      offline by construction, enough for a one-signal switch.
    first-gesture: |
      One gesture unlocks THREE output subsystems: AudioContext resume, navigator.vibrate sticky activation, and
      getGamepads(), which returns an empty list until a button is pressed ON THE CONTROLLER — a page click does not
      count, it is fingerprinting mitigation. The first gesture on the controller is a PLATFORM event, not a game
      event, and the a11y menu must read "unknown" rather than "unavailable" before it.

  accessibility:
    principle: |
      WHAT IS MANDATORY IS THE INFORMATION; THE CHANNEL CARRYING IT IS INTERCHANGEABLE. Rhythm does not require
      hearing, it requires knowing WHEN. A raycaster does not require sight, it requires knowing where the wall is,
      where the enemy is, and which way I am facing. This replaces an earlier framing that treated a missing channel
      as an impossible genre — a mistake, and the Dev caught it.
    what-is-actually-impossible: |
      Named honestly, after searching channel by channel. Hidden object for a blind player: the task IS visual search
      under visual noise, and every adaptation deletes the task. Free drawing for a blind player AS DRAWING: offer
      composition by named primitives, and do not call it drawing. Continuous physics puzzles for a blind player
      without a declared reading grid. Rhythm whose RULE depends on timbre, pitch or motif recognition — rhythm
      itself ports fine, since the visual cue is already the source of truth across most of the genre. And any
      tight-window reaction genre for "I can only blink", where the answer is rule rewriting, not adaptation.
      A blind-accessible raycaster EXISTS and is legitimate — and it evaluates a different skill, so it MUST NOT
      share a leaderboard with the sighted version.
    the-line: |
      Three layers. PRESENTATION — how state becomes pixel, sound and text — never changes the game; the engine
      decides and it is always available. OPERATION — how intent becomes input: remap, latch, scanning, coyote time,
      input buffer, minimum target — does not change the game, it changes the MOTOR TOLL of expressing it; the engine
      decides and the game cannot refuse. RULE — slow motion, invincibility, aim assist, hit window, skip — is where
      the line lies.
      THE OBJECTIVE CRITERION: an adaptation crosses the line when it alters the set of REACHABLE STATES or the
      PROBABILITY of reaching them, not when it alters how state is perceived or commanded. By that test the Easy
      mode's +4px collection hitbox, its ledge protection and its 2/3 gravity are all RULE, while toggle-move is
      OPERATION. Today a single button labelled "Fácil" bundles all three layers, which is why the argument is
      unwinnable in practice.
    free-vs-declared: |
      Free today, with the game knowing nothing: the full-screen post-processes — sixteen vision modes, six
      colour-blindness matrices, low vision, blindness. They do not know what a tile is and do not need to.
      NOT free, and this is the whole architecture: the three functions that look most generic are the three most
      coupled to the platformer. roleOf(t) in render/high-contrast.ts is a fixed tile table (9 hazard, 4|5|10 climb,
      3 water) on which ALL high contrast depends. caneProbe uses pl.facing and BOX.w/2 + TILE*0.6. sonar defines a
      target as an uncollected coin owned by this player. A grid game has no facing, a turn game has no TILE, and
      none of them has a coin.
    seven-declared-fields: |
      With these, a11y becomes free again for any genre. One, topology of the navigable space WITH a metric: grid,
      continuous, or ordered hotspot list. Two, semantic role per cell or entity, decoupled from colour and sprite.
      Three, a speakable name in pt-BR with gender and plural — required TWICE, because vlibrasSay translates TEXT,
      so without a name there is no Libras either. Four, who has focus and which way it points. Five, the current
      objective and its target. Six, who owns the tick, mine or the clock's — the single bit that separates Sokoban
      from Snake and decides whether scanning and WCAG 2.2.1 apply. Seven, event versus state.
    flash-limiter: |
      THE CHEAPEST AND MOST VALUABLE ITEM IN THE WHOLE STUDY, and it contradicts ADR-0020. core/layers.ts declares
      A11Y_CORRECTION as always the LAST post-process. Correct for contrast; wrong for safety — the correction
      INCREASES inter-frame luminance delta and nothing measures after it. A measured flash limiter must be a pass
      AFTER A11Y_CORRECTION. Today 2.3.1 is met by content discipline (game/traffic.ts's 16-second cycle), which does
      not scale to 35 third-party games.
    assistance-and-privacy: |
      An assistance profile REVEALS A DISABILITY. Pillar 2 meets pillar 6: under LGPD/COPPA and ADR-0017 this is
      sensitive child data. RULE: the assistance mark lives on the device, is visible to the pupil and the local
      teacher, and NEVER enters xAPI/Caliper telemetry. Unresolved in every existing ADR.
    pedagogical-exception: |
      In a literacy activity, simplifying the text DESTROYS the exercise — the text is the assessed item. The game
      declares WHICH ITEM IS ASSESSED; the engine adapts everything else aggressively. Without this, WCAG 3.1.5 is in
      permanent contradiction with the curriculum, and the honest move is to declare the exception rather than omit it.
    per-player-limits: |
      Vision is already per-player (GPU filter per viewport) and audio is already per-player (setSinkId). But TIME
      BELONGS TO THE LOOP AND THERE IS ONE LOOP: slow motion, pause and speed can NEVER be per-player in local
      multiplayer. The closed set of globals-by-physics is time, world geometry, and scene or weather. This belongs
      in the API, not discovered in the field.
    missing-categories: |
      Absent from every prior list and required by the pillars: speech; vestibular and motion sickness, distinct from
      epilepsy; sensory overload and autism, which COLLIDES with blindness a11y and is the one conflict that is real
      inside a single head; deafblindness — DECLARE OUT OF SCOPE, honestly, since no haptic channel and no braille
      display output exist; dyscalculia; and PRE-READERS, which in a Brazilian public school is probably the most
      numerous category of all and has no mechanism today.
    honest-conformance: |
      Never claim AA or AAA wholesale. DOM (menus, HUD, quiz): AA reachable and verifiable. Canvas and world: 1.4.11
      AA is the real target. 2.2.1: real conformance in grid, turn and pointer genres; in rhythm and parts of
      scrolling, DECLARE NON-CONFORMANCE BY THE REAL-TIME EXCEPTION rather than papering over it. 3.1.5 in literacy
      activities is structurally unreachable — declare the pedagogical exception.

  engine-game-boundary:
    audit: |
      Of 100 modules — not 94; the count was wrong and docs/ARCHITECTURE.md was stale by four — 32 are ENGINE, 19 are
      INCLUSIONIST and 49 are FRONTIER. The number that matters is the 49. The modularisation separated
      RESPONSIBILITIES; it has not yet separated PRODUCTS. Every one of those cuts was correct: the criterion was
      "what changes together", and the engine's criterion is "what travels together".
    biggest-coupling-is-not-the-platformer: |
      It is the LANGUAGE. Every screen-reader announcement is pt-BR hardcoded — srSay('Sonar: moeda à direita,
      perto.'), 'Área secreta revelada.' — across audio-nav, secret-areas, session, pause-icons, shell and the
      settings panels. The i18n pillar is satisfied only by data-i18n in the HTML. THE LAYER THAT IS THE PRODUCT
      DOES NOT GO THROUGH t(). It breaks before the second game, because it breaks at the second LANGUAGE.
    point-of-no-return: |
      Ten structural interfaces of the SAME player exist today in ten different modules: PhysicsPlayer, DrawPlayer,
      AnimPlayer, HudPlayer, KeydownPlayer, GamepadPlayer, TouchBindPlayer, SessionPlayer, PausePlayer, MotionPlayer.
      Nothing forces them to agree, and this project already knows what that costs — three copies of the
      action-to-edge table diverged and broke the wall climb in Easy mode. IF createGame() IS BORN BEFORE THE ENTITY
      MODEL, THOSE TEN BECOME THE ENGINE'S PUBLIC API, and engine and game can no longer be separated without
      rewriting all 100 modules at once.
    test-heuristic: |
      A test of an ENGINE module whose fixture needs a COIN is proof that the cut did not land. You cannot see this by
      reading the module — only by reading its test. That is how render/fx, render/viewports and ui/pause-icons,
      which look clean from the inside, were found to be tied from the outside.
    migration-order: |
      0. Fix the module map. (Done: it was stale by four modules.)
      1. Entity model, moving nothing. `tsc --noEmit` is the test. Zero runtime risk, and prerequisite to everything.
         DONE (1e99b41 → 782fa37). core/entity.ts holds one Player; the 23 views derive from it with
         `PlayerView<K>` (= Pick) so the node-project fixtures stay narrow; core/state.players is `Player[]`.
         Closed on the way: `quiz` had four shapes, `clingN` two, `'R'|'L'|'U'|'D'` was written three times, and
         ui/pause-icons carried an index signature that silently accepted any misspelled field.
      2. Input actions as data — closes the divergence that already cost an a11y defect.
      3. i18n the announcements in pt-BR, en and es — DECIDED, starting now. Mechanical, large,
         parallelisable, and cheap while nothing has moved yet. It is also the step that proves the a11y layer is a
         product rather than a feature of one game, since it breaks at the second LANGUAGE before the second GAME.
      4. createGame() inside the same repository. THIS IS THE BOUNDARY TEST: if it needs a parameter called
         coinTarget, the boundary is wrong and step 5 must not start.
      STEPS 5 AND 6 SWAPPED — Dev, 2026-08-25. The consumer comes FIRST, and this record's own reasoning is why:
      it already says that without the second consumer "engine is just a folder with a different name". If the
      consumer is what makes the word true, it is also what REVEALS the boundary — it does not merely confirm
      it. Cleaning the five leaking edges before writing it would be cutting by guesswork, and a cut in the
      wrong place is more expensive than no cut at all, because it looks finished.
      The 200-line quiz is also CHEAPER than the cleanup, and unlike the cleanup it produces an answer instead
      of an opinion: whatever it needs from the engine IS the engine; whatever it never touches is not.
      The order below reads 5 → 6 as written; execution order is 6, then 5.

      5. Split the 49 frontier modules in four batches, leaf-first. AFTER step 6.
      6. Two packages — but ONLY after a fake second consumer exists: a 200-line game that is NOT a platformer, a
         pure quiz with no physics and no tiles, proving sonar, high contrast, menu-nav, TTS, Libras and touch work
         outside the genre. WITHOUT THAT CONSUMER, "ENGINE" IS JUST A FOLDER WITH A DIFFERENT NAME.
         The consumer is built against the SINGLE package as it stands today. Every dependency it cannot satisfy
         without reaching into `game/` is a finding, recorded rather than worked around — that list, not a guess,
         is what step 5 then acts on.
      7. The remaining gaps: tilemap with layers, sprite atlas, namespaced save, scene manager, camera.
      RULE THROUGHOUT: tests migrate with their module, and any ENGINE-module test whose fixture mentions coin, quiz
      or scenario is rewritten in the SAME step, never later. Deferring that is exactly how three copies of the edge
      table accumulated.
    first-core: |
      START WITH THE DISCRETE GRID. All five research passes converged on it independently: it is the largest bucket
      of approved games (~55), the only fully deterministic one and therefore the only one testable without
      floating-point tolerance, each grid engine yields dozens of games with almost no extra code, and it is the ONLY
      loop that survives single-switch scanning intact — precisely what the project's inclusion purpose requires.

  catalogue-filter:
    approved: |
      Roughly 193 subgenres, each with a real cartridge and console named. The DOUBTFUL bucket was deliberately kept
      large — Snake and Pong are IN IT, because no official port to those five machines was found. A large honest
      "I do not know" is worth more than an invented example, since a reader will verify the doubts and will not
      verify the certainties.
    rejected: |
      Keyboard text entry: no console has a keyboard. But word games DID exist, via letter selection with a cursor,
      so the engine needs a LETTER GRID SELECTOR, not a keyboard — and in pt-BR that means legible accents at
      320x180. Also rejected: particle, fluid, cloth, soft-body and n-body simulation; microphone FFT; offline idle
      accumulation. NOTHING was rejected for requiring a network — the whole catalogue is already offline-first.
    mouse-is-not-a-veto: |
      The SNES Mouse existed, Mario Paint shipped with it, over 130 SNES titles supported it, and the Mega Drive had
      the Mega Mouse. AN ABSOLUTE CURSOR IS A FIRST-CLASS CONSOLE MODALITY, and modern touch reproduces it for free.
      What is missing is the GENRE — hidden object is 2000s PC casual — not the device.
    what-the-catalogue-lacks: |
      Around sixteen cartridge genres, all sharing one signature: they need a WORLD BIGGER THAN THE SCREEN and
      PROGRESSION BETWEEN SESSIONS. Scrolling beat'em up, run-and-gun, shmup with chained power-ups, large-map
      metroidvania, turn RPG with a world map, competitive falling puzzle, Mode 7 racing, item-gated top-down
      adventure, fighter with motion inputs, team sports with a season, absolute aim via peripheral, single-screen
      puzzle-platformer with deterministic AI, sugoroku, Gauntlet-style crawler, Asian board games — and,
      transversally, PASSWORD AND SAVE BETWEEN SESSIONS, which the catalogue lacks entirely because it was written
      for "one game in one prompt". That is the cartridge idiom, and the engine needs it.

open-decisions:
  rust-wasm: |
    DEFERRED TO POST-MVP — DECIDED. Everything stays in TypeScript until the MVP ships. Recorded here because the
    analysis holds and the decision should be re-read, not re-derived, when the time comes.
    The Dev is considering writing the games in Rust rather than TypeScript, compiled to WASM.
    It splits along a line the audit already found on its own: the a11y layer is DOM-NATIVE — aria-live regions, DOM
    text (which is WHY text is never rasterised), VLibras, menu-nav, the settings panels — and cannot and should not
    move; the core — grid, physics, collision, RNG, turn machines — is exactly what benefits. The boundary would be
    RUST = SIMULATION, JS/DOM = PRESENTATION AND ACCESSIBILITY, a cleaner split than the one being designed.
    Easier: fixed-step determinism is native; zero-allocation hot paths are native; "the grid core is the only one
    testable without float tolerance" stops being discipline and becomes a type.
    Harder: THE INTEROP SURFACE BECOMES THE NEW PLACE WHERE TWO SOURCES OF TRUTH DIVERGE — and within a single
    language this project already carried TWENTY-THREE player interfaces (this record said ten; they were counted
    one by one during step 1 and there were 23), three copies of one table that DID diverge and broke
    Easy-mode wall climbing, and documentation claiming 16x32 while the code ships six other sizes. A language
    boundary multiplies those opportunities. Also: 2194 tests are TypeScript and the golden trajectories would need
    re-anchoring; and the toolchain (three antivirus products, re-signed TLS, Add-Type already blocked) makes cargo
    fetching crates a real risk of the same class the Node --use-system-ca flag already solves.
    THE CRITERION THAT DECIDES IT: does the Rust core OWN the entities, with JS reading them every frame for the
    screen reader — serialisation cost plus divergence risk — or does Rust EMIT EVENTS while JS holds the
    presentational state? The second works. The first recreates the project's existing failure mode at larger scale.
  wasm-precache: |
    RESOLVED — DECIDED and implemented. `wasm` joined globPatterns and maximumFileSizeToCacheInBytes rose to 32 MB,
    because Workbox caps precached files at 2 MB by default and would otherwise have SKIPPED the 25.6 MB runtime with
    a warning, reproducing the same symptom. Precache went from 2.2 MB to 28.4 MB; the first online visit now
    downloads everything, which is the contract of a PWA that must work without a network afterwards. Verified in
    the browser: the file is physically in Cache Storage at full byte length, not merely named in sw.js.

  multiplayer-scanning: |
    OPEN, and pedagogical rather than technical. Freezing the world for player three's scan freezes players one, two
    and four; per-player time bubbles are impossible with shared physics. Precedent exists in the code (`p.waiting`,
    "Aguarde o Jogador 1"), and in a classroom waiting is defensible. Alternatives: everyone waits (recommended), or
    autopilot for the others.

