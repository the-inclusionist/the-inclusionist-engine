title: The Liberated Pixel Cup enters as THIRD-PARTY art under CC BY-SA 3.0, in its own quarantine, and never shares an asset with the author's own art

context-and-problem-statement: |
  The Dev decided on 2026-09-08 that the project uses the Liberated Pixel Cup — the OpenGameArt asset set at
  `github.com/OpenGameArt/LiberatedPixelCup`, a large body of 32×32-grid character sprites and tilesets built
  for exactly this kind of game.

  The decision is easy. What it touches is not, and the record exists for what it touches.

  ⚠️ THE LCP IS COPYLEFT, AND THE PROJECT'S OWN ART IS NOT FOSS. Read from the repository: the assets are
  DUAL-LICENSED under «Creative Commons Attribution-ShareAlike (CC BY-SA)» 3.0 and «GNU General Public
  License (GPL)» 3.0, attribution is required under both, and the repository carries separate author files
  for original and derivative works. Meanwhile ADR-0010 pillar 10 says, in as many words, that the project's
  art is a THIRD PARTY'S — the Dev's wife holds full patrimonial ownership — and `docs/LICENSES.md` records
  it as «NÃO é FOSS».

  ⚠️ AND THE PIPELINE IS A DERIVATIVE-WORK MACHINE. `plano-arte-procedural` turns source art into a semantic
  image (region, luminosity) plus a palette dictionary, for infinite recolour. A semantic image traced from an
  LCP sprite is a derivative of that sprite. So the hazard is not «may we use it» — it is that a pipeline
  which happily mixes sources would produce ONE asset carrying two incompatible regimes, and the copyleft
  would reach the combined work.

  That is not a licensing inconvenience. It would decide, on the author's behalf and without asking her, that
  her non-FOSS art becomes share-alike. Pillar 10 exists precisely to keep that decision hers.

decision-drivers:
  - "⚠️ The author's ownership is not the project's to spend. Pillar 10 is a statement of FACT, not a policy
     the project may trade away for convenience."
  - "The requerimento's own argument, quoted in ADR-0051: «construir do zero aquilo que já existe sob licença
     livre é desperdício de recurso público». The LCP is exactly that — and the argument cuts FOR using it."
  - "300+ games is the MVP with no budget and no contracts (ADR-0070, volunteer work only). An existing,
     coherent, purpose-built asset set is the difference between a catalogue and a wish."
  - "⚠️ Attribution is an OBLIGATION under both arms, not a courtesy. A gate that forgets it makes the project
     a licence violator silently."
  - "`docs/LICENSES.md` already has three regimes and the third is «conteúdo de terceiros: a licença que o
     autor escolheu, preservada». Nothing new has to be invented — the frame exists."

considered-options:
  - "A1 — LCP as DESIGN REFERENCE only, redrawn like the City parallax was (ADR-0042)."
  - "A2 — LCP as assets, taken under the GPL-3.0 arm."
  - "A3 — LCP as assets, taken under the CC BY-SA 3.0 arm, quarantined."
  - "A4 — LCP as assets with no separation, letting the pipeline mix freely."

pros-and-cons-of-the-options:
  A1:
    good:
      - "No copyleft attaches at all, and it is the precedent this repository already set with the City."
      - "Nothing has to be segregated, because nothing foreign is kept."
    bad:
      - "⚠️ It saves no labour, which is the entire reason to reach for the LCP. Redrawing 300 games' worth of
         sprites is the work the Dev is trying not to do."
      - "And the line between «reference» and «derivative» is not the artist's intent — a close redraw of a
         specific sprite is a derivative whatever it is called."
  A2:
    good:
      - "GPL-3.0 art inside AGPL-3.0-or-later code is the cleanest COMPATIBILITY story: one copyleft family."
    bad:
      - "⚠️ It pulls art into the CODE regime, which is the exact line pillar 10 and `LICENSES.md` drew for
         legal reasons — the Lei 14.063/2020 obligation is about the PROGRAM."
      - "GPL's «source = the preferred form for modification» would put the Aseprite/semantic sources under an
         obligation the art regime never accepted."
  A3:
    good:
      - "Art licensed AS ART, which keeps the two regimes as separate as the project already declares them."
      - "It lands in the third row of `LICENSES.md` with no new regime invented."
      - "Attribution and share-alike are per-asset obligations, which a quarantine can actually enforce."
    bad:
      - "⚠️ CC BY-SA 3.0 is NOT compatible with the GPL family, so an LCP-derived asset can never be merged
         into a GPL/AGPL-licensed data module. The quarantine is not tidiness — it is the mechanism."
      - "Two copyleft regimes now exist in one repository, and a reader has to be told which reaches what."
  A4:
    good: ["Fastest to start."]
    bad:
      - "⚠️ It converts the author's art into share-alike by accident, through a pipeline, without her being
         asked. This option is listed so that its refusal is on the record, not because it was close."

decision-outcome:
  chosen-option:
    link: "A3 — assets under CC BY-SA 3.0, quarantined, attributed per asset"
    justification: |
      §1 · THE LCP ENTERS, AND IT ENTERS AS THIRD-PARTY CONTENT. It is governed by the third row of
      `docs/LICENSES.md` — «a licença que o autor escolheu, preservada» — which is the row that already exists
      for exactly this. ⚠️ ADR-0010 pillar 10 is NOT disturbed: it says all art is a third party's under the
      licence that third party chose, and the LCP authors are a second such third party under the same rule.
      Nobody needs to reopen the pillar to read this record.

      §2 · THE ARM IS CC BY-SA 3.0, and the reason is the separation of regimes rather than a preference
      between two copylefts. The GPL arm would put art under the CODE licence, and the whole point of
      `LICENSES.md` having three rows is that the programme obligation and the art obligation are different
      obligations with different owners. ⚠️ **To override, say so**: taking the GPL-3.0 arm instead is a
      defensible reading, and it buys single-family compatibility at the price of blurring that line.

      ⚠️ §3 · QUARANTINE, AND IT IS THE SUBSTANCE OF THIS RECORD, NOT ITS HOUSEKEEPING. LCP-derived assets
      live in their own tree, with their own attribution file, and:

        · no asset may contain BOTH LCP-derived material and the author's own art;
        · no LCP-derived material may be fed into a palette, semantic image or atlas that also carries the
          author's own art;
        · a game either uses the author's art or LCP art for a given asset — never a blend of the two.

      The reason is one sentence: mixing would license HER art share-alike, and that is not the project's
      decision to make. CC BY-SA 3.0 and the GPL family are also mutually incompatible, so the quarantine is
      simultaneously what keeps the code regime clean.

      §4 · ATTRIBUTION IS A CONDITION OF USE, NOT A CREDIT LINE. Both arms require it, and the LCP repository
      keeps author files per asset precisely because the authorship is per asset. Attribution travels with the
      asset into `docs/CREDITS.md`, and an asset whose author is unknown does not enter — «we could not find
      out» is not a licence.

      §5 · DERIVATIVES ARE SHARE-ALIKE, AND THE PROJECT SAYS SO UP FRONT. Anything the procedural pipeline
      produces from an LCP source is a derivative and ships CC BY-SA 3.0. That is a cost accepted knowingly,
      and it is only survivable because of §3.

  consequences:
    good:
      - "The catalogue gets a coherent, purpose-built art set without a budget that does not exist — which is
         the requerimento's own argument about not rebuilding what already exists under a free licence."
      - "The three regimes of `LICENSES.md` gain their first real second-party case, and the file stops being
         theoretical."
      - "⚠️ The author's ownership is left exactly where pillar 10 put it: with her."
    bad:
      - "⚠️ Two incompatible copylefts now live in one repository, and every asset has to know which one it is
         under. That is a permanent tax on the art pipeline, paid per asset."
      - "An LCP-derived asset can never later be relicensed by this project, and cannot be merged with the
         author's art even if someone later wants to."
      - "Attribution is per asset, so the credits file grows with the catalogue and must be maintained by a
         gate rather than by memory."
    neutral:
      - "The LCP grid is 32×32 while the engine's logical canvas is 320×180 (pillar 5). Fitting is an art
         decision per game, not a licence one."

  confirmation: |
    None of this is gated yet, and the gates are the point — a licence obligation kept by memory is a
    violation waiting for the day someone forgets. Owed, in this order:

    · a sieve asserting that no asset path mixes the two trees, in the shape of `tests/no-stored-history` —
      an INVENTORY, because «did this blend two sources» cannot be grepped for by a word;
    · a case that every LCP-derived asset has an attribution entry naming its author, and that the entry is
      not empty — an asset with an unknown author must fail, not pass quietly;
    · a case that `docs/LICENSES.md` names the CC BY-SA 3.0 regime and points at the quarantine tree;
    · ⚠️ an ORPHAN case on the attribution file, for the same reason every ledger in this repository has one:
      an entry naming an asset that no longer exists makes the file a memory instead of a measurement.

more-information: |
  ⚠️ WHAT THIS RECORD DOES NOT DECIDE, and should not be read as deciding:

  · WHICH assets are taken, and for which games. That is art direction, and it belongs with the person who
    owns the art direction.
  · Whether the author's own art is retired in favour of the LCP anywhere. It is not — this record adds a
    source, it does not replace one, and replacing one would be hers to decide.
  · How the 32×32 LCP grid meets the 320×180 logical canvas of pillar 5. It is a per-game art question.
  · Whether the LCP's own DERIVATIVE assets (the repository separates original from derivative, with
    different author files) carry additional attribution chains that need reading before use. They probably
    do, and the attribution gate is where that gets discovered per asset rather than assumed in bulk.

  ⚠️ AND ONE THING WORTH SAYING PLAINLY: the reason this record is long is not the licence. It is that the
  project's art belongs to someone who is not in this repository, and a pipeline that mixes sources would
  spend her rights without asking. Everything above is downstream of that.
