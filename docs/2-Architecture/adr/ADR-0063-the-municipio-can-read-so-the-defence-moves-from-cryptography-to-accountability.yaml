title: The Município CAN read the data, so the defence moves from CRYPTOGRAPHY to ACCOUNTABILITY — role, trail, minimisation and retention

context-and-problem-statement: |
  ADR-0056 answered four questions together — what telemetry may carry, who can decrypt what, how a share ends,
  and what happens when a key is lost — and built an end-to-end encrypted design in which the individual's data
  was unreadable to the party running the servers.

  ⚠️ THAT PARTY NO LONGER EXISTS AS A SEPARATE PARTY. ADR-0056 was written for an arrangement of TWO: a school
  or clinic as controller, and a supplier operating the software. On 2026-08-28 the Dev settled that it is ONE —
  "eu sou funcionário da prefeitura, o projeto é AGPL e ficará hospedado nos próprios servidores da prefeitura".
  The Município is the CONTROLLER, the developer is a public servant, and the servers are the Município's own.

  ⚠️ SO THE DESIGN'S CENTRAL MOVE BECAME INCOHERENT RATHER THAN MERELY UNNECESSARY. End-to-end encryption
  protected the datum from the operator. When the operator IS the controller, encrypting so that it cannot read
  its own data does not protect anybody: the controller has to read the data to run the policy — that is what the
  Bússola Escolar IS — and a key it must hold anyway is not a key that excludes it. Three more clauses lost their
  ground with it: the institution "verified by us", sharing handed over "off our network", and a certificate we
  issue. There is no "us" on the other side of the network any more.

  ⚠️ AND THE RECORD WENT ON SAYING ALL OF IT WHILE MARKED `accepted`. The external diagnostic of 2026-09-02
  judged ADR-0056 as `coberto` — covered — for two of the 108 problems it examined, because it read the status
  and believed it. That is the measured cost that produced ADR-0057, and this record is the repair of the case
  that produced it.

decision-drivers:
  - "⚠️ THE PURPOSE IS TO COLLECT, AND PRIVACY IS THE CONSTRAINT — carried forward from ADR-0056 unchanged,
     because it survived the premise: `o nosso objetivo é coletar dados! O máximo que conseguirmos mantendo
     anonimato, pois se o objetivo fosse anonimato, não coletaríamos dado nenhum.`"
  - "A defence has to answer the threat that is REAL for this system. For a school and socioassistencial system
     the realistic incident is misuse by someone with legitimate access, not an outsider reading a database."
  - "Metadata is personal data. A design that protects payloads and mediates relationships has protected the
     wrong half — ADR-0056 found this the hard way and it still holds."
  - "The datalake stays deliberately poor: no socioeconomic data, no sex, no age, no kinship. A narrow feature
     space is itself a privacy property."
  - "A claim the document makes must be checkable in the code (requerimento §49). The record must state the
     boundary it actually defends, never the strongest-sounding sentence."
  - "Nothing may charge the teacher a recurring toll to keep the class running."

considered-options:
  - "Q1 — keep ADR-0056's E2E and give the Município a key it must hold anyway"
  - "Q2 — the Município reads; the defence is ROLE, TRAIL, MINIMISATION and RETENTION, with encryption at rest
     and encrypted backups"
  - "Q3 — the Município reads, with no cryptography at all, on the grounds that the law already permits it"

pros-and-cons-of-the-options:
  Q1:
    good: ["Nothing to rewrite; the record and the design stay as they are.",
           "It would still defend against theft of the storage itself."]
    bad: ["⚠️ IT IS THEATRE. A key the controller must hold to run the policy excludes nobody, and a design that
           looks like it excludes someone is worse than one that admits it does not — it invites the reader to
           believe a protection that is not there.",
          "It costs real capability: every query the datalake needs would have to be answered through the
           encryption, which the drivers say must be weighed against what it protects.",
          "Key loss becomes a way to destroy a municipal record the law requires be kept."]
  Q2:
    good: ["It defends against the threat that is actually realistic here — misuse by legitimate access — which
            cryptography-from-the-operator never addressed at all.",
           "Every measure is auditable by a third party, which is what art. 37 and art. 46 ask for and what a
            key nobody can inspect is not.",
           "It keeps ADR-0056's genuine wins: the telemetry that cannot rebuild a classroom, and the refusal to
            let the server link one identifier to another."]
    bad: ["It is WEAKER against one threat: an attacker who obtains a legitimate role reads what that role
           reads, and no key stands in the way.",
          "It depends on people — role assignment, trail review — where the old design depended on mathematics,
           and people are the part that erodes quietly.",
          "`the child's data never leaves in a readable form` was a sentence anyone could repeat. `role, trail,
           minimisation and retention` is four things and none of them is quotable."]
  Q3:
    good: ["Simplest, and legally sufficient on its own terms — art. 7º III does authorise the processing."]
    bad: ["It gives up encryption at rest and encrypted backups, which cost almost nothing and defend the one
           scenario where the Município's own posture is irrelevant: a stolen disk or a leaked backup.",
          "Legally sufficient is not the standard this project set for itself."]

decision-outcome:
  chosen-option:
    link: "Q2 — the defence moves from cryptography to accountability, and says so"
    justification: |
      ===== 1. WHAT REPLACES THE KEY, AND WHY IT DEFENDS MORE THAN THE KEY DID =====
      Four measures, and each answers something the E2E design did not:

        · **ROLE.** Access is by function, and each professional sees exactly what the work requires. The
          Bússola's teacher does not read the Apoio Ativo's socioassistencial record and the reverse, because
          ADR-0058 §3 puts them in different systems with no shared database.
        · **TRAIL.** Every access is logged, and the log is auditable. The requerimento already promises this
          ("os perfis de acesso são segregados por função, e todo acesso fica registrado em trilha auditável").
        · **MINIMISATION.** The datalake stays poor on purpose — no socioeconomic data, no sex, no age, no
          kinship — and the narrowness is a decision, not an oversight.
        · **RETENTION.** The prazo comes from the archival and sectoral legislation, not from us. At the end the
          record is eliminated, or anonymised where the guard remains obligatory (art. 16 IV).

      ⚠️ AND THIS IS STRONGER AGAINST THE THREAT THAT IS ACTUALLY REAL. End-to-end encryption defended against
      the party running the servers, which in the two-party world was a supplier. In a school and
      socioassistencial system the incident that actually happens is someone with a legitimate login reading a
      record they had no business reading. Cryptography from the operator never touched that case; a role and a
      trail are the only things that do.

      ⚠️ AND IT IS HONESTLY WEAKER SOMEWHERE, which has to be written or the record repeats ADR-0056's mistake in
      the other direction: an attacker who obtains a legitimate role reads what that role reads. No key stands in
      the way, because there is no key that the controller does not hold.

      ===== 2. CRYPTOGRAPHY STAYS WHERE IT STILL DOES WORK =====
      At rest, and on backups. The scenario it defends is the one where the Município's own posture is
      irrelevant — a stolen disk, a leaked backup, a decommissioned drive. It costs almost nothing and it is the
      only place a key protects against something the controller cannot otherwise prevent.

      ⚠️ AND THE MEASURES OF SCALE HAVE A WRITTEN TRIGGER, not a promise: sharding with a key per shard, dynamic
      credentials, tokenisation with a vault, canaries and honeytokens, rate limiting at the data layer and query
      auditing are the right measures for a multi-network base — and they are ADOPTED WHEN THERE IS MORE THAN ONE
      NETWORK IN OPERATION. The trigger is written so that the wait is a decision and not forgetfulness: the
      right measure without a trigger becomes invisible debt.

      ===== 3. WHAT ADR-0056 GOT RIGHT AND IS CARRIED FORWARD UNCHANGED =====
      Its telemetry analysis survives the premise entirely, because it never depended on who ran the server:

        · **THE TELEMETRY CARRIES NO PII AND CANNOT REBUILD A CLASSROOM** (ADR-0056 §3). Session counters, no
          identifier, no persistent device id, nothing that links two sessions to one person.
        · **THE SERVER DOES NOT LINK ONE id TO ANOTHER** (ADR-0056 §3b).
        · **METADATA IS PERSONAL DATA**, and the finding that produced it stands as the sharpest thing in that
          record: the first sharing design encrypted the payload and still leaked, because THE FACT OF THE SHARE
          IS THE DATUM. "Fica registrado no nosso sistema que eu atendo o filho do pai do João por eu ter
          compartilhado algo com ele." A server that mediates a share learns the relationship even when it cannot
          read a byte of the content.

      ⚠️ THAT LAST ONE IS WHY THIS RECORD DOES NOT SIMPLY SAY "THE CONTROLLER READS EVERYTHING, SO NOTHING
      MATTERS". The relationship graph is still a datum, it is still collected by the act of running the service,
      and minimisation still applies to it.

      ===== 4. WHAT DIED WITH THE PREMISE, NAMED SO NOBODY REBUILDS IT =====
        · End-to-end encryption of the individual's working base FROM THE PARTY RUNNING THE SERVER. There is no
          such separate party.
        · The institution holding an account "verified by us", and receiving a certificate we issue. The
          institution is the Município.
        · Sharing "handed over off our network". There is no other network.
        · The two keys, professional and institutional, AS A DEFENCE AGAINST US. The internal blast-radius
          argument survives and belongs to §1's ROLE; the exclusion argument does not.

      ⚠️ AND ADR-0056 §5 — THE PRINTED RECOVERY SHEET THAT NEVER LOCKS THE GAME — DIES AS A MECHANISM AND
      SURVIVES AS A RULE. With no key that only the professional holds, there is no key to lose. What must not be
      lost is the rule that produced it: **nothing charges the teacher a recurring toll to keep the class
      running**, and nothing about an adult's credential state may stop a child from playing.

      ===== 5. THE MULTI-TENANT CLAUSE IS A CONTROLLER CLAUSE =====
      ADR-0058 §6 makes every system multi-tenant from the start. The consequence for THIS record is the one that
      is easy to read as configuration and is not: **different tenants are different CONTROLLERS in the same
      installation**, each answering for its own. So isolation stops being good practice and becomes a compliance
      requirement — a database or schema per tenant, never a tenant column in a common table.

      The failure mode decides it, not the taste: a query that forgets `WHERE tenant_id` returns another
      controller's rows, silently, with a 200. A query that forgets the schema returns an error.

  consequences:
    positive:
      - "The record now describes an arrangement that exists, which is the whole point: two of the 108 problems
         the external diagnostic examined were marked covered by a record whose premise had died."
      - "The defence matches the threat. Role and trail answer misuse by legitimate access, which is what
         actually happens in a school system and what E2E never addressed."
      - "Every measure here is inspectable by a third party — a role table, a log, a retention rule, a schema —
         which is what art. 37 and art. 46 ask to see and what a key nobody can audit does not provide."
      - "The datalake regains the capability the encryption would have cost it, which the first driver requires
         be weighed rather than assumed away."
    negative:
      - "⚠️ WEAKER AGAINST THE INSIDER WITH A VALID ROLE, and no clause here changes that. The measures reduce
         what one role reaches and make the reaching visible; they do not prevent it."
      - "It depends on people — assigning roles correctly, reviewing trails — where the old design depended on
         mathematics. People are the part that erodes quietly, and nothing in CI can watch it."
      - "The project loses a sentence anyone could repeat. `No child datum leaves the device in a form anyone can
         recognise` was quotable and is now false; `role, trail, minimisation, retention` is four things."
      - "Schema-per-tenant multiplies migrations by the number of tenants, and a half-applied migration leaves
         tenants on different schema versions."
    neutral:
      - "The public statement of this design already exists, in the requerimento's Anexo V §V.1–V.7. This record
         and that annex must be changed together or they drift."

  confirmation: |
    · **ROLE:** a test that a role reaches only its own system's data — mechanically checkable once the compass
      exists, and checkable today by reading four backend configurations for the absence of a credential to
      another system's database (ADR-0058).
    · **TENANT:** the isolation test ADR-0058 already owes — two tenants in one installation, and a query
      written WITHOUT a tenant filter must ERROR rather than return the other tenant's rows. This is the one
      test that must exist before the second tenant does.
    · **TELEMETRY:** carried from ADR-0056 — no field of a telemetry event may be an identifier, and no two
      events may be linkable. Assertable over the event schema without a server.
    · **AT REST:** the storage is encrypted and so are the backups. Checkable by configuration.
    · **TRAIL:** every read of a student record writes a log line naming who, when and what. Assertable at the
      data-access layer, and it is the measure whose absence would be invisible.

    ⚠️ WHAT NO GATE CONFIRMS, and it is the honest centre of this record: whether anyone READS the trail. A log
    that nobody reviews is a log that documents the incident afterwards instead of preventing it. That is a
    municipal administrative practice, not a property of this software, and this record cannot promise it.

more-information: |
  WHAT THIS RECORD SUPERSEDES: ADR-0056, "No child datum leaves the device in a form anyone can recognise — E2E
  for the individual, RBAC for the institution, and telemetry that cannot rebuild a classroom". It keeps its full
  text, per ADR-0057 §4, and it should be read: its threat-modelling of metadata, and the moment the Dev caught
  the leak mid-sentence, are the reasoning this record inherits rather than repeats.

  ⚠️ WHY WHOLE AND NOT IN PART, since §3 and §3b survive intact: because the TITLE asserts the dead premise —
  "no child datum leaves the device in a form anyone can recognise" is now false, and ADR-0057's second erratum
  decides that a record whose title asserts what was replaced is superseded whole, however many clauses survive.
  The index shows nothing but titles.

  THE DATE ABOVE IS 2026-08-28, when the premise changed, and not the day this record was written. Dating it by
  the day of the repair would place a decision a week after the decisions that already depend on it.

  ⚠️ AND THIS RECORD DOES NOT BELONG IN THIS REPOSITORY. It decides what the `school-compass` backends may hold,
  and this is a game engine. It stays until that repository exists, because an accepted record that disappears
  without a successor reads as a decision that was never taken — the rule in issue #101, which also carries the
  migration order.
