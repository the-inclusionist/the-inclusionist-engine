title: Typography decisions (font roster, spacing)

context-and-problem-statement: |
  The font-system decisions. Was REGISTRO §2. The full evidence-based reference (roster by role, ABNT/DOI sources)
  lives in ../../game-design/typography.md; this ADR records the DECISIONS.

decision-outcome:
  justification: |
    Adopt the roster + spacing below; evidence (Zorzi 2012, Minakata/Beier 2022, BDA 2023) shows spacing matters more
    than the font — so the safe bet is generous, adjustable spacing over any "magic" font.

more-information: |
  Decisions (was REGISTRO §2):
  - "**Canonical fonts:** Atkinson Hyperlegible (default), Andika (early literacy), Lexend (optional dyslexia/
    dyscalculia/ADHD), Atkinson Hyperlegible Mono (math), Braille CC0. [game-design/typography.md canonical]"
  - "**OpenDyslexic** — the position on this font moved three times; only the last one is in force, and the earlier
    two are kept because the reasoning is what makes the third defensible. (1) Keep it with a caveat: \"apesar do
    estudo com evidência fraca/negativa, resolvemos manter a pedidos de pessoas que gostam desta fonte\".
    (2) Remove it entirely: \"**Remove isso.** Acabei de falar quais são as canônicas e esta eu havia retirado.\"
    (3) ⚠️ **IN FORCE 2026-08-27 — it is back, as a DECLARED EXCEPTION.** The Dev's framing, which is the one that
    reconciles this record with the requerimento (§58, where the same meta-analysis is why the dyslexia-marketed
    faces were not adopted): the exception was opened "visto que há muitas pessoas com dificuldades ou deficiências
    que as preferem para diversos tipos de uso no dia-a-dia (leitura, escrita, legenda, desenvolvimento de
    software etc.)". Not adopted on evidence; offered on preference, which is a different claim and a defensible
    one. It is fetched ON DEMAND, not bundled — see the delivery tiers below.
    WHAT DOES NOT CHANGE IS THE HONESTY CLAUSE, and it is the whole reason this clause is long: the evidence for
    OpenDyslexic is weak-to-negative, and it is offered as a CHOICE, never as a remedy. No screen, no label and no
    description may claim it helps dyslexia. It sits in the list because people who prefer it are not wrong about
    their own reading; it carries no efficacy claim because the studies do not support one."
  - "**Default spacing:** line ≥ 1.5×, letter ≥ 0.12em, word ≥ 0.16em, paragraph ≥ 2× (WCAG 1.4.12); Dyslexia toggle
    = letter 0.18em + word 0.63em (British Dyslexia Association guide)."
  - "⚠️ **EMENDA 2026-08-27 — THOSE NUMBERS ARE FLOORS, AND A MENU THAT DOES NOT FIT SCROLLS.** Added because the
    spacing clause above said what the values ARE and never said what happens when they collide with a screen too
    small to hold them. That silence is where they get traded away.

    THE RULE, and it applies to every menu in every game on this engine, not to the pause card that raised it:

      **When a menu does not fit the screen, the answer is a SCROLLBAR.** Never tighter spacing, and — barring a
      reason written down at the point of use — never a hidden heading.

    The Dev's reason, and it is the reason and not an example: \"diminuir os gaps pode atrapalhar pessoas com
    dislexia\". The spacing above is not decoration that yields under pressure; it is the accommodation itself.
    Compressing it to make a list fit takes the accommodation away from exactly the child it was measured for, and
    it does so INVISIBLY — nothing on screen says the spacing was reduced, so nobody reports it and nobody can
    switch it back on. A scrollbar, by contrast, announces itself and costs one gesture.

    THE TITLE IS THE SECOND HALF, and cheaper to lose than spacing but still not free: \"sumir com o título
    geralmente não vale a pena\". A heading is what tells a screen-reader listener that the rules changed mid-sweep
    — the exact failure ADR-0044 measured in the old pause card. It may go only where something else carries that
    boundary, and the reason belongs beside the code that hides it.

    ⚠️ THIS OUTRANKS FITTING. If a screen cannot hold a menu at these floors, the menu scrolls — the floors do not
    move. A design that needs the numbers lowered is a design to change, not a spacing budget to spend."
  - "⚠️ **EMENDA 2026-08-27 — THE ROSTER IS MANDATORY FOR EVERY GAME, AND IT SPLITS IN TWO BY WHERE A FONT MAY
    APPEAR.** This is the structural half of the amendment, and it is new: until now the catalogue was one list and
    every font in it could be chosen for the whole interface. The Dev cut it by ROLE.

    **TIER 1 — CALLIGRAPHIC. Inside ACTIVITIES only, never in the system.** His words: \"usadas somente dentro das
    atividades, nunca no sistema (hud, menus), por isso não aparecem nos menus para escolhas, mas sim em botões
    dentro das atividades escolares.\" They are TEACHING MATERIAL — a child learns to read cursive by meeting
    cursive — and they are the opposite of legible-by-default, so they may not carry a HUD, a menu or a warning.
    Each one carries a MINIMUM SIZE, because a script face below it stops being hard and becomes impossible:

      · Blackletter — **UnifrakturMaguntia**, from 20 px, for a stroke close to the German gothic of printed
        books; **UnifrakturCook**; and **Manufacturing Consent**.
        ⚠️ CORRECTED 2026-08-27: an earlier version of this clause dropped UnifrakturCook ("Maguntia basta"). It
        stays — the requerimento (IV.5) adopts both by name, and dropping it here would have made the protocolled
        document false. Manufacturing Consent is new and comes from the Dev.
        ⚠️ AND ITS LICENCE IS UNVERIFIED. The requerimento asserts that every family in IV.5 is SIL OFL 1.1;
        Manufacturing Consent is not in that list, so nobody has checked it. It is not bundled until someone has.
      · Copperplate / Roundhand / English Script — **Pinyon Script**, from 24 px (the highest floor: the hairlines
        are the thinnest in the roster); plus **Monsieur La Doulaise** (English roundhand) and **Herr Von
        Muellerhoff** (close to Pinyon). Both were missing here and are adopted by the requerimento (IV.5); the
        Dev kept them for a reason worth recording — they are built on historical study of the hands themselves,
        which is what makes them teaching material rather than decoration.
      · Ronde — **there is no adequate OFL font for the French ronde**, and that fact drives the whole design of
        this entry. From 20 px. The software:
          (i) **never ships** Ronde Script, OPTIFrench-Script or Merveille;
          (ii) **detects** whether the user's machine already has one of the three;
          (iii) if none is present, **asks the user to obtain any of them AND OFFERS NO LINK** — the project does
               not route anyone to a download of a font it has no right to distribute, and a link is a form of
               distribution the licences do not grant;
          (iv) keeps the Ronde option **DISABLED** while no font is present.
        ⚠️ THIS IS THE ONE ENTRY THAT MAKES THE REQUERIMENTO INACCURATE AS WRITTEN. IV.5 tells the Prefeitura that
        every calligraphic family is "todas sob SIL Open Font License 1.1, o que permite redistribuí-las junto ao
        software". The ronde chain is the exception, and the document has to gain this paragraph.
      · Foundational — **Fondamento**, from 20 px. The nib-written sibling of the ball-and-stick hand, from
        Johnston's Foundational Hand.
      · Ball-and-stick — **Comic Neue**, and **Fondamento** above. Neither is in the requerimento's IV.5 list;
        both are additions of this project, and the document gains them in the same pass.
      · **Playwrite** — the REGIONAL Playwrite is active by default, and the set is bounded by LANGUAGE:
        \"somente fontes de países que falam inglês, espanhol e português\" (Dev, 2026-08-27). The criterion is the
        rule; the enumeration is data that must be read from the live Google Fonts catalogue at build time, never
        from memory. Confirmed present today: BR · PT · MX · AR · ES · ES Deco · US Trad · US Modern · GB J · GB S.
        ⚠️ AND THE RULE REACHES FURTHER THAN THE THREE MARKET LOCALES — English is official in Nigeria, Tanzania,
        South Africa, India and Ireland, and Playwrite has regional faces for several of them. That is a feature of
        the criterion, not an accident of it: the hand a child is taught is national, not linguistic, and a
        Nigerian classroom writing English does not write the American hand.

    **TIER 2 — GENERAL. Anywhere, and these are the ones the font menu offers.**

    ⚠️ AND THE ROSTER IS NOW CUT A SECOND TIME, BY DELIVERY (Dev, 2026-08-27). Being in the catalogue and travelling
    inside the PWA are different things: what ships is a download every school pays for on first load, so the
    bundled set is deliberately small and everything else is fetched when chosen.

      · **BUNDLED WITH THE PWA — the canonical set:** Atkinson Hyperlegible (default for a reading player) ·
        Andika (default for a player still learning to read) · Lexend (optional) · iA Writer Quattro (optional).
        And **Noto Color Emoji** — which is the FIFTH, confirmed by the Dev; it had been written on a separate
        line and I had guessed Atkinson Hyperlegible Mono instead. It is a font and it is not a choice: the
        interface uses emoji as labels, so it is bundled for the same reason the other four are.
        And **Atkinson Hyperlegible Mono** is the SIXTH, added when the question was put to him: it is the
        canonical face for MATHS in this record, the file is already in the repository (20 KB), and maths is not
        an optional part of the product.
      · **FETCHED BY CURRICULUM EVENT — and this tier is new.** **Noto Sans Math** and **Noto Sans Mono** download
        automatically on the FIRST exact-sciences activity of the Brazilian eighth year. The Dev's reason is that
        this is where the notation stops being arithmetic: scientific notation, advanced radicals, algebra,
        polynomials and plane geometry — none of which Atkinson Mono was drawn to set.

        ⚠️ THE TIER MATTERS MORE THAN THE TWO FONTS. Until now a font arrived because it was BUNDLED or because
        somebody CHOSE it. This is a third door: the CURRICULUM asks for it. It works only because ADR-0032 made
        the curriculum data that the game reads — the activity declares what it needs and the fetch follows, with
        no font list hard-coded next to a year number. Any future notation (chemistry, music, IPA) uses the same
        door instead of growing the bundle.

        ⚠️ AND THE BNCC CODES ARE NOT CONFIRMED. The Dev named the eighth-year content from memory and it is
        plausible; which skill codes actually carry it has to be read from the Base when the curriculum layer is
        populated (issue #2), because the TRIGGER is a skill code and not a year label. Recorded as his rationale,
        not as a verified mapping.
      · **ON DEMAND:** Source Sans 3 · Inter · Open Sans · Lato · Literata · Source Serif 4 · Newsreader ·
        **OpenDyslexic**. This list may grow or shrink as the game evolves; nothing in it is load-bearing.
      · **PLAYWRITE:** the one for the player's REGION downloads automatically with the PWA; every other Playwrite
        is fetched on demand. All of them are official and permanently part of the game — "not bundled" is about
        bytes on first load, never about being dropped from the roster.
      · **OTHER HANDWRITING FACES ON DEMAND:** Comic Neue · UnifrakturCook · Pinyon Script · and the rest of
        TIER 1.

    **REMOVED:** Kindergarten Pro and Learning Curve (Playwrite covers them, and it was built for exactly this);
    Great Vibes ("não faz sentido neste material").

    **THE MENU IS A CHOICE, NOT A TOGGLE:** the selected font is shown with a yellow background, like a pressed
    button. One font is active; the others are alternatives, not switches."

  - "⚠️ **FEASIBILITY, MEASURED 2026-08-27 rather than assumed**, because the amendment above is only worth what it
    can actually ship. The fonts are bundled as woff2 under `app/public/vendor/fonts/`, declared in `app/index.html`
    — **17 families, 928 KB total**, so a family costs on the order of 20–90 KB and Andika, the largest, costs 200.

      · ALREADY BUNDLED and staying: atkinson · lexend · quattro · andika · sourcesans · inter · opensans · lato ·
        literata · sourceserif · newsreader · comicneue · pinyon · ufmag.
      · BUNDLED AND LEAVING: greatvibes (44 KB) · ufcook (20 KB). The catalogue also drops learningcurve and
        kindergarten, which were entries marked `.off` with no files behind them.
      · MISSING AND NEEDED: **OpenDyslexic** · **Fondamento** · **Playwrite**.

    PLAYWRITE WAS THE LINE THAT NEEDED A NUMBER, AND THE DEV BOUNDED IT THE SAME DAY. Playwrite is not one family:
    it is a family PER REGION, on the order of fifty across all languages (Playwrite NL, NO, TZ, DE, FR, …). His
    rule cuts it to the languages this project ships: \"somente fontes de países que falam inglês, espanhol e
    português\". At the roster's measured cost (20–90 KB per family) that lands in the low hundreds of KB rather
    than 1,5–2 MB, which the 29 MB budget absorbs.

    ⚠️ THE ENUMERATION IS STILL OWED, and it is data rather than judgement: which region codes Google Fonts actually
    publishes under those three languages has to be read from the catalogue when this is built. Ten are confirmed
    (BR, PT, MX, AR, ES, ES Deco, US Trad, US Modern, GB J, GB S); the anglophone set beyond the US and Britain is
    the part to look up, not to guess."

