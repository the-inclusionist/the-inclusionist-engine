title: The PWA is the SITE, not a game — and the platform loads the fonts, the voices and the cartridges ONCE

context-and-problem-statement: |
  🔴 EVERY RECORD ABOUT OFFLINE DELIVERY HAS BEEN REASONING ABOUT THE WRONG ARTEFACT, and the Dev said so:
  «Você está entendendo como jogo o platformer, certo? Não é esta a ideia.»

  ADR-0114 priced a vendored runtime as «the app's dist grows, and every game's deploy carries it». ADR-0110
  put the voice fetch in «the engine, on first boot». Both sentences assume the unit of installation is a
  GAME. It is not: the unit is `the-inclusionist-site`, the shell a child actually opens, and the games are
  cartridges inside it.

  📏 AND THE DIFFERENCE IS NOT PRESENTATIONAL, because Cache Storage is partitioned BY ORIGIN. With one PWA
  per game, «the engine fetches the voices on first boot» means N origins each fetching the same ~244 MB, and
  a vendored runtime means N deploys each carrying the same ~32 MB. With one platform, both are paid once and
  every cartridge inside it is served from the same cache. The arithmetic that made the vendoring question
  hard was arithmetic about a topology that was never the plan.

decision-drivers:
  - "Pillar 8 as clarified: PWA first day online, then offline-first — and the thing installed is the SITE"
  - "Pillar 1: a school Chromebook downloads this once, not once per game a child opens"
  - "ADR-0065 §3's promise that a cartridge «does not have to know one exists» — a platform makes it structural"
  - "A rule priced at three hundred deploys is a different rule from the same one priced at one"

considered-options:
  - "U1 · Each game is a PWA; the engine fetches voices and fonts on each game's first boot"
  - "U2 · Each game is a PWA, but they share a cache"
  - "U3 · THE DEV'S ANSWER — the SITE is the PWA; the platform loads the engine, the fonts, the voices and the cartridges"

pros-and-cons-of-the-options:
  U1:
    good:
      - "A game can be deployed and opened on its own, with nothing else built."
      - "It is what the records assumed, so nothing has to be rewritten."
    bad:
      - "🔴 N origins × ~244 MB of voices, and N deploys × ~32 MB of runtime, for the same bytes."
      - "A child who opens a second game waits for the whole accessibility stack again."
      - "Every game repository has to get the delivery right, which is the ADR-0106 §2 defect at catalogue scale."
  U2:
    good:
      - "Keeps per-game deploys and would remove the duplication."
    bad:
      - "🔴 It cannot be built: Cache Storage is partitioned by origin, and modern browsers partition the HTTP cache by top-level site too. There is no shared cache to share."
  U3:
    good:
      - "The fonts, the voices and the runtime are fetched ONCE, by the thing the child installs."
      - "A cartridge stops carrying any delivery concern at all — the promise of ADR-0065 §3 becomes structural."
      - "It is one deploy to get right instead of three hundred."
      - "The first-day budget becomes a real number about a real artefact, instead of one about a demo."
    bad:
      - "⚠️ The site does not exist yet — its repository is `VAZIO`. This record is written ahead of the code."
      - "A single origin is a single point of failure and a single thing to whitelist in a school network."
      - "«All the games created» has to be reconciled with the manifest ADR-0068 §2 created for a byte budget."

decision-outcome:
  chosen-option:
    link: "U3 — the site is the PWA, and the platform loads everything once"
    justification: |
      **THE UNIT OF INSTALLATION IS `the-inclusionist-site`.** In the Dev's words, it «carrega tudo que é da
      engine, incluindo fontes e vozes e todos os jogos criados», and the consequence he drew himself:
      «Assim não se carregam as vozes por jogo, mas pela plataforma onde estão os vários cartuchos.»

      1. **A GAME IS A CARTRIDGE, NOT A PWA.** It keeps its own repository, version and licence (ADR-0068 §1,
         untouched); what it stops being is a unit of installation.
      2. **THE PLATFORM LOADS THE ACCESSIBILITY STACK ONCE** — the fonts, the four neural voices of ADR-0110,
         and whatever heavy runtime issue #129 settles on. Not per game, not per cartridge boot.
      3. **ADR-0110's GUARANTEE IS UNCHANGED AND GETS STRONGER.** The engine still owns the voices and the
         cartridge still declares nothing; what moves is WHERE the fetch happens. «On first boot» meant each
         game's boot, and that is now the platform's.

      🔴 AND THIS COLLAPSES THE MAIN ARGUMENT IN THE VENDORING COMPARISON, which is why it had to be recorded
      before issue #129 is answered. I priced a vendored runtime as «~32 MB in every one of three hundred
      deploys». At one platform it is ~32 MB, once. ⚠️ And the CDN option loses its own best argument in the
      same move: «the browser already has it cached from another site» was never true, because Cache Storage
      is per origin and the HTTP cache is partitioned by top-level site. Both sides of that comparison were
      being argued from a topology that was not the plan.

      📌 WHAT THIS DOES NOT DECIDE, and it is named rather than assumed: «todos os jogos criados» has to meet
      ADR-0068 §2, where `the-inclusionist-demos` holds a MANIFEST that chooses which games and which versions
      enter a delivery, precisely because a byte budget would never let the whole catalogue reach a school
      device. The reading that fits both is that the platform loads every game IN THE DELIVERY'S MANIFEST, and
      that the manifest is what a school's budget is spent on. That reading is not this record's to assert.
  consequences:
    good:
      - "The fonts, voices and runtime are downloaded once per device instead of once per game"
      - "A cartridge carries no delivery concern — ADR-0065 §3's promise stops depending on 300 authors remembering"
      - "Issue #129's comparison becomes honest: one deploy on both sides, and the CDN's cache-sharing argument is gone"
      - "The first-day budget finally has a real subject; the engine's own `dist` is a demo, not the product"
    bad:
      - "🔴 The site is `VAZIO`: this decision has no code to hold it, and the gates below cannot run until it exists"
      - "One origin is one thing to whitelist, and one thing to lose"
      - "⚠️ The engine's `check-precache` budget now measures a DEMO. It stays useful and it is not the product's number"
      - "«All games created» versus the ADR-0068 manifest is an open edge, and a school's byte budget lives in it"
  confirmation: |
    ⚠️ WRITTEN BEFORE THE SITE EXISTS, deliberately, so that the first commit in an empty repository cannot
    decide this by accident — the same reason ADR-0110 and ADR-0114 were written ahead of their code.

    The gates it owes, and none of them can run until `the-inclusionist-site` has a build:

    · THE PLATFORM'S PRECACHE HOLDS THE ACCESSIBILITY STACK — fonts and the runtime — and no cartridge's build
      does. ⚠️ Asserted as ABSENCE on the cartridge side too, or «the platform has it» would pass while every
      game shipped its own copy anyway.
    · A CARTRIDGE DECLARES NO DELIVERY — no font file, no voice, no runtime in a game's own package or `dist`.
      The shape is `tests/vozes-fora-do-pacote`, pointed at a game instead of at the engine.
    · THE FIRST-DAY BUDGET MOVES TO THE SITE, and the engine keeps its own as what it is: a ceiling on the
      DEMO. ⚠️ Two budgets with one name would be the duplicated-fact rot; they need different names on the
      day the second one exists.
    · ⚠️ AND THE OPEN EDGE GETS A GATE RATHER THAN A SENTENCE: whatever «all the games created» resolves to,
      the number of cartridges in the platform's precache must be READ FROM THE MANIFEST of ADR-0068 §2 and
      not from whatever happens to be in a folder.

more-information: |
  Supersedes ADR-0110 in part: «the engine fetches them itself on first boot» — the locus, not the guarantee.
  The four voices, the engine's ownership, the background fetch and the cartridge declaring nothing all stand.

  Supersedes ADR-0114 in part: the delivery unit it reasoned about. Its split between RUNTIME and MODELS, its
  refusal to put either in the npm package, and its clause that the first precache block is a playable game
  are intact — the last one now has the SITE as its subject, which is what makes it enforceable.

  ADR-0116 is untouched: «offline after the first day» is a rule about timing and does not care which artefact
  is installed.

  Deliberately NOT decided here: whether the platform precaches every game of the manifest at install or
  accumulates them as a child opens them (ADR-0116 permits either, and a school's link decides it); how the
  site relates to the Bússola session it is described as carrying; and whether a single game can still be
  deployed standalone for testing, which is a development convenience and not a delivery model.
