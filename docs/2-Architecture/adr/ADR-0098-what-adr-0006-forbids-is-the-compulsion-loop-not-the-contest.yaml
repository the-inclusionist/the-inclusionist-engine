title: What ADR-0006 forbids is the compulsion loop, not the contest inside one match

context-and-problem-statement: |
  A football game was asked for on 2026-09-06. Football is a contest by construction: two sides, a score,
  a winner. ADR-0006 records, among its own chosen consequences, *«Always COOPERATIVE (1-2 players, no
  competition)»*, and ADR-0008 repeats the reason: *«the class plays together, not against each other»*.

  ⚠️ AND THE TENSION IS ALREADY IN THE ECOSYSTEM, UNRECORDED. `game-chess` exists, is played by two
  children against each other, and no record says a word about it. So this is not a new exception being
  requested for a new game: it is a line that was crossed in silence and is now being drawn.

  ⚠️ THE QUESTION IS NOT WHETHER TO RELAX A PILLAR. It is whether «competition» in ADR-0006 meant the thing
  its own decision-drivers name — streaks, loot, dopamine loops, the engagement economy — or whether it
  also meant a match that starts, ends, and leaves nothing behind. The record lists competition IN THE SAME
  BREATH as loot and dopamine feedback, which is a strong hint about which it meant, and it never says.

decision-drivers:
  - "⚠️ ADR-0006's own driver names the harm: *«Dark patterns / dopamine loops harm children»*. The harm is
     the LOOP - the thing that makes a child come back tomorrow because she is afraid of losing something -
     and a football match has no loop in it unless one is added."
  - "ADR-0037 already removes the machinery a competitive loop would need: there is no save, so there is no
     ranking, no league, no streak and no persisted best score. The pillar is defended by a different
     record, and defended more strongly than by a word."
  - "ADR-0049 already forbids the other half: no reward is random, so no contest here can be a slot machine."
  - "⚠️ A game where two children never oppose each other cannot contain football, chess, or most of what
     children in a school yard actually play together. Reading the clause literally does not make the
     ecosystem safer; it makes it silently non-compliant, which is what the chess already demonstrates."

considered-options:
  - "C1 - draw the line: the compulsion loop is forbidden; the contest inside a bounded match is not. The
     default two-seat mode is CO-OPERATIVE, and one-against-one is a mode an adult turns on"
  - "C2 - read the clause literally: no child ever opposes another. Football is CPU-only, and the chess is
     non-compliant and must be changed"
  - "C3 - amend ADR-0006 so the pillar itself admits contests"
  - "C4 - leave it: note the tension in the game's README and move on, as the chess did"

pros-and-cons-of-the-options:
  C1:
    good:
      - "It reads ADR-0006 by its own stated harm rather than by one word, and every mechanism the harm
         needs is still forbidden by ADR-0037 and ADR-0049."
      - "⚠️ THE DEFAULT STILL DOES THE PEDAGOGY. Two seats co-operating against the CPU is what a classroom
         uses, and it is what a child meets unless an adult decides otherwise - so the pillar's INTENT is
         what happens by default, and the contest is an adult's choice."
      - "It regularises the chess, which is a debt this ecosystem already carries."
    bad:
      - "⚠️ It reads a record's intent rather than its text, which is the move that lets any clause be
         reinterpreted by whoever finds it inconvenient. The mitigation is that the line is drawn HERE, in
         writing, with a list of what stays forbidden - not left to each game's judgement."
  C2:
    good:
      - "The clause means what it says, and nobody has to decide anything."
    bad:
      - "⚠️ It makes the chess non-compliant retroactively and would have to change or remove it."
      - "It removes from three hundred games the entire category of things children play together, which is
         a large price for a reading the record's own drivers do not support."
  C3:
    good:
      - "The constitution stops contradicting the catalogue."
    bad:
      - "⚠️ Amending a pillar because one game needs it is wider than the problem. The pillars are the
         destination; what is wrong here is that one word in a consequence was doing work the drivers never
         asked of it."
  C4:
    good:
      - "Costs nothing today."
    bad:
      - "It is what the chess did, and it is why this question arrived unanswered a year later. The next
         game inherits the same silence."

decision-outcome:
  chosen-option:
    link: "C1 - the line is drawn, and the default is co-operative"
    justification: |
      ===== 1. WHAT STAYS FORBIDDEN, AND THE LIST IS THE RECORD =====

      Streaks. Rankings and leaderboards. Leagues and seasons. Persisted best scores. Random rewards.
      Anything that makes a child come back because she would lose something by not coming back. All of it
      was already forbidden by ADR-0006's drivers, ADR-0037 and ADR-0049; this record only says so in one
      place so that «no compulsion» stops resting on the word «competition».

      ===== 2. WHAT IS PERMITTED =====

      A contest inside ONE match: a score, an opponent, a result, and nothing that outlives the session.
      It ends when the match ends and leaves no trace, which is exactly what ADR-0037 already guarantees.

      ===== 3. THE DEFAULT IS CO-OPERATIVE, AND THAT IS NOT A CONCESSION =====

      ⚠️ Two seats on the SAME side against the CPU is what a child meets unless an adult chooses otherwise.
      ADR-0006's intent is therefore what happens by default, and one-against-one is a decision somebody
      takes on purpose. A permission that is also the default would be an amendment wearing a line's
      clothes.

      ===== 4. AND IT REGULARISES THE CHESS =====

      `game-chess` has been competitive since before the question was asked. It is not made compliant by
      this record so much as it is finally described by one.

  consequences:
    positive:
      - "The ecosystem stops carrying a contradiction it could not see."
      - "The forbidden list is in one place instead of spread across three records and one word."
    neutral:
      - "The football game ships with a co-operative default and a one-against-one option."
    negative:
      - "⚠️ A record that reads intent over text sets a precedent for doing so again. The defence is that
         this one names exactly what it permits and exactly what it does not, so the next reader has a list
         rather than a licence."

  confirmation: |
    No game in the catalogue persists a score, a streak, a ranking or a league — checkable, because
    ADR-0037 means there is no storage in which to do so. The football game's default two-seat mode places
    both seats on the same side.

more-information: |
  The football game measures itself against `modelence/open-soccer`, and two of that game's features are
  absent for exactly these reasons rather than for lack of time: a persisted best score (ADR-0037) and any
  progression between matches (this record, and ADR-0049).
