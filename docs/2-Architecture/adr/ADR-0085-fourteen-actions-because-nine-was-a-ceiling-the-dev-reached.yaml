title: FOURTEEN actions, because nine was a ceiling and the Dev reached it — and the four new ones are POSITIONS, not the gamepad's names for them

context-and-problem-statement: |
  On 2026-09-06 the Dev asked for five more buttons for more elaborate games, naming them SELECT, L1, L2, R1
  and R2.

  ⚠️ ADR-0074 PREDICTED THIS REQUEST AND LEFT THE ANSWER OWED. Among its own disadvantages it wrote: *"nine
  actions is a CEILING that a genre may want to exceed, and the record has to say what happens"*. It did not
  say. This record says.

  There are two things to decide and they are not the same. The first is the SIZE of the set, which is the
  Dev's to state and they stated it. The second is what the new positions are CALLED — and the request arrived
  in the vocabulary of a gamepad.

  ⚠️ AND THE MEASUREMENT THAT MAKES THIS NOT PURELY ADDITIVE. `input/gamepad.ts:111` reads
  `run: b(2) || b(5) || b(7)`. In the Gamepad API's standard layout that is X, **R1 and R2** — so two of the
  five buttons requested are ALREADY BOUND, to the platformer's `run`. L1 (`b4`), L2 (`b6`) and SELECT (`b8`)
  are read by nobody. A migration that adds four positions without touching that line would produce a
  controller where R1 both runs and does the new thing, and the conflict would appear as an intermittent
  double action rather than as an error.

decision-drivers:
- "The Dev stated the need; the size of the action set is their call and is not in question here."
- "⚠️ ADR-0074 exists BECAUSE `jump` and `run` were platformer meaning inside the engine. `L1` would be the
   same defect facing the other way: gamepad meaning. On a keyboard scheme L1 is some key; on touch it is a
   slot; on a speech recogniser it is a word."
- "`start` is already an action name in ADR-0074 and is not a position — so there is a precedent, and it has a
   criterion: it names a SYSTEM function rather than something in the game's world."
- "Two of the five requested buttons are already bound to `run`, so the migration has a conflict to resolve
   rather than four blanks to fill."

considered-options:
- "N1 - fourteen actions: `action5`..`action8` plus `select`, with L1/L2/R1/R2/SELECT as the gamepad's DEFAULT
   BINDING for them"
- "N2 - fourteen actions named `l1`, `l2`, `r1`, `r2`, `select`, as requested"
- "N3 - keep nine and let a game that needs more read the gamepad directly"

pros-and-cons-of-the-options:
  N1:
    good:
    - "Obeys the rule ADR-0074 was written to install, in the one place where breaking it would be easiest."
    - "A transport that has no shoulders - touch, speech, eye movement - binds `action5` to whatever it does
       have, and the game's word for it is unchanged."
    - "`select` keeps a name because it passes the same test `start` passes: it is a SYSTEM function."
    bad:
    - "⚠️ `action7` is even less readable in code than `action1` was, and ADR-0074 already recorded that cost
       for the first four. Eight numbered verbs is the point at which a reader needs the game's preset open
       beside the engine's source to know what anything does."
  N2:
    good:
    - "It is what was asked for, and a gamepad user reads the remap screen and recognises the button."
    bad:
    - "⚠️ Bakes ONE transport into the vocabulary of all nine. The engine would have an action that only
       means something on a device many children in the target hardware do not have (pillar 1), and the
       remap screen for a touch-only game would offer `R2`."
    - "It is the exact defect ADR-0074 measured and corrected, one layer along."
  N3:
    good:
    - "No change to the engine at all."
    bad:
    - "A game reading the device directly is outside the transport registry, so the accessibility guarantee
       (ADR-0079: at least one available transport carries the game's action set) stops holding for it - which
       is the whole product."

decision-outcome:
  chosen-option:
    link: "N1 - fourteen positions, and the gamepad's names stay in the gamepad"
    justification: |
      ===== 1. THE FOURTEEN =====
      `core/actions.ts` is created as the single source, and it is a leaf module with zero dependencies:

        DIRECTIONS  `up` · `down` · `left` · `right`
        VERBS       `action1` · `action2` · `action3` · `action4` · `action5` · `action6` · `action7` · `action8`
        SYSTEM      `start` · `select`

      ⚠️ THERE IS NO HIERARCHY AMONG THE VERBS. The order is presentation order - in the gamepad wizard, in the
      remap screen - and not a scale of importance. A game may use `action7` and none of the others.

      ===== 2. WHY NOT `L1` =====
      The request's names are a BINDING and live in `input/gamepad.ts`: L1 -> `action5`, L2 -> `action6`,
      R1 -> `action7`, R2 -> `action8`, SELECT -> `select`, as that transport's default. Every other transport
      binds the same fourteen to whatever it has.

      `select` keeps its name for the reason `start` keeps its: it is a SYSTEM function, not a position in the
      game's world, and the words START and SELECT have been printed on the controller itself since 1983 - the
      child reads the hardware's label before ours. That is a criterion, not an exception: an action earns a
      name when it is about the session rather than the world.

      ===== 3. WHAT THIS RECORD DOES NOT DO, SAID PLAINLY =====
      ⚠️ IT DOES NOT WIRE ANYTHING. The transports still speak the eight platformer names - `jump`, `run`,
      `swap`, `especial` - across `input/gamepad`, `input/edges`, `input/devices` and `input/keydown`. That
      migration is issue #103 and has not started. What this record and `core/actions.ts` do is give it a
      DESTINATION, so the migration binds to a written vocabulary instead of inventing one on the way.

      ⚠️ AND IT HANDS #103 A CONFLICT RATHER THAN A BLANK: `run: b(2) || b(5) || b(7)` must lose `b(5)` and
      `b(7)` when they become `action7` and `action8`, and the platformer preset must then say what `run` is
      bound to instead. Recorded here so the migration cannot resolve it by accident.

  consequences:
    positive:
    - "The engine has a written action vocabulary for the first time; it existed only in ADR-0074 before."
    - "A game with more inputs than a platformer is expressible without leaving the transport registry, so the
       reachability guarantee of ADR-0079 keeps holding for it."
    - "The ceiling ADR-0074 flagged has a documented answer, so the next request to exceed fourteen has a
       precedent for how it is handled rather than a new argument."
    negative:
    - "⚠️ Eight numbered verbs are hard to read in engine source. ADR-0074 accepted this cost for four; this
       record doubles it, and the mitigation - the game's preset supplies the words - only helps a reader who
       has that preset open."
    - "The gamepad wizard (ADR-0013) grows from 9 steps to 14, which is a longer setup for a child."
    - "⚠️ Fourteen actions on a touch layout will not fit nine slots. ADR-0079 already says a transport
       declares its slots, so this is not a contradiction - but it does mean a game using twelve actions will
       be told touch cannot carry it, and that message does not exist yet."
    neutral:
    - "Nothing in the running game changes today: no transport reads `core/actions.ts` yet."
  confirmation: |
    THE GATE: `tests/actions-catorze.node.test.js`, born failing under THREE confirmed mutations:
      · adding a fourteenth-plus action to the list and to no family -> 2 red (this is the orphan case: an
        action that exists for the code and is invisible to the child, because no remap screen enumerates it);
      · putting `L1` and `R2` into the abstract list -> 4 red;
      · dropping the empty-set rejection -> 1 red.

    · `ACTIONS` has fourteen entries with no repetition.
    · DIRECTIONS + VERBS + SYSTEM covers `ACTIONS` exactly - no orphan, no overlap.
    · `isAction` rejects `L1`, `L2`, `R1`, `R2`, `SELECT` and also `jump`, `run`, `swap`, `especial`.
    · A game's action set is ITS OWN: `['up','down','action1']` is conforming, and so is `['action1']`. The
      four directions are NOT required - a quiz that navigates up and down has no use for left and right, and
      requiring them would invent a control that does nothing.
    · An empty set is rejected; a missing one is rejected with a different message; an unknown action is
      rejected AND NAMED.

    ⚠️ WHAT NO GATE CONFIRMS: that any transport reaches the new four. None does yet - see §3. The gate proves
    the vocabulary, and the vocabulary is all this record decides.

more-information: |
  A COUNT THAT DISAGREED WITH A LIST, AND THE ANSWER: the Dev's message said "four buttons" and named five.
  Rather than choose silently, the discrepancy was put back to them with the reading being taken — that the
  NAMES are the specification and the count is the slip — and they confirmed the same day: *"são realmente
  cinco"*. It is written here because the alternative was an engine with a button nobody asked for, arrived at
  without anyone noticing the arithmetic; a specification read twice costs one sentence.

  The touch layout is where fourteen actions will press hardest. ADR-0013 fixed 4 diamond bubbles plus a START
  pill; ADR-0074 counted 9 slots in `input/touch.ts`. Nothing here changes that, and a game needing twelve
  actions on touch is a problem ADR-0079's slot declaration names but does not yet solve.
