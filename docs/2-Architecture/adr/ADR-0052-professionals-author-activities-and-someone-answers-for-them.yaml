metadata:
  status: "accepted"
  date: 2026-08-27
  decision-makers: [Dev]
  consulted:
    - "ADR-0032 (the curriculum is a layer of its own, and it is DATA)"
    - "ADR-0048 (the journey; who logs in, and the professional's place in it)"
    - "ADR-0049 (rewards; an authored activity feeds the same bands)"
    - "requerimento Anexo VII §2 and XIV.1"
    - "requerimento Anexo VIII — professional records are sensitive data under art. 11 LGPD"
  informed: []

title: A professional AUTHORS activities inside the games, scoped to the student they attend — and the record names who answers for the content

context-and-problem-statement: |
  The requerimento promises something no ADR knew about. Anexo VII §2, repeated in XIV.1: professionals —
  psychopedagogues, speech therapists, occupational therapists, psychologists, and teachers — "uma vez cadastrados,
  podem CRIAR dentro dos jogos atividades ajustadas ao estudante que atendem. O sistema é ferramenta de trabalho
  desses profissionais, e não apenas recurso lúdico."

  In the ADRs the professional only READS reports (ADR-0048 §2). Authoring is an entire surface — an editor, a
  validation path, a scope, and a question nobody had asked: **if a professional writes an activity and it is
  wrong, who answers for it?**

  That last question is why this is an ADR and not an issue. Everything else is work; that one is a decision.

decision-drivers:
  - "The promise is already filed with the Prefeitura. Either it is designed, or the document has to say something
     smaller — and it is a promise worth keeping, because it is what makes the product a work tool rather than a
     game with a report screen."
  - "An activity written for one child is not curriculum. It must not leak into the catalogue, into another
     student's session, or into the skill statistics that calibrate difficulty."
  - "Responsibility must be nominal. Content about a child, authored by a professional, cannot have a diffuse
     owner."
  - "ADR-0032 made the curriculum DATA that imports nothing. An authored activity is data of the same shape, or it
     is a plugin — and a plugin is a different, much larger decision."

considered-options:
  - "A1 — no authoring: the professional only picks skills and reads reports (what the ADRs assumed)"
  - "A2 — ADJUSTING only: the professional tunes parameters of existing activities for their student"
  - "A3 — AUTHORING: the professional composes new activities from the engine's activity types, scoped to one
     student"

pros-and-cons-of-the-options:
  A1:
    good: ["Nothing to build, nothing to answer for."]
    bad: ["Contradicts a filed promise, and removes the thing that distinguishes this from a game with reports."]
  A2:
    good: ["Small, safe, and probably what most professionals want most of the time — different words, different
            pictures, a different pace on an activity that already works.",
           "Responsibility is bounded: the activity is ours; the tuning is theirs."]
    bad: ["It is not what the document says. 'Ajustadas' would be honest; 'criar' would not."]
  A3:
    good: ["Keeps the promise as written, and a speech therapist composing her own minimal-pair drill is exactly the
            use the document describes.",
           "With ADR-0032's shape, an authored activity is data — no code, no plugin, no execution surface."]
    bad: ["An editor is a product of its own, and building it badly is worse than not building it.",
          "It creates content about a child, written by someone outside the school, inside a municipal system."]

decision-outcome:
  chosen-option:
    link: "A3, with the four boundaries below — and A2 is what ships first"
    justification: |
      ===== 1. WHAT IS AUTHORED, AND WHAT IS NOT =====
      A professional composes an activity from the engine's EXISTING activity types — the same types the curriculum
      layer already declares — by supplying its content: the items, the alternatives, the words, the pictures, the
      order. **They do not write code and they do not add a new type of activity.** An authored activity is DATA,
      in the shape ADR-0032 fixed, and it therefore imports nothing and executes nothing.

      ⚠️ THE FIRST THING TO SHIP IS A2, NOT A3, and that is a sequencing decision rather than a retreat: tuning an
      existing activity covers most of the described use, exercises the same scoping and permission machinery, and
      is the smallest thing that makes the promise true. The editor follows it.

      ===== 2. SCOPE — ONE STUDENT, AND IT DOES NOT LEAK =====
      An authored activity is bound to the student it was made for. It never enters the public catalogue, never
      appears in another student's session, and — the part that is easy to miss — **never feeds the skill
      statistics that calibrate difficulty**. ADR-0049's bands are derived from item behaviour across many
      children; an item written by one professional for one child has no such population and would corrupt the
      calibration it was never measured against.

      It counts for THAT child's own history, and for nothing else.

      ===== 3. VALIDATION — THE AUTHOR IS THE VALIDATOR, AND IS NAMED =====
      No committee approves an activity written by a professional for their own patient; requiring one would make
      the feature useless in the week it is needed. What replaces approval is ATTRIBUTION: every authored activity
      carries its author, their professional registration, and the date, visibly, wherever it runs and wherever it
      appears in a report.

      **Who answers for the content is the professional who signed it.** The Município hosts and the engine runs;
      neither authored it. That is the same division the requerimento already draws for third-party content, and it
      is the only division that survives the question "and if it is wrong?".

      ===== 4. IT IS CONTENT ABOUT A CHILD, SO IT INHERITS ANEXO VIII =====
      An activity a speech therapist writes for a specific child can reveal what that child struggles with — which
      is clinical information. It therefore travels under the same four conditions ADR-0048 §2 now carries for
      professional records: specific, highlighted, revocable-per-purpose consent; segregated access profiles; a log
      of every consultation; and the prior manifestation of the data protection officer.

      ⚠️ AND, LIKE THAT FEATURE, IT IS NOT PART OF THE FIRST IMPLEMENTATION STAGE. Anexo VIII defers professional
      sharing; authoring is the same category of data and follows it rather than arriving ahead of it.

  consequences:
    positive:
      - "A promise already made to the Prefeitura acquires a design instead of remaining a sentence."
      - "The scoping rule protects the difficulty calibration from single-author items, which is the failure that
         would have been discovered late and been hard to diagnose."
      - "Attribution answers the responsibility question without inventing an approval bureaucracy."
    negative:
      - "An editor is a product. Building it means designing for a user this project has never designed for — a
         professional with fifteen minutes between appointments."
      - "It puts clinically revealing content inside a municipal system, which is precisely the material Anexo VIII
         handles most carefully."
      - "A2 first means the document's word 'criar' is not yet true when the first version ships. That has to be
         said out loud rather than left to be noticed."
    neutral:
      - "Teachers are in the same list as health professionals in the requerimento. For authoring they are: a
         teacher authoring for a class is a different feature and is not decided here."

  confirmation: |
    Not built. The clauses that will be gated:

      · SCOPE — an authored activity is unreachable from any session but its student's, asserted as a negative over
        the catalogue and the session loader.
      · CALIBRATION — authored items are excluded from the population statistics; a gate that fails if an authored
        item id reaches the difficulty estimator.
      · ATTRIBUTION — author and registration render wherever the activity runs and wherever it is reported.
      · DATA — no authoring path exists before the consent, segregation and logging of ADR-0048 §2 exist.

    ⚠️ WHAT NO TEST CAN CONFIRM: whether a professional can actually author something useful in the time they have.
    That is the question that decides whether this feature is used at all, and it belongs to issue #7.

more-information: |
  Comes from Anexo VII §2 and XIV.1 of the requerimento, which had no counterpart in any ADR. If the Dev prefers to
  narrow the document instead, the smaller and fully honest wording is "atividades AJUSTADAS ao estudante" — which
  is A2, and which this record ships first regardless.

  Deliberately NOT decided here: what the editor looks like, whether a teacher may author for a whole class, and
  whether an authored activity can ever be promoted into the shared catalogue.
