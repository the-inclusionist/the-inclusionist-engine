metadata:
  status: "accepted"
  date: 2026-08-25
  decision-makers: [Dev]
  consulted: [ADR-0032 (curriculum is its own layer), ADR-0038 (state is cut by lifetime),
              "issue #54 (MODE is derivable from activity)", "issue #50 (composition root extraction)"]
  informed: []

title: MODE is DERIVED from activity, not stored — two variables answering one question is a divergence waiting for a witness

context-and-problem-statement: |
  `MODE` (ludico | somasub | silabas) lives as a `let` in the composition root. `activity` (the activity id:
  ludico, alf3, mat5, fr2 …) lives in core/state and is persisted. Every activity carries a category, and
  `modeForCategory` translates it — alf to silabas, mat to somasub, everything else to ludico. So:

      MODE === modeForCategory(activityCategory(activity))

  holds for EVERY activity in the registry. `MODE` carries no information that `activity` does not already have.

  THE DIVERGENCE IS REAL AND WAS REPRODUCED, not argued. There are two write paths: `setActivity(id)` DERIVES
  the mode from the category and keeps both in agreement; `#opt-mode` calls `setModeValue` directly and never
  touches `activity`. Verified in the built game: starting from Ludico and cycling the button makes MODE become
  silabas while activity stays ludico — coins spawn as letters while the quiz dispatch still consults the old
  activity category.

  The attenuating fact, and the reason this is P2 rather than P1: `#opt-mode` lives inside
  `<div id="topbar-tools" hidden>`, revealed only with `?debug=true`. No child can reach it.

  This was found during issue #50 and the conclusion then was NOT to migrate MODE into core/state, because
  moving it there would enshrine as state a value that is a pure function of other state. That conclusion was
  right and this record finishes it.

decision-drivers:
  - "A defect that is impossible by construction beats a defect prevented by discipline."
  - "The translation function already exists and is already pure — the derivation costs no new logic."
  - "ADR-0038 classifies state by lifetime; a value that is not state at all should not need a classification."
  - "Whatever is decided must say WHERE the derivation lives, because core/ may not import from ui/."

considered-options:
  - "C1 — MODE becomes derived; setModeValue disappears and the divergence becomes impossible by construction"
  - "C2 — keep both and make #opt-mode call setActivity with a representative activity of the category"
  - "C3 — leave it and document that the debug button lies"

pros-and-cons-of-the-options:
  C1:
    good: ["Removes the class of defect, not the known instance.",
           "The translation is already pure and already written; nothing new is invented.",
           "One fewer mutable binding for ADR-0038 to classify."]
    bad: ["Touches six consumers: coinPools(), the coin sprite offset, applyLetra, the game/session ctx, the
           ui/activities-menu ctx and the window.__incl surface."]
  C2:
    good: ["One line."]
    bad: ["Fixes the symptom and leaves the weapon loaded: any future call to setModeValue reopens the same
           hole, and nothing in the code prevents it."]
  C3:
    good: ["Honest, and it is what is shipping today."]
    bad: ["The debt already survived two migrations; it will not shrink on its own."]

decision-outcome:
  chosen-option:
    link: "C1 — MODE becomes a derivation of activity, and setModeValue is deleted"
    justification: |
      MODE stops being a `let` and becomes a function of `activity`. `setModeValue` is deleted rather than
      deprecated: a setter that still exists is a setter that will be called.

      WHERE THE DERIVATION LIVES, and this part is decided by ADR-0032 rather than by preference:
      `activityCategory` and `modeForCategory` are pure functions over the activity registry, and they sit today
      in `ui/activities-menu`. ADR-0032 moved that registry out of `game/` into its own curriculum layer, and
      `app/js/educational/activities-registry.ts` is where it now lives. The two functions go with it. `core/`
      cannot import from `ui/` and does not need to: it imports from `educational/`.

      WHAT HAPPENS TO `#opt-mode`: it stops being a mode switch and becomes an activity switch, or it goes.
      That is a debug-surface decision and it follows the derivation rather than driving it.

  consequences:
    good:
      - "Coins spawning as letters while the quiz dispatch consults another category becomes unrepresentable."
      - "The pure functions of the curriculum finally live in the curriculum layer, which is where ADR-0032 put
         their data."
    bad:
      - "Six call sites move at once, and one of them is the window.__incl surface the browser protocol reads —
         a missed site there degrades the verification protocol itself."
    neutral:
      - "The debug topbar loses a control. It was revealing a state that no longer exists separately."

  confirmation: |
    A node test asserting the identity for EVERY activity in the registry: for each id, the derived mode equals
    modeForCategory(activityCategory(id)). Written failing first — add a registry entry whose category has no
    mapping and confirm the test goes red.

    And the browser protocol, because MODE reaches window.__incl: dist server, service worker unregistered,
    caches cleared, ?x=N, the loaded script src compared against the hash in dist/index.html, then switch
    activity between an alf, a mat and ludico and confirm the coin pool follows on each switch.

more-information: |
  Issue #54 holds the reproduction against the built game. Related: ADR-0032 (which decided where the registry
  lives, and therefore where these two pure functions belong) and ADR-0038 (which classifies what remains
  state after this record removes one binding from the count).
