title: A game repository is named `game-<slug>`, mirroring its package, and ADR-0068 §1's pattern is REPLACED rather than suspended

context-and-problem-statement: |
  ADR-0068 §1 gave every game repository the shape `the-inclusionist-game-<slug>`. ADR-0073 suspended it when
  the first declared address did not match, and ADR-0081 kept the suspension when the address changed again.
  Both refused to write a general rule, and both were right to: one instance is not a pattern.

  ⚠️ THAT REASON HAS EXPIRED, AND NOT BECAUSE ANYBODY ARGUED. The Dev standardised both game repositories:
  `the-inclusionist/game-chess` and `the-inclusionist/game-2048`. There are two game repositories in the
  organisation and both carry `game-<slug>`, each mirroring its package minus the scope.

  So this record proposes nothing. It writes down a rule that is already executed — which is what ADR-0057
  means by a decision needing a durable home in the same turn, and what it warns about when a decision lives
  only in the shape of some files: it argues with the records in every later conversation.

  ⚠️ AND ADR-0081's OWN REASON FOR LEAVING THIS OPEN WAS FALSE, which is worth stating because the record is
  still on the shelf. It said the rule could not be adopted because the chess `would be out of pattern`, and
  named it `hartwig-zdog-chess`. The chess was already `game-chess` when that sentence was written; the
  obstacle came from a stale reading of another repository and was corrected by that record's erratum. There
  was never a conflict here to resolve.

decision-drivers:
- "Both game repositories already carry the shape; a rule that describes practice costs nothing to adopt."
- "ADR-0068 §6's template reads the naming pattern, and it cannot be written while the pattern is suspended."
- "A decision that lives only in the shape of some repositories is a decision that argues with the records."
- "`the-inclusionist-game-<slug>` would say the container's name twice (ADR-0071 §1)."
- "Repository and package mirroring each other removes a thing every reader has to hold in their head."

considered-options:
- "R1 - `game-<slug>`: the package name minus the scope, which is what both repositories already carry"
- "R2 - keep §1 suspended and let the template's author decide"
- "R3 - restore ADR-0068 §1 as written, `the-inclusionist-game-<slug>`, and rename both repositories"

pros-and-cons-of-the-options:
  R1:
    pros:
    - "It is what exists. Zero repositories change, and no exception has to be written for anything."
    - "Repository and package say the same thing, so `game-chess` and `@the-inclusionist/game-chess` stop
       being two names."
    - "Unblocks the §6 template, which is the artifact that turns this from prose into 300 addresses."
    cons:
    - "⚠️ It unblocks the §6 template, and that gate was doing work. See the consequences."
  R2:
    pros:
    - "Costs nothing today."
    cons:
    - "The suspension was justified by there being no evidence; there is now evidence and no reason left."
    - "It leaves the template's author to infer the rule from two repositories, which is exactly the
       'decided silently by whoever writes the script' failure ADR-0073 installed the trigger to prevent."
  R3:
    pros:
    - "Restores a record to its original text with no partial supersession outstanding."
    cons:
    - "⚠️ Renames two repositories — one of which holds product — to adopt a name that says the container
       twice. It pays a real cost to satisfy a sentence written before the organisation existed."

decision-outcome:
  chosen-option:
    link: "R1 - `game-<slug>`, mirroring the package"
    justification: |
      ===== 1. THE RULE =====
      **A game repository is `the-inclusionist/game-<slug>`.** The slug is the same one the package uses, so
      the address is the package name with the scope removed:

        · `the-inclusionist/game-chess` ←→ `@the-inclusionist/game-chess`
        · `the-inclusionist/game-2048`  ←→ `@the-inclusionist/game-2048`

      ADR-0068 §1's `the-inclusionist-game-<slug>` is REPLACED, not suspended. The container is already named
      by the organisation, and repeating it is the repetition ADR-0071 §1 refused one layer down.

      ===== 2. WHAT THIS RULE DOES NOT REACH =====
      ⚠️ **THE ENGINE IS NOT A GAME**, and `the-inclusionist-engine` is therefore not an exception to this
      rule — it is outside its subject. ADR-0081's erratum records that treating it as a third "naming shape"
      was a mistake of category: a rule about game repositories never had anything to say about it.

      The same holds for the infrastructure repositories of ADR-0058. This record governs games and nothing
      else.

      ===== 3. WHAT IT COSTS, AND IT IS A GATE OPENING =====
      ⚠️ **ADR-0073 INSTALLED A TRIGGER AND THIS RECORD FIRES IT.** That record, and ADR-0081 after it, said
      the naming rule would be decided *when the §6 template is written, and not before* — and made the
      absence of a rule the thing that kept the template unwritten:

          *"O gate que este registro instala: NENHUM script de template existe até um registro decidir a
           regra de nome."*

      With the rule written, that gate is open. The three-hundred-repository script of ADR-0068 §6 may now be
      written — and everything else §6 requires still binds, unchanged: it does not RUN until one game has
      gone end to end, created from the template, built against the engine package, published, selected by
      the manifest, delivered inside the precache budget and gated by the reusable workflow.

      Saying it plainly because a gate that opens quietly is worse than one that never closed: **the next
      person to touch this has permission the previous two records withheld.**

  consequences:
    positive:
    - "Zero repositories change: the rule describes what both already are."
    - "Repository and package mirror each other, so neither has to be translated into the other."
    - "ADR-0068 §1 stops being a suspended sentence that three records have had to route around."
    - "The §6 template gains the precondition it was waiting for."
    negative:
    - "⚠️ The gate on the template is OPEN. Three hundred addresses can now be minted from a script, and the
       remaining protection is §6's own clause about exercising the template once — which is about RUNNING
       it, not about writing it."
    - "ADR-0068 §1 now carries three partial supersessions (ADR-0073, ADR-0081, this one), so a reader of
       that record has three pointers to follow before knowing what governs."
    neutral:
    - "The slug itself is not constrained here. `2048` and `chess` are what the two games chose; nothing says
       what a slug may contain, and nothing needed to."
  confirmation: |
    · `the-inclusionist/game-chess` and `the-inclusionist/game-2048` both resolve, and each game's
      `package.json` `repository.url` points at its own address.
    · Each game's package `name` is its address with the scope prefixed: `@the-inclusionist/game-<slug>`.
    · `grep -rn "the-inclusionist-game-"` finds nothing outside the records quoting the superseded pattern.
    · ⚠️ When the §6 template is written, it produces `game-<slug>` and is reviewed against THIS record —
      which is the whole point of writing the rule before the script rather than inside it.

more-information: |
  ⚠️ **WHAT THIS RECORD DELIBERATELY DOES NOT DO: propose anything.** The Dev renamed both repositories before
  it was written. Its whole content is a rule that already governs, put where the records are so that the next
  reader finds it instead of inferring it from two file listings.

  The suspension it ends lasted two days and two records, and the reason it lasted that long is worth keeping:
  ADR-0073 refused to derive a rule from a single instance, which was correct. What was NOT correct was
  ADR-0081 continuing to refuse for a reason it had not re-checked — see that record's erratum of 06/09.

  ADR-0068 §5 is untouched: a game repository still has no `adr/` folder, and this record lives in the engine
  like every other.
