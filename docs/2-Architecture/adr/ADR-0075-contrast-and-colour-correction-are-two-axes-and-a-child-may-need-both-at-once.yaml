title: Contrast and colour correction are TWO AXES — a child may need both at once, and today choosing one silently cancels the other

context-and-problem-statement: |
  The visual menu offers a single radio: `Modo padrão`, three contrast levels, three colour-vision
  corrections. Choosing a correction turns the contrast off. Choosing a contrast level turns the correction
  off.

  ⚠️ AND THIS WAS ALREADY WRITTEN DOWN, AS A CONSEQUENCE RATHER THAN A DESIGN. ADR-0011 says it in as many
  words: *"`p.viz` holds ONE value, so contrast and correction are MUTUALLY EXCLUSIVE. They live in a single
  select — with the two options grouped — precisely so that the exclusivity is honest. Two separate controls
  would have overwritten each other in silence"*. `settings-visual.ts` repeats it at the control:
  *"Rádio, e não sete botões: `p.viz` guarda UM valor, e a exclusividade fica dita pela forma do controle"*.

  Both are defences of the UI GIVEN the model. Neither defends the model.

  The Dev has now said what the model costs a person: **someone with a colour-vision deficiency may also need
  a certain level of high contrast, and both have to be on at the same time.** That is not an edge case —
  reduced contrast sensitivity and colour-vision deficiency are independent conditions and co-occur.

  ⚠️ AND THE MEASUREMENT SAYS THE FIX IS CHEAPER THAN THE UI SUGGESTS. The two adaptations are ALREADY
  different mechanisms: high contrast is `kind: 'hcnew'` and has NO entry in `VIZ_FILTER` — the cache comment
  in `render/viewports.ts` says outright *"modo sem filtro (normal, hc-*)"* — while a correction is a colour
  matrix (`CVD_MATRIX`, `pixiFilterFor`). They do not fight in the renderer. They fight in ONE `string` field.

decision-drivers:
  - "⚠️ An accommodation that cancels another accommodation is not an accommodation. Pillar 2 is not satisfied
     by offering both if a child can only ever have one."
  - "The two are independent conditions. Modelling them as one choice encodes a claim about people that is
     false."
  - "The renderer already treats them differently, so the exclusivity is an artifact of the STATE shape, not
     of the display pipeline."
  - "ADR-0011's reason for the single control — that two controls would overwrite each other silently — is
     an argument against a BAD split, not against the split."

considered-options:
  - "V1 — keep one `p.viz` and the single radio, as ADR-0011 has it"
  - "V2 — TWO independent axes: a THEME axis (contrast) and a VISION FILTER axis (correction / simulation /
     low vision / blind), each with its own default"
  - "V3 — keep one field but add combined values (`hc-direto-45+fix-protan`, …)"
  - "V4 — free composition: any number of filters stacked, chosen independently"

pros-and-cons-of-the-options:
  V1:
    good: ["Nothing changes: one field, one control, one filter lookup, and every test that reads `p.viz`.",
           "The exclusivity is at least VISIBLE, which ADR-0011 was right to insist on."]
    bad: ["⚠️ It denies the combination a real person needs, and the honesty of the control does not give her
           the contrast back.",
          "It puts an accessibility limit in a state field, where nobody looking at the menu can see why."]
  V2:
    good: ["The two conditions are modelled as what they are: independent.",
           "The renderer needs no new mechanism — contrast is a theme, the correction is a matrix in a chain
            ADR-0020 already declared.",
           "Each axis gets its own default, so ADR-0029's `mark what departs from default` finally has
            something coherent to mark."]
    bad: ["⚠️ `p.viz` is read across the engine — `VIZ_FILTER`, `pixiFilterFor`, `viz-setters`,
           `settings-visual`, `settings-empathy`, the pause icons and the consumer quiz. Splitting it is a
           migration, not an edit.",
          "SAVED STATE holds the old single value; a split needs a migration or a child loses her setting.",
          "Two axes is two things to explain in a menu whose readers include children."]
  V3:
    good: ["No change to the field's type; the filter lookup gains keys and nothing else moves."]
    bad: ["Combinatorial: 4 contrast levels × 4 colour states is 16 keys, and the next axis multiplies again.",
          "It encodes a product in a name, which is the shape that always ends in a parser."]
  V4:
    good: ["Most expressive; a user could stack anything."]
    bad: ["⚠️ Some combinations are contradictions — simulating deuteranopia while correcting it — and free
           composition offers them with a straight face.",
          "GAG and the menu-design rule both push against a control whose valid states the child has to work
           out for herself."]

decision-outcome:
  chosen-option:
    link: "V2 — two axes: THEME (contrast) and VISION FILTER, independent, each with its own default"
    justification: |
      ===== 1. THE TWO AXES =====
      **THEME** — the contrast levels of ADR-0011: standard, 3:1, 4.5:1, 7:1. It is a rendering theme, it has
      no colour-matrix filter, and it composes with anything.

      **VISION FILTER** — one at a time, because these genuinely exclude each other: a colour correction
      (`fix-protan`/`fix-deuter`/`fix-tritan`), OR a simulation (`sim-*`, the empathy menu), OR a low-vision
      mode, OR blind mode. ⚠️ Correcting deuteranopia while simulating it is a contradiction, and V4 was
      refused for offering contradictions with a straight face.

      A child may hold **one theme and one vision filter at the same time**, and that is the whole decision.

      ===== 2. THE NAMES, AND WHY `normal` WAS THE WRONG WORD TWICE =====
      Each axis has its own default, so each has its own name:
        · theme default → **`Tema padrão`** (or `Visão padrão`) — the absence of a contrast level.
        · colour default → **`Visão tricromática`** — the vision that needs no correction, named beside the
          other three rather than as the baseline they deviate from.

      ⚠️ `Cores normais` was wrong for the reason the Dev gave: in a menu whose other three entries name a
      way of seeing, calling the fourth NORMAL makes the other three abnormal, in the game that exists to say
      they are not. ⚠️ AND `modo sem deficiência visual` WAS CONSIDERED AND REFUSED, though it was offered:
      it asserts something about the PERSON — that she has no visual deficiency — which the software cannot
      know and which is false for most of the people who will land on the default. A label may name what the
      SOFTWARE is doing, or the vision it is TARGETING; it may not diagnose the reader.

      ⚠️ AND UNTIL THE SPLIT EXISTS, THE SHARED NEUTRAL IS `Modo padrão`. One entry serving both axes cannot
      truthfully be `Visão tricromática`, because it is also how a person turns high contrast off. The
      trichromatic name arrives at the colour axis on the day the axis exists — the interim name is honest
      about being interim.

      ===== 3. WHAT MAKES THIS SAFE TO DO, WHICH IS ADR-0011'S OWN ARGUMENT =====
      ADR-0011 kept ONE control because *"two separate controls would have overwritten each other in silence,
      and a child would have lost the correction by choosing a contrast level, with nothing"* to tell her.
      That is an argument against a split that keeps ONE field, not against the split.

      With two fields there is nothing to overwrite. The failure ADR-0011 feared is the failure this record
      removes, and it is removed by the state shape rather than by the control's shape.

      ===== 4. THE MIGRATION IS THE DANGEROUS PART, AND IT IS NAMED =====
      ⚠️ `p.viz` is read across the engine — `VIZ_FILTER`, `pixiFilterFor`, `viz-setters`, `settings-visual`,
      `settings-empathy`, the pause icons, the consumer quiz — and a saved setting holds the OLD single value.
      A split without a migration silently discards what a child already chose, which is the same class of
      harm as the exclusivity itself.

      The old value maps cleanly: `hc-*` → theme, filter default; `fix-*`/`sim-*`/`lv-*`/`blind` → theme
      default, that filter; `normal` → both defaults. It is mechanical, and it must exist before the first
      read of the new shape.

  consequences:
    positive:
      - "A child who needs a colour correction AND a contrast level can have both, which is the only reason
         this record exists."
      - "The state shape stops encoding a false claim about people."
      - "ADR-0029's `mark what departs from default` becomes coherent: two axes, two defaults, two marks."
      - "The empathy menu and the visual menu stop competing for one field."
    negative:
      - "⚠️ A MIGRATION OF SAVED SETTINGS, and if it is skipped every child loses the visual mode she chose."
      - "Every module that reads `p.viz` is touched. It is broad, mechanical work with a real chance of
         missing a reader that only runs in the browser project."
      - "Two axes is more to explain in a menu read by children, and the menu-design rule (footer explanation)
         has to carry it without adding prose to the rows."
      - "The combinations multiply what a visual regression check would have to cover."
    neutral:
      - "The contrast levels, Direct Rendering and the CB-safe palette rule of ADR-0011 are untouched — only
         the exclusivity clause is replaced."

  confirmation: |
    · A player can have `7:1` and `fix-deuter` at the same time, and a test asserts BOTH are applied — not
      that the setter accepted them.
    · Choosing a contrast level does not change the colour filter, and choosing a colour filter does not
      change the theme. One assertion each, in both directions.
    · A saved setting written before the split still restores the same visible state afterwards.
    · No contradiction is reachable: simulating a deficiency and correcting the same one cannot both be on.
    · The label of a default names the software or the targeted vision, never the reader's condition.

    ⚠️ NONE OF THIS PASSES TODAY. The split is not implemented; only the interim label changed. Saying so is
    part of the record.

more-information: |
  SUPERSEDES ADR-0011 IN PART — only the clause that states contrast and correction are mutually exclusive,
  and the single grouped control that made the exclusivity visible. ADR-0011's substance is untouched:
  Direct Rendering rather than photographic filters, the three contrast levels with 3:1 as the default, the
  CB-safe palette applying only to non-scenery, and the reasoning about where a child goes to fix contrast
  she cannot read with.

  ⚠️ AND ADR-0011 WAS NOT WRONG WHEN IT WAS WRITTEN. It saw the exclusivity, refused to hide it, and chose a
  control that made it visible instead of a pair of controls that would have destroyed each other in silence.
  What changed is that the limitation itself is now refused. A record that stated an honest consequence is
  superseded by one that removes the cause.
