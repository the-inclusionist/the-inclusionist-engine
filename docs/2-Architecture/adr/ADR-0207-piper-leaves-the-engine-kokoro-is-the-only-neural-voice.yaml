title: Piper leaves the engine — Kokoro is the only neural voice, and the project says why in public

context-and-problem-statement: |
  Reading licences to mirror third-party models, the lessac chain behind three of the four Piper voices the engine delivers came to
  light: the delivery (ADR-0177) had been copying Faber, Amy and Ryan into every build. The Dev, 2026-09-14: «Isso não deveria
  acontecer.» And the decision: «Creio que o melhor que temos a fazer é divulgar que tomamos conhecimento da incompatibilidade dos
  modelos piper Faber, Amy e Ryan (Claude não?) tomamos a decisão de trabalhar apenas com Kokoro e não mais com Piper.»

decision-drivers:
  - "D1 — A LICENCE WE CANNOT SHOW IS A LICENCE WE DO NOT HAVE: a voice whose base checkpoint's data forbids distribution does not ship"
  - "D2 — SAY IT IN THE OPEN: builds already carried those files; the people who use the engine learn it from the project"
  - "D3 — ONE NEURAL VOICE FAMILY WHOSE LICENCE READS CLEAN: Kokoro-82M, Apache-2.0 weights trained on permissive audio"

considered-options:
  - "A — keep Piper, stop packaging the three voices and fetch them from Hugging Face on first use"
  - "B — keep only the Piper voices whose lineage reads clean"
  - "C — Piper leaves; Kokoro is the only neural voice; a public notice"

pros-and-cons-of-the-options: |
  **A.** ✅ The voices stay. ❌ The licence question is unanswered, only moved to the child's device; the school's address goes to a
  third party at play time, against ADR-0177.
  **B.** ✅ Keeps the runtime. ❌ The one voice left (Claude, Spanish) has no stated starting checkpoint; Portuguese and English lose
  their Piper voice anyway.
  **C.** ✅ No voice of unknown lineage anywhere in the engine or its builds. ❌ Kokoro's Portuguese and Spanish voices were judged
  low quality by the Dev; its model is 327 MB; a game without the Kokoro port has only the browser's voice.

decision-outcome:
  chosen-option:
    link: "C — Piper leaves the engine"
    justification: |
      1. **No Piper in the engine**: no Piper runtime, no Piper voice, no Piper phonemizer — not in the voice list, the heavy-file
         catalogue, the delivery, the precache nor the content security policy. Claude (es_MX) leaves with them.
      2. **The neural voice is Kokoro**, through the game's port (ADR-0198); the browser's voice stays first (ADR-0200).
      3. **A public notice** in the engine repository: which voices, what their cards say, what the Blizzard 2013 licence says, that
         earlier builds packaged them, and that the engine no longer uses Piper.

  consequences:
    positive:
      - "The engine and its builds carry no voice whose training data forbids distribution"
    negative:
      - "BREAKING for games: the Piper voice ids, the Piper runtime import and the phonemizer files are gone; a game that imported
         `piper-tts-web` for the engine drops it"
      - "Portuguese and Spanish neural speech is Kokoro's, judged low quality by the Dev; without the Kokoro port only Web Speech speaks"
      - "Earlier builds keep the files they copied; the notice says so, the project cannot recall them"

  confirmation: |
    The gates in `confirmed-by` (issue #193 in `the-inclusionist-engine`, closed). Gates: no source, test, catalogue entry, dependency or header in
    the engine names Piper, its voices or its phonemizer (a gate reads the tree); a built delivery contains no Piper file; the notice
    is in the repository.

more-information: |
