title: A PWA is offline AFTER THE FIRST DAY — installing is itself a network act, so a first fetch is not a breach of pillar 8

context-and-problem-statement: |
  🔴 THE DEV CAUGHT A REASON ATTRIBUTED TO HIM THAT HE NEVER GAVE. ADR-0114 justified refusing cdnjs/jsDelivr
  for the runtime «for the reason he himself gave in the same message: a CDN fetch is a network dependency at
  first use». The same record stores their actual words two paragraphs above: «Concordo com 3 (buscado na rede
  com os modelos) e se conseguir usar cdnjs/jsdelivr é ótimo». They asked for the CDN. The reason was the AI's,
  and it was written back as their after they had said «E assim eu sigo sua recomendação» — a recommendation
  quoting itself as the authority for the recommendation.

  ⚠️ AND THE ARGUMENT ITSELF DOES NOT HOLD, which is what their second question exposed: «me explique COMO É
  POSSÍVEL HAVER RUNTIME EM CDN SEM REDE?!» There is no such state. A PWA arrives over the network — that IS
  the install. Requiring that nothing be downloaded on first use is requiring that the application not be
  installed.

  📏 AND THE TECHNICAL CLAIM UNDER IT WAS MEASURED FALSE ON 2026-09-09. «A CDN asset cannot be precached» is
  not true: `workbox-build` takes `additionalManifestEntries`, and its neighbouring option describes exactly
  this case — assets «assumed to be uniquely versioned via their URL», which a pinned
  `cdn.jsdelivr.net/npm/<pkg>@<version>/…` is. A cross-origin, immutably-versioned URL enters the precache at
  INSTALL time with `revision: null`, legitimately, and lives in Cache Storage afterwards like any other file.

decision-drivers:
  - "Pillar 8 has to state something a machine can be measured against, not an impossible purity"
  - "A record must not put a reason in the Dev's mouth — a decision resting on that is not their decision"
  - "The distinction that MATTERS offline is WHEN the bytes arrive, not from WHOSE origin"
  - "Three hundred games deploy this; a rule that costs each of them 32 MB needs a real reason"

considered-options:
  - "O1 · Keep ADR-0114 as written — nothing may be fetched at first use, so the runtime must be vendored"
  - "O2 · Offline from the first BYTE, with the whole catalogue shipped in the install"
  - "O3 · THE DEV'S ANSWER — offline AFTER THE FIRST DAY: the install may fetch, and from then on the machine holds"

pros-and-cons-of-the-options:
  O1:
    good:
      - "One origin, so a school proxy that allows the game's domain cannot break the voice."
      - "Nothing to reach at install beyond the app itself."
    bad:
      - "🔴 It rests on a state that cannot exist — a PWA with no network was never installed."
      - "It was justified by a reason attributed to the Dev that they did not give, and against the preference they did."
      - "It makes every one of three hundred deploys carry ~32 MB to satisfy a rule that measures nothing."
  O2:
    good:
      - "The strongest possible guarantee: the machine is complete the moment it exists."
    bad:
      - "🔴 244 MB of models in an install, on a public-school Chromebook — the cost ADR-0110 measured and refused."
      - "Contradicts the Dev's own pillar-8 clarification, that the cache ACCUMULATES as extras come down."
  O3:
    good:
      - "It states something testable: after the install completes, the machine plays with no network."
      - "It restores the Dev's own preference — cdnjs/jsDelivr become admissible, judged on their real merits."
      - "It keeps the distinction that carries weight: PRECACHED AT INSTALL versus FETCHED LAZILY AT FIRST USE."
      - "It matches their pillar-8 clarification exactly: a floor at install, extras accumulating afterwards."
    bad:
      - "«The first day» is a human phrase; the gate has to translate it into «is in the precache manifest»."
      - "A third-party origin has to answer at install time, and a school whitelist may not include it."
      - "It reopens issue #129 rather than closing it — but now with a comparison that is not rigged."

decision-outcome:
  chosen-option:
    link: "O3 — offline after the first day; installing is a network act"
    justification: |
      **A PWA of this project is guaranteed to work offline AFTER THE FIRST DAY.** In the Dev's words: «a ADR
      deveria ser PWA offline após o primeiro dia.» Three consequences, and the second is the one that
      replaces a slogan with something a gate can measure:

      1. **A FETCH DURING THE INSTALL IS NOT A BREACH OF PILLAR 8.** It is the install. The pillar promises
         that a child can play with no network; it never promised that the application materialises without
         one.
      2. **THE RULE THAT SURVIVES IS ABOUT TIMING, NOT ORIGIN: precached at install, never fetched lazily at
         first use.** ⚠️ This is the half of the old clause that was always correct and was buried under the
         wrong reason. `ui/webcam.ts:62` breaks it — a `<script src>` to `webgazer.cs.brown.edu` on the first
         use of eye control — and it breaks it whether the host is a CDN or our own origin. That is the real
         defect issue #129 found, and it is unchanged by this record.
      3. **cdnjs / jsDelivr ARE ADMISSIBLE FOR THE RUNTIME**, which is what the Dev asked for on 2026-09-08,
         provided the URL is pinned to an exact version and listed in the precache manifest
         (`workbox.additionalManifestEntries`, `revision: null`, which is correct for an immutably-versioned
         URL). Whether the runtime is vendored or precached from a CDN goes back to issue #129 as an open
         engineering comparison — single origin and school whitelists and supply chain on one side, deploy
         weight on the other — and NOT as a question pillar 8 has already answered.

      📏 THE MODELS ARE UNCHANGED AND ARE NOT PART OF THE FIRST DAY. ADR-0110 fetches them in the background;
      at ~63 MB each they may take longer than a day on a school link, and the fallback voice speaks while
      they come down. «Offline after the first day» is a promise about the GAME, not about every extra.

      🔴 AND THE ERRATUM IS RECORDED HERE RATHER THAN QUIETLY FIXED: ADR-0114's sentence «for the reason he
      himself gave» is a misattribution and has been corrected in place, because a wrong citation is the one
      case ADR-0057 leaves to erratum. The DECISION it carried is superseded here, in a new record, because
      the author with the same facts of that day would have written the same sentence — which is the test.
  consequences:
    good:
      - "Pillar 8 gains a measurable form: after install, no network is needed to play"
      - "The Dev's stated preference is restored, and issue #129 gets a comparison that is not decided in advance"
      - "The real rule is stated where it bites: precached at install, never a lazy fetch at first use"
      - "The engine's `dist` is no longer required to grow by ~32 MB in every one of three hundred deploys"
      - "`ui/webcam.ts:62` is still a violation, and now for a reason that survives scrutiny"
    bad:
      - "⚠️ A precached third-party URL must answer at install; a school whitelist that omits it fails the install silently"
      - "Pinning an immutable CDN URL means upgrading is a commit here anyway — one of vendoring's costs, kept"
      - "«The first day» has to be translated into a gate over the precache manifest, or it stays prose"
      - "Supply chain: a CDN origin executing WASM in a child's browser is a risk vendoring does not have"
  confirmation: |
    ⚠️ THE FIRST GATE ALREADY EXISTS AND WAS BUILT BEFORE THIS RECORD, which is why the record can be this
    short: `scripts/check-precache.mjs` asserts the FLOOR — every file the build emits is either precached or
    excused by name with its reason (`0336b7e`). It is origin-agnostic on purpose, so it keeps holding under
    this record: an external entry appears in the manifest and never on disk, which the sieve does not flag.

    The gates this record adds:

    · WHATEVER RUNTIME IS CHOSEN IS IN THE PRECACHE MANIFEST — asserted over the generated manifest, so that
      «precached at install» is a fact and not an intention. ⚠️ If the choice is a CDN, the entry must be
      PINNED to an exact version: an unpinned URL with `revision: null` is the frozen-precache defect this
      script already exists to catch, arriving from the other direction.
    · NO LAZY FETCH OF A RUNTIME AT FIRST USE — the rule of §2, and `tests/nada-de-cdn-a-mao.node.test.js` is
      already the inventory that carries it. `ui/webcam.ts` stays on that list until it is precached or gone.
    · ⚠️ AND THE DAY-ONE FLOOR IS A GAME, NOT A CATALOGUE — the clause of ADR-0114 that survives untouched.
      The runtime and the models are extras; the gate must not let «offline after the first day» quietly grow
      to mean «after the 244 MB have come down».

more-information: |
  Supersedes ADR-0114 in part: the clause that a CDN fetch is disqualifying because it is a network dependency
  at first use, and the conclusion that vendoring is what makes pillar 8 true. Everything else in that record
  stands — the split between RUNTIME and MODELS, that neither travels in the npm package, that the first
  precache block is a playable game, and that LAN is out of scope for now.

  📌 The measurement that made ADR-0114 worth writing is untouched and is the reason it is superseded only in
  part: `ui/webcam.ts:62` is the engine's only hand-written external runtime fetch, there is no policy, and
  three subsystems wait on one answer.

  Deliberately NOT decided here: whether the runtime is vendored or precached from a CDN (issue #129, now a
  fair comparison); whether a precached third-party origin is acceptable against a school whitelist, which is
  a deployment question and wants a school; and how Subresource Integrity applies to a WASM artefact fetched
  by a runtime rather than by a `<script>` tag.
