title: Two recognisers — Vosk for commands, Moonshine for reading

context-and-problem-statement: |
  ADR-0189 chose Vosk with the game's words as grammar. The Dev, 2026-09-13: «Vosk via WASM para entender comandos seria o
  ideal, mas vi muitos erros sendo cometidos no teste que fiz. Por outro lado, Moonshine (27M-331M) via transformers.js (Whisper
  é muito grande, não?) para atividades que envolvem leitura, se mostrou excepcional onde precisão ser importante. Vamos
  implementar ambas e testar em jogo.»

decision-drivers:
  - "D1 — A COMMAND IS A FEW WORDS, A READING IS A SENTENCE: each needs the recogniser that is good at it"
  - "D2 — MEASURED IN A GAME, NOT ASSUMED: both are built and tried where a child plays"

considered-options:
  - "A — Vosk only (ADR-0189)"
  - "B — Vosk for commands and Moonshine for reading, both built and tested in a game"

pros-and-cons-of-the-options: |
  **A.** ✅ One model per language. ❌ The Dev saw many errors in their test; open reading is what it does worst.
  **B.** ✅ Each task gets its recogniser, and the choice is tried in play. ❌ Two runtimes and two sets of models.

decision-outcome:
  chosen-option:
    link: "B — both, tested in a game"
    justification: |
      1. **Vosk in WASM, with the game's words as grammar, recognises COMMANDS** (ADR-0189 §1–3 stand).
      2. **Moonshine through transformers.js, in the browser, recognises READING**: an activity where the child reads aloud
         and precision matters.
      3. **Both are built and tried in a game** before either is taken as the answer; neither sends audio off the device.
      4. ⚠️ OPEN, for the Dev: `onnx-community` publishes Moonshine in English and seven other languages, none of them
         Portuguese or Spanish. Reading in pt-BR and Spanish needs a model that covers them — a Moonshine flavour from another
         source, or a multilingual Whisper (tiny 39.0 MB quantized, between Moonshine tiny and base).

  consequences:
    positive:
      - "A reading activity can hear a whole sentence with the precision the Dev measured"
    negative:
      - "A delivery with voice control carries two runtimes and their models"
      - "Until a Portuguese and Spanish reading model is chosen, reading recognition covers English only"

  confirmation: |
    ✅ The gates in confirmed-by: a read sentence is transcribed on the device, the model's files fetched only through
    the lent fetch, and no recogniser that leaves the device is ever used; the models are in the heavy-file catalogue
    with their sha256; commands are Vosk's, with the game's words as grammar. Both recognisers were tried in a game and
    the result written (issue #184). 📌 Which reading model speaks which language is ADR-0201's; the browser's own
    recogniser first is ADR-0200's.

more-information: |
  The Dev asked whether Whisper is too large: the quantized whisper-tiny (39.0 MB) sits between moonshine-tiny (26.9 MB) and
  moonshine-base (60.1 MB), and whisper-base is 73.3 MB — the gap is smaller than its name suggests, and it covers Portuguese
  and Spanish. Measured sizes, not accuracy.
