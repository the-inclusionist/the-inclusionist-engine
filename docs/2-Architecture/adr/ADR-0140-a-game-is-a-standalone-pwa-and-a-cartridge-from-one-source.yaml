metadata:
  status: "accepted"
  date: 2026-09-11
  supersedes-in-part: [ADR-0117]
  decision-makers: [Dev]
  consulted:
    - "ADR-0117 — SUPERSEDED IN PART, and only the clause «A GAME IS A CARTRIDGE, NOT A PWA». Everything
       that clause was arguing FOR stands untouched: Cache Storage is partitioned by origin, the platform
       loads the accessibility stack once, and the cartridges in the precache are read from the manifest.
       What falls is the absolute form of the sentence, not the reasoning under it"
    - "ADR-0139 — the reason this is cheap. Because a cartridge never calls `createGame`, the thing that
       calls it is free to differ per build, and one source can serve two shells"
    - "ADR-0116 — a PWA is guaranteed offline AFTER the first day, and what is precached is precached at
       install. The standalone build inherits that promise for itself"
    - "ADR-0069 — in a PWA the ORIGIN is the application's identity. It is why §3 below has to name a line
       rather than leave the two builds as equals"
    - "ADR-0010 pillar 1 — weak Brazilian public-school hardware. It is the reason the standalone build
       carrying its own engine is acceptable and the platform build carrying six is not"
