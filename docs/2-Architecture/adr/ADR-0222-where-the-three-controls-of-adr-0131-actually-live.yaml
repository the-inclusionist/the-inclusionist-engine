title: Where the three controls of ADR-0131 actually live, and why the question is closed

context-and-problem-statement: |
  ADR-0131 (2026-09-09) asked three placement questions and stayed `proposed` for thirteen days. In the meantime the menus it
  argues about were rebuilt, and three later decisions answered all three questions — none of them by citing it.

  📏 What is true today, measured rather than recalled:

  · **Captions live in the VISUAL panel.** ADR-0151 §2, written by the Dev three days after ADR-0131, lists them there, and
    that is where `createGame` builds `#opt-captions`. ADR-0131 argued the opposite — that the menu follows the NEED and not
    the output channel, as blind mode does — and lost to a later decision that simply placed them.

  · **One-button became two different things, and that is the part worth keeping.** The SIMULATION («um botão por vez», with
    «sem força para segurar») stayed in the empathy panel, which is exactly what that panel is for; the ACCOMMODATION — playing
    with a single switch, by scanning — became a position of the ☝️ cycle «Jeito de apertar» in the MOBILITY panel (ADR-0218).
    ADR-0131 read a single control where there were two, and the distinction it could not see is the one that resolves its
    complaint: nobody's real accommodation is framed as a pretence any more, and the simulation did not have to move.

  · **Wheelchair mode left the menus entirely** (ADR-0151). The question of which panel should hold it has no subject.

  🔴 WHY THIS NEEDS A RECORD RATHER THAN A CLOSED ISSUE. A `proposed` record that the tree has contradicted does not sit still:
  it argues its case again in the next conversation, with whoever reads it — which is the mechanism ADR-0057 describes and the
  reason revocation is a new record and never an edit in place. This one exists so that ADR-0131 stops recommending a menu
  that no longer exists.

decision-drivers:
  - "A record whose premise the tree has already contradicted misleads the next reader, and the next reader is often me"
  - "Two of the three questions were answered by the Dev's own later decisions; re-opening them would be re-deciding"
  - "The empathy/mobility split turned out to be a distinction between SIMULATION and ACCOMMODATION, which is worth writing down
     because it is the rule that will decide the next such question"
  - "Moving a control costs the child and the educator who learned where it was — ADR-0131 said so itself, and nothing here moves"

considered-options:
  - "A · supersede ADR-0131 with this record of what is, and close issue #136"
  - "B · accept ADR-0131 as written and move captions to the auditory panel"
  - "C · leave ADR-0131 `proposed` and close the issue alone"

pros-and-cons-of-the-options:
  A:
    good:
      - "The tree and the records agree, and the criterion that survived — simulation in the empathy panel, accommodation in the
