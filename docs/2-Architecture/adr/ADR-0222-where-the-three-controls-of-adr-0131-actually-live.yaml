  C:
    good:
      - "No writing"
    bad:
      - "🔴 The `proposed` record stays, and keeps arguing for a move that will not happen — the exact failure ADR-0057 was written about"

decision-outcome:
  chosen-option:
    link: "A · supersede ADR-0131 with this record of what is, and close issue #136"
    justification: |
      Nothing moves; the records catch up with the menus. And the rule that outlives ADR-0131 is not the one it proposed: the
      panel is chosen by whether the control SIMULATES an experience or ACCOMMODATES one. «Um botão por vez» simulates, so it
      belongs with the empathy panel; «Jeito de apertar» accommodates, so it belongs with mobility. Captions stay where the Dev
      put them, and this record says so out loud rather than leaving a rule with an unexplained exception.

  consequences:
    positive:
      - "A reader who opens ADR-0131 is sent here instead of to a proposal the tree contradicts"
      - "The simulation/accommodation rule is stated once, and it is the question to ask of the next control"
      - "Issue #136 closes for the right reason — answered, not abandoned"
    negative:
      - "⚠️ One placement (captions) follows the channel and not the need, and the tree therefore carries a named exception. Writing
         it down is the honest half; it is still an exception"
      - "This record documents rather than decides, which is the cheapest kind of record and the easiest to skip reading"

  confirmation: |
    📏 Confirmed by MEASUREMENT on the day it was written, not by a gate — this record moves no code, so there is nothing to gate.
    In `engine:app/js/boot/create-game.ts`: `#opt-captions` is inserted into the visual panel's card; `#opt-onebtn` and
    `#opt-semforca` are inserted into the empathy panel's card as the two motor simulations; the ☝️ cycle of ADR-0218 lives in the
    mobility panel; and `#opt-wheelchair` is mounted by no engine panel (`git grep` finds it only in `ui/settings-empathy`, the
    platformer's module, which the engine does not mount).
    ⏸ What would falsify it: a control that simulates an experience appearing outside the empathy panel, or an accommodation
    appearing inside it. There is no gate for that, and inventing a fragile one over element ids would be worse than the rule.

more-information: |
  Issue #136 carried this question in the tracker since 2026-09-09 and is closed by this record (ADR-0126: a decision lives in a
  record, and an issue is a piece of work). ADR-0131 stays readable, superseded — the point of superseding rather than editing is
  that its reasoning about need-versus-channel remains available to whoever asks the question again.
