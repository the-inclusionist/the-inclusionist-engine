title: The session clock is a Time Timer — a continuous pie, 50 minutes by default

context-and-problem-statement: |
  ADR-0050 shows the adult's session limit as a pie plus a digital countdown, and the digital readout carries the
  warning (H:MM becomes M:SS at five minutes). Numbers are a reading task and a source of pressure; a child who cannot
  read the time still sees how much of a disc is left. Nothing has been built (issue #94), and no session length exists
  when no adult has configured one.

decision-drivers:
  - "A limit that is shown is fair; a limit shown as numbers asks the child to read a clock"
  - "A default must exist, or the clock has nothing to show when no adult is logged in"

considered-options:
  - "A · ADR-0050 as written: pie plus H:MM countdown"
  - "B · A Time Timer: a continuous pie that shrinks, numbers optional at most; 50 minutes by default"

pros-and-cons-of-the-options: |
  **A.** ❌ The warning lives in the numbers, which a non-reader cannot use. **B.** ✅ The amount left is seen, not read.
  ✅ A default of 50 minutes gives every session a limit to show. ❌ A child who can read loses the exact minutes, unless
  a numeric readout is offered beside the pie.

decision-outcome:
  chosen-option:
    link: "B — a continuous Time Timer pie, 50 minutes by default, to the right of the quick bar"
    justification: |
      The Dev's decision. The clock is a disc that empties continuously, like the Time Timer; it may carry numbers but
      never only numbers, and it does not change unit as a warning. The default session is 50 minutes, used whenever no
      adult has set one in Bússola Escolar. It sits at the top right, to the right of the quick accessibility bar
      (ADR-0168, ADR-0175). ADR-0050's other rules stand: the clock measures the session, never an activity, and the
      adult's settings replace the default.

  consequences:
    positive:
      - "Every session has a visible limit, readable without reading"
    negative:
      - "What happens when the default 50 minutes run out with no adult present is not settled here (ADR-0050 §4 locks the screen until an adult lifts the break)"

  confirmation: |
    ✅ The gates in confirmed-by: a continuous Time Timer pie that empties clockwise, beside the digits and never numbers
    only; one hour, full at the start and red at its end (the erratum of 2026-09-25, fixed by ADR-0240). 📌 The top-right
    place became ADR-0239's bottom centre, and the adult's value replacing the default waits for Bússola Escolar's adult
    menu (ADR-0240).

more-information: |
  ⏸ Open, for the Dev: at the end of a default session with no adult logged in, does the screen lock as ADR-0050 §4
  says (and who lifts it), or does the pie only signal the end?
