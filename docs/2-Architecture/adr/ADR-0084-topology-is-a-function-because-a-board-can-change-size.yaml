title: A game's `topology` is a FUNCTION, because a board can change size while the game runs

context-and-problem-statement: |
  `core/contract.ts` declared `readonly topology: Topology` — a value — while `roleAt`, `nameAt`, `focusOf`,
  `objectiveOf` and `targetsOf` are all functions. The asymmetry was not designed; it was inherited from the
  first declaration written, a platformer whose world never resizes.

  ⚠️ AND IT HAD ALREADY BEEN PATCHED TWICE BEFORE ANYONE NAMED IT. `platform/audio-sonar.ts` always asked for
  `topology: () => Topology` in its port, and `boot/create-game.ts:205` bridged the two with
  `topology: () => o.declaration.topology` — a function that returns a constant. Neither patch was wrong and
  neither was recorded; each was a local fix for a shape that did not fit.

  ⚠️ THE SECOND GAME BROKE ON IT. `game-15puzzle` has three board sizes — 3x3, 4x4, 5x5 — chosen while the
  game runs. To satisfy `readonly topology: Topology` it wrote `get topology()`, which type-checks and answers
  live. The comment it left beside the workaround states the residual defect precisely: a consumer that CACHED
  the topology would go stale against a resized board, and `conformanceProblems` reads it exactly once.

  A getter satisfying an interface is a COINCIDENCE OF TypeScript, not a contract. Nothing tells the next
  author it is expected, nothing tests it, and the failure it leaves is silent.

decision-drivers:
- "Five of six declaration fields are already functions; the sixth is the one that broke."
- "A patch that appears twice is the contract asking to change, not two coincidences."
- "The failure mode of the workaround is SILENT staleness, which is the class this project keeps paying for."
- "⚠️ Timing: two consumers exist today and both belong to the Dev. After the first publish the same change is
   a major version and a stranger's broken build."

considered-options:
- "R1 - `topology(): Topology`, like the other five fields"
- "R2 - keep the value and bless the getter as the expected pattern, in a comment"
- "R3 - keep the value and add a change notification (`onTopologyChange`, or a version counter) so the engine
   can invalidate caches"

pros-and-cons-of-the-options:
  R1:
    good:
    - "The contract states the truth - this can change - instead of encoding it in a trick."
    - "The 15-puzzle's getter stops being a workaround and becomes unnecessary."
    - "`conformanceProblems` can re-evaluate, so a board that collapses to zero columns is caught WHEN it
       collapses rather than at construction."
    - "Removes the bridge in `boot/create-game`, which existed only because of the mismatch."
    bad:
    - "A game with a fixed board writes `topology: () => THE_GRID` - one more ceremony for the common case."
    - "⚠️ Breaking for both existing consumers. Measured: `game-chess` declares a literal value
       (`chess-declaration.ts:53`) and `game-15puzzle` declares a getter (`puzzle-declaration.ts:64`). One
       line each, and both are the Dev's."
  R2:
    good:
    - "Zero change, zero risk today."
    bad:
    - "⚠️ A getter that satisfies an interface is not a contract - nothing tells the next author, and nothing
       fails when they do not. The comment would be the only enforcement, and a comment is not a gate."
    - "`conformanceProblems` still reads once; a caching consumer still goes stale in silence."
  R3:
    good:
    - "Gives the engine something R1 does not: the ability to invalidate a cache on notice."
    bad:
    - "Introduces a LIFECYCLE into a contract that has none. ADR-0030's whole claim is that a genre package
       either satisfies the fields or does not; R3 adds an eighth concept to solve what R1 solves with none."

decision-outcome:
  chosen-option:
    link: "R1 - `topology(): Topology`"
    justification: |
      ===== 1. THE FIELD =====
      `GameDeclaration.topology` is a FUNCTION returning the shape of the space AS IT IS NOW. `tick` becomes
      the only constant field in the declaration.

      ===== 2. CONFORMANCE TELLS THE TWO FAILURES APART =====
      ⚠️ `conformanceProblems` reports THREE distinct problems where it used to report one, and the split is
      the point. `topology: missing` is a field nobody wrote. `topology: must be a FUNCTION (it was a value
      until ADR-0084)` is the field written the OLD way - which is what an author copying a pre-0084 example
      produces, and what would otherwise die in the first frame with «o.declaration.topology is not a
      function»: a frozen screen, which for a child who cannot see is indistinguishable from a game that
      never started. Saying only "missing" would send that author looking for a field that is right there.
      `topology: the function returned nothing` is the broken getter.

      ===== 3. AND THE MESSAGES BECAME ENGLISH, WHICH WAS NOT OPTIONAL =====
      ⚠️ The `engine-i18n` gate refused the first version of this change: it took `core/contract.ts` from 6 raw
      Portuguese strings to 8, and that ceiling only shrinks. There were three ways out and two of them were
      wrong - writing the new messages in Portuguese (still fails), or raising the ceiling (loosening the very
      anchor the gate exists to hold). The third is that these sixteen strings are DEVELOPER DIAGNOSTICS that
      never reach a child, and the CLAUDE.md artefact rule already asked for English. All sixteen were
      converted and `core/contract.ts` left the debt list entirely - the gate then required that too, which is
      why it is a good gate.

      ===== 4. WHAT DOES NOT CHANGE =====
      `Topology` itself - the three kinds, their fields, `distance()`. This record changes HOW the declaration
      hands the topology over, not what a topology is. The shape of `Topology` is a separate open question
      (the grid metric, and space beyond two dimensions), deliberately not answered here.

  consequences:
    positive:
    - "A game whose board resizes is expressible without a workaround, and the 15-puzzle is the proof."
    - "A declaration that goes invalid mid-run is caught mid-run: `conformanceProblems` re-reads."
    - "The bridge in `boot/create-game` is gone, so there is one less place where the two shapes meet."
    - "`core/contract.ts` carries zero raw Portuguese and is off the i18n debt list."
    negative:
    - "⚠️ BREAKING for the two existing games, and neither is fixed by this commit because both live in other
       repositories: `game-chess` (`topology: { kind: 'grid', cols: 8, rows: 8 }` -> `topology: () => ({...})`)
       and `game-15puzzle` (`get topology()` -> `topology()`). Until they change, they fail to typecheck
       against the engine they consume by `file:`."
    - "One more pair of parentheses for every game with a fixed board, which is most of them."
    neutral:
    - "The engine's own quiz declaration (`consumer-quiz/main-quiz.ts`) now allocates a fresh object per call.
       Measured as irrelevant: it is read by the sonar, not per frame - and a game for which it mattered would
       return a memoised constant, which the function form allows and the value form did not."
  confirmation: |
    THE GATE: `tests/contract-topologia-e-funcao.node.test.js`, born failing under a confirmed mutation -
    removing the `typeof !== 'function'` branch from `conformanceProblems` (so a value is accepted again) turns
    the second test red.

    · A declaration whose `topology` is a VALUE is rejected, and the message says FUNCTION rather than missing.
    · A declaration whose `topology` is absent is rejected with a DIFFERENT message.
    · A function returning nothing is rejected with a third.
    · A board that changes from 3x3 to 5x5 between two calls reports 5 on the second, and `distance` follows it
      (2 steps corner-to-corner at 3, 4 at 5).
    · A declaration whose columns collapse to zero starts failing conformance AT THAT MOMENT.

    ⚠️ THE BRIDGE IS GUARDED BY THE TYPE CHECKER, NOT BY A TEST, and that is deliberate rather than a gap.
    Reverting `boot/create-game.ts:205` to `() => o.declaration.topology` produces
    `TS2322: Type '() => () => Topology' is not assignable to type '() => Topology'` - measured. A test would
    say less, later.

    ⚠️ WHAT NO GATE CONFIRMS: that the two external games were fixed. They are in other repositories and this
    record cannot test them; the negative consequence above names the exact line in each.

more-information: |
  This is the first of three contract decisions the 15-puzzle's debt report forced, and the only one that is
  self-contained. The other two are open:

  · THE GRID METRIC. `distance()` uses Chebyshev for every grid, which is true where diagonals are legal and
    under-reports by up to 2x where they are not - and its consumer is the sonar, the instrument of a child who
    cannot see. The Dev rejected the options offered (a `metric` name, a `diagonals` flag) and asked a wider
    question: a measure the ENGINE chooses and performs, working at any orientation in the plane and in three
    dimensions. That answer changes `Topology` and `Spot`, and it is not this record.

  · THE WORLD ELEMENT. What "the world" means when a game's visible content is DOM. Decided in principle -
    the game declares it, mandatorily - and not yet written.

  Both must land before the first npm publish, for the reason in the drivers.
