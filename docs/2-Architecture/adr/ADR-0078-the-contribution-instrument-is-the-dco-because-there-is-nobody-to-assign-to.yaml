title: The contribution instrument is the DCO — because before the ato there is nobody a CLA could assign to

context-and-problem-statement: |
  ADR-0070 recorded that there is no hiring and the only labour is volunteer, and left two questions open
  with a trigger: the instrument for CODE contributions, and the terms for ART. The trigger is **before the
  first repository becomes public** — not before the first contribution, because by then somebody has already
  sent work and changing the terms afterwards asks people to agree retroactively.

  The repositories are private today (ADR-0066 §3) and the trigger has not fired. This record fires it early,
  which is the only moment it is cheap.

  ⚠️ AND THE CHOICE IS NARROWER THAN IT LOOKS, for a reason that is a fact and not a preference. A CLA is an
  ASSIGNMENT or a licence grant, and both need somebody on the receiving end. The patrimonial owner of this
  software is the MUNICÍPIO (Lei nº 9.609/1998 art. 4º), and the Município has authorised nothing yet — the
  publication is still a PEDIDO. So:

    · a CLA assigning to the DEVELOPER would have him receive rights over a work whose patrimonial owner is
      his employer, which is the opposite of what every other record in this project says;
    · a CLA assigning to the MUNICÍPIO needs the Município to be a party to it, and it is not one until the
      ato that pedido `e` asks for.

  Before the ato, the DCO is not the lighter instrument. It is the only available one.

decision-drivers:
  - "⚠️ There is no lawful assignee for a CLA today, and inventing one would make a claim this project spends
     five records refusing to make."
  - "A term nothing enforces is missing exactly where it matters, so the instrument has to be checkable by a
     machine."
  - "A volunteer arrives with a fork and a pull request. An instrument that needs an e-mail exchange and a
     signed document before the first patch loses the contributor at the door."
  - "⚠️ The art is NOT free and a volunteer artist will assume it is. Silence here is not neutrality, it is
     a person giving work under terms they were never told."

considered-options:
  - "C1 — DCO: `Signed-off-by` on every commit, checked in CI"
  - "C2 — a CLA assigning rights to the Município"
  - "C3 — a CLA assigning rights to the developer"
  - "C4 — nothing: the AGPL header is taken as sufficient"

pros-and-cons-of-the-options:
  C1:
    good: ["No paperwork, no assignee, no account: a line in the commit message.",
           "Checkable by a machine, so it cannot rot into a policy nobody applies.",
           "It is a STATEMENT by the contributor about their right to contribute — which is exactly the
            uncertainty a volunteer project has — rather than a transfer this project cannot receive."]
    bad: ["It grants no rights, so it does not let the Município relicense later without asking everyone.",
          "⚠️ It is weaker than a CLA precisely where a public body might want strength, and that has to be
           said rather than discovered by the Procuradoria."]
  C2:
    good: ["Strongest: the owner of the software would also own the contributions, cleanly."]
    bad: ["⚠️ IMPOSSIBLE TODAY. The Município is not a party to anything here; making it one is the ato that
           has not happened.",
          "It would also need somebody inside the Município to administer the signatures."]
  C3:
    good: ["Available immediately; one person to administer it."]
    bad: ["⚠️ It has a public servant receive rights over a work whose patrimonial owner is the Município.
           It is the `@pm-monte` problem again, one layer down: a claim in an instrument instead of in a name.",
          "It would have to be undone at the ato, and undoing an assignment needs every contributor again."]
  C4:
    good: ["Nothing to build."]
    bad: ["A licence says what a RECIPIENT may do; it says nothing about who holds the rights or whether the
           contributor had the right to contribute at all.",
          "It leaves an artist to assume the art is as free as the code."]

decision-outcome:
  chosen-option:
    link: "C1 — the DCO for code, plus an explicit art acknowledgement, both stated where a contributor arrives"
    justification: |
      ===== 1. CODE: THE DCO, AND IT IS CHECKED =====
      Every commit in a contribution carries:

          Signed-off-by: Name <email@example.com>

      which is `git commit -s`. It states that the contributor wrote the patch or has the right to submit
      it under the project's licence. It transfers nothing, and that is correct: there is nothing here that
      could receive a transfer.

      ⚠️ AND IT IS ENFORCED IN CI, NOT IN A DOCUMENT. A pull request whose commits lack the trailer fails.
      This project has already measured what an unenforced gate is worth: two security scanners sat red for
      weeks behind `allow_failure: true` and nobody read the grey mark.

      ===== 2. ART: THE ACKNOWLEDGEMENT, BECAUSE SILENCE WOULD MISLEAD =====
      A contributor of ART is told, where they would contribute, three things that a programmer does not
      need to hear:

        · **the art is NOT free software and not a free-culture licence** — restricted use is a product
          requirement (LICENSES.md §2), and no free licence can carry it;
        · **the artist keeps AUTHORSHIP** (Lei nº 9.610/1998) and grants the project the right to use,
          modify and distribute the work within the project's art regime;
        · ⚠️ **the restriction that travels**: art generated with PixelLab may not be used to train a model
          (LICENSES.md §4), and the project cannot grant downstream more than it received.

      ⚠️ AND THE HONEST SENTENCE IS THE ONE ABOUT EXPECTATION: someone who volunteers art for a public-good
      project reasonably expects it to end up free. Here it does not. Saying so before they draw is the whole
      of this clause.

      ===== 3. WHAT CHANGES AT THE ATO, AND WHY IT IS NOT A PROBLEM =====
      When the Município is a party, a CLA becomes possible. The DCO does not block it: it is a floor, not a
      ceiling, and adding an assignment later is a decision with its own record. What the DCO buys in the
      meantime is a provenance trail for every contribution, which is precisely what a later assignment would
      need in order to be asked for.

      ===== 4. WHAT THIS RECORD IS NOT =====
      ⚠️ It is not a legal opinion, and neither is `docs/LICENSES.md`. It is an engineering decision about
      which instrument this project can operate before the ato. The opinion belongs to the Procuradoria, which
      the requerimento already asks in pedido `c`, and this record is one of the things she should be shown.

  consequences:
    positive:
      - "The trigger ADR-0070 set is met before it fires: the terms exist before any repository is public."
      - "A volunteer can contribute with `git commit -s` and nothing else."
      - "An artist learns the art regime BEFORE drawing, rather than after."
      - "Every contribution carries a provenance line, which is what a later CLA would have to build on."
    negative:
      - "⚠️ THE DCO GRANTS NOTHING. If the Município later wants to relicense, it has to ask every
         contributor. That is a real cost of choosing the only instrument available now."
      - "One more required trailer is one more way a first pull request fails, and a rejected first
         contribution is often the last one. The failure message has to teach `git commit -s`, not scold."
      - "The art acknowledgement will lose some volunteers. It is better to lose them at the door than to
         receive work under terms they did not know."
    neutral:
      - "Nothing changes for the Dev's own commits, which already carry authorship through git."

  confirmation: |
    · `docs/CONTRIBUTING.md` states both terms, and a pull-request template repeats the code one where it is
      read rather than where it is filed.
    · CI FAILS a pull request whose commits lack `Signed-off-by`, and the failure message says how to fix it
      (`git commit -s`, `git rebase --signoff`).
    · No art file enters a repository without the acknowledgement having been stated in that repository.
    · ⚠️ UNTESTED UNTIL THE FIRST OUTSIDE CONTRIBUTION, and that cannot be simulated: whether the wording
      loses volunteers is measured by volunteers.

more-information: |
  This record supersedes nothing. It answers the two questions ADR-0070 §3 left open, in the shape that
  record asked for: named, triggered, and decided before the trigger fires.

  ⚠️ AND THE ARGUMENT IS WORTH KEEPING EVEN IF THE CONCLUSION CHANGES: the reason for the DCO is not that it
  is fashionable or light. It is that a CLA needs an assignee and this project has none until the Município
  becomes one. If the ato comes and a CLA is chosen, THAT is the fact that changed — and a record which said
  `DCO because simpler` would have been superseded for the wrong reason.
