title: As camadas com LEITURA são seis, e a maior delas são os menus — medido, não desenhado

context-and-problem-statement: |
  O Dev propôs para a tela a mesma abstração que o CONTROLE_ENGINE é para a entrada: em vez de cada elemento
  ser um caso, declarar as CAMADAS e o que vive em cada uma. E arriscou o número: provavelmente quatro com
  leitura — ação, atividade escolar, HUD do jogo, HUD do minigame —, sendo todas as outras design gráfico.

  ⚠️ O MÉTODO É O QUE DEU AO CONTROLE_ENGINE EXATAMENTE CATORZE POSIÇÕES: não desenhar o número, MEDIR se ele
  fecha. Foram contadas as duas superfícies onde conteúdo legível existe — os 37 sinks de markup do censo da
  issue #106, e as ~190 chamadas de `srSay`/`srAlert`/`narrate`.

  O NÚMERO NÃO FECHA, E A DIFERENÇA NÃO É DE MARGEM:

      dentro das quatro:   7 sinks de markup ·  76 anúncios
      FORA das quatro:    30 sinks de markup · 116 anúncios, em 26 módulos

  ⚠️ E O QUE SOBRA NÃO É RUÍDO DISPERSO — AGRUPA-SE SOZINHO. Quase tudo são MENUS E DIÁLOGOS:
  `activities-menu` (5 markup, 12 falas), os sete painéis `settings-*`, `pause-icons` (2 e 16), `map-hub`,
  `menu-nav`, `shell`. É a superfície onde a acessibilidade deste produto de facto mora — e é justamente ela
  que a proposta manda para «design gráfico».

  Um segundo grupo, menor e diferente dos dois: os AVISOS DO SISTEMA — o cartão de alcance (#112) e o banner
  de queda do laço (ADR-0054). Não são menu e não são HUD.

decision-drivers:
- "⚠️ Medido: 30 dos 37 sinks e 116 dos 192 anúncios caem fora das quatro camadas propostas."
- "⚠️ E medido também que a intuição do Dev acerta no ponto mais difícil: a camada de AÇÃO tem ZERO markup e
   38 anúncios. A leitura dela já é o CONTRATO (`nameAt`/`objectiveOf`/`targetsOf`) — o que significa que esta
   abstração não inventa nada para o mundo; ela ESTENDE AO DOM o que o contrato já faz pela canvas."
- "A `HUD DO MINIGAME` está vazia hoje: `winsDots` devolve DADO desde a issue #106 e vive dentro de
   `game/quiz`. A camada existe conceptualmente e não tem casa — o que é informação, não objeção."
- "O que distingue as camadas não é a posição na tela: é DE QUEM ELAS FALAM."

considered-options:
- "L1 - ficar com as quatro, e o resto é design gráfico"
- "L2 - SEIS camadas, com menus e avisos do sistema nomeados"
- "L3 - nenhuma abstração; cada sink continua a ser um caso"

pros-and-cons-of-the-options:
  L1:
    good:
    - "Menos peças, e a proposta original tem a virtude de caber numa frase."
    bad:
    - "⚠️ REFUTADA PELA MEDIDA, e não por gosto: mandaria para «design gráfico» 30 dos 37 sinks e a maior
       parte da fala do produto. Os menus são onde o ADR-0044, o ADR-0028 e o rodapé de explicação vivem —
       chamar-lhes decoração tornaria a abstração falsa no primeiro uso."
  L2:
    good:
    - "Fecha: toda a superfície legível cai numa das seis, e o que fica de fora é genuinamente decoração
       (parallax, clima, scanline, vinheta, transição)."
    - "⚠️ Dá casa a uma regra que hoje é um enum de dois valores: `AlcanceDoFiltro` (`'mundo'` vs
       `'mundo-e-menus'`) é uma afirmação sobre CAMADAS, e a regra da issue #82 — uma simulação alcança o
       mundo e NÃO os menus, porque o menu é o instrumento de sair dela — passa a ser dizível em vez de
       codificada em duas strings."
    - "A garantia de acessibilidade deixa de ser por PONTO e passa a ser por CAMADA: «tudo o que é legível
       nesta camada chega ao leitor de tela» é aferível de uma vez, e um sink novo tem de declarar onde mora."
    bad:
    - "Seis é mais do que quatro, e uma abstração que ninguém consegue recitar não é usada."
    - "Duas das seis (HUD do minigame, avisos do sistema) têm pouquíssimo conteúdo hoje."
  L3:
    bad:
    - "É o estado que deixou 37 sinks acumularem-se sem lar, e que fez a issue #106 existir."

decision-outcome:
  chosen-option:
    link: "L2 - seis camadas. ACEITE pelo Dev em 2026-09-06, depois de ver a medida que mudou o seu número de
           quatro para seis"
    justification: |
      ===== AS SEIS, E O QUE AS SEPARA =====
      ⚠️ O TESTE NÃO É A POSIÇÃO NA TELA, É **DE QUEM A CAMADA FALA**. Três sujeitos, seis camadas:

      O JOGO fala:
        1. AÇÃO — o mundo. Leitura = o CONTRATO + o sonar. Zero DOM, e é assim que deve ficar.
        2. ATIVIDADE ESCOLAR — o minigame por cima do jogo. DOM.
        3. HUD DO JOGO — o que persiste durante a partida (contador, poder).
        4. HUD DA ATIVIDADE — o progresso do minigame. Vazia hoje.

      A CRIANÇA escolhe:
        5. MENUS E DIÁLOGOS — a maior de todas, e onde as regras de a11y já existem (as três zonas do
           ADR-0044, o rodapé de explicação, o índice «6 de 10», `todo menu persiste`).

      O PROGRAMA fala de si:
        6. AVISOS DO SISTEMA — o cartão de alcance, o banner de queda. Nem menu nem HUD.

      ⚠️ E A SEXTA NÃO É PREGUIÇA DE CLASSIFICAR: ela tem uma REGRA PRÓPRIA que as outras não têm. Um aviso
      do sistema precisa de sobreviver a uma simulação de empatia — uma cegueira simulada não pode apagar o
      banner que diz que o jogo morreu —, enquanto as camadas 1 a 4 têm de ser alcançadas por ela. É a mesma
      família da regra da issue #82, e é o que faz das duas coisas camadas distintas em vez de estilos.

      ===== O QUE ESTE REGISTRO NÃO DECIDE =====
      A FORMA do padrão de nós. A medida diz quantas camadas e quais; como cada uma declara os seus elementos
      é a próxima pergunta, e ela deve nascer de um segundo levantamento — o que os 30 sinks de menu têm em
      comum — em vez de ser desenhada aqui.

  consequences:
    positive:
    - "A promessa de acessibilidade passa a ser aferível por camada em vez de por ponto."
    - "`AlcanceDoFiltro` ganha um vocabulário verdadeiro, e a regra da #82 deixa de viver num enum."
    negative:
    - "⚠️ É uma abstração NOVA num produto que já tem contrato, escala de z-index e vocabulário de ações.
       Sobrepor-se a qualquer um deles seria pior do que não a ter."
    neutral:
    - "A escala de `z-index` (ADR-0020) NÃO é substituída: ela ordena pintura, isto classifica leitura. As
       duas cruzam-se mas não se contêm — a scanline do CRT tem z-index e não tem camada legível nenhuma."
  confirmation: |
    A medida está em `scratchpad/camadas.py` e é repetível: conta os sinks de markup e as chamadas de
    anúncio por módulo, agrupa pelas camadas declaradas e imprime o RESÍDUO. É o resíduo que decide o número.

    ⚠️ ESTEVE `proposed` ATÉ O DEV VER A MEDIDA, e isso fica escrito porque é o procedimento e não o acaso:
    uma abstração de camadas escrita antes de ele saber que o número mudou de quatro para seis seria uma
    abstração imposta por quem mediu, e não decidida por quem a propôs. Ele aceitou as seis em 2026-09-06.

    ⚠️ E O CÓDIGO AINDA NÃO A SEGUE. O que este registro fixa é QUANTAS camadas e QUAIS; a FORMA do padrão de
    nós depende de um segundo levantamento — o que os 30 sinks de menu têm em comum —, e desenhar a forma
    antes dele repetiria o erro que esta própria medida acabou de corrigir.

more-information: |
  ⚠️ ESTE REGISTRO EXISTE PORQUE A MEDIDA CONTRARIOU A PROPOSTA, e é a segunda vez hoje que isso acontece: o
  id de armazenamento não podia vir da declaração (ADR-0088) e o `main.ts` não podia entrar no escopo do
  `engine-boundary` como o plano dizia. Nos três casos a intuição apontava a direção certa e o número errado.

  A ordem sugerida continua a ser: decidir isto ANTES da issue #111, porque ela move o cartucho para outro
  repositório — e é muito mais barato dizer de que camada cada peça é antes de as peças se separarem.
