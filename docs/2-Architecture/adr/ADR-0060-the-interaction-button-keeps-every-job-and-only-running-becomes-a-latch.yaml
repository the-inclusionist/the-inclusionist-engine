title: The INTERACTION button keeps every job it had, in every input mode — and only RUNNING becomes a latch, because only running requires holding

context-and-problem-statement: |
  ADR-0045 answered a real question correctly and then had its answer revoked twice in two days.

  THE QUESTION, which has not changed: the movement toggle already lets a child walk without holding a
  direction — "para quem não consegue manter pressionado (1 dedo)". The RUN button went on demanding exactly
  what that setting exists to remove. A child who plays with one finger walked without holding and could not run.

  ADR-0045's answer was that the run button's EDGE becomes the run latch, and everything else that edge used to
  trigger — clinging to a wall with the spider power, and later picking things up — moves to the JUMP in
  context. It is in that record's title: "every other job it carried moves to the JUMP".

  ⚠️ THE DEV REVOKED IT, IN TWO STEPS, AND THE SECOND ONE HE SAW ON SCREEN.

    · Carrying, 2026-08-28: "Botão de interação continua sendo botão de interação e servindo para conversar,
      pegar e jogar mesmo nos outros modos. O que muda é que a parte de correr [...] vira toggle." — "desfaço
      o que pedi".
    · Clinging, the same day, after watching it: "climb está funcionando não somente apertando o botão de
      contexto na parede, mas também o botão de pulo. O correto é só o primeiro caso."

  ⚠️ AND THE CODE FOLLOWED HIM WHILE THE RECORD DID NOT. `pularVaiGrudar` and `botaoDeGrude` were deleted from
  `game/run-toggle.ts` on 2026-08-28 — the file says so, in a block that quotes both revocations. ADR-0045 §3
  and §4 still describe those two functions as the decision in force. A reader arriving at the record a week
  later would have implemented something the code had already removed, and nothing in `status: accepted` would
  have warned them. That is the failure CLAUDE.md names in one line: choices went into the code and not into
  the record.

decision-drivers:
  - "A button that means different things in different accessibility modes is a button whose meaning a child has
     to re-learn when an adult changes a setting she did not ask for."
  - "The revoked half is named in ADR-0045's TITLE. A partial pointer cannot repair a title, and the index shows
     nothing but titles."
  - "Two of the three revoked clauses were never declared, so the record has been wrong in public for a week —
     the cost of leaving it is measured, not hypothetical."
  - "What survives from ADR-0045 is worth carrying forward deliberately rather than by inheritance, because one
     of its clauses (the two questions, §2) is the one that nearly broke the cane."

