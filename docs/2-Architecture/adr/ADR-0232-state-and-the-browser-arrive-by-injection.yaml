title: State and the browser arrive by injection from the composition root

context-and-problem-statement: |
  The engine is layered (ADR-0173) and measured (ADR-0221), and it is still coupled where it matters: 92 imports outside
  the root bring a module that HOLDS STATE — the translator's current dictionary, the storage, the state store, an audio
  context, a canvas. Such an import is not a dependence on what a function computes; it is a dependence on WHICH
  instance exists, and there is only one per page. It is why two roots on one page share a pad's previous frame, and why
  the browser suite races: 115 files write the same `localStorage`.

  The Dev asked for a strategy that decouples everything, and asked two things of it: whether fan-out should count type
  imports once there is no coupling to count, and whether the `platform` layer's globals should simply be injected.

decision-drivers:
  - "D1 — WHAT HAS STATE OR AN EFFECT IS PASSED, NOT REACHED: a module's needs are readable from its signature"
  - "D2 — A CONTRACT IS THE DEPENDENCE WE WANT: a type is erased at build and is exactly what injection depends on"
  - "D3 — TWO ROOTS SHARE NOTHING (ADR-0142): module-level state is shared by construction"
  - "D4 — A TEST BUILDS WHAT IT NEEDS: storage a test constructs cannot race with another file's"
  - "D5 — A FINITE LIST UNDER A RATCHET: every phase has an end state, and the measure lists edges by name"

considered-options:
  - "A — Dependency injection from the composition root: stateful modules become factories, the root is the only module that touches browser globals or constructs state, everything else receives; fan-out counts value imports only; a seventh measure counts value edges into stateful modules"
  - "B — Mandatory ports in the `platform` layer only; the layers above keep importing the translator, the storage and the state store"
  - "C — Exempt the `platform` layer from global reach (it IS the browser) and keep the singletons"
  - "D — A service locator: one container every module asks for what it needs"

pros-and-cons-of-the-options: |
  **A.** ✅ One rule answers both questions. ✅ Two roots and two test files stop sharing anything. ✅ The pattern is
  already in the tree and proven (ADR-0227). ❌ Every published function that reads a singleton changes shape: many
  breaking notes. ❌ The root gains wiring lines (it is exempt from fan-out, not from branches).
  **B.** ✅ Fewer changes. ❌ The 68 edges into the translator, storage and state store are above `platform` and do not
  move; the browser suite keeps racing, because the state store still reads the one shared storage.
  **C.** ✅ No work. ❌ The largest coupling of the tree stays, named as policy.
  **D.** ✅ Fewer signatures change. ❌ A locator is a global under another name: every module depends on the container
  and hides what it takes from it, and two roots still share it unless it is built per root — which is injection with a
  lookup added.

decision-outcome:
  chosen-option:
    link: "A — state and the browser arrive by injection from the composition root"
    justification: |
      1. **The rule.** Outside `boot/create-game`, a module imports BY VALUE only what holds no state and reaches no
         global: pure functions, constants, tables. The translator, the storage, the state store, audio, speech, canvas,
         the loop — anything with state or an effect — arrives as a parameter (the module's ctx or deps), built once by
         the root. Types are imported freely: they are the contracts the parameters are declared by.
      2. **The root is the only module that touches `window`, `document`, `navigator`, `localStorage` or
         `performance`.** A `platform` adapter is a FACTORY that receives the browser object it wraps —
         `createStorage(backend)`, not a module that reads `localStorage`. This answers the second question: yes,
         injection — and «mandatory ports» and «injection» were the same decision seen from its two ends: the port is
         the interface, the injection is who fills it. `platform` needs no exemption, because the adapter receives the
         global instead of reaching it.
      3. **Fan-out counts value imports only** (ADR-0221 superseded in part, its definition of fan-out). This answers the
         first question: once state arrives by parameter, a type import is a dependence on a contract, erased at build,
         and it is what point 1 asks a module to depend on — counting it punished the `SwitchableControl` interface for
         existing. The question survives only as «how many contracts does a module know», which is interface breadth and
         not coupling; it is not measured. The baseline is re-measured in the same commit, and the commit says it is the
         measure changing, not a payment.
      4. **A seventh measure, `statefulEdges`**: value imports into a stateful module. Ceiling 0 for a new module; an
         existing one must not worsen; the root is exempt (constructing state is its job). The stateful set is written in
         the baseline BY NAME, so a misclassification is visible in a diff and reviewed, never trusted.
      5. **The order, each phase with its end state**, largest cost to a child first:
         · **measure** — script, baseline and gate in the repository; the gate red by mutation; the 92 edges listed.
         · **storage and state store** — built by the root, 27 edges → 0; the browser suite run 20 times (F9's end state).
         · **translator** — passed in, 41 edges → 0.
         · **every remaining stateful module becomes a factory** — stateful modules outside the root → 0, global reach
           outside the root → 0.
      6. **Zero coupling is not the aim, and is not possible.** Contracts and pure vocabulary stay shared, and they should:
         they are the stable side, and depending toward stability is the direction that costs nothing to change.
      7. **Nothing outside this repository is touched**; every published shape that changes carries a migration note.

  consequences:
    positive:
      - "Two roots on one page share nothing, and two test files share nothing — the race behind F9 loses its cause"
      - "What a module needs is its signature; a test builds exactly that"
      - "One module knows the browser, and it is the one whose job is wiring"
      - "The coupling measure stops punishing the contracts it asks for"
    negative:
      - "A series of breaking releases: every published function that reads a singleton changes shape"
      - "The root grows in wiring lines; it must not grow in branches (ADR-0221's criterion for the root)"
      - "Ctx types grow members — the price of dependencies being visible"

  confirmation: |
    ✅ D1 BUILT (engine a0ef7512, see the erratum): the measure and its gate are `confirmed-by`. The other phases are
    still debt in issue #207, one checkbox each, and each closes on its own measured end state: D2 storage and state
    store (27 edges -> 0, then 20 runs of the browser suite), D3 the translator (42 -> 0), D4 every remaining stateful
    module a factory.

more-information: |
  📌 Why the translator is not first despite carrying the most edges: storage and the state store are what two test files
  race on, and the Dev reframed that instability as the cost of a design that is too complex (F9). The translator's state
  is the page's language, which one page genuinely has one of; passing it in is for readable signatures and tests, not to
  stop a race.
