title: The accommodation catalogue is GENERAL, and a GENRE declares its subset and its own additions

context-and-problem-statement: |
  📏 **Measured on 2026-09-12, classifying every ctx field of the two visual panels by where it would come
  from**, the engine can already answer 11 of `settings-empathy`'s 15 fields and 10 of `settings-visual`'s 17:
  `platform/audio.setHearingLossGraph`, `core/state.setOneButtonValue`, `core/state.setWheelchairValue`,
  `setCbSafeValue`, `setOwnerColorsValue`, `setOutlineFgValue`/`Bg`, `render/lq-filter.setLq`.

  🔴 **AND THE DEV READ THAT MEASUREMENT AND SAID IT IS WORSE THAN IT LOOKS**, in their own words:

      «Não faz sentido um modo cadeira de rodas num xadrez ou num snake. […] Modo empatia cadeira de rodas só
       pode aparecer no gênero plataforma, ou seja, é uma opção própria deste gênero, assim como peças
       diferentes é algo que somente existe em jogos de tabuleiro (xadrez, damas, gamão).»

  🎯 **THE MEASUREMENT CONFUSED TWO DIFFERENT QUESTIONS.** «The engine owns the flag» and «the setting belongs
  in this game» are not the same sentence. `core/state.wheelchair` exists, so the engine CAN write it — and a
  wheelchair toggle in a chess game is still a control with no subject.

  ⚠️ **AND THAT IS A SECOND KIND OF DEAD BUTTON, WHICH ADR-0106 §5 DOES NOT REACH.** §5 forbids the control
  whose ACTION does not work, and the engine can detect that one: the writer is missing, so the row is not
  mounted and the gap goes to `problems`. A control with no SUBJECT passes every check — the writer exists,
  the state persists, the announcement speaks — and it is worse for the child, because nothing anywhere
  reports it. It is a button that works and means nothing.

  📌 **THE SAME SPLIT ALREADY EXISTS ONE LEVEL DOWN AND IS ALREADY SOLVED.** The remapping screen used to show
  eight fixed rows, and `SettingsControlsCtx` still carries why that was wrong: «a engine decidia que todo
  jogo tem exatamente pular, correr, trocar e especial. Um quiz mostraria quatro linhas para ações que não
  existem nele, e uma criança tentaria remapear um botão que não faz nada.» The cure was `ActionPreset`. The
  accommodations are the same problem, unfixed.

decision-drivers:
  - "D1 — A CONTROL WITH NO SUBJECT IS INVISIBLE TO EVERY GATE WE HAVE. It is the only defect class in this
     area that neither a type error, nor `problems`, nor a mutation over the engine can surface."
  - "D2 — THE THREE HUNDRED GAMES ARE NOT THREE HUNDRED SPECIAL CASES. They fall into genres, and a genre is
     the unit at which «does this accommodation apply» has one answer instead of three hundred."
  - "D3 — AND THE ENGINE MUST NOT LOSE WHAT IT KNOWS. Hearing loss, low vision and colour-blindness
     simulation apply to almost every genre; making everything genre-declared would make each game re-derive
     what the engine already decided."
  - "D4 — RENAMING IS A COST WITHOUT A BUYER. `jumpEdge` and its five siblings are `Player` fields (ADR-0033)
     read by the engine's own latch, collision and draw. Renaming them to `Action` vocabulary is a break paid
     by everyone to solve a naming discomfort of one genre."

considered-options:
  - "A — Every accommodation is the engine's, and a game that cannot use one simply has a switch that does
     nothing meaningful."
  - "B — Every accommodation is the game's, declared one by one, with the engine offering none by default."
  - "C — A GENERAL catalogue in the engine; a GENRE declares which entries apply, with its own words, and adds
     its own entries when the genre has something the catalogue does not."

pros-and-cons-of-the-options: |
  **A — everything is the engine's.**
  ✅ One rule, zero declaration, and it is what today's code implies.
  ❌ It is the wheelchair-in-chess outcome. Every genre pays for every other genre's accommodations, and the
     cost lands on the child as a menu full of switches that mean nothing to her game.

  **B — everything is the game's.**
  ✅ Nothing meaningless ever appears.
  ❌ It is the arrangement ADR-0106 was written to end: «cada jogo está precisando montar do seu jeito». And
     it throws away real engine knowledge — `setHearingLossGraph` works in any game with sound, and asking
     three hundred games to each decide that is how five of six ended up with nothing.

  **C — general catalogue, genre declares.**
  ✅ It is the shape the codebase already proved with `ActionPreset`, applied where the same defect lives.
  ✅ A genre answers once for its whole family, instead of each game answering for itself.
  ✅ New accommodations enter as ADDITIONS rather than renamings, so `jumpEdge` stays `jumpEdge` and a board
     game simply never declares it while declaring `pecas`, which the platformer never had.
  ❌ It introduces a concept the codebase does not have yet — the GENRE — and something has to hold it.
  ❌ And the catalogue has to be seeded honestly: classifying today's accommodations into general and
     genre-bound is judgement work that nobody can do from the types alone.

decision-outcome:
  chosen-option:
    link: "C — a general catalogue, and a genre declares its subset, its words, and its own additions"
    justification: |
      ===== 1. THE SHAPE, AND IT IS ONE THE CODEBASE ALREADY PROVED =====
      The engine holds a CATALOGUE of accommodations, closed the way `Action` is closed. A genre declares a
      partial map over it — which entries apply, and the word this genre uses for each — exactly as
      `ActionPreset` is `Partial<Record<Action, ActionWord>>`.

      An entry a genre does not declare is not mounted. Not hidden with a reason, not disabled: **absent**,
      because there is nothing to explain to a child about a setting her game has no concept of.

      ===== 2. A GENRE ADDS; IT DOES NOT RENAME =====
      What a genre has and the catalogue does not, it declares as its OWN entry — «peças» for the board
      games, and whatever the next genre brings. Nothing in the engine is renamed to accommodate it.

      📌 This is the Dev's clause, in their words: «Não precisaria renomeá-los, mas fornecer uma lista de
      "traduções" por gêneros assim como novas opções quando necessário.» So `jumpEdge`, `swapEdge` and
      `specialEdge` keep their names on `Player`; a genre that does not jump simply never declares them, and
      the platformer's translation is what turns `jumpEdge` into the word a child reads.

      ===== 3. AND THE CATALOGUE IS WRITTEN BY STUDYING GENRES, NOT BY WAITING FOR THEM =====
      The Dev asked for «contratos que ainda não existem mas são previsíveis ao se estudar os gêneros». The
      catalogue is seeded from the genres of the 300-game plan rather than grown one defect at a time — which
      is the difference between a vocabulary and a pile of exceptions.

      ===== 4. THE FIRST CLASSIFICATION, AS FAR AS IT IS MEASURED TODAY =====
      Stated as a starting point and not as the answer, because it is judgement and the study in §3 is what
      settles it:

        · **General** — hearing-loss simulation (`platform/audio.setHearingLossGraph`), low-vision and
          colour-blindness simulation, typography, spoken menu index, narration, navigation sound. They apply
          wherever there is sound or a screen, which is everywhere.
        · **Genre-bound** — wheelchair mode (platform), Easy Mode's coins-on-the-ground (platform),
          tap-to-move and the run latch (anything with sustained movement), piece sets (board games).

      ⚠️ One-button mode is the honest hard case and is NOT classified here: it means «collapse this game's
      actions onto one», which needs a game with more than one action and a rule for what collapses into
      what. It goes into the study, not into a default.

      ===== 5. WHAT THIS DOES NOT DECIDE =====
      Where a genre's declaration LIVES — a field on `CreateGameOptions`, a genre module, or the template of
      ADR-0068 §6 — and how the menu presents the two families. The second is ADR-0146.

  consequences:
    positive:
      - "A control with no subject stops being possible by construction, instead of being a defect nobody can
         detect"
      - "A genre answers once for its family; three hundred games stop being three hundred special cases"
      - "The engine keeps what it genuinely knows — sound, screen, typography — instead of devolving it"
      - "New genres extend the catalogue instead of forcing renames, so `Player` stays as it is"
    negative:
      - "The codebase gains a concept it does not have: the GENRE, which something now has to hold and keep
         honest"
      - "Seeding the catalogue is judgement work that no type and no test can do, and a bad seed is a
         vocabulary everyone inherits"
      - "A game whose genre is declared wrong silently loses accommodations — a new failure mode, and one
         whose symptom is absence"
      - "It is a second partial-declaration contract beside `ActionPreset`; two of them is a pattern, three
         would be a smell"

  confirmation: |
    ✅ BUILT (confirmed 2026-09-25 — see `confirmed-by`), in the form ADR-0153 gave it. The gates as they were named before the work, kept as history: The work is **issue #143** in
    `the-inclusionist-engine`, and the study of §3 is the first half of it. The gates, named now:

      1. An accommodation a genre does NOT declare is absent from the document — the case asserts the
         ABSENCE, not merely that nothing threw.
      2. An accommodation the genre declares carries the GENRE's word, and never an engine identifier — the
         `labellerFrom` rule, applied to the catalogue.
      3. A genre-specific entry that the catalogue does not contain still mounts, so an addition does not
         need an engine release.
      4. 🔴 Two genres in one page — the ADR-0142 arrangement — do not leak each other's accommodations. This
         is the gate that a single-genre implementation passes by accident.

more-information: |
  📏 **The measurement that started this**, taken 2026-09-12 by classifying every ctx field of the two visual
  panels by its would-be source: `settings-empathy` 11 of 15 from the engine, `settings-visual` 10 of 17. The
  four world-facing fields of the empathy panel are all about visual SIMULATION (`renderVizGroup`,
  `setPlayerViz`, `reflectVizButtons`, `reflectMotorEmpathy`); the three accommodations that are not visual —
  hearing loss, one-button, wheelchair — are entirely the engine's **to write**. It was that last sentence
  that the Dev corrected: being able to write it is not the same as it belonging there.

  ⚠️ **AND THE CORRECTION GENERALISES BACKWARDS.** The same conflation is in work already committed:
  `ui/settings-motor` mounts Easy Mode, tap-to-move and the run latch for any game, and all three are
  platform vocabulary. The panel is not wired into `createGame` yet, so nothing has shipped — but the
  classification of §4 has to reach it before it does.

  📌 **The genre list is not invented here.** It comes from the 300-game catalogue of ADR-0058 and the
  repository template of ADR-0068 §6; this record only says that the genre is the unit at which the question
  is answered.
