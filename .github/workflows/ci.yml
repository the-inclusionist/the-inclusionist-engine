# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE ENGINE'S OWN GATES, ON GITHUB — the port ADR-0066 §4 called work rather than a copy.
#
# ========================= WHY THIS FILE EXISTS =========================
# ADR-0066 moved hosting to a GitHub organisation and said in as many words that CI is a PORT, not a copy,
# and that "a gate that silently stops running is worse than one that never existed". Between the move and
# this file, that is exactly what the engine had: `.gitlab-ci.yml` still holds the gates, and GitLab has not
# seen a commit since 2026-08-30 — so every commit pushed here arrived with no typecheck, no test suite and
# no ADR validator. `game-ci.yml` next to this file gates the GAMES and says outright that the engine does
# not use it.
#
# ========================= WHAT CHANGED IN THE PORT, AND WHY =========================
# Four of the five GitLab jobs cross over unchanged in substance: `test`, `adr`, `a11y`, and the build.
# The two SCANNERS could not, and the reason is a price rather than a technicality:
#
#   ⚠️ GitHub's native code scanning (CodeQL) and secret scanning are FREE ONLY ON PUBLIC REPOSITORIES.
#   On a private one they require GitHub Advanced Security, which is paid. ADR-0066 §3 keeps every
#   repository private until the Município authorises publication, so the native pair is unavailable for
#   exactly as long as it matters most — a repository being prepared for publication.
#
# So the equivalents are open-source and run as ordinary steps: gitleaks in place of secret scanning, and
# semgrep in place of CodeQL. Both are pinned to an exact version, because a scanner that silently changes
# its rules is a gate whose verdict nobody can reproduce.
#
# ⚠️ AND THEY ARE NOT `continue-on-error`. On GitLab both scanners carried `allow_failure: true` and both
# had been RED since they were added — they died on `npm: not found`, inherited from a `default:` block,
# and the grey ✗ was read by nobody for weeks. The whole point of porting them is that they now fail the
# pipeline.
#
# ========================= CONVENTION =========================
# Action majors match `game-ci.yml` (`@v4`) on purpose: two workflows in one repository that pin different
# majors of the same action are a divergence somebody has to reconcile later. Bumping them is one change,
# for both files, not a side effect of adding this one.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the same branch makes the first run's verdict irrelevant. Cancelling it is not a
  # weakening of the gate: the newer commit is the one that has to be green.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================================
  # The engine's `test` job from `.gitlab-ci.yml`, in the same order and for the same reasons.
  # ============================================================================================
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci`, not `npm install`: the lockfile is part of what is under test. It also runs `prepare`,
      # which builds `dist-pkg/` — without it the package `exports` point at nothing.
      - run: npm ci

      # Supply chain FIRST, and production dependencies only: those are the ones that reach a child's
      # browser. A dev-only advisory is a different conversation and must not block this one.
      - name: audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

      # Zero errors, no budget. The 273-error debt of the TypeScript conversion reached zero on
      # 2026-08-26 and the budget gate was deleted; a new error is a new error.
      - name: typecheck
        run: npm run typecheck

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: test (node + browser)
        run: npm test

      - name: build
        run: npm run build

      # ⚠️ The precache manifest must not FREEZE a file. `revision: null` on a URL with no build hash means
      # an installed service worker serves those bytes forever — 97 of 141 entries were frozen on
      # 2026-08-25, on devices nobody could reach.
      - name: precache budget
        run: npm run check:precache

      # ⚠️ The ONE obligation that undoes itself. §51.j of the requerimento commits the project to an annual
      # public report on the eleven child-protection principles, and says why it needs a machine:
      # «compromisso sem prestação de contas periódica degrada silenciosamente». ADR-0053 turned that into
      # this gate. It is DORMANT until a first year is declared (see docs/compliance/README.md) and prints a
      # notice saying so on every run — a dormant gate is a notice, not a pass. Needs no build, so it sits
      # here rather than in a job of its own.
      - name: annual compliance report
        run: npm run check:annual-report

  # ============================================================================================
  # The engine's own records, beside the code they name (ADR-0242).
  # ============================================================================================
  # 🔴 THE TREE LIVES HERE AGAIN, so this job checks it on every push and needs no token for it — the dormant state
  # ADR-0123 forced on this job is over for the engine's records. The Dev's rule stands: «cada repositório precisa ter
  # seus validadores e gates para ADRs»; the kit (validator, its test, the tempo and debt sieves) lives here and in
  # `the-inclusionist-docs`, identical.
  #
  # 📌 WHAT CROSSES INTO `the-inclusionist-docs` — 53 index rows and 9 supersession pointers — is COUNTED and SAID
  # without the token, and OPENED with it. The token also buys the two things only this side can do: open the
  # `engine:` confirmations of the records that stayed there (ADR-0123 §4), and compare the two copies of the kit.
  #
  # ⚠️ Without `DOCS_READ_TOKEN` those steps are a NOTICE, not a pass — the same shape as `check:annual-report`.
  adr:
    runs-on: ubuntu-latest
    env:
      # ⚠️ A secret cannot be read in a job-level `if:`, so it becomes a boolean here and the steps read that.
      TEM_TOKEN: ${{ secrets.DOCS_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      # Eight checks, including the bidirectional supersession pointers — now across repositories too. ⚠️ NO PIPE:
      # the exit code is the gate, and «N sound» coexists with a non-zero exit.
      - name: validate the engine's records
        run: python scripts/validate-adr.py docs/2-Architecture/adr --repo engine=.

      # 🎯 THE GATE OF THE GATE (ADR-0123 §3): the validator SAYS what it did not check.
      - name: the validator says what it did NOT check
        run: python scripts/test-validate-adr.py

      - name: a record does not contradict its own tree
        run: python scripts/tempo-dos-registos.py

      - name: the debt census stays alive
        run: python scripts/test-divida-dos-registos.py

      # A REPORT, not a gate: it never fails (ADR-0126).
      - name: how many records owe work nobody can find
        run: python scripts/divida-dos-registos.py

      - name: NOTICE — the-inclusionist-docs could not be fetched, so what crosses into it was only counted
        if: env.TEM_TOKEN != 'true'
        run: |
          echo "::warning title=Cross-repository records unchecked::the secret DOCS_READ_TOKEN is not set, so" \
               "the-inclusionist-docs was NOT fetched: the rows and supersession pointers that cross into it were" \
               "counted, not opened, its records' confirmations naming this repository were not checked, and the" \
               "two copies of the records tooling were not compared. Create a fine-grained PAT with read access to" \
               "the-inclusionist/the-inclusionist-docs and store it as DOCS_READ_TOKEN in this repository."

      # ⚠️ A PRIVATE repository of the same organisation: a workflow's `GITHUB_TOKEN` does NOT reach another repository —
      # measured in run 34352635399, which failed with `Not Found`.
      - name: the-inclusionist-docs
        if: env.TEM_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: the-inclusionist/the-inclusionist-docs
          path: records-docs
          token: ${{ secrets.DOCS_READ_TOKEN }}

      - name: this tree, with what crosses into the-inclusionist-docs OPENED
        if: env.TEM_TOKEN == 'true'
        run: python scripts/validate-adr.py docs/2-Architecture/adr --repo engine=. --repo docs=records-docs

      # 📌 `--repo engine=.` is what this repository has and the other does not: the CODE the confirmations name.
      - name: the project-wide records, with the confirmations that name this repository OPENED
        if: env.TEM_TOKEN == 'true'
        run: python scripts/validate-adr.py records-docs/docs/2-Architecture/adr --root=records-docs --repo engine=. --repo docs=records-docs

      - uses: actions/setup-node@v7
        if: env.TEM_TOKEN == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - if: env.TEM_TOKEN == 'true'
        run: npm ci
      # 🎯 THE COUNTERMEASURE TO DRIFT, in the job where the two copies meet: two versions of the kit give two verdicts
      # on the same tree. `DOCS_ROOT_REQUIRED` makes a skip fail here, where the checkout was declared.
      - name: the two copies of the records tooling are the same
        if: env.TEM_TOKEN == 'true'
        env:
          DOCS_ROOT: ${{ github.workspace }}/records-docs
          DOCS_ROOT_REQUIRED: "1"
        run: npx vitest run --project node tests/the-validator-does-not-drift.node.test.js

  # ============================================================================================
  # Pillar 2, measured against the app RUNNING rather than against the source.
  # ============================================================================================
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The preview server serves `dist/`, which is what a school would receive. Any WCAG A/AA violation in
      # our own markup fails the run; the VLibras widget is excluded by the script, not by this file.
      # ⚠️ THE TARGET IS `/quiz.html` AND NOT `/`. `dist/` emits no `index.html` — it left with the cartridge (#111) —, so a
# readiness probe on `/` never became ready (it waited the whole 30 s) and axe timed out waiting for `#sr-status` on a
# page that does not exist. The probe hits the SAME page the gate audits: a probe that tests another address does not
# prove the gate has something to audit.
      - name: axe against the built app
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/quiz.html >/dev/null && break; sleep 1; done
          AXE_URL=http://localhost:4173/quiz.html npm run test:a11y

  # ============================================================================================
  # ADR-0078: the DCO is the contribution instrument, and an instrument nothing checks is missing
  # exactly where it matters. Pull requests only - the maintainer's own pushes to `main` are already
  # attributed by git, and gating them would be ceremony rather than provenance.
  # ============================================================================================
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ⚠️ The message TEACHES rather than scolds. A rejected first contribution is often the last one,
      # and the fix is one flag most people have never needed.
      # 🔴 THE RANGE ENDS AT THE PULL REQUEST'S HEAD, NOT AT `HEAD`. On `pull_request` the checkout is
      # `refs/pull/N/merge`, a merge commit GitHub makes («Merge <head> into <base>») that nobody signs, so
      # `origin/<base>..HEAD` failed every pull request, however signed. Measured on a simulated merge ref: the old
      # range reported the synthetic merge; this one reports exactly the contributor's commits, an unsigned one included.
      - name: every commit is signed off
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          faltando=$(git log --format='%H %s' --grep='^Signed-off-by:' --invert-grep \
            "origin/${{ github.base_ref }}..${PR_HEAD}")
          if [ -n "$faltando" ]; then
            echo "::error::These commits have no 'Signed-off-by' trailer:"
            echo "$faltando"
            echo ""
            echo "The DCO (https://developercertificate.org/) is how you state that you wrote the patch,"
            echo "or have the right to submit it under this project's licence. It transfers nothing."
            echo ""
            echo "  fix the next commits:  git commit -s"
            echo "  fix this branch:       git rebase --signoff origin/${{ github.base_ref }}"
            exit 1
          fi
          echo "all commits signed off"

  # ============================================================================================
  # Secret detection. Replaces GitLab's template, which never ran once.
  # ============================================================================================
  secrets:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ `fetch-depth: 0` — the whole history. A secret that was committed and then deleted is still in
      # the history, and the history is what becomes public. A shallow clone would gate the tip and miss
      # every commit that matters.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary, pinned, rather than the marketplace action: `gitleaks-action` requires a paid licence
      # key for repositories owned by an ORGANISATION, and this repository is owned by one. The tool
      # itself is MIT.
      - name: gitleaks (pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          # ⚠️ `--retry`: the download failed with `curl: (35) Connection reset by peer` on a documentation-only commit, and
          # a gate that goes red over the network is a gate that teaches people to ignore red — the exact defect this file
          # was written not to have. `--retry-all-errors` because a reset is not an HTTP code, and without it `--retry`
          # does not catch it.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          # `--redact` so a finding does not leak the secret into a public build log, which would turn
          # the gate into the disclosure. Exit code 1 on any finding: this is a gate, not a report.
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  # ============================================================================================
  # Static analysis. Replaces CodeQL, which is paid on a private repository.
  # ============================================================================================
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0
    steps:
      - uses: actions/checkout@v7
      # Registry rulesets by name, pinned image: `--config auto` would pull whatever the registry decides
      # today, which makes a red run impossible to reproduce tomorrow. `--metrics=off` because a project
      # that argues about child telemetry does not send its own source metrics to a vendor by default.
      - name: semgrep
        run: semgrep scan --config=p/typescript --config=p/javascript --error --metrics=off
