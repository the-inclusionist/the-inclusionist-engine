# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE GATE EVERY GAME CALLS — ADR-0068 §4, written instead of copied.
#
# ========================= WHY IT IS ONE FILE AND NOT THREE HUNDRED =========================
# ADR-0068 §4 refused three hundred copies of a pipeline, and named the failure it was refusing: copies
# drift, and the ones that drift silently are the ones that STOP GATING. A gate that stopped running is
# worse than one that never existed, because the repository still shows a green tick.
#
# So a game's own workflow is a few lines that INVOKE this one:
#
#     jobs:
#       ci:
#         uses: the-inclusionist/the-inclusionist-engine/.github/workflows/game-ci.yml@main
#
# ========================= WHY IT LIVES IN THE ENGINE REPOSITORY =========================
# Because ADR-0067 §5 says a repository is created when a RECORD declares its address, and no record
# declares an address for a workflows repository. Inventing one to hold a YAML file would be the rule
# working backwards.
#
# And it is where the shared things already are, by ADR-0068 §5's own reasoning: the ADR validator and the
# eight gate checks live in the engine, and a game inherits them. This is the same sentence applied to CI.
#
# 📌 AND THE RECORDS ARE HERE AGAIN (ADR-0242). ADR-0123 had moved every record to `the-inclusionist-docs`;
# ADR-0226 gave each repository the records about itself, so a GAME repository may keep an `adr/` tree of its own
# (the opposite of ADR-0068 §5's «never»); and ADR-0242 brought the engine's records home, leaving in
# `the-inclusionist-docs` only what belongs to the whole project. The engine's index keeps a row for every record
# of the project, local or pointing across, which is why a game's records are checked against this repository.
#
# ⚠️ THE ENGINE ITSELF DOES NOT USE THIS FILE, and the reason changed on 2026-09-06. It used to be that the
# engine's gates ran on GitLab; they now run beside this file, in `ci.yml`, and `.gitlab-ci.yml` was deleted
# once the GitLab project was archived. The engine still does not CALL this workflow, because it is not a
# game: `game-ci.yml` installs Chromium and offers an axe gate against a game served on a port, and the
# engine's own pipeline has six jobs this one has no business carrying — the ADR validator and the DCO check
# among them. Two workflows, two shapes, and neither is a copy of the other.
#
# ========================= WHAT IT GATES, AND WHY EACH ONE =========================
# The four that the engine's own `test` job runs, minus what only an app has:
#   · `npm audit --omit=dev` — production dependencies are the ones that reach a child's browser;
#   · typecheck — clean, zero errors, no budget (the engine's 273-error debt reached zero on 2026-08-26);
#   · the Vitest suite, both projects — a game's browser tests need Chromium;
#   · the build — a game that does not build cannot be selected by the catalogue's manifest.
#
# And one that is the games' own, REQUIRED and with no input to turn it off (ADR-0253, building the gate ADR-0140 called
# «not optional»):
#   · the CARTRIDGE — built with the ENGINE's build (`vite build --mode cartridge`, which exists only in a game whose `vite.config`
#     wraps its config in `defineGameBuild` from `@the-inclusionist/engine/build`), then checked with the ENGINE's checker
#     (`inclusionist-check-cartridge`), which imports the built cartridge and runs on it the same refusals `createGame` and
#     `mount()` apply at boot. The app build above proves the standalone PWA; this proves the half the platform installs, which
#     before this step nothing built at all.
#   🔴 A GAME WITHOUT A CARTRIDGE TARGET IS RED UNTIL IT ADOPTS THE ENGINE'S BUILD — its own `build:lib` does not count, because
#   five games wrote five of them and that drift is what the record ends. The migration is in `docs/6-DevOps-SRE/Breaking-Changes.md`.
#
# The a11y gate (axe) is OPT-IN rather than default, and that is a deliberate honesty: it needs the game to
# be servable at a URL, and a game whose shell is still a scaffold has nothing to serve. `with: a11y: true`
# turns it on. ⚠️ A game that ships to a school with `a11y: false` is a game that skipped pillar 2, and the
# input is named so that skipping it is a VISIBLE line in the caller instead of an absence.
name: game-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major/minor to run on. Default matches the engine's .node-version."
        required: false
        type: string
        default: "24.14.0"
      a11y:
        description: "Run the axe gate against the built game. Requires `preview` and an axe script."
        required: false
        type: boolean
        default: false
      preview-port:
        description: "Port `npm run preview` binds to when the a11y gate runs."
        required: false
        type: number
        default: 4173
      adr-records:
        description: "Validate this game's own ADR tree (ADR-0226, ADR-0242). Requires the `records-token` secret."
        required: false
        type: boolean
        default: false
    secrets:
      # Read access to `the-inclusionist/the-inclusionist-engine`, which is private: the game's records cite the
      # engine's and the project's, the engine's tree and index answer for every number, and without them each such
      # citation fails on purpose. The game's own `GITHUB_TOKEN` does not reach another repository. It no longer
      # needs `the-inclusionist-docs`: the engine's index carries a row for every record kept there (ADR-0242).
      records-token:
        required: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ v7 HERE IS EVIDENCE, NOT SYMMETRY WITH `ci.yml`. This file is the one that reaches five other
      # repositories, so it moved a day after the engine's own bump and only once that bump had a green run
      # behind it (`60fdb0e`, all five real jobs green, and it carries `9a69afe`). The two breaking changes
      # between v4 and v7 that could reach a CALLER were measured in the five callers, not here:
      #   · setup-node v5 added automatic caching keyed on `packageManager` (narrowed to npm in v6) — none of
      #     the five games declares that field, and this step passes `cache: npm` explicitly, which is the
      #     path v6 kept;
      #   · checkout v7 refuses a fork checkout under `pull_request_target`/`workflow_run` — no caller uses
      #     either trigger; their workflows call this one from `push`/`pull_request`.
      # 📌 A caller's own repository is what proves this, and the engine's tree cannot: the same lesson that
      # cost an ADR on 2026-09-09 when a contract field was retired on this repository's own consumer.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the thing under test. It also runs the engine's
      # `prepare`, which is what builds `dist-pkg/` — without it the engine's `exports` point at nothing.
      - run: npm ci

      # Supply chain FIRST. A vulnerable production dependency is the one finding that makes the rest moot.
      - name: audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

      - name: typecheck
        run: npm run typecheck

      # Chromium for the `browser` Vitest project. `--with-deps` because the runner image has none of them.
      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # 🔴 THE CARTRIDGE, BUILT BY THE ENGINE (ADR-0253). No `if:` and no input: every game builds its cartridge here, the one way.
      # The first line only turns an engine too old to have the build into a sentence instead of an npm error. `npx --no` never
      # downloads: a bin missing from the game's own tree fails here rather than fetching whatever the registry holds by that name.
      - name: cartridge (the engine's build of the platform's target)
        run: |
          node -e "const p=require('@the-inclusionist/engine/package.json');if(!(p.bin||{})['inclusionist-check-cartridge']){console.error('@the-inclusionist/engine '+p.version+' has no cartridge build: move to the version that has it and wrap vite.config in defineGameBuild (ADR-0253)');process.exit(1)}"
          npx --no -- vite build --mode cartridge

      # The boot's own refusals over what was just built: a cartridge that compiles and breaks the contract stops here.
      - name: cartridge check (the refusals of createGame and mount)
        run: npx --no -- inclusionist-check-cartridge

      # ⚠️ NOT `if: inputs.a11y` ALONE. The gate also needs the game to HAVE the two scripts, and a caller
      # that asks for it without them should fail loudly here rather than time out on a curl loop.
      - name: a11y (axe against the running game)
        if: ${{ inputs.a11y }}
        run: |
          node -e "const s=require('./package.json').scripts||{};for(const k of ['preview','test:a11y'])if(!s[k]){console.error('a11y: true, but package.json has no \"'+k+'\" script');process.exit(1)}"
          npm run preview -- --port ${{ inputs.preview-port }} &
          for i in $(seq 1 30); do curl -sf http://localhost:${{ inputs.preview-port }}/ >/dev/null && break; sleep 1; done
          AXE_URL=http://localhost:${{ inputs.preview-port }}/ npm run test:a11y

      # 🔴 A GAME'S OWN RECORDS (ADR-0226 §1). They cite the engine's records and the project's, so the check needs
      # the ENGINE beside it (ADR-0242): its tree holds the engine's records, its index answers for every number in
      # the project — the ones kept in `the-inclusionist-docs` included, by rows that name that repository — and it
      # carries the validator. The step borrows the validator instead of copying it.
      # ⚠️ Off by default and not `if: hashFiles(...)`: the checkout needs a token, and a step that switched itself
      # on when the folder appeared would go red in every game that has records and no secret yet.
      - name: checkout the engine, the home of the records a game cites (ADR-0242)
        if: ${{ inputs.adr-records }}
        uses: actions/checkout@v7
        with:
          repository: the-inclusionist/the-inclusionist-engine
          token: ${{ secrets.records-token }}
          path: .engine-records

      # The same setup the records' own CI uses: the runner's system Python refuses a global `pip install`.
      - if: ${{ inputs.adr-records }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # `--repo engine=` also OPENS a game record's `engine:` confirmations against the engine's code. A number the
      # game's records cite in `the-inclusionist-docs` is answered by the engine's index row that names that repository.
      - name: adr records (this game's tree, citations resolved against the engine's)
        if: ${{ inputs.adr-records }}
        run: |
          pip install pyyaml
          python .engine-records/scripts/validate-adr.py docs/2-Architecture/adr --repo engine=.engine-records --root=.
