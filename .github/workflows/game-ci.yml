# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE GATE EVERY GAME CALLS — ADR-0068 §4, written instead of copied.
#
# ========================= WHY IT IS ONE FILE AND NOT THREE HUNDRED =========================
# ADR-0068 §4 refused three hundred copies of a pipeline, and named the failure it was refusing: copies
# drift, and the ones that drift silently are the ones that STOP GATING. A gate that stopped running is
# worse than one that never existed, because the repository still shows a green tick.
#
# So a game's own workflow is a few lines that INVOKE this one:
#
#     jobs:
#       ci:
#         uses: the-inclusionist/the-inclusionist-engine/.github/workflows/game-ci.yml@main
#
# ========================= WHY IT LIVES IN THE ENGINE REPOSITORY =========================
# Because ADR-0067 §5 says a repository is created when a RECORD declares its address, and no record
# declares an address for a workflows repository. Inventing one to hold a YAML file would be the rule
# working backwards.
#
# And it is where the shared things already are, by ADR-0068 §5's own reasoning: the records, the ADR
# validator and the eight gate checks all stay in the engine, and a game inherits them. This is the same
# sentence applied to CI.
#
# ⚠️ THE ENGINE ITSELF DOES NOT USE THIS FILE, and the reason changed on 2026-09-06. It used to be that the
# engine's gates ran on GitLab; they now run beside this file, in `ci.yml`, and `.gitlab-ci.yml` was deleted
# once the GitLab project was archived. The engine still does not CALL this workflow, because it is not a
# game: `game-ci.yml` installs Chromium and offers an axe gate against a game served on a port, and the
# engine's own pipeline has six jobs this one has no business carrying — the ADR validator and the DCO check
# among them. Two workflows, two shapes, and neither is a copy of the other.
#
# ========================= WHAT IT GATES, AND WHY EACH ONE =========================
# The four that the engine's own `test` job runs, minus what only an app has:
#   · `npm audit --omit=dev` — production dependencies are the ones that reach a child's browser;
#   · typecheck — clean, zero errors, no budget (the engine's 273-error debt reached zero on 2026-08-26);
#   · the Vitest suite, both projects — a game's browser tests need Chromium;
#   · the build — a game that does not build cannot be selected by the catalogue's manifest.
#
# The a11y gate (axe) is OPT-IN rather than default, and that is a deliberate honesty: it needs the game to
# be servable at a URL, and a game whose shell is still a scaffold has nothing to serve. `with: a11y: true`
# turns it on. ⚠️ A game that ships to a school with `a11y: false` is a game that skipped pillar 2, and the
# input is named so that skipping it is a VISIBLE line in the caller instead of an absence.
name: game-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major/minor to run on. Default matches the engine's .node-version."
        required: false
        type: string
        default: "24.14.0"
      a11y:
        description: "Run the axe gate against the built game. Requires `preview` and an axe script."
        required: false
        type: boolean
        default: false
      preview-port:
        description: "Port `npm run preview` binds to when the a11y gate runs."
        required: false
        type: number
        default: 4173

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the thing under test. It also runs the engine's
      # `prepare`, which is what builds `dist-pkg/` — without it the engine's `exports` point at nothing.
      - run: npm ci

      # Supply chain FIRST. A vulnerable production dependency is the one finding that makes the rest moot.
      - name: audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

      - name: typecheck
        run: npm run typecheck

      # Chromium for the `browser` Vitest project. `--with-deps` because the runner image has none of them.
      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # ⚠️ NOT `if: inputs.a11y` ALONE. The gate also needs the game to HAVE the two scripts, and a caller
      # that asks for it without them should fail loudly here rather than time out on a curl loop.
      - name: a11y (axe against the running game)
        if: ${{ inputs.a11y }}
        run: |
          node -e "const s=require('./package.json').scripts||{};for(const k of ['preview','test:a11y'])if(!s[k]){console.error('a11y: true, but package.json has no \"'+k+'\" script');process.exit(1)}"
          npm run preview -- --port ${{ inputs.preview-port }} &
          for i in $(seq 1 30); do curl -sf http://localhost:${{ inputs.preview-port }}/ >/dev/null && break; sleep 1; done
          AXE_URL=http://localhost:${{ inputs.preview-port }}/ npm run test:a11y
