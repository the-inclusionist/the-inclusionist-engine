<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segundo consumidor — quiz sem plataforma</title>
<!--
  O SEGUNDO CONSUMIDOR (ADR-0027, passo 6, antecipado pelo Dev em 2026-08-25).

  Isto NÃO é um jogo para crianças ainda: é um INSTRUMENTO DE MEDIDA. Um quiz sem física, sem tiles, sem mundo
  — e por isso mesmo capaz de responder a pergunta que nenhuma leitura de código responde: o que desta base é
  ENGINE e o que é O JOGO DE PLATAFORMA que ela hospeda hoje?

  A regra desta página é uma só, e é ela que produz a medida:

      SÓ PODE IMPORTAR DE core/, input/, render/, platform/, ui/ e audio/. NUNCA de game/.

  Toda vez que ele precisar de algo que só existe em `game/`, isso é um ACHADO — anotado, não contornado. A
  lista de achados é o que o passo 5 (a divisão em pacotes) vai consertar. Contornar um achado aqui destruiria
  o instrumento: ele mede exatamente aquilo que a gente for tentado a esconder.
-->
<!--
  ⚠️ AS FONTES DA ENGINE, e elas ficaram sem ninguém a ligá-las em 07/09. Quem carregava o
  `vendor/fonts.css` era o `app/index.html` do jogo, que saiu com o cartucho (issue #111) — e o painel de
  tipografia continuou a oferecer dezassete famílias das quais NENHUMA era carregada. A criança escolhia,
  o menu marcava a escolha, e o navegador desenhava a fonte do sistema. Sem erro em lado nenhum.

  O `preload` é da Atkinson porque ela é o PADRÃO (`DEFAULT_FONT_KEY`): a face que a página desenha antes
  de qualquer escolha é a que vale a pena não esperar.

  ⚠️ E UM CONSUMIDOR DO PACOTE TEM DE FAZER O MESMO. O `exports` publica estes ficheiros em `./assets/*` e
  o `files` leva `app/public/vendor` — mas ligá-los é dele, e isso agora está escrito no `package.json`.
-->
<link rel="preload" href="/vendor/fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ⚠️ A SAÍDA DE EMERGÊNCIA DO TECLADO, e ela é o PRIMEIRO foco da página por definição: um "pular para o
       conteúdo" que venha depois de outra coisa obriga a atravessar essa coisa, que é o oposto do que ele é.
       WCAG 2.4.1 (Bypass Blocks).

       Estava tudo pronto e faltava o elemento: o `.skip-link` tem regra no `style.css` (invisível em
       `top:-60px`, desce ao foco) e a frase tem chave no dicionário (`skip.toGame`) — e nenhuma página da
       engine o desenhava. O alvo é o `#game-region`, que já tem `tabindex="-1"` justamente para poder
       receber foco por programa. -->
  <a class="skip-link" href="#game-region" data-i18n="skip.toGame">Pular para o jogo</a>

  <!-- Regiões vivas do leitor de tela: o par que core/a11y-sr procura. Se este consumidor precisasse de mais
       do que isto para anunciar, a camada de a11y não seria reutilizável — seria uma função do jogo. -->
  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="sr-alert" class="sr-only" role="alert" aria-live="assertive"></p>

  <main>
    <div class="stage-wrap">
      <div id="stage" class="stage">
        <!-- Mesmo id que ui/layout escala e para dentro do qual os diálogos são reparentados. Sem canvas: um
             quiz não desenha mundo, e é isso que o teste quer descobrir se a engine tolera. -->
        <section id="game-region" class="game-region" tabindex="-1" aria-label="Quiz">
          <div id="quiz-app" class="quiz-app"></div>

          <!-- 🔴 «TIPOGRAFIA» E «VISÃO» SAÍRAM DAQUI em 2026-09-12, e a ausência é o conserto: estavam na zona do RODAPÉ,
               que é o lugar da explicação (`CLAUDE.md` §4, as três zonas), e duplicavam o que a barra rápida já dá — o
               ciclo de comunicação escolhe a letra, e o 🚥 a correcção de cor (ADR-0151). O Dev viu-os num print.
               O host dos filtros fica: é ele que o `createGame` preenche para o 🚥 funcionar. -->
          <svg id="q-cvd" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute"></svg>
          <!-- A BARRA DE ACESSIBILIDADE DA ENGINE (ADR-0106). VAZIA DE PROPÓSITO: o `createGame` monta-a aqui,
               como já monta os filtros de daltonismo no `#q-cvd`. Este consumidor não copia markup nenhum.

               ⚠️ ANTES HAVIA AQUI UM BOTÃO À MÃO — `#q-libras`, «Modo pessoa surda» —, e tirá-lo é o conserto.
               Ele demonstrava que o modo funciona SEM o widget do VLibras carregado (o `b0239e9`): o estado é
               da engine e o intérprete é um tradutor opcional. Essa demonstração não se perde, muda de dono —
               agora quem a faz é o ícone 🤟 da própria barra, que é o que os 300 jogos vão ter.

               📌 E ele era a ÚNICA duplicação — MEDIDA NO NAVEGADOR e não prevista. Eu tinha escrito «cinco
               ícones» aqui e a página serviu OITO: os cinco com estado (🦯 cego · 🗨️ TTS · 🤟 Libras ·
               🧩 TEA · ☝️ alternância) MAIS os três `soon` (🧑 rosto · 👀 olhos · 👄 voz), que se montam
               rotulados «(em construção)» — soon é «ainda não construímos», e dizê-lo é a decisão.
               O 🔤 da tipografia não é ícone de barra, e os de contraste e cor NÃO são montados: este jogo
               não tem escritor visual, e o §5 do ADR-0106 recusa oferecer um botão que não acciona nada.
               Essa metade da previsão confirmou-se; a outra não, e fica o medido. -->
          <div id="title-icons" class="pause-icons"></div>
          <!-- ⚠️ O PAINEL DE TIPOGRAFIA SAIU DAQUI EM 07/09, e a ausência é o conserto. Este bloco declarava
               à mão o véu, o cartão, o título, a lista e os dois botões — cinco ids que o `ui/settings-typo`
               EXIGIA e que nada no tipo dele dizia. Era o achado 6 da etapa C: «o painel abre vazio, sem
               erro», e cada consumidor teria de redescobrir a mesma lista por tentativa.

               Agora quem o monta é a `ui/panel-shell.montarCasca`, chamada pelo `main-quiz.ts`: a engine
               constrói a casca e DEVOLVE os ids. O contrato passou a ler-se no tipo. -->
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="js/consumer-quiz/main-quiz.ts"></script>
</body>
</html>
