<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="quiz.pageTitle">The Inclusionist — quiz de demonstração</title>
<!--
  THE SECOND CONSUMER (ADR-0027, step 6, brought forward by the Dev).

  This is NOT a game for children yet: it is a MEASURING INSTRUMENT. A quiz with no physics, no tiles, no world
  — and for that very reason able to answer the question no reading of the code answers: what in this base is
  ENGINE, and what belongs to a game it hosts?

  The page has one rule, and it is the rule that produces the measure:

      IT IMPORTS ONLY THE ENGINE'S LAYERS (core/, input/, render/, platform/, ui/, boot/). NEVER A GAME'S CODE.

  Every time it needs something that exists only in a game, that is a FINDING — written down, not worked around. The
  list of findings is what the package split fixes. Working around a finding here would destroy the instrument: it
  measures exactly what we would be tempted to hide.
-->
<!--
  ⚠️ THE ENGINE'S FONTS. The page that used to link `vendor/fonts.css` was the game's `app/index.html`, which left with
  the cartridge (issue #111) — and for a while the typography panel went on offering families of which NONE was
  loaded. The child chose, the menu marked the choice, and the browser drew the system font. No error anywhere.

  The `preload` is Atkinson's because it is the DEFAULT (`DEFAULT_FONT_KEY`): the face the page draws before any choice
  is the one worth not waiting for.

  ⚠️ AND A CONSUMER OF THE PACKAGE HAS TO DO THE SAME. `exports` publishes these files under `./assets/vendor/*` and
  `files` ships `app/public/vendor` — but linking them is the consumer's job, and `package.json` says so.
-->
<link rel="preload" href="/vendor/fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ⚠️ THE KEYBOARD'S EMERGENCY EXIT, and it is the page's FIRST focus by definition: a "skip to content" that comes
       after something else forces you to cross that thing, which is the opposite of what it is.
       WCAG 2.4.1 (Bypass Blocks).

       The `.skip-link` has its rule in `style.css` (invisible at `top:-60px`, it comes down on focus) and the sentence
       has its key in the dictionary (`skip.toGame`). The target is `#game-region`, which has `tabindex="-1"` precisely
       so it can receive focus by script. -->
  <a class="skip-link" href="#game-region" data-i18n="skip.toGame">Pular para o jogo</a>

  <!-- The screen reader's live regions: the pair `core/a11y-sr` looks for. If this consumer needed more than this to
       announce, the a11y layer would not be reusable — it would be a function of the game. -->
  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="sr-alert" class="sr-only" role="alert" aria-live="assertive"></p>

  <main>
    <div class="stage-wrap">
      <div id="stage" class="stage">
        <!-- The id ui/layout scales, and the one the dialogs are reparented into. No canvas: a quiz draws no
             world, and whether the engine tolerates that is what the test wants to find out. -->
        <section id="game-region" class="game-region" tabindex="-1" aria-label="Quiz">
          <div id="quiz-app" class="quiz-app"></div>

          <!-- 🔴 «TIPOGRAFIA» AND «VISÃO» ARE NOT HERE, and the absence is the fix: they sat in the FOOTER zone, which is the
               place of the explanation (`CLAUDE.md` §4, the three zones), and duplicated what the quick bar already gives
               — the communication cycle picks the letter, and 🚥 the colour correction (ADR-0151). The Dev saw them on a
               screenshot. The filters' host stays: `createGame` fills it so 🚥 works. -->
          <svg id="q-cvd" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute"></svg>
          <!-- THE ENGINE'S ACCESSIBILITY BAR (ADR-0106). EMPTY ON PURPOSE: `createGame` mounts it here, as it mounts the
               colour-vision filters in `#q-cvd`. This consumer copies no markup.

               ⚠️ THERE USED TO BE A HAND-MADE BUTTON HERE — `#q-libras`, «Modo pessoa surda» —, and removing it is the
               fix. It showed that the mode works WITHOUT the VLibras widget loaded (`b0239e9`): the state is the
               engine's and the interpreter is an optional translator. That demonstration is not lost, it changes
               owner — now the bar's own 🤟 icon makes it, which is what every game will have.

               📌 And it was the ONLY duplication — MEASURED IN THE BROWSER, not predicted. «Five icons» had been written
               here and the page served EIGHT: the five with state (🦯 blind · 🗨️ TTS · 🤟 Libras · 🧩 ASD ·
               ☝️ switch access) PLUS the three `soon` ones (🧑 face · 👀 eyes · 👄 voice), mounted labelled
               «(em construção)» — soon means «not built yet», and saying so is the decision.
               Typography's 🔤 is not a bar icon, and the contrast and colour ones are NOT mounted: this game has no
               visual writer, and ADR-0106 §5 refuses to offer a button that operates nothing. -->
          <div id="title-icons" class="pause-icons"></div>
          <!-- ⚠️ THE TYPOGRAPHY PANEL IS NOT DECLARED HERE, and the absence is the fix. This block used to declare by hand
               the veil, the card, the title, the list and the two buttons — five ids that `ui/settings-typo`
               REQUIRED and that nothing in its type said. It was finding 6 of stage C: «o painel abre vazio, sem
               erro», and every consumer would have had to rediscover the same list by trial.

               Now `ui/panel-shell.mountShell`, called by `main-quiz.ts`, mounts it: the engine builds the shell and
               RETURNS the ids. The contract can be read in the type. -->
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="js/consumer-quiz/main-quiz.ts"></script>
</body>
</html>
